mensreformer: { label:"Men's Reformer", theme:"Kontrollierte Kraft. Stabiler Core.", color:"#516170",
  memory:["FOOTWORK","FOUNDATION","HUNDRED","COORDINATION","ROWING","ENGINE","GLUTES","ATHLETIC","BURN","RESET"],
  phases:[
    {name:"SETUP & FOOTWORK", range:"0–8", start:0, blocks:[
      P("0:00","Footwork — Parallel · ×10","Rückenlage, Schulterpolster fixiert, Ballen auf der Fußstange, Fersen zusammen, Knie über den Hüften gebeugt. Beine strecken die Carriage kontrolliert nach außen, dann genauso kontrolliert zurück. 3–4 Federn (mittel–schwer) für einen spürbaren Beinkraft-Reiz von Anfang an.<div class='cue'>„Ballen auf die Stange, Fersen zusammen.“<br>„Die Carriage fährt nur so schnell raus, wie ihr sie auch wieder kontrolliert reinholt.“<br>„Das ist der klassische Reformer-Einstieg — sofortiger Beinkraft-Reiz, gleichzeitig lernt ihr die Carriage-Kontrolle, ohne dass es wie Aufwärmen wirkt.“</div>"),
      P("2:00","Footwork — V-Position · ×10","Gleiche Bewegung wie Parallel, andere Fußstellung: Fersen bleiben zusammen, Zehen öffnen sich weit (V-Form). Die Innenseite der Beine arbeitet dadurch spürbar stärker mit.<div class='cue'>„Fersen zusammen, Zehen weit auf — eine V-Form.“<br>„Gleiche Kontrolle wie eben, nur die Fußstellung ändert sich.“</div>"),
      P("4:00","Footwork — Wide & Heels · ×8 + ×8","Wide: Füße hüftbreit auseinander, parallel zueinander, gleiche Streck-Beuge-Bewegung. Direkt im Anschluss Heels: Fersen liegen auf der Stange, Zehen frei in der Luft — Waden und Achillessehne übernehmen zusätzlich Arbeit.<div class='cue'>„Erst breiter Stand, parallel.“<br>„Und jetzt die Fersen auf die Stange, Zehen frei — spürt ihr, wie die Waden übernehmen?“</div>"),
      P("6:00","Footwork — Single Leg · 6×/Seite","Ein Fuß bleibt auf der Stange, das andere Bein hebt sich in die Luft oder wird am Körper gehalten. Deutlich mehr Beckenstabilität gefordert als beidbeinig — die Carriage will bei jedem Wiederholungszyklus leicht kippen. <span class='tag ground'>LEICHTER</span> beide Füße bleiben auf der Stange, nur das Gewicht mental auf eine Seite verlagern. <span class='tag flight'>SCHWERER</span> das freie Bein bleibt während der ganzen Bewegung gestreckt in der Luft.<div class='cue'>„Ein Fuß auf der Stange, das andere Bein bleibt entspannt.“<br>„Das Becken bleibt gerade — das ist schwerer als die Beinarbeit selbst.“</div>"),
    ]},
    {name:"POWERHOUSE FOUNDATION", range:"8–16", start:480, blocks:[
      P("8:00","Neutral Spine + Breathing · 1 Min.","Rückenlage auf dem Carriage, Füße auf der Fußstange. Neutrale Wirbelsäule finden — kleine Kurve im unteren Rücken, weder flach gepresst noch stark hohl — während das Gerät unter euch leicht nachgibt.<div class='cue'>„Findet die Mitte zwischen ganz flach und stark hohl — das ist eure Neutralstellung, auch wenn das Gerät sich bewegt.“</div>"),
      P("9:00","Pelvic Curl auf dem Reformer · ×6","Füße auf der Fußstange, Becken hebt sich Wirbel für Wirbel bis zu einer geraden Linie Knie–Hüfte–Schulter, dann Wirbel für Wirbel wieder ablegen. Die Carriage bleibt dabei ruhig — keine zusätzliche Bewegung durch die Beine. 2–3 Federn (leicht–mittel): ausreichend, damit die Carriage stabil bleibt, ohne dass die Beinarbeit die Wirbelsäulenartikulation übernimmt.<div class='cue'>„Wirbel für Wirbel hoch — Becken zuerst, dann folgt der Rücken.“<br>„Die Carriage soll dabei still stehen. Wenn sie wandert, ist die Feder nicht die richtige Stellschraube — probiert kleiner zu werden.“</div>"),
      P("10:30","Hundred Prep · 30–50 Pumps","Beine im Tabletop oder Fersen auf der Stange, Oberkörper oben (Chest-Lift-Höhe), Hände greifen den Rahmen oder die Straps, Arme pumpen klein und kraftvoll neben dem Körper. <span class='tag ground'>LEICHTER</span> Füße bleiben auf der Stange statt Tabletop. <span class='tag flight'>SCHWERER</span> Beine gestreckt in die Diagonale, Fersen zusammen.<div class='cue'>„Qualität vor Zahl — die Carriage soll dabei still bleiben, nicht nur der Oberkörper.“</div>"),
      P("13:00","Coordination Prep · ×6","Aus dem Tabletop: Beine strecken sich nach vorne, während die Arme (an den Straps) gleichzeitig nach hinten ziehen — eine Gegenbewegung von Armen und Beinen bei stabilem Rumpf. 2 Federn (leicht) für die Arme.<div class='cue'>„Arme und Beine bewegen sich gegeneinander — die Mitte bleibt der ruhige Punkt.“<br>„Das ist die Foundation-Bewegung, die euch im Finale später in verdichteter Form nochmal begegnet.“</div>"),
    ]},
    {name:"SHOULDER CONTROL", range:"16–22", start:960, blocks:[
      P("16:00","Rowing 1 — Arms Front · ×8","Aufrechter Sitz auf dem Carriage, Straps in beiden Händen. Arme ziehen von vorne kontrolliert zum Körper, dann kontrolliert wieder nach vorne strecken. 1–2 Federn (leicht) — Kontrolle vor Kraft.<div class='cue'>„Das Becken bleibt aufrecht, auch wenn der Zug nach vorne zieht.“<br>„Das ersetzt die Bandarbeit von der Matte — echte Zugarbeit mit Reformer-Widerstand.“</div>"),
      P("18:00","Chest Expansion · ×8","Kniend oder sitzend, Straps hinter dem Körper, Arme ziehen kontrolliert nach hinten, Brustkorb öffnet sich. Am Ende der Bewegung darf sich der Kopf sanft zur Seite drehen, dann zur Mitte zurück.<div class='cue'>„Die Arme ziehen nach hinten, der Brustkorb öffnet sich — nicht der untere Rücken.“</div>"),
      P("20:00","Triceps Press · ×8","Bauchlage oder Kniestand, Straps in den Händen, Arme strecken sich kontrolliert nach hinten (Trizeps), dann zurück. Bewusst als eigenständige Übung — kein Übergang in eine andere Position danach.<div class='cue'>„Nur der Oberarm bewegt sich — der Oberkörper bleibt ruhig liegen.“</div>"),
    ]},
    {name:"THE ENGINE", range:"22–33", start:1320, blocks:[
      P("22:00","Elephant · ×8","Stehend, Hände auf der Fußstange, Füße auf der Carriage-Kante, Becken hoch (umgekehrtes V). Die Carriage fährt durch Hüftbeugung rein und raus, die Fersen bleiben dabei unten. Vor dieser Übung bewusst Federn und Fußposition neu einstellen — kein nahtloser Übergang aus der vorherigen Übung. 2–3 Federn (mittel).<div class='cue'>„Die Bewegung kommt aus der Hüfte, nicht aus den Armen.“<br>„Das ist der athletischste und für viele eindrücklichste Block heute: Plank auf einer beweglichen Fläche. Sieht simpel aus, ist es nicht.“</div>"),
      P("24:00","Long Stretch · ×8","Plank-Position, Hände auf der Fußstange, Körper eine gerade Linie. Die Carriage fährt durch Armkraft und Rumpfspannung raus und rein, das Becken bleibt dabei auf Schulterhöhe. 2 Federn (leicht–mittel) — weniger Federn heißt hier mehr Stabilisationsarbeit für den Rumpf. <span class='tag ground'>LEICHTER</span> kleinerer Bewegungsweg, mehr Federn. <span class='tag flight'>SCHWERER</span> weniger Federn, größerer Weg.<div class='cue'>„Das Becken darf beim Rausfahren nicht nach oben wandern — das ist der Kontrollpunkt.“</div>"),
      P("26:30","Down Stretch · ×6","Aus der Plank: Becken sinkt in eine sanfte Rückbeuge, die Carriage bewegt sich dabei nur minimal, dann zurück in die neutrale Plank."),
      P("28:30","Up Stretch / Pike · ×6","Aus der Plank: Becken hebt sich in eine Pike-Position, die Carriage fährt durch die Hüftbeugung ein Stück ein, dann zurück in die Plank.<div class='cue'>„Kontrolliert nach oben, kontrolliert zurück — kein Schwung.“</div>"),
      P("31:00","Core-Finisher: Knees to Chest auf dem Carriage · ×8","Plank-Position, beide Knie ziehen gemeinsam kontrolliert zur Brust (die Carriage fährt dabei ein), dann zurück in die Plank. — Hinweis: Nicht alle fünf Elemente dieses Blocks sind Pflicht. Bei knapper Zeit oder Kondition dürfen Down Stretch oder dieser Core-Finisher entfallen, die Serie bleibt trotzdem stimmig."),
    ]},
    {name:"GLUTES & LEGS", range:"33–43", start:1980, blocks:[
      P("33:00","Single-Leg Footwork + Free-Leg Circles · 6×/Seite","Ein Fuß bleibt auf der Stange, das freie Bein zeichnet kontrollierte Kreise in der Luft, während die Carriage-Position stabil gehalten wird.<div class='cue'>„Der Reformer erlaubt hier echten Widerstand statt nur Körpergewicht — das ist der Bonus gegenüber der Matten-Klasse.“</div>"),
      P("35:30","Bridge auf dem Reformer → Marching · ×10, dann 6×/Seite","Füße auf der Fußstange, Becken hebt sich zur Bridge, dann abwechselnd ein Knie zur Brust ziehen, ohne dass die Carriage wegrutscht. 2 Federn (leicht) — zu viel Widerstand macht die Bridge instabil."),
      P("38:00","Side Splits / Skating · 8×/Seite","Seitlich stehend auf der Carriage-Plattform, ein Fuß auf dem Frame, ein Fuß auf der Carriage. Die Carriage fährt seitlich weg und wieder heran, das Standbein trägt. 3–4 Federn (mittel–schwer) für Stabilität beim Erstversuch. <span class='tag ground'>LEICHTER</span> mit einer Hand am Rahmen abstützen.<div class='cue'>„Sieht leichter aus, als es ist — die Hüftstabilität wird hier massiv gefordert.“</div>"),
      P("40:30","Runner's Lunge auf dem Reformer · 6×/Seite","Ein Fuß auf der Carriage, ein Fuß fest auf der Plattform/dem Boden vor dem Gerät — eine Ausfallschritt-Bewegung, bei der die Carriage mit dem hinteren Bein rein und raus fährt."),
    ]},
    {name:"ATHLETIC", range:"43–52", start:2580, blocks:[
      P("43:00","Standing Lunge auf der Fußstange · 8×/Seite","Ein Fuß auf der Fußstange, anderer Fuß auf der Plattform hinter dem Gerät, kontrollierte Kniebeuge-Bewegung, die Carriage fährt mit dem vorderen Bein. 3 Federn (mittel) für Stabilität.<div class='cue'>„Balance zuerst, Bewegungsumfang danach.“</div>"),
      P("45:30","Short Box — Round Back · ×8","Sitz auf der Short Box, Füße unter den Riemen fixiert, Oberkörper rollt in eine runde Vorbeuge und wieder auf."),
      P("47:30","Short Box — Flat Back & Oblique · 6×/Seite","Oberkörper bleibt lang (kein Runden), neigt sich seitlich und rotiert leicht — arbeitet gezielt die schräge Bauchmuskulatur."),
      P("49:30","Knee Stretch Series · ×8","Kniend auf der Carriage, Hände auf der Fußstange, die Hüfte fährt die Carriage durch Kniebeugung ein und aus, der Rücken bleibt lang. <span class='tag ground'>LEICHTER</span> kleinerer Bewegungsweg.<div class='cue'>„Der Rücken bleibt eine gerade Linie — die Hüfte macht die Arbeit.“</div>"),
    ]},
    {name:"POWERHOUSE BURN", range:"52–57", start:3120, blocks:[
      P("52:00","Rowing-Kette · je 30 Sek.","Arms Front direkt gefolgt von Chest Expansion, ohne Pause dazwischen. Kein neues Lernen mehr — ein echter Final Burn aus bereits beherrschten Bewegungen, zügiger und mit einem starken, aber bekannten Abschluss."),
      P("53:00","Long Stretch — zügig · ×10","Gleiche Form wie im Engine-Block, jetzt zügiger und ohne Zwischenerklärung."),
      P("54:30","Hundred/Coordination-Kette — zügig · 1:30","Hundred Prep direkt gefolgt von Coordination Prep, beides bereits aus der Foundation bekannt — hier nur schneller und ohne neue Erklärung."),
      P("56:00","Knee Stretch — kontrollierter Abschluss · ×8","Aus dem Athletic-Block bereits bekannte Bewegung, hier als ruhigerer Abschluss vor dem Reset — kein neuer Skill, sondern der bewusste letzte bekannte Reiz.<div class='cue'>„Nichts Neues mehr — das kennt ihr schon. Nur noch sauber zu Ende bringen.“<br>„Finale heißt Bekanntes verdichten, nicht nach 52 Minuten Ermüdung noch etwas Neues lernen.“</div>"),
    ]},
    {name:"RESET", range:"57–60", start:3420, blocks:[
      P("57:00","Mermaid Stretch → Spine Stretch → Kindshaltung","Bewusst kein abruptes Ende — nach so viel Zugarbeit und Beinkraft braucht diese Zielgruppe die Dehnung mindestens so dringend wie die Kraft davor. Mermaid Stretch am Rahmen: seitliche Dehnung, eine Hand hält den Rahmen oder die Fußstange. Spine Stretch im Sitz auf dem Carriage: Wirbelsäule rundet sich nach vorne. Zum Schluss kurze Kindshaltung neben dem Gerät am Boden.<div class='cue'>„Letzter bewusster Atemzug.“</div>"),
    ]},
  ],

const CORE = {
  essence:[
    "Bewegung führt in die Ruhe.",
    "AWAKEN → FLOW → EXPLORE → MELT → REST — Standardform, keine Pflicht für jede Journey.",
    "Explore: Arrive → Move → Reduce → Pause → Release",
    "Bewegung: groß → fließend → explorativ → klein → still",
    "Phasen dienen der Bewegungsqualität, nicht umgekehrt.",
    "Optionen statt Hierarchie.",
    "Maximal drei Minuten Stillness.",
    "Belastung bewusst wechseln.",
    "Rest ist Praxis.",
  ],
  sections:[
    ["1","Die Idee","JIN Journey führt über Bewegung in die Ruhe – statt Ruhe vom Körper zu verlangen. Die Stunde beginnt nicht zwangsläufig still, sondern mit Bewegung: schwingen, drehen, kreisen, strecken, federn, fließen. Diese Bewegung verändert im Verlauf ihre Qualität – bewusster, fließender, explorativer, kleiner – bis schließlich keine Bewegung mehr notwendig ist."],
    ["2","Warum JIN mit J?","JIN schlägt bewusst die Brücke zu JOGA – mit J wie Ja zu Bewegung. Bewegung ist kein Privileg junger, beweglicher oder sportlicher Menschen. Wir müssen keine bestimmte Form erreichen, unseren Körper nicht beherrschen – wir dürfen ihn benutzen, kennenlernen, erleben. Erst sagen wir Ja zur Bewegung, dann erlauben wir uns die Ruhe."],
    ["3","Was JIN Journey nicht ist","JIN Journey behauptet nicht, neue Asanas erfunden zu haben. Die Elemente stammen aus Yoga, Yin Yoga, Vinyasa, Mobility und freier Bewegung. Die Eigenständigkeit liegt in der Dramaturgie. JIN Journey ist deshalb nicht: erst Mobility → dann Vinyasa → dann Yin. Die Phasen gehen ineinander über – im Idealfall bemerkt niemand „jetzt beginnt Yin“, sondern nur: „Irgendwann bin ich einfach still geworden.“"],
    ["4","Die drei Sprachebenen","Methodische Phasen (AWAKEN→FLOW→EXPLORE→MELT→REST) – die Standardform, mit der die meisten Journeys entwickelt werden. Bewegungsqualität (groß→fließend→explorativ→klein→still) – das eigentliche Prinzip, dem die Phasen dienen. Markenformel (MOVE. FLOW. MELT.) – verdichtet die Erfahrung kommunikativ. Unterrichtet wird nach den Phasen, die eine Journey tatsächlich braucht – nicht jede Journey braucht alle fünf. Entscheidend ist, dass sich die Bewegungsqualität nachvollziehbar verändert, nicht dass exakt fünf Etiketten durchlaufen werden. QiGong Yin variiert das Modell zu einem Wechsel aus Bewegung und Nachhall statt einer einmaligen Kurve; Yin reduziert bewusst auf Ankommen → Halten → Ruhe, weil hier die Stille selbst die Journey ist, nicht ihr Ziel am Ende."],
    ["5","Die fünf Phasen","AWAKEN – bewege dich, keine klassische Aufwärmübung. FLOW – Bewegung bekommt Struktur, Atem und Rhythmus verbinden sich. EXPLORE – Positionen werden nicht eingenommen, sondern ihr Bewegungsraum wird untersucht; das methodische Herzstück. MELT – aktive Bewegung tritt zurück, Schwerkraft übernimmt. REST – keine neue Aufgabe, nur Integration. Das ist die Standardabfolge für Morning, Evening und Energy. Journeys dürfen begründet abweichen, wenn die Dramaturgie es verlangt – etwa wenn eine Klasse bewusst nicht aufbaut, sondern fast unmittelbar in Stille geht (Yin), oder wenn sich Aktivierung und Ruhe fortlaufend abwechseln statt sich einmal aufzubauen (QiGong Yin). Eine Abweichung ist kein Freifahrtschein: Die Bewegungsqualität muss sich weiterhin nachvollziehbar verändern, sonst ist es keine JIN Journey mehr, sondern nur eine Übungsliste."],
    ["6","Die Explore-Grammatik","Arrive (Position finden, Belastung wahrnehmen) → Move (Bewegungsraum untersuchen – kein einzelner Move, ein Container mit mehreren Bausteinen) → Reduce (schrittweise verkleinern) → Pause (vollständig beenden, beobachten) → Release (bewusst verlassen, entlasten)."],
    ["7","Optionsprinzip","Eine JIN-Option verändert die Erfahrung – sie bewertet sie nicht. Keine Labels wie „Anfänger“, „Best Ager“, „Low Impact“, „Advanced“. Stattdessen: Ground/Flight, Small Range/Open Range. Beim Figure Four: Ground (Fuß bleibt am Boden) / Float (Fuß hebt ab). Keine Variante gewinnt."],
    ["8","Age-inclusive Movement","JIN Journey ist ausdrücklich altersinklusiv, aber kein Seniorenyoga. Berücksichtigt werden Beweglichkeit, Balance, Gelenksensibilität, Kniebelastung, Handgelenksbelastung, Bodenwechsel, Kraft, Tagesform. Alter entscheidet nie automatisch über eine Variante – ein beweglicher 70-Jähriger braucht nicht automatisch weniger, ein unbeweglicher 30-Jähriger nicht automatisch mehr."],
    ["9","Gelenkregel","Keine belastete Gelenkposition wird unnötig lange beibehalten. Bewegung innerhalb derselben Position gilt nicht automatisch als Entlastung – vier Minuten Beckenkreisen im Dragon sind trotzdem vier Minuten Belastung auf demselben Knie. Explore muss bei Bedarf Belastungswechsel enthalten."],

// ===================== STUNDENGENERATOR (KI-Varianten) =====================
// Journey-spezifische Regeln, die bei jedem KI-Aufruf mitgegeben werden —
// JIN-Methode und Men's Pilates brauchen unterschiedliche Leitplanken.
const GENERATOR_RULES = {
  jin: "Diese Journey folgt der JIN-Methode: Bewegungsqualität bewegt sich von groß/fließend zu klein/still, Bodenwechsel bewusst, kein Hold über 3:00 (Stillness Rule), saubere Übergänge zwischen Positionen, Gelenkbelastung wechselt statt einseitig zu bleiben, Dramaturgie führt Richtung Ruhe. Optionen als Ground/Flight benennen, niemals als Anfänger/Fortgeschritten.",
  menspilates: "Diese Class folgt Pilates-Prinzipien für männliche Einsteiger: Powerhouse-Kontrolle, ausgewogene Verteilung auf Schultergürtel/Core/Glutes/Beine, klare Leichter/Schwerer-Optionen pro Übung, kein Workout- oder CrossFit-Charakter. Keine zwei sehr ähnlichen Bewegungsmuster direkt hintereinander (z. B. nicht mehrere Plank-Varianten in Folge). Sprache klar und funktional, keine Esoterik.",
  mensreformer: "Diese Class nutzt den Reformer für sportliche Männer/Reformer-Neulinge mit Kraftbasis. Prinzip: erst lernen, dann belasten, dann brennen. Stellschrauben sind je nach Übung Federwahl, Bewegungsumfang, Ausgangsposition oder zusätzliche Stabilisierung — nie pauschal nur die Feder, und nie als Anfänger/Fortgeschritten benannt. Keine zwei komplexen neuen Gerätepositionen direkt hintereinander ohne kurze Umbau-/Orientierungsphase. Finale verdichtet nur bereits bekannte Bewegungen, führt keinen neuen Skill ein. Sprache klar und funktional, keine Fitnessstudio-Klischees. Bei jedem Wechsel von Körperposition, Straps, Box, Fußstange oder Feder-Setup muss die neue Einstellung im Vorschlag ausdrücklich genannt werden — keine Übung vorschlagen, deren sichere Geräteposition oder Federlogik nicht eindeutig beschrieben werden kann. Minimiere unnötige Geräteumbauten: bevorzuge innerhalb eines Blocks Übungen mit kompatiblem Setup und Federbereich; ein Gerätewechsel muss einen klaren methodischen Nutzen haben.",
};
function generatorRulesFor(journeyKey){
  if(journeyKey==="menspilates") return GENERATOR_RULES.menspilates;
  if(journeyKey==="mensreformer") return GENERATOR_RULES.mensreformer;
  return GENERATOR_RULES.jin;
}

function loadVariantStore(){ return loadWB("jin-variants", {}); }
function saveVariantStore(store){ saveWB("jin-variants", store); }
function getVariantEntry(journeyKey){
  const store = loadVariantStore();
  return store[journeyKey] || { activeId:null, draftPhases:null, list:[] };
}
function setVariantEntry(journeyKey, entry){
  const store = loadVariantStore();
  store[journeyKey] = entry;
  saveVariantStore(store);
}
function getActivePhases(journeyKey){
  const entry = getVariantEntry(journeyKey);
  if(entry.activeId==="draft" && entry.draftPhases) return entry.draftPhases;
  if(entry.activeId && entry.activeId!=="draft"){
    const v = (entry.list||[]).find(x=>x.id===entry.activeId);
    if(v) return v.phases;
  }
  return null; // null = Original
}
function getDisplayJourney(journeyKey){
  const base = DATA[journeyKey];
  if(!base || !base.phases) return base;
  const activePhases = getActivePhases(journeyKey);
  if(!activePhases) return base;
  return Object.assign({}, base, { phases: activePhases });
}
function ensureDraft(journeyKey){
  const entry = getVariantEntry(journeyKey);
  if(entry.activeId==="draft" && entry.draftPhases) return entry;
  const base = getActivePhases(journeyKey) || DATA[journeyKey].phases;
  entry.draftPhases = JSON.parse(JSON.stringify(base));
  entry.activeId = "draft";
  setVariantEntry(journeyKey, entry);
  return entry;
}

async function aiSuggestBlock(journeyKey, phaseName, originalBlock, siblingTitles, durationSec){
  const j = DATA[journeyKey];
  const rules = generatorRulesFor(journeyKey);
  const res = await fetch("/.netlify/functions/joga", {
    method: "POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ type:"jin_move_suggestion", params:{
      phase: phaseName,
      journeyLabel: j.label,
      journeyTheme: j.theme + " | Regeln: " + rules + " | Ersetze diese eine Übung, behalte die Dauer bei, vermeide Wiederholung von: " + siblingTitles.join(", "),
      existingTitles: siblingTitles,
      remainingTime: secToTime(durationSec || 120),
      provider:"claude"
    }})
  });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  if(!data.claude) throw new Error(data.claudeError || "Keine Antwort von der KI.");
  const cleaned = data.claude.trim().replace(/^```json\s*/,"").replace(/```$/,"");
  const parsed = JSON.parse(cleaned);
  const suggestions = parsed.suggestions || [];
  if(!suggestions.length) throw new Error("Keine Vorschläge erhalten.");
  return suggestions[0];
}
function computeBlockDurationSec(ph, blockIdx){
  const startSec = parseTimeToSec(ph.blocks[blockIdx].time);
  let endSec;
  if(blockIdx+1 < ph.blocks.length){
    endSec = parseTimeToSec(ph.blocks[blockIdx+1].time);
  } else {
    const m = String(ph.range||"").match(/[\u2013-](\d+)\s*$/);
    endSec = m ? (+m[1])*60 : startSec + 120;
  }
  return Math.max(30, endSec - startSec);
}
function suggestionToCompiledBlock(sug, time){
  let bodyHtml = "";
  if(sug.explore && Object.values(sug.explore).some(v=>v)){
    bodyHtml = ["arrive","move","reduce","pause","release"].map(k=>{
      const val = sug.explore[k];
      const lbl = k.charAt(0).toUpperCase()+k.slice(1);
      return val && val.trim() ? "<span class='lbl'>"+lbl+"</span> "+nl2br(val) : null;
    }).filter(Boolean).join("<br>");
  } else {
    bodyHtml = nl2br(sug.body||"");
  }
  if(sug.cueLong && sug.cueLong.trim()){
    const lines = sug.cueLong.split("\n").map(quoteLine).filter(Boolean);
    if(lines.length) bodyHtml += "<div class='cue'>"+lines.join("<br>")+"</div>";
  }
  return { time, title: sug.title || "(KI-Vorschlag)", body: bodyHtml };
}

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}

function render(){
  document.querySelectorAll(".jtab").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));
  document.querySelectorAll("nav.bottom button").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));

  const modebar = document.querySelector(".modebar");
  const themebar = document.querySelector(".themebar");
  const main = document.getElementById("main");
  const label = document.getElementById("journeyLabel");
  const themeText = document.getElementById("themeText");
  const memline = document.getElementById("memline");

  if(state.journey==="core"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Core 1.0";
    main.innerHTML="";
    renderCore(main);
    return;
  }
  if(state.journey==="study"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Nacharbeit";
    main.innerHTML="";
    renderStudyPlan(main);
    return;
  }
  if(state.journey==="builder"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Erstellen";
    main.innerHTML="";
    renderBuilder(main);
    return;
  }
  modebar.style.display="flex";
  themebar.style.display="block";
  const j = getDisplayJourney(state.journey);
  label.textContent = j.label;
  themeText.textContent = "„" + j.theme + "“";
  memline.innerHTML = j.memory.map(m=>`<span class="memchip">${m}</span>`).join("");
  main.innerHTML="";

  const prepBtn = document.getElementById("prepModeBtn");
  const hasPrep = state.journey==="energy";
  prepBtn.style.display = hasPrep ? "block" : "none";
  if(state.mode==="prep" && !hasPrep) state.mode="study";
  document.querySelectorAll(".modebtn").forEach(b=> b.classList.toggle("active", b.dataset.mode===state.mode));

  if(state.mode==="study") renderStudy(main, j);
  if(state.mode==="cards") renderCards(main, j);
  if(state.mode==="practice") renderPractice(main, j);
  if(state.mode==="music") renderMusic(main, j);
  if(state.mode==="prep" && hasPrep) renderWorkbookPrep(main);
}

async function aiReviewClass(journeyKey, phases){
  const j = DATA[journeyKey];
  const rules = generatorRulesFor(journeyKey);
  const overview = phases.map(ph => ph.name + ": " + ph.blocks.map(b=> b.time+" "+b.title).join(" | ")).join("\n");
  const res = await fetch("/.netlify/functions/joga", {
    method: "POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ type:"jin_move_suggestion", params:{
      phase: "GESAMTE STUNDE — QUALITÄTSCHECK",
      journeyLabel: j.label,
      journeyTheme: j.theme + " | Regeln: " + rules + " | Das ist die komplette generierte Stunde:\n" + overview +
        "\nPrüfe auf Wiederholungen, Belastungsverteilung über die Stunde, Positionswechsel, Dramaturgie und die genannten Regeln. Antworte NUR mit JSON in der Form {\"flagged\":[{\"phase\":\"<Phasenname>\",\"title\":\"<exakter Übungstitel>\",\"reason\":\"<kurzer Grund>\"}]}. Wenn alles gut ist: {\"flagged\":[]}.",
      existingTitles: [],
      remainingTime: "",
      provider:"claude"
    }})
  });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  if(!data.claude) throw new Error(data.claudeError || "Keine Antwort von der KI.");
  const cleaned = data.claude.trim().replace(/^```json\s*/,"").replace(/```$/,"");
  const parsed = JSON.parse(cleaned);
  return parsed.flagged || [];
}

function renderGeneratorBar(main, journeyKey){
  const j = DATA[journeyKey];
  if(!j || !j.phases) return;
  const entry = getVariantEntry(journeyKey);
  const hasDraft = entry.activeId==="draft" && entry.draftPhases;
  const activeSaved = entry.activeId && entry.activeId!=="draft" ? (entry.list||[]).find(v=>v.id===entry.activeId) : null;

  const bar = document.createElement("div"); bar.className="corebox"; bar.style.marginBottom="16px";
  bar.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
      <select id="variantSelect" style="flex:1; min-width:140px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font-size:13px;">
        <option value="" ${!entry.activeId?"selected":""}>Original</option>
        ${hasDraft ? `<option value="draft" ${entry.activeId==="draft"?"selected":""}>Entwurf (nicht gespeichert)</option>` : ""}
        ${(entry.list||[]).map(v=>`<option value="${v.id}" ${entry.activeId===v.id?"selected":""}>${escapeHtml(v.name)}</option>`).join("")}
      </select>
      <button id="genRemix" class="bsmallbtn">🔀 Ganze Stunde neu mischen</button>
    </div>
    <div id="genActions" style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
      ${hasDraft ? `<button id="genSave" class="bsmallbtn">💾 Variante speichern</button><button id="genReset" class="bsmallbtn">↺ Original</button>` : ""}
      ${activeSaved ? `<button id="genDelete" class="bsmallbtn danger">🗑️ Variante löschen</button><button id="genReset" class="bsmallbtn">↺ Original</button>` : ""}
    </div>
    <div id="genStatus" style="font-size:12px; color:var(--text-3); margin-top:6px;"></div>
  `;
  main.appendChild(bar);

  const statusEl = bar.querySelector("#genStatus");

  bar.querySelector("#variantSelect").addEventListener("change", (e)=>{
    const entry2 = getVariantEntry(journeyKey);
    entry2.activeId = e.target.value || null;
    setVariantEntry(journeyKey, entry2);
    render();
  });

  const saveBtn = bar.querySelector("#genSave");
  if(saveBtn) saveBtn.addEventListener("click", ()=>{
    const name = prompt("Name für diese Variante (z. B. \"Hüftfokus\" oder \"softer\"):");
    if(!name || !name.trim()) return;
    const entry2 = getVariantEntry(journeyKey);
    const id = "v_" + Date.now();
    entry2.list = entry2.list || [];
    entry2.list.push({ id, name: name.trim(), createdAt: new Date().toISOString(), phases: entry2.draftPhases });
    entry2.activeId = id;
    entry2.draftPhases = null;
    setVariantEntry(journeyKey, entry2);
    render();
  });

  const resetBtn = bar.querySelector("#genReset");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    const entry2 = getVariantEntry(journeyKey);
    entry2.activeId = null;
    setVariantEntry(journeyKey, entry2);
    render();
  });

  const deleteBtn = bar.querySelector("#genDelete");
  if(deleteBtn) deleteBtn.addEventListener("click", ()=>{
    if(!confirm("Diese Variante wirklich löschen?")) return;
    const entry2 = getVariantEntry(journeyKey);
    entry2.list = (entry2.list||[]).filter(v=>v.id!==entry2.activeId);
    entry2.activeId = null;
    setVariantEntry(journeyKey, entry2);
    render();
  });

  bar.querySelector("#genRemix").addEventListener("click", async ()=>{
    const btn = bar.querySelector("#genRemix");
    btn.disabled = true;
    const base = getActivePhases(journeyKey) || DATA[journeyKey].phases;
    const newPhases = JSON.parse(JSON.stringify(base));
    let total = 0; newPhases.forEach(ph=> total += ph.blocks.length);
    let done = 0;
    try {
      for(const ph of newPhases){
        const usedTitles = ph.blocks.map(b=>b.title);
        for(let i=0;i<ph.blocks.length;i++){
          statusEl.textContent = `Mische … ${done+1}/${total}`;
          const sug = await aiSuggestBlock(journeyKey, ph.name, ph.blocks[i], usedTitles.filter(t=>t!==ph.blocks[i].title), computeBlockDurationSec(ph, i));
          const newBlock = suggestionToCompiledBlock(sug, ph.blocks[i].time);
          usedTitles[i] = newBlock.title;
          ph.blocks[i] = newBlock;
          done++;
        }
      }
      // Class-Check: ein zusätzlicher KI-Aufruf bewertet die gesamte neue Stunde
      // und nennt nur die problematischen Blöcke — nur diese werden ersetzt.
      try {
        statusEl.textContent = "Qualitätscheck läuft …";
        const flagged = await aiReviewClass(journeyKey, newPhases);
        if(flagged.length){
          statusEl.textContent = `Qualitätscheck: ${flagged.length} Position(en) werden ersetzt …`;
          for(const f of flagged){
            const ph = newPhases.find(p=>p.name===f.phase);
            if(!ph) continue;
            const idx = ph.blocks.findIndex(b=>b.title===f.title);
            if(idx===-1) continue;
            const siblingTitles = ph.blocks.map(b=>b.title).filter(t=>t!==ph.blocks[idx].title);
            const sug2 = await aiSuggestBlock(journeyKey, ph.name, ph.blocks[idx], siblingTitles, computeBlockDurationSec(ph, idx));
            ph.blocks[idx] = suggestionToCompiledBlock(sug2, ph.blocks[idx].time);
          }
        }
      } catch(reviewErr){
        // Qualitätscheck ist ein Bonus, kein Muss — die bereits generierte Stunde bleibt gültig,
        // wenn der Check selbst fehlschlägt (z. B. unerwartetes Antwortformat).
        console.warn("Class-Check übersprungen:", reviewErr.message);
      }
      const entry2 = getVariantEntry(journeyKey);
      entry2.draftPhases = newPhases;
      entry2.activeId = "draft";
      setVariantEntry(journeyKey, entry2);
      statusEl.textContent = "";
      render();
    } catch(err){
      btn.disabled = false;
      statusEl.textContent = "";
      alert("Neu mischen fehlgeschlagen: " + err.message);
    }
  });
}

// ===================== TEXT-TO-SPEECH (Cues vorlesen) =====================
let ttsEnabled = (function(){ try { return localStorage.getItem("jin-tts")!=="0"; } catch(e){ return true; } })();
let ttsLastSpokenKey = null;
let ttsInterruptedKey = null;
let ttsVoice = null;
function ttsLoadVoice(){
  if(!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  ttsVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("de")) || null;
}
if("speechSynthesis" in window){
  ttsLoadVoice();
  window.speechSynthesis.onvoiceschanged = ttsLoadVoice;
}
function extractCueText(bodyHtml){
  const m = (bodyHtml||"").match(/<div class='cue'>([\s\S]*?)<\/div>/);
  const html = m ? m[1] : (bodyHtml||"");
  const lines = html.split("<br>").map(l=>{
    let t = l;
    t = t.replace(/<span class='lbl'>(.*?)<\/span>/g, (mm,txt)=> txt+": ");
    t = t.replace(/<span class='tag (ground|flight)'>(.*?)<\/span>/g, (mm,cls,txt)=> txt+": ");
    t = t.replace(/<[^>]+>/g,"");
    t = t.replace(/„|“/g,"");
    return t.trim();
  }).filter(Boolean);
  return lines.join(". ");
}
function ttsSpeak(text, onEnd){
  if(!("speechSynthesis" in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  if(ttsVoice) u.voice = ttsVoice;
  u.rate = 0.95;
  if(onEnd){ u.onend = onEnd; u.onerror = onEnd; }
  window.speechSynthesis.speak(u);
}
function ttsStop(){
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function ttsMaybeAutoSpeak(block){
  if(!ttsEnabled || !state.timer.running) return;
  const key = block.phase+"|"+block.time+"|"+block.title;
  if(key===ttsLastSpokenKey) return;
  ttsLastSpokenKey = key;
  ttsSpeak(extractCueText(block.body));
}

function renderPractice(main, j){
  const flat = allBlocksFlat(j);
  const total = 3600;
  const elapsed = state.timer.elapsed;
  let currentIdx = 0;
  for(let i=0;i<flat.length;i++){ if(flat[i].start<=elapsed) currentIdx=i; }
  const current = flat[currentIdx];
  const next = flat[currentIdx+1] || null;
  const remaining = Math.max(0, (next ? next.start : total) - elapsed);

  const hero = document.createElement("div"); hero.className="practice-hero";
  hero.innerHTML = `
    <div class="clock">${fmt(elapsed)}</div>
    <div class="clockphase">${current.phase}</div>
    <div class="bar"><div class="barfill" style="width:${Math.min(100, elapsed/total*100)}%"></div></div>
    <div class="ctrls">
      <button id="ptoggle" class="go">${state.timer.running? "Pause":"Start"}</button>
      <button id="preset">Reset</button>
      <button id="ttstoggle" class="ttstoggle${ttsEnabled?" on":""}" title="Cues automatisch vorlesen">${ttsEnabled?"🔊":"🔇"}</button>
    </div>`;
  main.appendChild(hero);

  const nextstrip = document.createElement("div"); nextstrip.className="nextstrip";
  nextstrip.innerHTML = `<span class="rem">${fmt(remaining)} VERBLEIBEND</span><span class="nx">${next ? `NEXT → <b>${next.title}</b>` : "Letzte Übung"}</span>`;
  main.appendChild(nextstrip);

  const now = document.createElement("div"); now.className="nowcard";
  now.innerHTML = `<div class="lblrow"><div class="lbl">${current.time} · ${current.phase}</div><button id="speaknow" class="speakbtn">🔊 Vorlesen</button></div><div class="title">${current.title}</div><div class="txt">${current.body}</div>`;
  main.appendChild(now);

  const mini = document.createElement("div"); mini.className="minilist";
  flat.forEach(b=>{
    const row=document.createElement("div");
    row.className="miniblock"+(b===current?" active":"");
    row.innerHTML=`<span class="t">${b.time}</span><span>${b.title}</span>`;
    row.onclick=()=>{ state.timer.elapsed=b.start; if(state.timer.running) state.timer.startedAt=Date.now()-b.start*1000; render(); };
    mini.appendChild(row);
  });
  main.appendChild(mini);

  document.getElementById("ptoggle").onclick=()=>{
    state.timer.running=!state.timer.running;
    if(state.timer.running){
      // Anker auf die Wanduhr statt nur hochzuzählen: so bleibt die Anzeige auch
      // korrekt, wenn der Browser den Tick mal verzögert oder aussetzt (z.B. während
      // Sprachausgabe läuft oder das Display kurz sperrt) — beim nächsten Tick holt
      // sie sich automatisch die tatsächlich vergangene Zeit statt einfach weiterzuzählen.
      state.timer.startedAt = Date.now() - state.timer.elapsed*1000;
      state.timer.interval=setInterval(()=>{
        state.timer.elapsed = Math.floor((Date.now()-state.timer.startedAt)/1000);
        if(state.timer.elapsed>=total){ state.timer.elapsed=total; state.timer.running=false; clearInterval(state.timer.interval); }
        render();
      },1000);
    } else {
      clearInterval(state.timer.interval);
      ttsStop();
    }
    render();
  };
  document.getElementById("preset").onclick=()=>{
    state.timer.running=false; state.timer.elapsed=0; state.timer.startedAt=null; clearInterval(state.timer.interval);
    ttsStop(); ttsLastSpokenKey=null; ttsInterruptedKey=null;
    render();
  };
  document.getElementById("ttstoggle").onclick=()=>{
    const key = current.phase+"|"+current.time+"|"+current.title;
    const wasSpeaking = ("speechSynthesis" in window) && window.speechSynthesis.speaking;
    ttsEnabled = !ttsEnabled;
    try { localStorage.setItem("jin-tts", ttsEnabled?"1":"0"); } catch(e){}
    if(!ttsEnabled){
      ttsStop();
      // Wurde der Cue gerade aktiv gesprochen, merken wir uns das, um ihn beim
      // Wiedereinschalten fortzusetzen (TTS kann nicht mitten im Satz weitermachen).
      ttsInterruptedKey = wasSpeaking ? key : ttsInterruptedKey;
    } else if(ttsInterruptedKey === key){
      ttsInterruptedKey = null;
      ttsLastSpokenKey = key;
      ttsSpeak(extractCueText(current.body));
    } else {
      // Wiedereinschalten, ohne dass der Cue dieses Blocks unterbrochen wurde:
      // nicht rückwirkend von vorne vorlesen. Erst der nächste Blockwechsel
      // löst wieder automatisches Vorlesen aus.
      ttsLastSpokenKey = key;
    }
    render();
  };
  document.getElementById("speaknow").onclick=(ev)=>{
    ttsSpeak(extractCueText(current.body));
    const btn=ev.currentTarget; btn.classList.add("speaking");
    setTimeout(()=>btn.classList.remove("speaking"), 600);
  };

  ttsMaybeAutoSpeak(current);
}

// ===================== CLASS BUILDER =====================
const PHASE_ORDER = ["AWAKEN","FLOW","EXPLORE","MELT","REST"];

function inferBaseType(name){
  const stripped = String(name||"").trim().toUpperCase().replace(/\s*\d+\s*$/,"").trim();
  if(PHASE_ORDER.includes(stripped)) return stripped;
  const synonyms = {
    "WARMUP":"AWAKEN", "WARM-UP":"AWAKEN", "WARM UP":"AWAKEN",
    "PEAK":"EXPLORE", "CORE":"EXPLORE", "MAIN":"EXPLORE",
    "COOLDOWN":"REST", "COOL-DOWN":"REST", "COOL DOWN":"REST", "CALM":"REST", "STILL":"REST",
  };
  if(synonyms[stripped]) return synonyms[stripped];
  return stripped; // unknown custom type — its own bucket, no false match
}

function slugify(s){
  const base = (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
  return "custom_" + (base || String(Date.now()));
}
function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function nl2br(s){ return escapeHtml(s).split("\n").map(x=>x.trim()).filter(Boolean).join("<br>"); }
function parseDur(s){
  if(!s) return null;
  const m = String(s).trim().match(/^(\d+):([0-5]?\d)$/);
  if(!m) return null;
  return (+m[1])*60 + (+m[2]);
}
function secToTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}
function quoteLine(l){
  l = l.trim();
  if(!l) return "";
  if(!l.startsWith("\u201e")) l = "\u201e" + l;
  if(!l.endsWith("\u201c")) l = l + "\u201c";
  return l;
}

function loadCustomStore(){
  try { return JSON.parse(localStorage.getItem("jin-custom-journeys") || "{}"); } catch(e){ return {}; }
}
function saveCustomStore(store){
  try { localStorage.setItem("jin-custom-journeys", JSON.stringify(store)); } catch(e){}
}
function loadCustomJourneys(){
  const store = loadCustomStore();
  Object.keys(store).forEach(key=>{
    DATA[key] = compileJourney(store[key]);
  });
}

function emptyBlock(){
  return { title:"", dur:"", body:"", cueLong:"", isHold:false, explore:null, opts:null };
}
function newDraft(){
  return {
    key:null, label:"", theme:"", intention:"", color:"#e8601f", memory:[],
    phases: PHASE_ORDER.map(name=>({ name, baseType:name, blocks:[] })),
  };
}
let builderDraft = newDraft();
let builderEditingKey = null;

function compileJourney(draft){
  let cursor = 0;
  const phases = draft.phases.map(ph=>{
    const phaseStart = cursor;
    const blocks = ph.blocks.map(bl=>{
      const dur = parseDur(bl.dur) || 0;
      const time = secToTime(cursor);
      let bodyHtml = "";
      if(bl.explore){
        bodyHtml = ["arrive","move","reduce","pause","release"].map(k=>{
          const val = bl.explore[k];
          const lbl = k.charAt(0).toUpperCase()+k.slice(1);
          return val && val.trim() ? "<span class='lbl'>"+lbl+"</span> "+nl2br(val) : null;
        }).filter(Boolean).join("<br>");
      } else if(bl.opts && bl.opts.label1 && bl.opts.text1){
        bodyHtml = "<span class='tag ground'>"+escapeHtml(bl.opts.label1.toUpperCase())+"</span> "+nl2br(bl.opts.text1);
        if(bl.opts.label2 && bl.opts.text2){
          bodyHtml += "<br><span class='tag flight'>"+escapeHtml(bl.opts.label2.toUpperCase())+"</span> "+nl2br(bl.opts.text2);
        }
        if(bl.body && bl.body.trim()) bodyHtml += (bodyHtml?"<br>":"") + nl2br(bl.body);
      } else {
        bodyHtml = nl2br(bl.body);
      }
      if(bl.cueLong && bl.cueLong.trim()){
        const lines = bl.cueLong.split("\n").map(quoteLine).filter(Boolean);
        if(lines.length) bodyHtml += "<div class='cue'>" + lines.join("<br>") + "</div>";
      }
      cursor += dur;
      return { time, title: bl.title || "(ohne Titel)", body: bodyHtml };
    });
    const rangeStr = Math.floor(phaseStart/60) + "\u2013" + Math.floor(cursor/60);
    return { name: ph.name, range: rangeStr, start: phaseStart, blocks };
  });
  return {
    label: draft.label || "Neue Journey",
    theme: draft.theme || "",
    color: draft.color || "#e8601f",
    memory: draft.memory || [],
    phases,
  };
}

function validateJourney(draft){
  const items = [];
  if(!draft.label || !draft.label.trim()){
    items.push({level:"err", text:"Journey braucht einen Namen (Label)."});
  }
  let totalSec = 0;
  let anyBlocks = false;
  let holdIssues = [];
  draft.phases.forEach(ph=>{
    if(!ph.blocks.length){
      items.push({level:"warn", text: ph.name+": noch keine Moves."});
    } else { anyBlocks = true; }
    ph.blocks.forEach(bl=>{
      const dur = parseDur(bl.dur);
      if(bl.title && dur===null){
        items.push({level:"err", text: ph.name+" \u00b7 \"" + bl.title + "\": Dauer fehlt oder falsches Format (mm:ss)."});
      }
      if(dur) totalSec += dur;
      if(bl.isHold && dur && dur>180){
        holdIssues.push(ph.name+" \u00b7 "+bl.title);
      }
    });
    // R/L pairing heuristic
    const titles = ph.blocks.map(b=>b.title||"");
    titles.forEach(t=>{
      const m = t.match(/^(.*)\sR(\s\u00b7.*)?$/);
      if(m){
        const base = m[1];
        const hasL = titles.some(t2=> t2.startsWith(base+" L"));
        if(!hasL) items.push({level:"warn", text: ph.name+": \""+t+"\" hat keine erkennbare L-Seite (Seitenkonvention)."});
      }
    });
  });
  if(!anyBlocks){
    items.push({level:"err", text:"Noch keine Moves in der Journey."});
  }
  if(holdIssues.length){
    items.push({level:"err", text:"Stillness Rule verletzt (max. 3:00 pro Hold): " + holdIssues.join(", ")});
  }
  const totalOk = totalSec>=3570 && totalSec<=3630;
  items.push({
    level: totalOk ? "ok" : (totalSec>0 ? "warn" : "err"),
    text: "Gesamtzeit: " + secToTime(totalSec) + " (Ziel: 60:00)"
  });
  if(draft.phases.every(ph=>ph.blocks.length>0) && !holdIssues.length){
    items.push({level:"ok", text:"Alle 5 Phasen belegt, keine Stillness-Rule-Verletzung."});
  }
  const hasErr = items.some(i=>i.level==="err");
  return { items, canSave: !hasErr };
}

function renderValidationPanel(){
  const el = document.getElementById("bvalid");
  if(!el) return;
  const v = validateJourney(builderDraft);
  el.innerHTML = v.items.map(i=>{
    const dot = i.level==="ok" ? "\u2713" : i.level==="warn" ? "!" : "\u2715";
    return "<div class='vitem "+i.level+"'><span class='vdot'>"+dot+"</span><span>"+escapeHtml(i.text)+"</span></div>";
  }).join("");
  const saveBtn = document.getElementById("bsave");
  if(saveBtn) saveBtn.disabled = !v.canSave;
  return v;
}

  builderDraft.phases[phaseIdx].blocks[blockIdx][key] = value;

}

      <h3>Prüfung gegen Core 1.0</h3>
      <div class="bvalid" id="bvalid"></div>
    </div>

      <div class="bfield" style="max-width:220px;"><label>Basistyp (für Bibliothek/KI-Regeln)</label><select class="bi-basetype" data-pidx="${pIdx}">${baseTypeOptions}</select></div>
      <div class="bblocklist"></div><button class="baddbtn" data-addblock="${pIdx}">+ Move zu ${ph.name}</button><div class="bsuggestbar"><button data-suggest="library" data-pidx="${pIdx}">📚 Bibliothek</button><button data-suggest="ai" data-pidx="${pIdx}">✨ KI-Vorschlag</button></div><div class="bsuggest-panel" id="bsuggest-${pIdx}" style="display:none;"></div>`;
    const listEl = sec.querySelector(".bblocklist");

    });

  addPhaseBtn.textContent = "+ Neue Phase (z. B. FLOW 2, PEAK)";
  addPhaseBtn.onclick = ()=>{
    const name = prompt("Name der neuen Phase (z. B. \"FLOW 2\" oder \"PEAK\"):");
    if(!name || !name.trim()) return;
    builderDraft.phases.push({ name: name.trim(), baseType: inferBaseType(name), blocks:[] });
    render();
  };
  phasesEl.after(addPhaseBtn);
  wrap.querySelectorAll("[data-suggest]").forEach(b=>{
    b.onclick = ()=>{
      const pIdx = +b.dataset.pidx;
      const source = b.dataset.suggest;
      if(source === "library") openLibraryPanel(pIdx);
      else openAiPanel(pIdx);
    };

  wrap.querySelector("#bf-label").addEventListener("input", e=>{ builderDraft.label = e.target.value; renderValidationPanel(); });

  wrap.querySelector("#bf-color").addEventListener("input", e=>{ builderDraft.color = e.target.value; });
  wrap.querySelector("#bf-intention").addEventListener("input", e=>{ builderDraft.intention = e.target.value; });

    };

  wrap.querySelectorAll("[data-loadkey]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.loadkey;
      const raw = store[k];
      if(raw){ builderDraft = JSON.parse(JSON.stringify(raw)); builderEditingKey = k; render(); }
    };
  });

    const key = builderEditingKey || slugify(builderDraft.label);
    builderDraft.key = key;
    const store2 = loadCustomStore();
    store2[key] = JSON.parse(JSON.stringify(builderDraft));
    saveCustomStore(store2);
    DATA[key] = compileJourney(builderDraft);
    builderEditingKey = key;
    buildJourneyTabs();

    render();
  };

  wrap.querySelector("#bdelete").onclick = ()=>{
    if(!builderEditingKey){ builderDraft = newDraft(); render(); return; }
    if(!confirm("Diese Journey wirklich löschen?")) return;
    const store2 = loadCustomStore();
    delete store2[builderEditingKey];
    saveCustomStore(store2);
    delete DATA[builderEditingKey];
    builderEditingKey = null;
    builderDraft = newDraft();
    buildJourneyTabs();
    render();
  };

  renderValidationPanel();
}

function renderBlockCard(pIdx, bIdx, bl){
  const card = document.createElement("div");
  card.className = "bblock";
  const isExplore = builderDraft.phases[pIdx].name === "EXPLORE";
  card.innerHTML = `
    <div class="bblockhead">
      <span class="bt">Move ${bIdx+1}</span>
      <button class="bsmallbtn danger" data-removeblock="1">Entfernen</button>
    </div>
    <div class="brow">
      <div class="bfield" style="flex:2;"><label>Titel</label><input type="text" class="bi-title" value="${escapeHtml(bl.title)}" placeholder="z.B. Hip Circle R"></div>
      <div class="bfield" style="flex:1;"><label>Dauer (mm:ss)</label><input type="text" class="bi-dur" value="${escapeHtml(bl.dur)}" placeholder="1:30"></div>
    </div>
    <div class="bcheckrow"><label><input type="checkbox" class="bi-hold" ${bl.isHold?"checked":""}> Statischer Hold (Stillness Rule: max. 3:00)</label></div>
    ${isExplore ? `<div class="bcheckrow"><label><input type="checkbox" class="bi-explmode" ${bl.explore?"checked":""}> EXPLORE-Grammatik (Arrive/Move/Reduce/Pause/Release)</label></div>` : ""}
    <div class="bblockbody"></div>
    <div class="bfield"><label>Cue lang (eine Zeile = ein gesprochener Satz)</label><textarea class="bi-cue" placeholder="Ein Satz pro Zeile">${escapeHtml(bl.cueLong)}</textarea></div>
  `;

  const bodyWrap = card.querySelector(".bblockbody");
  function renderBody(){
    bodyWrap.innerHTML = "";
    if(bl.explore){
      const grid = document.createElement("div");
      grid.className = "bexplore-grid";
      ["arrive","move","reduce","pause","release"].forEach(k=>{
        const f = document.createElement("div");
        f.className = "bfield";
        f.innerHTML = "<label>"+k.charAt(0).toUpperCase()+k.slice(1)+"</label><textarea class='bi-expl' data-k='"+k+"'>"+escapeHtml(bl.explore[k]||"")+"</textarea>";
        grid.appendChild(f);
        f.querySelector("textarea").addEventListener("input", e=>{ bl.explore[k]=e.target.value; renderValidationPanel(); });
      });
      bodyWrap.appendChild(grid);
    } else {
      const optsField = document.createElement("div");
      optsField.className = "bsection";
      optsField.style.padding = "10px";
      optsField.innerHTML = `
        <div class="bcheckrow"><label><input type="checkbox" class="bi-optsmode" ${bl.opts?"checked":""}> Zwei Optionen (z.B. Ground/Flight)</label></div>
        <div class="bopts-fields" style="display:${bl.opts?"block":"none"}">
          <div class="brow">
            <div class="bfield"><label>Label 1</label><input type="text" class="bi-opt-l1" value="${escapeHtml(bl.opts&&bl.opts.label1||"")}" placeholder="GROUND"></div>
            <div class="bfield"><label>Text 1</label><input type="text" class="bi-opt-t1" value="${escapeHtml(bl.opts&&bl.opts.text1||"")}"></div>
          </div>
          <div class="brow">
            <div class="bfield"><label>Label 2</label><input type="text" class="bi-opt-l2" value="${escapeHtml(bl.opts&&bl.opts.label2||"")}" placeholder="FLIGHT"></div>
            <div class="bfield"><label>Text 2</label><input type="text" class="bi-opt-t2" value="${escapeHtml(bl.opts&&bl.opts.text2||"")}"></div>
          </div>
        </div>
        <div class="bfield"><label>Beschreibung</label><textarea class="bi-body" placeholder="Freitext, eine Zeile = eine Anweisung">${escapeHtml(bl.body)}</textarea></div>
      `;
      bodyWrap.appendChild(optsField);
      const optsCheck = optsField.querySelector(".bi-optsmode");
      const optsFields = optsField.querySelector(".bopts-fields");
      optsCheck.addEventListener("change", e=>{
        bl.opts = e.target.checked ? {label1:"",text1:"",label2:"",text2:""} : null;
        optsFields.style.display = bl.opts ? "block" : "none";
        renderValidationPanel();
      });
      ["l1","t1","l2","t2"].forEach((suf,i)=>{
        const cls = ".bi-opt-"+suf;
        const el = optsField.querySelector(cls);
        const key = ["label1","text1","label2","text2"][i];
        el.addEventListener("input", e=>{
          if(!bl.opts) bl.opts = {label1:"",text1:"",label2:"",text2:""};
          bl.opts[key] = e.target.value;
          renderValidationPanel();
        });
      });
      optsField.querySelector(".bi-body").addEventListener("input", e=>{ bl.body = e.target.value; renderValidationPanel(); });
    }
  }
  renderBody();

  card.querySelector(".bi-title").addEventListener("input", e=>{ bl.title = e.target.value; renderValidationPanel(); });
  card.querySelector(".bi-dur").addEventListener("input", e=>{ bl.dur = e.target.value; renderValidationPanel(); });
  card.querySelector(".bi-hold").addEventListener("change", e=>{ bl.isHold = e.target.checked; renderValidationPanel(); });
  card.querySelector(".bi-cue").addEventListener("input", e=>{ bl.cueLong = e.target.value; renderValidationPanel(); });
  const explToggle = card.querySelector(".bi-explmode");
  if(explToggle){
    explToggle.addEventListener("change", e=>{
      bl.explore = e.target.checked ? {arrive:"",move:"",reduce:"",pause:"",release:""} : null;
      bl.opts = null;
      renderBody();
    });
  }
  card.querySelector("[data-removeblock]").onclick = ()=>{
    builderDraft.phases[pIdx].blocks.splice(bIdx,1);
    render();
  };

  return card;
}

  const hr = () => new D.Paragraph({spacing:{before:200, after:200}, border:{bottom:{color:"B8A99A", space:1, style:D.BorderStyle.SINGLE, size:6}}, children:[new D.TextRun({text:""})]});
  const memoryLine = items => new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{before:200, after:200},
    shading:{type:D.ShadingType.CLEAR, fill:"F4EFE9"}, children:[new D.TextRun({text:items.join("  \u2192  "), bold:true, size:20, color:ACCENT})]});

  ch.push(title("JIN JOURNEY"));
  ch.push(subtitle(draft.label||"Neue Journey"));
  ch.push(versionLine("Custom Journey \u2014 erstellt mit dem JIN Journey Builder"));
  let totalSec = 0;
  draft.phases.forEach(ph=> ph.blocks.forEach(b=> totalSec += (parseDur(b.dur)||0)));
  ch.push(metaLine("Dauer", secToTime(totalSec)+" Min."));
  if(draft.theme) ch.push(metaLine("Thema", draft.theme));
  if(draft.intention) ch.push(metaLine("Intention", draft.intention));
  ch.push(hr());

  let cursor = 0;
  draft.phases.forEach(ph=>{
    const phaseStart = cursor;
    const phaseDur = ph.blocks.reduce((s,b)=> s+(parseDur(b.dur)||0), 0);
    ch.push(h1(Math.floor(phaseStart/60)+"\u2013"+Math.floor((phaseStart+phaseDur)/60)+" Min \u00b7 "+ph.name));
    ph.blocks.forEach(bl=>{
      const dur = parseDur(bl.dur)||0;
      const start = secToTime(cursor);
      const end = secToTime(cursor+dur);
      const holdSuffix = (bl.isHold && dur) ? "  ("+secToTime(dur)+" Min.)" : "";
      ch.push(h3(start+"\u2013"+end+" \u00b7 "+(bl.title||"(ohne Titel)")+holdSuffix));
      if(bl.explore){
        ["arrive","move","reduce","pause","release"].forEach(k=>{
          const val = bl.explore[k];
          if(val && val.trim()){
            ch.push(label(k.charAt(0).toUpperCase()+k.slice(1)));
            val.split("\n").filter(x=>x.trim()).forEach(line=> ch.push(p(line.trim())));
          }
        });
      } else {
        if(bl.opts && bl.opts.label1 && bl.opts.text1){
          ch.push(label(bl.opts.label1)); ch.push(p(bl.opts.text1));
          if(bl.opts.label2 && bl.opts.text2){ ch.push(label(bl.opts.label2)); ch.push(p(bl.opts.text2)); }
        }
        if(bl.body && bl.body.trim()) bl.body.split("\n").filter(x=>x.trim()).forEach(line=> ch.push(p(line.trim())));
      }
      if(bl.cueLong && bl.cueLong.trim()){
        bl.cueLong.split("\n").filter(x=>x.trim()).forEach(line=> ch.push(p(quoteLine(line), {italics:true})));
      }
      cursor += dur;
    });
  });

  if(draft.memory && draft.memory.length){
    ch.push(h1((draft.label||"Journey")+" \u2014 Memory Line"));
    ch.push(memoryLine(draft.memory));
  }
  return ch;
}

async function exportDocx(draft){
  if(!window.docx){
    alert("Die Word-Export-Bibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.");
    return;
  }
  const v = validateJourney(draft);
  if(!v.canSave && !confirm("Es gibt noch offene Punkte in der Prüfung. Trotzdem als Word-Dokument exportieren?")) return;
  try {
    const D = window.docx;
    const doc = new D.Document({ sections: [{
      properties: { page: { size:{width:11906, height:16838}, margin:{top:1080, bottom:1080, left:1200, right:1200} } },
      children: buildDocxParagraphs(draft),
    }]});
    const blob = await D.Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "JIN_Journey_" + (draft.label||"custom").replace(/[^a-z0-9]+/gi,"_") + ".docx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
  } catch(err){
    alert("Word-Export fehlgeschlagen: " + err.message);
  }
}

// ---------- Suggestions: offline library + AI ----------
function htmlToPlainLine(s){
  return (s||"")
    .replace(/<span class='lbl'>([^<]*)<\/span>\s*/g, "$1: ")
    .replace(/<span class='tag (?:ground|flight)'>([^<]*)<\/span>\s*/g, "$1: ")
    .replace(/<[^>]+>/g, "")
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .trim();
}
function splitBodyAndCue(html){
  const m = html.match(/<div class='cue'>([\s\S]*?)<\/div>/);
  let cueLines = [];
  let rest = html;
  if(m){
    cueLines = m[1].split(/<br\s*\/?>/).map(htmlToPlainLine).filter(Boolean);
    rest = html.replace(/<div class='cue'>[\s\S]*?<\/div>/, "");
  }
  return { rest, cueLines };
}
function htmlToDraftFields(html, phaseName){
  const { rest, cueLines } = splitBodyAndCue(html);
  const lines = rest.split(/<br\s*\/?>/).map(htmlToPlainLine).filter(Boolean);
  const plain = lines.join("\n");
  let explore = null;
  if(phaseName === "EXPLORE"){
    const keys = ["Arrive","Move","Reduce","Pause","Release"];
    if(keys.some(k=> plain.includes(k+": "))){
      explore = {arrive:"",move:"",reduce:"",pause:"",release:""};
      let current = null;
      lines.forEach(line=>{
        const found = keys.find(k=> line.startsWith(k+": "));
        if(found){ current = found.toLowerCase(); explore[current] = line.slice(found.length+2); }
        else if(current){ explore[current] += "\n" + line; }
      });
    }
  }
  return { body: explore ? "" : plain, explore, cueLong: cueLines.join("\n") };
}

let MOVE_LIBRARY = null;
function buildMoveLibrary(){
  if(MOVE_LIBRARY) return MOVE_LIBRARY;
  MOVE_LIBRARY = { AWAKEN:[], FLOW:[], EXPLORE:[], MELT:[], REST:[] };
  const sources = [["morning","Morning"], ["evening","Evening"], ["energy","Energy"]];
  sources.forEach(([key, srcLabel])=>{
    const j = DATA[key];
    if(!j) return;
    j.phases.forEach(ph=>{
      if(!MOVE_LIBRARY[ph.name]) return;
      ph.blocks.forEach((bl, i)=>{
        const nextStart = i+1 < ph.blocks.length ? parseTimeToSec(ph.blocks[i+1].time) : (ph.start + rangeEndSec(ph));
        const startSec = parseTimeToSec(bl.time);
        const dur = Math.max(0, nextStart - startSec);
        const fields = htmlToDraftFields(bl.body, ph.name);
        MOVE_LIBRARY[ph.name].push({
          title: bl.title, journeySource: srcLabel, duration: secToTime(dur||60),
          isHold: !!(fields.cueLong || dur<=180) && ph.name==="MELT",
          body: fields.body, explore: fields.explore, cueLong: fields.cueLong,
        });
      });
    });
  });
  return MOVE_LIBRARY;
}
function parseTimeToSec(t){
  const m = String(t||"0:00").match(/^(\d+):([0-5]?\d)/);
  return m ? (+m[1])*60 + (+m[2]) : 0;
}
function rangeEndSec(ph){
  const m = String(ph.range||"").match(/\u2013(\d+)$/);
  return m ? (+m[1])*60 - ph.start : 180;
}

function suggestionCardHtml(s, idx){
  const src = s.journeySource ? "<span class='ssrc'>"+escapeHtml(s.journeySource)+"</span>" : "";
  const preview = s.explore
    ? Object.entries(s.explore).filter(([k,v])=>v).map(([k,v])=> k+": "+v).join(" · ")
    : (s.body||"");
  return "<div class='scard'><span class='sdur'>"+escapeHtml(s.duration||"")+"</span>" +
    "<span class='stitle'>"+escapeHtml(s.title||"")+"</span>"+src+
    "<div class='sbody'>"+escapeHtml(preview)+"</div>" +
    "<button class='sapply' data-applyidx='"+idx+"'>Übernehmen</button></div>";
}

function openLibraryPanel(pIdx){
  const panel = document.getElementById("bsuggest-"+pIdx);
  const ph = builderDraft.phases[pIdx];
  const baseType = ph.baseType || inferBaseType(ph.name);
  const lib = buildMoveLibrary()[baseType] || [];
  const show = panel.style.display !== "none" && panel.dataset.mode === "library";
  if(show){ panel.style.display = "none"; return; }
  panel.dataset.mode = "library";
  panel.style.display = "block";
  let items = lib;
  function draw(filter){
    const f = (filter||"").toLowerCase();
    const filtered = f ? items.filter(s=> s.title.toLowerCase().includes(f)) : items;
    panel.innerHTML = "<input class='sfilter' placeholder='Move suchen...' id='libfilter-"+pIdx+"'>" +
      (filtered.length ? "" : `<div class='sstatus'>Keine Treffer für Basistyp „${baseType}“.</div>`) +
      filtered.map((s,i)=> suggestionCardHtml(s, i)).join("");
    panel.querySelector(".sfilter").addEventListener("input", e=> draw(e.target.value));
    panel.querySelectorAll("[data-applyidx]").forEach(btn=>{
      btn.onclick = ()=>{ applySuggestion(pIdx, filtered[+btn.dataset.applyidx]); };
    });
  }
  draw("");
}

async function openAiPanel(pIdx){
  const panel = document.getElementById("bsuggest-"+pIdx);
  const already = panel.style.display !== "none" && panel.dataset.mode === "ai";
  if(already){ panel.style.display = "none"; return; }
  panel.dataset.mode = "ai";
  panel.style.display = "block";
  panel.innerHTML = "<div class='sstatus'>Lädt Vorschläge …</div>";
  const ph = builderDraft.phases[pIdx];
  const existingTitles = builderDraft.phases.flatMap(p=> p.blocks.map(b=>b.title)).filter(Boolean);
  const usedSec = ph.blocks.reduce((s,b)=> s+(parseDur(b.dur)||0), 0);
  try {
    const res = await fetch("/.netlify/functions/joga", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ type:"jin_move_suggestion", params:{
        phase: ph.name, journeyLabel: builderDraft.label||"Neue Journey", journeyTheme: builderDraft.theme,
        existingTitles, remainingTime: secToTime(Math.max(0,3600/5-usedSec)), provider:"claude"
      }})
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(!data.claude) throw new Error(data.claudeError || "Keine Antwort von der KI erhalten.");
    let parsed;
    try {
      const cleaned = data.claude.trim().replace(/^```json\s*/,"").replace(/```$/,"");
      parsed = JSON.parse(cleaned);
    } catch(e){ throw new Error("Antwort war kein gültiges JSON."); }
    const suggestions = parsed.suggestions || [];
    if(!suggestions.length){ panel.innerHTML = "<div class='sstatus'>Keine Vorschläge erhalten.</div>"; return; }
    panel.innerHTML = suggestions.map((s,i)=> suggestionCardHtml(s, i)).join("");
    panel.querySelectorAll("[data-applyidx]").forEach(btn=>{
      btn.onclick = ()=>{ applySuggestion(pIdx, suggestions[+btn.dataset.applyidx]); };
    });
  } catch(err){
    panel.innerHTML = "<div class='sstatus'>KI-Vorschlag fehlgeschlagen: " + escapeHtml(err.message) +
      ". Prüfe, ob die Netlify Function erreichbar ist und ein API-Key hinterlegt ist.</div>";
  }
}

function applySuggestion(pIdx, s){
  if(!s) return;
  const block = emptyBlock();
  block.title = s.title || "";
  block.dur = s.duration || "";
  block.isHold = !!s.isHold;
  block.cueLong = s.cueLong || "";
  if(s.explore && Object.values(s.explore).some(v=>v)){
    block.explore = { arrive:s.explore.arrive||"", move:s.explore.move||"", reduce:s.explore.reduce||"", pause:s.explore.pause||"", release:s.explore.release||"" };
  } else {
    block.body = s.body || "";
  }
  builderDraft.phases[pIdx].blocks.push(block);
  render();
}
