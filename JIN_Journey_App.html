:root{ --accent:#e8601f; --accent-ink:#171512; }
  html[data-theme="dark"]{
    --bg:#171512; --card:#1c1a17; --line:#2a2622;
    --text:#f2eee6; --text-2:#c9c2b4; --text-3:#8a8070; --text-4:#5c564c;
    --ground-bg:#16221c; --ground-line:#2c4636; --ground:#8fc9a8;
    --flight-bg:#241c14; --flight-line:#3a2c1c; --flight:#c9a876;
  }
  html[data-theme="light"]{
    --bg:#faf6f0; --card:#ffffff; --line:#e8ded0;
    --text:#2a2420; --text-2:#4a443c; --text-3:#7a7166; --text-4:#a89486;
    --ground-bg:#eef7f1; --ground-line:#bfe0cc; --ground:#2f7a4d;
    --flight-bg:#fbf1e4; --flight-line:#eed9b8; --flight:#8a6a2f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:78px; transition:background .2s;}
  h1,h2,h3{font-family:'Inter',system-ui,sans-serif; font-weight:600; margin:0;}
  .wrap{max-width:520px; margin:0 auto; padding:0 16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 16px 0; border-bottom:1px solid var(--line);}
  header.top .brand{display:flex; align-items:flex-start; justify-content:space-between; max-width:520px; margin:0 auto; gap:8px; flex-wrap:wrap;}
  header.top .overline{font-size:10px; font-weight:700; color:var(--text-3); letter-spacing:2px; text-transform:uppercase;}

      P("0:00","Arrive","Hüftbreiter Stand. Knie weich. Gewicht verteilen. Schultern lösen. Atem wahrnehmen.<div class='cue'>„Guten Morgen. Wir starten heute nicht damit, besonders beweglich zu sein. Wir starten einfach damit, uns zu bewegen. Spürt kurz eure Füße. Lasst die Knie weich. Atmet einmal tief ein. Und lang wieder aus. Wir sagen heute einfach Ja zu Bewegung. Und schauen, wohin sie uns führt.“</div>"),
      P("1:30","Bounce","<span class='lbl'>Ground</span> Über Füße, Sprunggelenke und Knie federn. Fersen dürfen sich lösen, beide Füße behalten Bodenkontakt.<br><span class='lbl'>Flight</span> Aus dem Federn dürfen kleine Hops entstehen. Beide Qualitäten können jederzeit ineinander übergehen.<div class='cue'>„Gebt dem Körper ein bisschen Rhythmus. Noch kein Workout. Nur wach werden. Wer springen möchte, springt. Wer heute nicht springen möchte, bleibt bei den Fersen. Beides ist richtig.“</div>"),
      P("2:30","Arm Swings","Arme vor dem Körper kreuzen → öffnen. Klein beginnen. Bewegungsradius allmählich vergrößern. Arme schwingen, nicht aktiv in Endpositionen führen.<div class='cue'>„Lasst die Arme vor dem Körper kreuzen.“<br>„Und wieder öffnen, weit zur Seite.“<br>„Kreuzen. Öffnen.“<br>„Fangt klein an. Der Radius darf langsam größer werden.“<br>„Nicht kontrollieren. Schwingen lassen.“<br>„Die Arme dürfen einfach mitfliegen.“</div>"),
      P("3:30","Trunk Twist","Rumpf R/L drehen. Arme locker mitführen. Gegenüberliegende Ferse darf lösen. Kopf folgt nur in angenehmem Radius.<div class='cue'>„Dreht den Oberkörper sanft nach rechts. Und nach links.“<br>„Die Arme bleiben locker, sie hängen einfach mit.“<br>„Die Bewegung kommt aus der Mitte. Die Arme hängen einfach dran.“<br>„Die Ferse darf sich lösen, wenn das für euch stimmt.“<br>„Nicht maximal drehen. Einfach drehen.“</div>"),
      P("4:30","Body Wave","Knie → Becken → untere Wirbelsäule → Brust → Kopf. Bewegungsrichtung umkehren. Mehrere kontinuierliche Wellen.<div class='cue'>„Beugt die Knie ein wenig.“<br>„Schiebt das Becken sanft nach vorne.“<br>„Lasst die Welle durch die Wirbelsäule laufen – Becken, Wirbelsäule, Brust, Kopf zuletzt.“<br>„Und noch einmal von unten.“<br>„Keine perfekte Welle. Findet eure.“</div>"),
      P("5:30","Hip Circles","Becken vor → rechts → hinten → links. Mehrere Kreise. Richtungswechsel. Knie bleiben weich.<div class='cue'>„Becken nach vorne, nach rechts, nach hinten, nach links – ein großer Kreis.“<br>„Stellt euch vor, euer Becken zeichnet einen Kreis um eure Füße.“<br>„Ein paar Kreise, dann Richtung wechseln.“<br>„Die Knie bleiben weich, während ihr kreist.“</div>"),
      P("6:30","Squat & Reach","Ein: Aufrichten, Arme hoch. Aus: Becken zurück, Knie beugen, Arme nach hinten. 6–8 Wiederholungen.<div class='cue'>„Das ist kein Squat-Test. Geht nur so tief, dass ihr anschließend genauso leicht wieder hochkommt.“</div>"),
      P("7:30","Reach & Open","Beide Arme seitlich weit nach oben öffnen, ganz strecken, kurz halten. Dann Arme sinken lassen, mit dem Ausatmen. 4–6 Wiederholungen.<div class='cue'>„Öffnet beide Arme weit zur Seite und nach oben. Macht euch groß, schafft Raum um euch herum.“<br>„Kurz halten – dann lasst alles wieder sinken, mit dem Ausatmen.“<br>„Noch einmal: Arme öffnen, Raum schaffen. Und loslassen.“<br>„Genau darum geht's heute Morgen: nicht enger werden, sondern Platz schaffen für den Tag, der kommt.“</div>"),
      P("9:15","March mit Hände-Clap","Auf der Stelle marschieren, Knie abwechselnd anheben. Bei jedem angehobenen Knie die Hände kurz darüber zusammenklatschen.<div class='cue'>„Marschiert locker auf der Stelle. Immer wenn ihr ein Knie hebt, führt ihr die Hände von außen zum Knie. Ihr bestimmt eure Geschwindigkeit. Es ist kein Rennen – die Koordination darf ruhig etwas holprig sein.“</div>"),
      P("11:00","Side Reach Flow","Abwechselnde Seitbeugen R/L. Arme lang. Knie weich. Kontinuierlich fließen. Radius zum Ende leicht reduzieren.<div class='cue'>„Der Radius darf jetzt schon kleiner werden. Ihr bereitet den Körper vor, nicht das Publikum.“</div>"),
    ]},
    {name:"FLOW", range:"12–24", start:720, blocks:[
      P("12:00","Round 1 — Learn","Mountain → Reach → Forward Fold (Knie weich) → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → rechtes Knie kurz ablegen → Brust öffnen → Hände absetzen → Vierfüßler → Cat/Cow 3× → Down Dog → rechter Fuß nach vorne = Low Lunge R → linkes Knie kurz ablegen → Brust öffnen → Hände absetzen → linker Fuß nach vorne → Fold → Half Lift → Fold → Roll Up → Mountain.<div class='cue'>„Kommt nach vorne auf eure Matte, in den Stand.“<br>„Einatmen – Arme heben, lang nach oben. Schafft euch Raum, bevor der Tag ihn füllt.“<br>„Ausatmen – nach vorne falten. Knie bleiben weich.“<br>„Einatmen – halber Lift, Rücken lang.“<br>„Ausatmen – wieder Fold.“<br>„Rechtes Bein weit nach hinten: Low Lunge links.“<br>„Rechtes Knie sinkt sanft zum Boden.“<br>„Brustkorb öffnet sich, kurz nach oben schauen, wenn das gut tut.“<br>„Hände zum Boden. Vierfüßler.“<br>„Cat/Cow, drei Mal – rund, dann lang.“<br>„Hände schieben, Hüfte hoch: Down Dog.“<br>„Rechter Fuß nach vorne, zwischen die Hände: Low Lunge rechts.“<br>„Linkes Knie sinkt sanft zum Boden.“<br>„Brustkorb öffnet sich.“<br>„Linker Fuß kommt dazu. Fold.“<br>„Einatmen – halber Lift. Ausatmen – Fold.“<br>„Roll Up, Wirbel für Wirbel. Mountain.“<br>„Wir nehmen jetzt die freie Bewegung von eben mit in einen ersten Flow. Kein Tempo. Kein Wettbewerb. Der Atem gibt uns den Rhythmus.“</div>"),
      P("16:30","Round 2 — Flow","Identische Sequenz. Cat/Cow 2×. Übergänge weicher verbinden. Atem und Bewegung stärker verbinden. Lunges bleiben dynamisch.<div class='cue'>„Gleicher Weg, diesmal fließender.“<br>„Reach, Fold, Half Lift, Fold, Low Lunge links, Vierfüßler, Cat/Cow zweimal, Down Dog, Low Lunge rechts, Fold, Roll Up, Mountain.“<br>„Zweite Runde: Lasst die Übergänge ineinanderfließen. Die Form kennt ihr jetzt.“</div>"),
      P("20:30","Round 3 — Feel","Gleicher Bewegungsbogen. Cat/Cow 1×. Weniger technische Führung. Kurzer Moment des Wahrnehmens der Gruppe (optional). Am Ende: Down Dog → Knie ablegen → Vierfüßler. Nicht mehr aufstehen.<div class='cue'>„Wir haben groß angefangen. Vielleicht bemerkt ihr kurz die anderen im Raum, die heute mit euch angefangen haben. Ab jetzt wird unsere Bewegung langsam näher zum Boden und etwas kleiner.“</div>"),
    ]},
    {name:"EXPLORE", range:"24–39", start:1440, blocks:[
      P("24:00","Dragon R","<span class='lbl'>Arrive</span> Aus Vierfüßler rechten Fuß zwischen die Hände. Linkes Knie zunächst am Boden.<br><span class='lbl'>Move</span> Rock: Becken 3–4× vor/zurück. Half-Split Rock: Becken zurück, rechtes Bein länger, wieder vor, 3–4×. Activate — <span class='tag ground'>GROUND</span> linkes Knie am Boden. <span class='tag flight'>FLOAT</span> linke Zehen auf, Knie wenige cm heben. Rotate: linke Hand innen am rechten Fuß, rechter Arm öffnet, 2–3×. Side Reach: Oberkörper auf, linker Arm hoch, Neigung rechts.<br><span class='lbl'>Reduce</span> Zurück zum Low Lunge, zwei Rocks → kleiner → minimal.<br><span class='lbl'>Pause</span> Ca. 15–20 Sek.<br><span class='lbl'>Release</span> Bein zurück, Vierfüßler, Knie entlasten.<div class='cue'>„Rock, dann Half-Split Rock – findet euer Tempo.“<br><span class='lbl'>Ground</span> „Das linke Knie bleibt am Boden.“<br><span class='lbl'>Float</span> „Oder die linken Zehen kommen auf, das Knie hebt ein paar Zentimeter.“<br>„Große Bewegung. Kleine Bewegung. Noch kleiner. Bis ihr nichts mehr verändern müsst.“</div>"),
      P("27:00","Dragon L","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release.<div class='cue'>„Spiegelverkehrt, gleiche Anweisung wie rechts. Was rechts richtig war, ist links nicht automatisch gleich – findet es neu.“</div>"),
      P("30:00","90/90 Hip Wave","<span class='lbl'>Arrive</span> Sitz, Knie auf, Füße etwas weiter als hüftbreit.<br><span class='lbl'>Move</span> Knie R/L pendeln, 6–8×. Auf einer Seite bleiben, Oberkörper zum vorderen Bein, leicht vor/zurück. Seitenwechsel. Wieder R/L fließen.<br><span class='lbl'>Reduce</span> Pendel kleiner.<br><span class='lbl'>Pause</span> Neutraler Sitz.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Nicht ziehen. Bewegen.“</div>"),
      P("34:30","Butterfly Wave","<span class='lbl'>Arrive</span> Fußsohlen zusammen.<br><span class='lbl'>Move</span> Ein: Wirbelsäule auf. Aus: nach vorne, 3×. Side Reach R/L. Rotation R/L. Erneut vor → auf → vor.<br><span class='lbl'>Reduce</span> Volle → halbe → minimale Welle.<br><span class='lbl'>Pause</span> Ca. 60–75 Sek.<br><span class='lbl'>Release</span> Hände an Knie, aktiv zusammenführen, Beine ausstrecken.<div class='cue'>„Und genau hier verändert sich unsere Journey. Am Anfang war Bewegung groß. Jetzt wird sie klein. Vielleicht bleibt irgendwann nur noch der Atem.“</div>"),
    ]},
    {name:"MELT", range:"39–55", start:2340, blocks:[
      P("39:00","Half Butterfly R · 2:00","Rechtes Bein lang. Linker Fuß zum inneren Oberschenkel. Oberkörper zum rechten Bein, nach vorne sinken. Knie darf weich sein.<div class='cue'>„Nicht zum Fuß. Einfach in Richtung Bein.“</div>"),
      P("41:00","Half Butterfly L · 2:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Die zweite Seite ist selten die gleiche Geschichte wie die erste.“</div>"),
      P("43:00","Deer R · 2:00","Rechtes Bein vor dem Becken, Knie gebeugt, Unterschenkel diagonal vor dem Körper. Linkes Bein seitlich/hinten. Keine erzwungenen 90°. Aufrecht oder sanft nach vorne.<div class='cue'>„Vorderes Bein trägt, hinteres Bein liegt. Kein Ziehen, kein Quadrat erzwingen.“</div>"),
      P("45:00","Deer L · 2:00","Spiegelverkehrt.<div class='cue'>„Spiegelverkehrt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("47:00","Sphinx · 2:00","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Unterer Rücken behält Raum.<div class='cue'>„Kommt langsam in die Bauchlage. Unterarme zum Boden.“<br>„Je weiter die Ellbogen nach vorne wandern, desto kleiner wird die Rückbeuge.“<br>„Die Unterarme tragen euch, nicht die untere Wirbelsäule.“<br>„Nach so viel Falten heute: hier darf sich der Oberkörper einmal öffnen, bevor wir noch einmal nach vorne gehen.“</div>"),
      P("49:00","Pike / Caterpillar · 3:00","Beide Beine vorne. <span class='tag ground'>GROUND</span> Knie deutlich gebeugt, Oberkörper sinkt leicht. <span class='tag flight'>FLIGHT</span> Beine gestreckt, wenn die Rückseite das zulässt. Aufrichten, leicht aus dem Becken nach vorne, Oberkörper schwer werden lassen. Kein Ziehen zu den Füßen.<div class='cue'>„Die Haltung, auf die euer Körper die ganze Stunde vorbereitet wurde.“<br><span class='lbl'>Ground</span> „Die Knie dürfen deutlich gebeugt bleiben.“<br><span class='lbl'>Flight</span> „Oder die Beine strecken sich, wenn die Rückseite das zulässt.“<br>„Vielleicht sieht sie heute unspektakulär aus. Perfekt.“</div>"),
      P("52:00","Supine Twist R · 1:30","Rückenlage. Knie anwinkeln, nach links sinken. Brustkorb rotiert nach rechts. Kopf neutral oder rechts.<div class='cue'>„Das Knie sinkt, der Brustkorb bleibt offen. Der Boden hält den Rest.“</div>"),
      P("53:30","Supine Twist L · 1:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Letzte Bewegung vor der Stille.“</div>"),
    ]},
    {name:"REST", range:"55–60", start:3300, blocks:[
      P("55:00","Savasana","Rückenlage. Arme/Beine bequem. Ca. vier Minuten vollständige Ruhe. Letzte Minute: Atem vertiefen → Finger/Zehen → strecken → über die Seite zum Sitz.<div class='cue'>„Wir haben mit Bewegung begonnen – groß, locker, unperfekt. Dann wurde sie kleiner. Bis keine Bewegung mehr nötig war.“</div>"),
    ]},
  ],

evening: { label:"Evening Unwind", theme:"Den Tag abgeben", color:"#5a7a8a",
  memory:["SHAKE","SWAY","WAVE","MOON","MELTING CAT","THREAD","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","FIGURE FOUR","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–10", start:0, blocks:[
      P("0:00","Shake & Arrive","Im Stand. Hände → Arme → Schultern → Beine locker ausschütteln. Gewicht verlagern. Bewegung allmählich ruhiger.<div class='cue'>„Bevor wir versuchen loszulassen, bewegen wir erst einmal das, was der Tag uns mitgebracht hat. Ihr müsst jetzt noch nicht ruhig sein.“</div>"),
      P("2:00","Shoulder Rolls → Arm Swings","Schultern langsam kreisen. Daraus lockere Armswings entwickeln.<div class='cue'>„Die Schultern zuerst, dann dürfen die Arme dazukommen. Nichts muss gleichzeitig passieren.“</div>"),
      P("3:00","Trunk Twist","Rumpf R/L. Arme schwer mitschwingen. Fersen dürfen reagieren.<div class='cue'>„Lasst die Arme schwer sein.“</div>"),
      P("4:00","Body Waves","Knie → Becken → Wirbelsäule → Brust → Kopf. Langsamer und weicher als Morning.<div class='cue'>„Der Tag steckt oft in der Wirbelsäule. Lasst die Welle ihn einfach rausschieben.“</div>"),
      P("5:00","Hip Circles","Große langsame Beckenkreise, beide Richtungen. Radius zum Ende reduzieren.<div class='cue'>„Langsamer als heute Morgen. Das Becken darf schwer sein, nicht spielerisch.“</div>"),
      P("6:00","QiGong Kreisen","Arme in einem großen Kreis über außen nach oben kreisen. Dann die Hände mit den Handflächen vor dem Körper bis zur Körpermitte nach unten führen. Dabei leicht in die Knie gehen.<div class='cue'>„Führt die Arme in einem weiten Kreis über außen nach oben. Dabei führt ihr die Hände mit den Handflächen nach unten bis zur Körpermitte. Dabei geht ihr leicht in die Knie. Die Hände weiter nach unten durchführen und dann wieder über außen nach oben bringen.“</div>"),
      P("7:00","QiGong Kreisen — umgekehrt","Arme von oben über außen vor den Bauch führen, dabei leicht in den Squat gehen. Die Hände vor dem Körper mit den Handflächen nach oben zeigend langsam nach oben führen.<div class='cue'>„Diesmal andersherum: Arme von oben über außen vor den Bauch bringen. Dabei geht ihr ganz leicht in einen Squat. Dann führt ihr die Hände vor dem Körper mit den Handflächen wieder nach oben, streckt dabei die Beine.“</div>"),
      P("8:00","Side-to-Side Sway","Gewicht R/L. Arme frei mitfließen. Zunehmend weicher und kleiner.<div class='cue'>„Wir hören nicht plötzlich auf, uns zu bewegen. Wir lassen die Bewegung nur langsam ruhiger werden.“</div>"),
    ]},
    {name:"FLOW", range:"10–20", start:600, blocks:[
      P("10:00","Moon Flow 1","Mountain → Reach → Crescent Side Bend R → Mitte → L → Mitte → Standing Twist R/L → Fold → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → Knie ablegen → <b>Evening Low Crescent</b> (Arme seitlich bis Schulterhöhe/weiches V, 2–3×, keine Überkopfhaltung) → rechte Hand innen, Brustkorb links → Vierfüßler → Cat/Cow 3× → Down Dog → rechter Fuß vor = Low Lunge R → Evening Low Crescent 2–3× → linke Hand innen, Brustkorb rechts → Fold → Roll Up → Mountain.<div class='cue'>„Kommt nach vorne auf eure Matte, in den Stand.“<br>„Einatmen – Arme heben, lang nach oben.“<br>„Neigt euch sanft nach rechts – Crescent Side Bend.“<br>„Zurück zur Mitte. Und nach links.“<br>„Zurück zur Mitte.“<br>„Dreht den Oberkörper sanft nach rechts, Arme schwingen locker mit. Und nach links.“<br>„Ausatmen – nach vorne falten.“<br>„Einatmen – halber Lift, Rücken lang.“<br>„Ausatmen – wieder Fold.“<br>„Rechtes Bein weit nach hinten, Knie sinkt ab: Low Lunge links.“<br>„Arme seitlich bis Schulterhöhe öffnen, ein weiches V – Evening Low Crescent. Keine Überkopfhaltung heute Abend.“<br>„Zwei, drei Mal, in eurem eigenen Tempo.“<br>„Rechte Hand innen neben dem Fuß, Brustkorb öffnet sich nach links.“<br>„Hände zum Boden. Vierfüßler.“<br>„Cat/Cow, drei Mal – Wirbelsäule rund, dann lang.“<br>„Hände schieben, Hüfte hoch: Down Dog.“<br>„Rechter Fuß nach vorne, zwischen die Hände: Low Lunge rechts.“<br>„Evening Low Crescent, zwei, drei Mal.“<br>„Linke Hand innen, Brustkorb öffnet sich nach rechts.“<br>„Zurück zur Matte, Fold.“<br>„Roll Up, Wirbel für Wirbel, Kopf kommt zuletzt.“<br>„Mountain.“<br>„Der Mond drängt nicht. Jede Position darf einen Atemzug länger bleiben als beim Sun Flow heute Morgen.“</div>"),
      P("15:00","Moon Flow 2","Identischer Ablauf. Cat/Cow 1–2×. Weniger technische Führung, mehr kontinuierliche Bewegung. Kurzer Moment des gemeinsamen Atems (optional). Am Ende: Down Dog → Knie → Vierfüßler.<div class='cue'>„Gleicher Weg wie eben. Diesmal fließt er von selbst.“<br>„Reach, Seitneigung rechts und links, Twist, Fold, Half Lift, Fold.“<br>„Low Lunge links, Evening Low Crescent, Brustkorb öffnet.“<br>„Vierfüßler, Cat/Cow ein-, zweimal, Down Dog.“<br>„Low Lunge rechts, Evening Low Crescent, Brustkorb öffnet.“<br>„Fold, Roll Up, Mountain.“<br>„Der Atem darf jetzt länger werden. Wir brauchen immer weniger Schwung. Immer weniger Kraft.“<br>„Ihr atmet gerade alle im selben Raum. Jede*r in ihrem eigenen Tempo.“<br>„Wir bewegen uns langsam nach innen.“</div>"),
    ]},
    {name:"EXPLORE", range:"20–35", start:1200, blocks:[
      P("20:00","Melting Cat","<span class='lbl'>Arrive</span> Vierfüßler.<br><span class='lbl'>Move</span> Cat/Cow 4–5×. Becken Richtung Fersen → Gewicht nach vorne, 3–4×. Body Circles: zurück→rechts→vorne→links, 3×, Richtungswechsel.<br><span class='lbl'>Reduce</span> Kreise kleiner bis minimal.<br><span class='lbl'>Pause</span> Child's Pose, ca. 45 Sek.<br><span class='lbl'>Release</span> Zurück Vierfüßler, Handgelenke entlasten.<div class='cue'>„Nicht mehr Cat-Cow wie am Morgen. Die Wirbelsäule bewegt sich jetzt kleiner, wärmer, langsamer.“</div>"),
      P("24:00","Thread & Reach R · 1:45","<span class='lbl'>Arrive</span> Vierfüßler, Knie unter der Hüfte.<br><span class='lbl'>Move</span> Rechten Arm hoch öffnen, unter linkem Arm hindurch (3×), letztes Mal Schulter+Kopf sanft zum Boden.<br><span class='lbl'>Reduce</span> Minimal nachgeben.<br><span class='lbl'>Pause</span> Ca. 30–35 Sek.<br><span class='lbl'>Release</span> Hand unter Schulter, aktiv drücken, Arm zurück.<div class='cue'>„Der Arm fädelt sich durch, die Schulter sinkt. Sucht nicht die tiefste Rotation, sondern die ehrlichste.“</div>"),
      P("25:45","Thread & Reach L · 1:45","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release.<div class='cue'>„Gespiegelt, linker Arm fädelt unter dem rechten hindurch. Gleiche Regel: keine Bestleistung, nur die ehrlichste Rotation.“</div>"),
      P("27:30","90/90 Moon Sway","<span class='lbl'>Arrive</span> Sitz, beide Knie aufgestellt.<br><span class='lbl'>Move</span> Beide Knie rechts → Mitte → links, 6× langsam. Auf einer Seite: Oberkörper zum vorderen Bein, auf/vor/zurück 3×, Seitenwechsel.<br><span class='lbl'>Reduce</span> Zwei Wechsel, dann minimal.<br><span class='lbl'>Pause</span> Kurz in der Mitte sitzen, ca. 15–20 Sek.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Lasst die Hüften nicht etwas leisten. Lasst sie reagieren.“</div>"),
      P("31:00","Butterfly Wave — Evening","<span class='lbl'>Arrive</span> Sitz, Fußsohlen zusammen.<br><span class='lbl'>Move</span> Spinal Wave 4×. Circular Fold 3× + Richtungswechsel. Side Melt R/L. Fold Wave 3×.<br><span class='lbl'>Reduce</span> Fold Wave kleiner.<br><span class='lbl'>Pause</span> Ca. 75 Sek.<br><span class='lbl'>Release</span> Knie zusammenführen.<div class='cue'>„Wir hören nicht auf, weil ich sage: Jetzt ist Yin. Wir hören auf, weil die Bewegung nicht mehr gebraucht wird.“</div>"),
    ]},
    {name:"MELT", range:"35–53", start:2100, blocks:[
      P("35:00","Butterfly · 3:00","Fußsohlen zusammen, angenehmer Abstand. Oberkörper nach vorne sinken lassen.<div class='cue'>„Keine Richtung mehr. Nur Gewicht.“</div>"),
      P("38:00","Half Butterfly R · 2:30","Rechtes Bein lang, linker Fuß innen. Oberkörper Richtung rechtes Bein. Knie darf weich sein.<div class='cue'>„Kein Ziehen zum Fuß. Der Oberkörper sinkt nur so weit, wie der Atem noch frei fließt.“</div>"),
      P("40:30","Half Butterfly L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Der Abend hat keine Eile.“</div>"),
      P("43:00","Deer R · 2:30","Rechtes Bein vor/diagonal vor dem Becken. Linkes Bein seitlich/hinten. Aufrecht oder sanft vorne. Keine erzwungenen 90°.<div class='cue'>„Das vordere Bein trägt das Gewicht des ganzen Tages. Lasst es einfach liegen.“</div>"),
      P("45:30","Deer L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Fast geschafft.“</div>"),
      P("48:00","Supine Figure Four","Rückenlage, Knie auf. Rechten Außenknöchel auf linken Oberschenkel. <span class='tag ground'>GROUND</span> Fuß am Boden. <span class='tag flight'>FLOAT</span> Fuß hebt, Hände hinter Oberschenkel. Ca. 1:15 pro Seite.<div class='cue'>„Der untere Fuß darf am Boden bleiben. Kein Ziehen am Bein ist nötig.“</div>"),
      P("50:30","Supine Twist","R: Knie links, Brustkorb rechts (1:15). L: spiegelverkehrt (1:15).<div class='cue'>„Der Boden trägt euch jetzt. Ihr müsst nichts mehr halten, was nicht gehalten werden muss.“</div>"),
    ]},
    {name:"REST", range:"53–60", start:3180, blocks:[
      P("53:00","Savasana","Beine/Arme bequem. Ca. 5–6 Minuten vollständige Ruhe. Letzte Minute: Atem vertiefen → Finger/Zehen → strecken → über die Seite zum Sitz.<div class='cue'>„Was heute erledigt wurde, ist erledigt. Was nicht erledigt wurde, darf bis morgen warten.“</div>"),
    ]},

energy: { label:"Energy", theme:"Du musst nicht müde sein, um ruhig zu sein.", color:"#a15c3e",
  memory:["KLOPFEN","BOUNCE","WAVE","ARME&TWISTS","GOLFERSWING","QISQUAT","ENERGY FLOW","SWAY","TRAVELING WAVE","90/90","DRAGONFLY","HALF BUTTERFLY","SPHINX","BUTTERFLY","CHEST OPENER","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–8", start:0, blocks:[
      P("0:00","Wach-Klopfen · 1:00","Mit den Fingerspitzen oder der flachen Hand Arme, Schultern und Oberschenkel abklopfen. Gleichmäßiges Tempo, Stärke selbst gewählt.<div class='cue'>„Klopft mit den Fingerspitzen oder der flachen Hand sanft über Arme, Schultern und Oberschenkel.“<br>„Ihr bestimmt die Stärke – von ganz leicht bis kräftiger.“<br>„Keine Massage, keine Therapie. Nur ein Weg, dem Körper zu sagen: wir sind jetzt wach.“</div>"),
      P("1:00","Bounce · 1:00","<span class='tag ground'>GROUND</span> Federn, Fersen lösen, Bodenkontakt bleibt. <span class='tag flight'>FLIGHT</span> Kleine Hops. Jederzeit wechseln.<div class='cue'>„Lasst die Fersen leicht federn.“<br>„Am Boden lassen oder ein Stück lösen – eure Wahl.“<br>„Kiefer locker. Schultern locker.“<br>„Wir strengen uns nicht an. Wir schauen, was schon da ist.“</div>"),
      P("2:00","Body Waves · 1:00","Knie → Becken → Wirbelsäule → Brust → Kopf. Zwei, drei Wellen.<div class='cue'>„Beugt die Knie ein wenig, Becken nach vorne.“<br>„Rollt die Bewegung durch die Wirbelsäule – Brustkorb, Schultern, Kopf zuletzt.“<br>„Muss nicht schön aussehen. Sucht eure Welle.“</div>"),
      P("3:00","Arme & Twists · 2:30","Vier Elemente fließend hintereinander: Arme über Kreuz vor der Brust zusammenschlagen und öffnen (30 Sek.) → Arme komplett locker hängen lassen, Oberkörper schwingt sie mit (30 Sek.) → Rumpf-Twist, Arme locker mitfliegend (45 Sek.) → Hüfte treibt die Drehung, Arme schlagen seitlich an (45 Sek.).<div class='cue'>„Schlagt die Arme über Kreuz vor der Brust zusammen – wie eine Umarmung mit Schwung. Und wieder öffnen.“<br>„Jetzt lasst die Arme komplett schwer werden. Keine Kraft mehr – nur der Oberkörper bewegt sie mit.“<br>„Dreht jetzt den Oberkörper nach rechts und links. Die Arme fliegen einfach hinterher.“<br>„Und jetzt kommt die Drehung aus der Hüfte, nicht mehr aus dem Oberkörper – die Arme schlagen von selbst seitlich an, wenn die Hüfte dreht.“<br>„Vier Bewegungen, ein Fluss. Ihr bestimmt Tempo und Stärke.“</div>"),
      P("5:30","Golferswing · 1:00","Breiter Stand, Arme wie einen Golfschläger gefasst. Große Rotation R/L, Schwung kommt aus der Hüfte.<div class='cue'>„Stellt euch vor, ihr haltet einen Golfschläger.“<br>„Großer Schwung von einer Seite zur anderen, die Hüfte dreht mit.“<br>„Lasst den Schwung größer werden, wenn es sich gut anfühlt.“</div>"),
      P("6:30","QiSquat & Faustschlag · 1:30","QiSquat (45 Sek.): breiter Stand, Zehen leicht nach außen, Arme über die Seite nach oben, Hände sinken mit dem Squat nach unten. Direkt daraus Faustschlag (45 Sek.): Fäuste ballen, abwechselnd nach vorne stoßen. <span class='tag ground'>SMALL RANGE</span> flacher Stand, kleinerer Stoß. <span class='tag flight'>OPEN RANGE</span> tieferer Stand, größerer Stoß.<div class='cue'>„Breiter Stand, Zehen leicht nach außen. Arme über die Seite nach oben, Hände sinken mit euch in den Squat.“<br>„Und jetzt direkt weiter: ballt die Fäuste, stoßt abwechselnd nach vorne.“<br>„Richtung und Klarheit – nicht Kraft.“<br><span class='lbl'>Small Range</span> „Stand höher, Stoß kleiner.“<br><span class='lbl'>Open Range</span> „Stand tiefer, Stoß größer.“<br>„Das ist der letzte Moment vor dem Flow.“</div>"),
    ]},
    {name:"FLOW", range:"8–27", start:480, blocks:[
      P("8:00","Round 1 — Learn · 6:00","Mountain → Reach → Fold → Half Lift → Fold → rechtes Bein weit nach hinten, hintere Ferse hebt, Bein streckt sich = High Lunge L → hintere Ferse sinkt, hinterer Fuß öffnet sich deutlich: Warrior II L (Ground: kürzerer Stand / Reach: Arme horizontal) → Reverse Warrior L (kein Gewicht in die hintere Hand) → zurück Warrior II → Side Angle L → Hände zum Boden, Down Dog → Plank Wave (Ground: Knie am Boden / Float: kurze Plank) → Down Dog → rechter Fuß nach vorne, hintere Ferse hebt, Bein streckt sich = High Lunge R → hintere Ferse sinkt, hinterer Fuß öffnet sich deutlich: Warrior II R → Reverse Warrior R → Side Angle R → Fold → Roll Up → Mountain.<div class='cue'>„Kommt nach vorne auf eure Matte.“<br>„Einatmen – Arme heben. Ausatmen – nach vorne falten.“<br>„Einatmen – halber Lift. Ausatmen – Fold.“<br>„Rechtes Bein weit nach hinten, die hintere Ferse hebt, das Bein streckt sich: High Lunge links.“<br>„Jetzt sinkt die hintere Ferse zum Boden, der hintere Fuß öffnet sich deutlich: Warrior II links.“<br>„Der Stand darf kürzer oder weiter sein. Findet euren Stand.“<br>„Arme öffnen. Einatmen – Reverse Warrior. Die hintere Hand trägt kein Gewicht.“<br>„Ausatmen – zurück in Warrior II.“<br>„Unterarm Richtung Oberschenkel oder Hand Richtung Boden – Side Angle.“<br>„Hände zum Boden. Down Dog.“<br>„Von hier nach vorne in eure Plank Wave.“<br><span class='lbl'>Ground</span> „Die Knie können am Boden bleiben.“<br><span class='lbl'>Float</span> „Oder ihr nehmt kurz die Plank.“<br>„Brustkorb nach vorne. Becken zurück. Wieder Down Dog.“<br>„Rechter Fuß nach vorne. High Lunge rechts. Warrior II rechts. Reverse Warrior. Side Angle rechts.“<br>„Zurück zur Matte. Fold. Roll Up. Mountain.“<br>„Lernt erst die Linie. Wir müssen noch nichts daraus machen.“</div>"),
      P("14:00","Round 2 — Build · 7:00","Gleiche Route wie Runde 1. Nach Side Angle: Warrior II → kurze Balance-Option (Zehen tippen neben Standfuß / Knie hebt vor-oben) — ein Atemzug, keine eigene Erklärung nötig. Danach die eigentliche neue Bewegung: <b>Twist-Reach</b> aus Warrior II — Oberkörper öffnet sich zum vorderen Bein, hinterer Arm reicht diagonal nach oben, Blick folgt optional. Beide Seiten.<div class='cue'>„Gleicher Weg. Diesmal kennt euer Körper die Richtung schon.“<br>„Reach. Fold. Half Lift. High Lunge. Warrior II. Reverse. Warrior II. Side Angle. Down Dog. Plank Wave.“<br>„Zurück in Warrior II. Wer mag: Zehen tippen oder Knie lösen sich – nur ein Atemzug, dann zurück.“<br>„Und jetzt das Neue: der Oberkörper öffnet sich zum vorderen Bein, der hintere Arm reicht diagonal nach oben – eine sanfte Drehung, kein Ziehen.“<br>„Der Blick darf folgen, wenn das für den Nacken gut ist.“<br>„Zurück in Warrior II, dann weiter zu Side Angle.“<br>„Energie bedeutet heute nicht: schneller. Energie bedeutet: mehr Richtungen.“</div>"),
      P("21:00","Round 3 — Feel · 6:00","Nur 2–3 Atemzüge pro Seite: Warrior II → Reverse Warrior → Side Angle → Warrior II, atemgebunden, ohne feste Halts. Dann früher als bisher in den freien Bewegungsmoment übergehen — das ist das eigentliche Ziel der Runde, nicht ein drittes Mal dieselben drei Formen. Frei bewegen, Augen offen oder geschlossen, eigene Wahl.<div class='cue'>„Dritte Runde. Nur zwei, drei Atemzüge pro Seite.“<br>„Warrior II, Reverse, Side Angle, zurück in Warrior II – ein Atemzug pro Übergang.“<br>„Andere Seite, gleich kurz.“<br>„Und jetzt lasst die Form los. Bewegt euch frei, so wie es sich gerade richtig anfühlt.“<br>„Kein Warrior II mehr nötig – das war die Vorbereitung, das hier ist der eigentliche Moment.“<br>„Vielleicht spürt ihr den Herzschlag etwas schneller, den Atem etwas größer. Das ist okay – wir schauen dem jetzt einfach nur zu.“</div>"),
    ]},
    {name:"EXPLORE", range:"27–35", start:1620, blocks:[
      P("27:00","Standing Energy Sway · 2:00","<span class='lbl'>Arrive</span> Nach Runde 3 nicht sofort auf die Matte. Füße etwas weiter als hüftbreit, Knie weich, Arme hängen.<br><span class='lbl'>Move</span> Gewicht R/L verlagern, ein Knie beugt sich, das andere Bein wird länger. Arme dürfen beim Wechsel locker durch die Mitte schwingen. <span class='tag ground'>GROUND</span> kleiner Gewichtswechsel. <span class='tag flight'>OPEN</span> größere seitliche Verlagerung, Arme weiter.<br><span class='lbl'>Reduce</span> Weg wird kleiner, bis nur noch das Gewicht wandert.<div class='cue'>„Bleibt noch einen Moment im Stand.“<br>„Verlagert euer Gewicht nach rechts. Und nach links.“<br>„Lasst die Arme irgendwann mitkommen. Nicht platzieren. Schwingen lassen.“<br>„Ihr habt gerade sehr klare Formen gemacht. Jetzt dürft ihr die Form wieder verlieren.“<br>„Macht den Weg jetzt kleiner. Bis nur noch das Gewicht wandert.“</div>"),
      P("29:00","Traveling Lunge Wave · 3:00","<span class='lbl'>Arrive</span> Aus dem Stand.<br><span class='lbl'>Move</span> Eine durchgehende Reise statt vier Einzelstationen: Ausatmen in Fold → rechtes Bein weit zurück in Low Lunge → Becken-Welle vor/zurück, 2–3× → Becken zurück zur Mitte, durch einen tiefen Fold hindurch → linkes Bein weit zurück in Low Lunge → Becken-Welle vor/zurück, 2–3× → zurück zur Mitte, Fold, Roll Up. <span class='tag ground'>GROUND</span> Hände bleiben am Boden/Oberschenkel. <span class='tag flight'>REACH</span> hinterer Arm hebt bei der Welle mit.<br><span class='lbl'>Reduce</span> Wellen werden kleiner, Übergänge langsamer.<br><span class='lbl'>Live-Hinweis</span> Bewusst wenig sprechen — es ist eine Reise, keine vier Stopps. Zu viele Ansagen brechen genau das.<div class='cue'>„Fold. Rechtes Bein weit zurück.“<br>„Becken pendelt.“<br>„Weiter zur Mitte, zur anderen Seite.“<br>„Becken pendelt.“<br>„Zurück. Fold.“</div>"),
      P("32:00","90/90 Melt · 3:00","<span class='lbl'>Arrive</span> Sitz, beide Füße vor dem Körper aufgestellt, Knie gebeugt.<br><span class='lbl'>Move</span> Knie nach rechts sinken lassen → Mitte → links, 6–8 langsame Wechsel. Arme/Hände dürfen hinter dem Körper stützen. Auf einer Seite bleiben: Oberkörper leicht Richtung vorderes Knie → zurück, 2–3 kleine Waves. Andere Seite.<br><span class='lbl'>Reduce</span> Zurück zu den Wechseln, dann kleiner: nur noch ein kleines Pendeln.<br><span class='lbl'>Pause</span> Mitte, Beine ausstrecken oder locker angewinkelt, 20–30 Sek. sitzen. — <b>Hier endet der Peak.</b><div class='cue'>„Lasst beide Knie zu einer Seite sinken.“<br>„Durch die Mitte. Andere Seite.“<br>„Kein Winkel muss stimmen.“<br>„Jetzt wird auch dieser Weg kleiner. Nur noch ein kleines Pendeln.“<br>„Unser Peak liegt schon hinter uns.“<br>„Du musst nicht müde sein, um ruhig zu sein. Ab jetzt bauen wir nichts mehr auf.“</div>"),
    ]},
    {name:"MELT", range:"35–54", start:2100, blocks:[
      P("35:00","Dragonfly · 2:30","Breiter Sitz, Beine nur so weit wie ohne Haltearbeit. Knie deutlich gebeugt möglich. Oberkörper nach vorne sinken. Keine Hände ziehen.<div class='cue'>„Öffnet die Beine nur so weit, dass ihr sie nicht aktiv festhalten müsst.“<br>„Richtet euch zunächst auf. Dann lasst den Oberkörper nach vorne schwerer werden.“<br>„Nicht weiter. Schwerer.“</div>"),
      P("37:30","Half Butterfly R · 1:30","Rechtes Bein lang, linker Fuß zum inneren Oberschenkel. Oberkörper Richtung rechtes Bein sinken, Knie darf weich sein.<div class='cue'>„Rechtes Bein lang, linker Fuß zum inneren Oberschenkel.“<br>„Oberkörper sinkt Richtung rechtes Bein – nicht zum Fuß, einfach Richtung Bein.“</div>"),
      P("39:00","Half Butterfly L · 1:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Beobachtet, was hier anders ist als rechts.“</div>"),
      P("40:30","Sphinx · 2:00","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Bewusst kurz gehalten.<div class='cue'>„Bauchlage, Unterarme zum Boden.“<br>„Je weiter die Ellbogen nach vorne wandern, desto sanfter die Rückbeuge.“<br>„Nach so viel Bewegung: hier öffnet sich der Oberkörper einmal in die andere Richtung.“</div>"),
      P("42:30","Reclined Butterfly · 2:30","Rückenlage, Fußsohlen zusammen, Knie sinken zur Seite. <span class='tag ground'>WIDE</span> Füße weiter vom Becken. <span class='tag flight'>CLOSE</span> Füße näher am Becken. Hände drücken die Knie nicht nach unten.<div class='cue'>„Lasst die Knie einfach sinken, ohne nachzuhelfen.“<br><span class='lbl'>Wide</span> „Füße etwas weiter vom Becken.“<br><span class='lbl'>Close</span> „Oder näher zum Becken.“<br>„Die Schwerkraft übernimmt.“</div>"),
      P("45:00","Reclined Chest Opener · 2:00","Rückenlage, Beine angestellt oder lang. <span class='tag ground'>GROUND</span> Arme in Kaktus-Position, Ellbogen angewinkelt, Oberarme auf Schulterhöhe am Boden. <span class='tag flight'>FLIGHT</span> Arme lang über den Kopf, Hände fassen sich oder verschränken.<div class='cue'>„Legt euch auf den Rücken. Beine dürfen angestellt oder lang sein.“<br><span class='lbl'>Ground</span> „Arme in die Kaktus-Position.“<br><span class='lbl'>Flight</span> „Oder Arme lang über den Kopf strecken.“<br>„Die Schultern sinken einfach zum Boden, kein Ziehen.“<br>„Nach so viel Armarbeit im Flow darf sich hier vorne alles öffnen.“</div>"),
      P("47:00","Knees to Chest · 1:00","Rückenlage, beide Knie zur Brust, Hände locker an den Beinen.<div class='cue'>„Beide Knie zur Brust, Hände locker dran. Wiegt euch sanft hin und her, dann still.“</div>"),
      P("48:00","Supine Twist R · 3:00","Knie links, Brustkorb rotiert rechts. Arme bequem, Kopf neutral oder rechts. Bewusst länger als sonst — die Rotation darf hier wirklich ankommen.<div class='cue'>„Füße noch einmal aufstellen. Knie nach links sinken lassen.“<br>„Brustkorb dreht nach rechts. Rechter Arm darf sich öffnen.“<br>„Die Knie müssen den Boden nicht erreichen.“<br>„Findet die Version, in der ihr nicht festhalten müsst.“<br>„Lasst euch hier ruhig etwas mehr Zeit als sonst.“</div>"),
      P("51:00","Supine Twist L · 3:00","Spiegelverkehrt.<div class='cue'>„Knie zurück zur Mitte. Langsam zur anderen Seite.“<br>„Knie nach rechts. Brustkorb nach links. Linker Arm öffnet.“<br>„Nichts ziehen. Nichts korrigieren. Nur Gewicht abgeben.“<br>„Auch hier: mehr Zeit als sonst.“</div>"),
    ]},
    {name:"REST", range:"54–60", start:3240, blocks:[
      P("54:00","Savasana","Arme/Beine bequem. Keine Atemtechnik, keine Visualisierung, keine Aufgabe. Ca. fünf Minuten vollständige Ruhe. Erst gegen Ende reaktivieren.<div class='cue'>„Kommt langsam zurück zur Mitte. Beine ausstrecken.“<br>„Arme dort ablegen, wo sie bequem liegen.“<br>„Vorhin haben wir Energie bewegt. Wir haben sie nicht verbraucht.“<br>„Und wir müssen nicht erschöpft sein, um still zu werden.“<br>(Etwa vier Minuten Stille.)<br>„Vertieft langsam den Atem. Bewegt Finger und Zehen.“<br>„Nehmt euch Zeit, über eine Seite nach oben zu kommen.“<br>„Energie und Ruhe sind keine Gegensätze.“</div>"),
    ]},
  ],

    {label:"BOUNCE", phase:"AWAKEN", time:"1:00", title:"Bounce · 1:00", body:"Ground: federn, Bodenkontakt bleibt. Flight: kleine Hops."},

    {label:"GOLFERSWING", phase:"AWAKEN", time:"5:30", title:"Golferswing · 1:00", body:"Breiter Stand, Arme wie Golfschläger gefasst. Große Rotation R/L, Schwung aus der Hüfte."},
    {label:"QISQUAT", phase:"AWAKEN", time:"6:30", title:"QiSquat & Faustschlag · 1:30", body:"Squat mit Armführung, direkt weiter in abwechselnden Faustschlag. Small Range/Open Range je nach Tiefe."},
    {label:"ENERGY FLOW", phase:"FLOW", time:"8:00", title:"JIN Energy Flow", body:"High Lunge → Warrior II → Reverse Warrior → Side Angle → Down Dog → Plank Wave → andere Seite. Learn → Build (kurze Balance-Option + Twist-Reach als eigentliches Neues) → Feel (nur 2–3 Atemzüge/Seite, dann früh frei)."},

    {label:"TRAVELING WAVE", phase:"EXPLORE", time:"29:00", title:"Traveling Lunge Wave · 3:00", body:"Eine durchgehende Reise: Low Lunge R mit Becken-Welle → Mitte → Low Lunge L mit Becken-Welle → Mitte. Live bewusst wenig sprechen."},

qigongyin: { label:"QIJIN", theme:"Ruhe entsteht durch Wiederholung, nicht durch Dauer.", color:"#6f8c74",
  memory:["ARRIVE","QIGONG","PUPPY","SPHINX","TWIST","BUTTERFLY","BREATH","CATERPILLAR","SWAN","GROUND","DRAGONFLY","GATHER","HEART","SIDE MELT","REST"],
  phases:[
    {name:"AWAKEN", range:"0–7:30", start:0, blocks:[
      P("0:00","Arrive","Sitzen oder Rückenlage, wie es sich heute richtig anfühlt. Augen dürfen schließen. Atem beobachten, nichts verändern. Kein Halten wird lang – die Ruhe entsteht durch Wiederholung, nicht durch Dauer.<div class='cue'>„Setzt oder legt euch hin, wie es sich gerade richtig anfühlt. Wir fangen heute anders an: nicht lange still, sondern immer wieder kurz. Bewegung, dann kurz Ruhe, dann wieder Bewegung. Am Ende hat sich trotzdem viel beruhigt – nur auf einem anderen Weg.“</div>"),
      P("2:00","QiGong Schultern","Stehend. Arme in großen, langsamen Kreisen über außen nach oben und wieder nach unten führen. Schultern rollen sanft mit. Tempo an den eigenen Atem koppeln. Letzter Stehmoment der Stunde.<div class='cue'>„Führt die Arme in großen, langsamen Kreisen über außen nach oben. Lasst die Schultern einfach mitrollen. Kein Tempo-Ziel – der Atem gibt das Tempo vor.“<br>„Und für den Rest der Stunde kommen wir auf den Boden – ihr müsst jetzt nicht mehr aufstehen.“</div>"),
      P("4:30","Puppy Pose · 1:30","Aus dem Vierfüßler Unterarme nach vorne gleiten, Stirn sinkt Richtung Boden. <span class='tag ground'>GROUND</span> Hüfte bleibt über den Knien. <span class='tag flight'>FLIGHT</span> Gesäß sinkt weiter Richtung Fersen.<div class='cue'>„Kommt in den Vierfüßler. Unterarme gleiten nach vorne, die Stirn sinkt Richtung Boden. Die Schultern dürfen komplett schwer werden.“<br><span class='lbl'>Ground</span> „Die Hüfte bleibt über den Knien.“<br><span class='lbl'>Flight</span> „Oder das Gesäß sinkt weiter Richtung Fersen, wenn das heute gut tut.“<br>„Ihr müsst nirgends hinkommen – nur nachgeben, so weit es heute geht.“</div>"),
      P("6:00","Sphinx · 1:30","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Unterer Rücken behält Raum.<div class='cue'>„Kommt langsam in die Bauchlage. Unterarme zum Boden. Je weiter die Ellbogen nach vorne wandern, desto kleiner wird die Rückbeuge.“</div>"),
    ]},
    {name:"FLOW", range:"7:30–19", start:450, blocks:[
      P("7:30","QiGong Rumpf","Aufrechter Sitz oder Fersensitz. Rumpf sanft nach rechts und links drehen, Arme schwingen locker mit wie leere Ärmel. Erst kleiner Radius, dann darf die Drehung größer werden. Letzte Runden: langsamer, Blick darf leicht mitgehen.<div class='cue'>„Dreht den Oberkörper sanft nach rechts und links, im Sitz. Die Arme hängen einfach mit, wie leere Ärmel.“<br>„Fangt mit einem kleinen Radius an.“<br>„Nach und nach darf die Drehung etwas größer werden.“<br>„Für die letzten Atemzüge: langsamer werden, der Blick darf ein kleines Stück mitgehen.“</div>"),
      P("10:00","Supine Twist R · 1:15","Rückenlage, Knie angewinkelt. Beide Knie sinken nach links, Brustkorb bleibt offen nach rechts gedreht. Arme bequem ablegen.<div class='cue'>„Knie sinken zur einen Seite, der Brustkorb bleibt offen zur anderen. Beide Schultern müssen nicht unten bleiben – findet die Version ohne Ziehen.“</div>"),
      P("11:15","Supine Twist L · 1:15","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Knie zur anderen Seite, Brustkorb offen zur Gegenseite.“</div>"),
      P("12:30","QiGong Hüfte","Aufrechter Sitz, Beine gekreuzt oder Fersensitz. Becken in großen, langsamen Kreisen bewegen, dann Gewicht sanft von einer Sitzbeinseite zur anderen verlagern.<div class='cue'>„Kreist langsam mit dem Becken, beide Richtungen – im Sitz. Dann verlagert das Gewicht sanft von einer Sitzbeinseite zur anderen, wie ein langsames Wiegen.“</div>"),
      P("15:00","Butterfly · 1:30","Sitz, Fußsohlen zusammen, Knie sinken zur Seite. Oberkörper darf nach vorne sinken, muss aber nicht. Kein Ziehen an den Füßen.<div class='cue'>„Fußsohlen zusammen, Knie sinken nach außen. Der Oberkörper darf sinken – oder auch nicht.“</div>"),
      P("16:30","Half Butterfly R · 1:15","Rechtes Bein lang, linker Fuß innen. Oberkörper Richtung rechtes Bein, Knie darf weich sein.<div class='cue'>„Kein Ziehen zum Fuß. Der Oberkörper sinkt nur so weit, wie es gut tut.“</div>"),
      P("17:45","Half Butterfly L · 1:15","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Andere Seite, gleiche Regel: kein Ziehen.“</div>"),
    ]},
    {name:"EXPLORE", range:"19–34:30", start:1140, blocks:[
      P("19:00","QiGong Atem-Welle","Stehend oder sitzend. Beim Einatmen Arme langsam seitlich nach oben führen, beim Ausatmen wieder senken. Bewegung und Atem exakt verbinden.<div class='cue'>„Beim Einatmen heben sich die Arme seitlich nach oben. Beim Ausatmen sinken sie wieder. Lasst den Atem die Geschwindigkeit bestimmen, nicht ihr.“</div>"),
      P("21:00","Caterpillar · 2:00","Beide Beine lang, Knie weich möglich. Oberkörper sinkt aus dem Becken nach vorne, wird zunehmend schwer.<div class='cue'>„Beide Beine lang, Knie dürfen weich sein. Lasst den Oberkörper einfach schwerer werden – kein Ziehen zu den Füßen.“<br>„Nehmt euch hier die zusätzliche Zeit – nichts muss forciert werden.“</div>"),
      P("23:00","Gentle Swan R · 1:45","Aus dem Vierfüßler ein Bein angewinkelt nach vorne bringen, das andere Bein lang nach hinten. Aufrecht bleiben oder mit den Händen leicht nach vorne sinken – keine tiefe Rotation erzwingen.<div class='cue'>„Ein Bein vorne angewinkelt, das andere lang nach hinten. Bleibt aufrecht, wenn Aufrecht sich richtig anfühlt – ihr müsst nicht tief nach vorne.“</div>"),
      P("24:45","Gentle Swan L · 1:45","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("26:30","QiGong Seite","Aufrechter Sitz, ein Arm lang über den Kopf führen, Oberkörper sanft zur Gegenseite neigen, zurück zur Mitte, Seite wechseln.<div class='cue'>„Im Sitz: ein Arm lang nach oben, der Oberkörper neigt sich sanft zur Seite. Zurück zur Mitte, andere Seite.“</div>"),
      P("27:30","Seated Side Bend R · 1:00","Sitz, ein Arm lang nach oben und über den Kopf zur Seite geneigt. Das Sitzbein bleibt unten.<div class='cue'>„Ein Arm lang nach oben, dann über den Kopf zur Seite neigen. Das Sitzbein bleibt unten – die Länge kommt von oben, nicht vom Ziehen.“</div>"),
      P("28:30","Seated Side Bend L · 1:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Andere Seite, gleiche Länge.“</div>"),
      P("29:30","QiGong Wirbelwelle","Stehend oder sitzend. Langsame Welle durch die Wirbelsäule laufen lassen, von unten nach oben, dann umkehren.<div class='cue'>„Lasst eine langsame Welle durch die Wirbelsäule laufen, von unten nach oben. Und wieder zurück. Keine perfekte Welle – eure eigene.“<br>„Noch ein paar Wellen – lasst sie langsamer werden.“</div>"),
      P("32:00","Seated Twist R · 1:15","Aufrechter Sitz, Oberkörper sanft nach rechts drehen, eine Hand kann hinter dem Körper abstützen.<div class='cue'>„Dreht den Oberkörper sanft zur Seite, eine Hand stützt hinter euch. Die Drehung kommt aus der Mitte, nicht aus dem Ziehen der Arme.“</div>"),
      P("33:15","Seated Twist L · 1:15","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Zur anderen Seite drehen.“</div>"),
    ]},
    {name:"MELT", range:"34:30–53", start:2070, blocks:[
      P("34:30","QiGong Erdung","Aufrechter Sitz oder Fersensitz. Gewicht bewusst in die Sitzknochen spüren, Oberkörper mehrfach sanft nach vorne und zurück wiegen.<div class='cue'>„Spürt das Gewicht in den Sitzknochen. Wiegt den Oberkörper sanft nach vorne, dann zurück. Jedes Mal ein bisschen mehr Boden unter euch.“</div>"),
      P("36:30","Dragonfly · 2:00","Breiter Sitz, Beine nur so weit wie ohne Haltearbeit. Oberkörper darf nach vorne sinken.<div class='cue'>„Öffnet die Beine nur so weit, dass ihr sie nicht festhalten müsst. Der Oberkörper darf schwerer werden.“<br>„Kein Ziel hier – nur so viel Zeit, wie der Körper heute braucht.“</div>"),
      P("38:30","Reclined Butterfly · 2:00","Rückenlage, Fußsohlen zusammen, Knie sinken zur Seite. <span class='tag ground'>WIDE</span> Füße weiter vom Becken. <span class='tag flight'>CLOSE</span> Füße näher am Becken. Hände drücken die Knie nicht nach unten.<div class='cue'>„Lasst die Knie einfach sinken, ohne nachzuhelfen.“<br><span class='lbl'>Wide</span> „Füße etwas weiter vom Becken.“<br><span class='lbl'>Close</span> „Oder näher zum Becken.“<br>„Die Schwerkraft übernimmt.“</div>"),
      P("40:30","QiGong Sammeln","Stehend oder sitzend, Hände langsam vor dem Körper zusammenführen, als würdet ihr etwas sammeln. Bewegung wird zunehmend kleiner.<div class='cue'>„Führt die Hände langsam vor dem Körper zusammen. Die Bewegung darf jetzt kleiner werden – so klein, wie sie will.“</div>"),
      P("42:00","Knees to Chest · 2:00","Rückenlage, beide Knie zur Brust, Hände locker an den Beinen. Sanft hin und her wiegen, dann still.<div class='cue'>„Beide Knie zur Brust, Hände locker dran. Wiegt euch sanft hin und her. Dann Mitte, still.“<br>„Bleibt hier noch ein paar Atemzüge länger als sonst.“</div>"),
      P("44:00","QiGong Herzöffnung","Aufrechter Sitz, Arme langsam weit zur Seite öffnen, Brustkorb hebt sich leicht. Wieder schließen, mehrfach, langsames Tempo.<div class='cue'>„Im Sitz: Öffnet die Arme langsam weit zur Seite, der Brustkorb hebt sich ein wenig. Und wieder schließen. Ganz langsam.“</div>"),
      P("46:00","Reclined Side Melt · 1:30","Rückenlage, Arme lang über den Kopf, Hände können sich kreuzen. Beine und Arme gemeinsam sanft nach rechts sinken lassen, leichte Bananenform (je zur Hälfte der Zeit). Zurück zur Mitte, dann nach links.<div class='cue'>„Arme lang über den Kopf strecken.“<br>„Jetzt lasst Beine und Arme gemeinsam sanft nach rechts sinken – eine leichte Bananenform, kein Ziehen.“<br>„Zurück zur Mitte. Und nach links.“<br>„Die Seite spürt hier zum ersten Mal heute richtig Länge.“</div>"),
      P("47:30","Heart Rest · 2:00","Rückenlage, eine oder beide Hände auf dem Herzen. Nichts tun, nur spüren.<div class='cue'>„Legt eine oder beide Hände auf euer Herz. Ihr müsst nichts fühlen, nichts suchen. Nur die Hand dort lassen.“<br>„Lasst euch hier ruhig etwas länger Zeit.“</div>"),
      P("49:30","QiGong Abschluss","Stehend oder sitzend, Hände langsam vor dem Körper zusammenführen, Bewegung wird immer kleiner, bis sie von selbst aufhört.<div class='cue'>„Führt die Hände noch einmal langsam zusammen. Lasst die Bewegung kleiner werden, bis sie von selbst aufhört.“</div>"),
      P("51:30","Fetal Rest · 1:30","Seitlage, Knie angezogen, Kopf auf dem Arm oder locker abgelegt. Augen dürfen schließen.<div class='cue'>„Legt euch auf die Seite, Knie angezogen, Kopf bequem abgelegt. Die Augen dürfen jetzt zu bleiben.“</div>"),
    ]},
    {name:"REST", range:"53–60", start:3180, blocks:[
      P("53:00","Savasana","Rückenlage, Arme und Beine bequem ablegen. Volle Länge, kein Halten. Letzte Minute Atem vertiefen, dann über die Seite langsam hoch.<div class='cue'>„Legt euch auf den Rücken, Arme und Beine bequem. Nichts mehr zu tun, nichts mehr zu halten.“<br>(Stille.)<br>„Vertieft langsam den Atem, bewegt Finger und Zehen. Über die Seite, wenn ihr bereit seid, langsam hoch.“</div>"),
    ]},
  ],

yin: { label:"Yin", theme:"Manchmal braucht Ruhe Zeit.", color:"#7a6a8c",
  memory:["ARRIVE","HEART","THREAD","SQUAT","HALF BUTTERFLY","DEER","DRAGONFLY","CATERPILLAR","SPHINX","BUTTERFLY","SIDE MELT","BRIDGE","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–7:30", start:0, blocks:[
      P("0:00","Arrive","Sitzen oder Rückenlage, wie es sich richtig anfühlt. Augen dürfen schließen. Kurz ankommen, bevor die erste Haltung beginnt.<div class='cue'>„Setzt oder legt euch hin. Heute ist eine andere Art von Ruhe: kein QiGong dazwischen, kein Fließen – nur Haltungen, die wir wirklich lange halten, bis zu drei Minuten pro Haltung.“<br>„Das ist ungewohnt, wenn ihr sonst mehr in Bewegung seid. Gebt euch die Erlaubnis, hier nichts tun zu müssen außer bleiben.“<br>„Ein paar ruhige Atemzüge, bevor wir in die erste Haltung gehen.“</div>"),
    ]},
    {name:"MELT", range:"7:30–52:30", start:450, blocks:[
      P("7:30","Melting Heart Pose · 3:00","Vierfüßler, Knie unter der Hüfte. Arme weit nach vorne, Stirn sinkt Richtung Boden (optional: Block unter die Stirn). Hüfte bleibt über den Knien.<div class='cue'>„Kommt in den Vierfüßler. Schiebt die Hände weit nach vorne, die Stirn sinkt Richtung Boden.“<br>„Wer mag, legt sich einen Block unter die Stirn.“<br>„Wer sensible Knie hat: Decke oder Kissen unter die Knie legen.“<br>„Die Hüfte bleibt über den Knien – anders als Kindshaltung.“<br>„Wem das in den Schultern zu viel ist: Ellbogen leicht beugen, Arme wie Kaktus-Arme öffnen.“<br>„Das Herz sinkt Richtung Boden, der Brustkorb öffnet sich sanft nach oben.“<br>„Drei Minuten ist lang. Das ist Absicht – hier darf sich wirklich etwas verändern.“</div>"),
      P("10:30","Thread the Needle R · 2:30","Vierfüßler. Rechten Arm unter dem linken hindurchfädeln, rechte Schulter und Schläfe sinken zum Boden. Linke Hand bleibt vorne oder wandert hinter den Rücken. Bewusst kürzer gehalten – die Stützhand trägt durchgehend Gewicht.<div class='cue'>„Vierfüßler, Handgelenke unter den Schultern.“<br>„Rechten Arm nach oben, dann unter dem linken Arm hindurchfädeln.“<br>„Rechte Schulter und Schläfe sinken zum Boden.“<br>„Die linke Hand bleibt einfach vorne liegen – oder wandert, wenn ihr mögt, hinter den Rücken.“<br>„Nicht die tiefste Drehung suchen, die ehrlichste.“<br>„Wird das stützende Handgelenk oder die Schulter unangenehm: jederzeit früher rauskommen.“</div>"),
      P("13:00","Thread the Needle L · 2:30","Spiegelverkehrt.<div class='cue'>„Zurück zur Mitte, dann die andere Seite. Linker Arm fädelt unter dem rechten hindurch.“<br>„Gleiche Regel: keine Bestleistung, nur die Version, die heute stimmt.“<br>„Auch hier: früher raus, wenn Handgelenk oder Schulter ziehen.“</div>"),
      P("15:30","Squat · 2:00","Stand, Füße etwas breiter als hüftbreit, Zehen leicht nach außen. In die Hocke sinken. <span class='tag ground'>PASSIVE</span> Block oder festes Kissen unter das Gesäß, Gewicht komplett absetzen. <span class='tag flight'>AKTIV</span> Ohne Sitzunterstützung halten, Oberschenkel bleiben aktiv. Bewusst kürzer gehalten – ohne Sitzunterstützung ist das Kraft, nicht Loslassen.<div class='cue'>„Kommt in den Stand, Füße etwas breiter, Zehen leicht nach außen.“<br>„Sinkt langsam in die Hocke.“<br><span class='lbl'>Passive</span> „Wer einen Block oder ein festes Kissen zur Hand hat: unter das Gesäß schieben und das Gewicht komplett absetzen. So wird daraus eine echte Yin-Haltung – ihr müsst nichts mehr halten.“<br><span class='lbl'>Aktiv</span> „Ohne Unterstützung bleiben die Oberschenkel aktiv – das ist hier in Ordnung, ist aber eher Kraft als Loslassen.“<br>„Wem die Fersen abheben: zusätzlich ein zusammengerolltes Handtuch darunter.“<br>„Wer instabil steht: mit dem Rücken an eine Wand lehnen.“<br>„Das ist eine der wenigen Steh-Haltungen heute.“</div>"),
      P("17:30","Half Butterfly R · 3:00","Rechtes Bein lang, linker Fuß zum inneren Oberschenkel. Oberkörper Richtung rechtes Bein sinken, Knie darf weich sein (optional: Block unter das rechte Knie).<div class='cue'>„Rechtes Bein lang, linker Fuß zum inneren Oberschenkel.“<br>„Oberkörper sinkt Richtung rechtes Bein – nicht zum Fuß, einfach Richtung Bein.“<br>„Das Knie darf weich sein, das ist kein Fehler.“<br>„Wer unter dem rechten Knie Halt möchte: Block oder gerolltes Handtuch.“</div>"),
      P("20:30","Half Butterfly L · 3:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Beobachtet, was hier anders ist als rechts.“</div>"),
      P("23:30","Dragonfly · 3:00","Breiter Sitz, Beine nur so weit wie ohne Haltearbeit. Oberkörper darf nach vorne sinken (optional: Block unter die Stirn oder Unterarme). Bewusst hier platziert: gestreckte Beine als Ausgleich nach zwei gebeugten Knien.<div class='cue'>„Öffnet die Beine nur so weit, dass ihr sie nicht aktiv halten müsst.“<br>„Der Oberkörper darf nach vorne sinken – Hände oder Unterarme können euch tragen.“<br>„Wer mag, legt sich einen Block unter die Stirn oder die Unterarme.“<br>„Nach den gebeugten Knien eben: hier dürfen die Beine einfach lang und gerade sein.“<br>„Kein Ziel hier – nur so viel, wie der Körper heute zulässt.“</div>"),
      P("26:30","Deer R · 3:00","Rechtes Bein vor dem Becken, Knie gebeugt, Unterschenkel diagonal vor dem Körper. Linkes Bein seitlich/hinten. Aufrecht bleiben oder sanft nach vorne sinken.<div class='cue'>„Rechtes Bein vor dem Becken, Knie gebeugt. Das linke Bein liegt seitlich hinten.“<br>„Kein erzwungenes Quadrat – die Beine finden ihren eigenen Winkel.“<br>„Bleibt aufrecht, oder sinkt sanft nach vorne, wenn das gut tut.“<br>„Vorderes Bein trägt, hinteres Bein liegt.“</div>"),
      P("29:30","Deer L · 3:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("32:30","Caterpillar · 3:00","Beide Beine lang, Knie weich möglich. Oberkörper sinkt aus dem Becken nach vorne, wird zunehmend schwer.<div class='cue'>„Beide Beine lang nach vorne, Knie dürfen weich sein.“<br>„Lasst den Oberkörper schwerer werden – kein Ziehen zu den Füßen.“<br>„Das ist die zentrale Haltung der heutigen Stunde. Alles bisher hat den Körper hierauf vorbereitet.“<br>„Drei Minuten ist eine lange Zeit. Ihr müsst nichts daraus machen.“</div>"),
      P("35:30","Sphinx · 2:00","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Bewusst kürzer gehalten – eine gehaltene Streckung belastet den unteren Rücken anders als ein Fold.<div class='cue'>„Bauchlage, Unterarme zum Boden.“<br>„Je weiter die Ellbogen nach vorne wandern, desto sanfter die Rückbeuge.“<br>„Nach so viel Falten: hier öffnet sich der Oberkörper einmal in die andere Richtung.“<br>„Wer im unteren Rücken zieht: jederzeit früher rauskommen, das ist keine Ausnahme, sondern normal.“</div>"),
      P("37:30","Reclined Butterfly · 3:00","Rückenlage, Fußsohlen zusammen, Knie sinken zur Seite (optional: Blöcke unter beide Knie als Unterstützung).<div class='cue'>„Rücken, Fußsohlen zusammen, Knie sinken nach außen.“<br>„Wer unter den Knien Unterstützung möchte: je ein Block.“<br>„Die Hände drücken die Knie nicht nach unten – die Schwerkraft übernimmt.“</div>"),
      P("40:30","Reclined Side Melt · 3:00","Rückenlage, Arme über den Kopf, Beine und Arme gemeinsam sanft nach rechts sinken lassen, dann nach links (je zur Hälfte der Zeit).<div class='cue'>„Arme lang über den Kopf, Hände können sich kreuzen.“<br>„Beine und Arme gemeinsam sanft nach rechts sinken lassen – eine leichte Bananenform.“<br>„Nach der Hälfte der Zeit: zurück zur Mitte, dann nach links.“<br>„Die Seite bekommt hier selten so viel Aufmerksamkeit wie heute.“</div>"),
      P("43:30","Knees to Chest · 0:30","Rückenlage, beide Knie zur Brust, Hände locker an den Beinen.<div class='cue'>„Beide Knie zur Brust, Hände locker dran. Kurz wiegen, dann still.“</div>"),
      P("44:00","Bridge · 2:30","Rückenlage, Füße aufgestellt, hüftbreit. <span class='tag ground'>GROUND</span> Mehrere kleine Bridge Waves: Becken heben und senken, dann unten liegen bleiben, kein Halten nötig. <span class='tag flight'>FLIGHT</span> Becken anheben, Block unter das Kreuzbein legen (niedrigste Stufe für die meisten), Gewicht komplett absetzen.<div class='cue'>„Füße aufstellen, hüftbreit.“<br><span class='lbl'>Ground</span> „Hebt und senkt das Becken mehrmals, ganz sanft. Dann bleibt ihr unten liegen – das ist schon die volle Haltung, kein Halten nötig.“<br><span class='lbl'>Flight</span> „Oder: Becken anheben, Block unter das Kreuzbein schieben – die niedrigste Stufe reicht fast immer. Dann das Gewicht auf den Block sinken lassen.“<br>„Beine können lang werden, oder die Füße bleiben nah am Becken.“<br>„Das ist die einzige Rückbeuge heute, bei der niemand etwas leisten muss.“</div>"),
      P("46:30","Supine Twist R · 3:00","Rückenlage, Knie angewinkelt. Beide Knie sinken nach links, Brustkorb bleibt offen nach rechts. Optional: rechten Fuß fassen für zusätzliche Quadrizeps-Dehnung.<div class='cue'>„Knie sinken zur einen Seite, der Brustkorb bleibt offen zur anderen.“<br>„Beide Schultern müssen nicht unten bleiben.“<br>„Wer mag: das obere Bein beugen und mit der Hand den Fuß fassen – ein Zusatz für die Vorderseite des Oberschenkels.“<br>„Der Blick darf der Drehung folgen, wenn das für den Nacken gut ist.“</div>"),
      P("49:30","Supine Twist L · 3:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Letzte Drehung vor der Stille.“</div>"),
    ]},
    {name:"REST", range:"52:30–60", start:3150, blocks:[
      P("52:30","Savasana","Rückenlage, Arme und Beine bequem ablegen. Volle Länge, kein Halten. Letzte Minute Atem vertiefen, dann über die Seite langsam hoch.<div class='cue'>„Legt euch auf den Rücken, Arme und Beine bequem.“<br>„Heute war jede Haltung anders lang, aus einem Grund. Jetzt kommt eine letzte, längere Stille.“<br>„Nichts mehr zu halten, nichts mehr zu tun.“<br>(Stille.)<br>„Vertieft langsam den Atem, bewegt Finger und Zehen.“<br>„Über die Seite, wenn ihr bereit seid, langsam hoch.“</div>"),
    ]},
  ],

    {label:"HEART", phase:"MELT", time:"7:30", title:"Melting Heart Pose · 3:00", body:"Vierfüßler, Arme weit vorne, Stirn sinkt (optional Block). Hüfte bleibt über den Knien."},

    {label:"SQUAT", phase:"MELT", time:"15:30", title:"Squat · 2:00", body:"Breiter Stand, in die Hocke sinken. Passive-Option: Block/Kissen unters Gesäß für echtes Loslassen."},
    {label:"HALF BUTTERFLY", phase:"MELT", time:"17:30", title:"Half Butterfly R/L · 3:00", body:"Langes Bein, anderer Fuß innen, Oberkörper Richtung langes Bein."},
    {label:"DRAGONFLY", phase:"MELT", time:"23:30", title:"Dragonfly · 3:00", body:"Breiter Sitz, nur so weit wie ohne Haltearbeit. Ausgleich zwischen Half Butterfly und Deer."},

menspilates: { label:"Men's Pilates", theme:"Nicht die größte Bewegung gewinnt. Die Bewegung, die du kontrollieren kannst.", color:"#3a5a7a",
  memory:["ROLL DOWN","SQUAT+REACH","FOUNDATION","TOE TAP","DEAD BUG","HUNDRED","SHOULDER","ENGINE","GLUTES","ATHLETIC","BURN","RESET"],
  phases:[
    {name:"MOBILIZE", range:"0–8", start:0, blocks:[
      P("0:00","Standing Roll Down · ×4","Füße hüftbreit, Knie ganz leicht gebeugt. Kinn sinkt zur Brust, dann Wirbel für Wirbel nach unten abrollen — Kopf, Nacken, oberer Rücken, unterer Rücken. Unten hängen Arme und Kopf komplett schwer, Knie bleiben weich. Dann von unten wieder aufrollen, Wirbel für Wirbel, Kopf kommt zuletzt.<div class='cue'>„Lasst den Kopf zuerst fallen, als würde eine Perlenkette Wirbel für Wirbel abgelegt.“<br>„Unten angekommen: Knie weich, Kopf und Arme komplett schwer.“<br>„Und jetzt von ganz unten wieder aufbauen — Becken zuerst, Kopf kommt als Letztes.“<br>„Keine Eile. Das ist die einzige Übung heute ohne Zeitdruck.“</div>"),
      P("2:00","Squat + Reach · ×8","Füße hüftbreit, Zehen leicht nach außen. In die Kniebeuge sinken, so tief wie kontrolliert möglich, Gewicht bleibt in der Fußmitte. Beim Hochkommen Arme über den Kopf strecken und ausatmen. <span class='tag ground'>LEICHTER</span> nur halbe Tiefe, Hände bleiben an den Hüften. <span class='tag flight'>SCHWERER</span> mit einer Kurzhantel in jeder Hand, Arme strecken sich beim Hochkommen mit Gewicht nach oben.<div class='cue'>„Runter so tief, wie ihr die Knie noch über den Füßen halten könnt.“<br>„Beim Hochkommen: Arme lang nach oben, ausatmen.“<br>„Wer mag: Hanteln dazu — sonst bleibt's bei den Armen allein.“</div>"),
      P("4:00","World's Greatest Stretch · 3×/Seite","Großer Ausfallschritt nach vorne, hintere Ferse hoch. Innere Hand neben dem vorderen Fuß absetzen, äußerer Arm dreht sich zur Decke, Blick darf folgen. Becken zeigt so weit wie möglich nach vorne.<div class='cue'>„Großer Schritt nach vorne, innere Hand neben den Fuß.“<br>„Und jetzt öffnet sich der obere Arm zur Decke — der Blick darf mitgehen, wenn's der Nacken mag.“<br>„Lasst die Rotation vor allem aus Brustwirbelsäule und Hüfte entstehen — nicht erzwingen.“</div>"),
      P("6:00","Cat–Cow · 6× → Thread the Needle · 3×/Seite","Vierfüßler, Handgelenke unter den Schultern. Cat–Cow: Wirbelsäule rund machen (Kinn zur Brust, Becken einrollen), dann lang machen (Brustbein nach vorne, Blick leicht nach oben). Direkt im Anschluss Thread the Needle: ein Arm hebt zur Decke, dreht dann unter dem anderen Arm hindurch, Schulter und Schläfe sinken zum Boden.<div class='cue'>„Rund machen — und lang machen. Noch fünfmal, in eurem Tempo.“<br>„Jetzt ein Arm zur Decke — und darunter hindurchfädeln, Schulter sinkt zum Boden.“<br>„Heute geht es nicht darum, beweglich auszusehen. Sondern darum, den Körper kontrollieren zu können — das ist der Satz, der die ganze Stunde trägt.“</div>"),
    ]},
    {name:"POWERHOUSE FOUNDATION", range:"8–16", start:480, blocks:[
      P("8:00","Neutral Spine + Breathing · 3 Atemzüge","Rückenlage, Knie aufgestellt, Füße hüftbreit. Neutrale Wirbelsäule finden: kleine Kurve im unteren Rücken, weder flach gepresst noch stark hohl. Seitliche Rippenatmung: beim Einatmen weiten sich die Rippen zur Seite, beim Ausatmen sinken sie, Bauchnabel zieht sich sanft zur Wirbelsäule.<div class='cue'>„Findet die Mitte zwischen ganz flach und stark hohl im Rücken — das ist eure Neutralstellung.“<br>„Einatmen in die Rippen seitlich. Ausatmen, Nabel zieht sanft nach innen.“<br>„Diese Position ist die Basis für alles, was heute noch kommt.“</div>"),
      P("9:00","Pelvic Tilt / Imprint & Release · ×6","Aus der Neutralstellung: Becken kippt sanft, unterer Rücken presst komplett in die Matte (Imprint). Dann wieder lösen zurück in die Neutralstellung (Release). Bewegung kommt aus dem Becken, nicht aus den Beinen oder dem Bauch nach oben drücken.<div class='cue'>„Kippt das Becken, bis der untere Rücken ganz in der Matte liegt.“<br>„Und wieder lösen, zurück in die neutrale Mitte.“<br>„Hier lernt ihr die Verbindung, die den Rest der Stunde trägt: Becken, Rippen, Bauchspannung.“</div>"),
      P("10:30","Toe Tap · 6×/Seite","Beide Beine im Tabletop (Knie über der Hüfte, 90 Grad). Ein Fuß sinkt kontrolliert Richtung Boden, tippt leicht auf, kommt zurück — ohne dass sich Becken oder unterer Rücken bewegen. Je tiefer der Fuß sinkt, desto mehr Arbeit für die tiefe Bauchmuskulatur.<div class='cue'>„Das Becken bleibt komplett still — das ist die ganze Übung.“<br>„Sinkt nur so tief, wie ihr die Stille im Becken halten könnt.“<br>„Merkt ihr, wie der untere Bauch mitarbeitet, sobald der Fuß sinkt?“</div>"),
      P("12:00","Dead Bug · 6×/Seite","Tabletop-Position, dann gegenüberliegender Arm (nach hinten über den Kopf) und Bein (nach vorne, Ferse Richtung Boden) strecken sich gleichzeitig aus, während der untere Rücken flach am Boden bleibt. Zurück in die Ausgangsposition, Seite wechseln. <span class='tag ground'>LEICHTER</span> nur die Arme bewegen, Füße bleiben die ganze Zeit am Boden. <span class='tag flight'>SCHWERER</span> ein Widerstandsband um beide Füße gespannt, Beine arbeiten gegen den Zug.<div class='cue'>„Arm und gegenüberliegendes Bein strecken sich gemeinsam — der Rücken bleibt flach.“<br>„Wenn der Rücken sich hohl macht: Weg kleiner, nicht durchziehen.“<br>„Das ist Dead Bug — die Königsdisziplin der Powerhouse-Kontrolle.“</div>"),
      P("13:30","Chest Lift → Hundred Prep · ×6 + 30–50 Pumps","Chest Lift: Hände hinter dem Kopf oder verschränkt vor der Brust, Oberkörper hebt sich langsam bis zur Schulterblattspitze, Blick bleibt zum Bauchnabel, Nacken lang. Direkt im Anschluss oben bleiben, Arme strecken sich neben dem Körper und pumpen kraftvoll auf und ab (Hundred). <span class='tag ground'>LEICHTER</span> Füße bleiben am Boden statt im Tabletop. <span class='tag flight'>SCHWERER</span> Beine gestreckt in die Diagonale angehoben.<div class='cue'>„Langsam hoch bis zu den Schulterblattspitzen. Blick zum Bauchnabel, Nacken bleibt lang.“<br>„Oben bleiben — und jetzt die Arme pumpen, klein und kraftvoll.“<br>„Qualität vor Zahl. Noch keine 100 erzwingen, wir sind erst beim Fundament.“</div>"),
    ]},
    {name:"SHOULDER CONTROL", range:"16–22", start:960, blocks:[
      P("16:00","Band Pull-Apart · 10–12×","Stand, Band mit beiden Händen schulterbreit greifen, Arme gestreckt vor dem Körper. Arme ziehen das Band auseinander bis vor die Brust, Schulterblätter ziehen sich sanft zueinander, dann kontrolliert zurück.<div class='cue'>„Zieht das Band auseinander, die Schulterblätter kommen sanft zusammen.“<br>„Kontrolliert zurück — nicht das Band zurückschnappen lassen.“<br>„Das ist der Ausgleich zu allem, was das Bankdrücken euch eingebrockt hat.“</div>"),
      P("18:00","External Rotation mit Band","8–10×/Seite. Ellbogen bleibt fest am Körper fixiert, 90 Grad gebeugt. Unterarm dreht nach außen gegen den Widerstand des Bandes, dann kontrolliert zurück zur Mitte.<div class='cue'>„Der Ellbogen bleibt am Körper kleben — nur der Unterarm dreht nach außen.“<br>„Kontrolliert zurück, nicht fallen lassen.“</div>"),
      P("20:00","Scapular Push-up → Plank Hold · ×8 + 20 Sek.","Direkter Übergang auf die Matte: Plank-Position, Arme gestreckt. Ohne die Arme zu beugen, Schulterblätter zueinander sinken lassen (Brustkorb sinkt leicht zwischen die Schultern), dann aktiv auseinanderdrücken (oberer Rücken rundet sich leicht). Danach direkt in den Plank Hold übergehen. <span class='tag ground'>LEICHTER</span> Knie am Boden statt Zehen.<div class='cue'>„Arme bleiben gestreckt — nur die Schulterblätter bewegen sich zueinander und auseinander.“<br>„Und jetzt halten: Schulterkontrolle geht direkt ins Gewicht auf den Händen über.“<br>„Zwanzig Sekunden. Eine gerade Linie von Kopf bis Ferse.“</div>"),
    ]},
    {name:"THE ENGINE", range:"22–33", start:1320, blocks:[
      P("22:00","Single Leg Stretch · 8×/Seite","Rückenlage, Oberkörper in Chest-Lift-Höhe. Ein Knie zur Brust ziehen (Hände außen am Schienbein/innen am Knie), anderes Bein lang und knapp über dem Boden gestreckt. Wechsel mit dem Atem — ausatmen bei jedem Wechsel.<div class='cue'>„Ein Knie zur Brust, das andere Bein lang und tief — aber der Rücken bleibt am Boden.“<br>„Wechsel mit dem Ausatmen, zwei Wechsel pro Atemzug.“<br>„Der Oberkörper bleibt oben, der Nacken bleibt lang.“</div>"),
      P("24:00","Double Leg Stretch · ×8","Erste Variante bewusst reduziert: Knie im Tabletop, Oberkörper oben. Arme strecken sich nach hinten über den Kopf, kreisen dann seitlich zurück zu den Knien — die Beine bleiben die ganze Zeit im Tabletop oben. <span class='tag flight'>SCHWERER</span> Beine strecken sich zusätzlich diagonal nach vorne-unten, während die Arme nach hinten reichen, dann kehren beide gemeinsam zurück.<div class='cue'>„Nur die Arme reisen heute Runde eins — die Beine bleiben oben und ruhig.“<br>„Wenn die Rippen hochkommen, der Rücken hohl wird oder der Nacken hart wird: kleiner machen, nicht durchziehen.“<br>„Wer mag: Beine strecken sich mit den Armen mit — aber nur, wenn der Rücken flach bleibt.“</div>"),
      P("26:00","Criss Cross · 6–8×/Seite","Hände hinter dem Kopf, Ellbogen weit geöffnet. Oberkörper rotiert, Ellbogen bewegt sich Richtung gegenüberliegendes Knie, während das andere Bein sich streckt. Rotation kommt aus dem Rumpf, nicht aus dem Ziehen am Kopf.<div class='cue'>„Die Rotation kommt aus der Körpermitte — die Hände ziehen nicht am Kopf.“<br>„Ellbogen zum gegenüberliegenden Knie, dann Seite wechseln.“<br>„Langsamer ist hier schwerer als schnell.“</div>"),
      P("28:00","Forearm Plank · 30 Sek.","Unterarme am Boden, Ellbogen unter den Schultern, Körper eine durchgehende gerade Linie von Kopf bis Ferse. Becken weder nach oben noch nach unten hängen lassen. <span class='tag ground'>LEICHTER</span> Knie am Boden. <span class='tag flight'>SCHWERER</span> zusätzlich Knee Taps, 10× abwechselnd Knie Richtung Boden tippen.<div class='cue'>„Eine gerade Linie — kein Buckel, kein Durchhängen im Becken.“<br>„Atmen nicht vergessen, auch wenn's brennt.“</div>"),
      P("30:00","Plank Hold — Finisher · 20 Sek.","Letzte, bewusst maximale Anspannung des Blocks vor dem Wechsel zu Glutes & Legs. Gleiche Form wie zuvor, aber ohne Bewegung dazwischen — nur Halten. <span class='tag ground'>LEICHTER</span> Knie am Boden.<div class='cue'>„Zwanzig Sekunden. Das ist der Abschluss des Engine-Blocks.“<br>„Atmen nicht vergessen. Fast geschafft.“</div>"),
    ]},
    {name:"GLUTES & LEGS", range:"33–43", start:1980, blocks:[
      P("33:00","Pelvic Curl → Bridge Hold → Heel Raises → Marching Bridge","×6 / Hold / ×8 / 6×/Seite. Pelvic Curl: Rückenlage, Füße hüftbreit aufgestellt, Wirbel für Wirbel vom Becken aus abheben bis zu einer geraden Linie Knie–Hüfte–Schulter, dann Wirbel für Wirbel wieder ablegen. Oben halten (Bridge Hold). Dann Fersen abwechselnd anheben und senken (Heel Raises). Dann im Bridge-Hold abwechselnd ein Knie zur Brust ziehen, ohne dass das Becken kippt (Marching Bridge).<div class='cue'>„Wirbel für Wirbel hoch — Becken zuerst, dann der Rücken folgt.“<br>„Oben halten. Und jetzt die Fersen: heben, senken, heben, senken.“<br>„Ein Knie zur Brust — das Becken bleibt dabei ganz ruhig und gerade.“<br>„Das ist die Sequenz, die euch Hamstrings, Glutes und Beckenkontrolle in einem Rutsch gibt.“</div>"),
      P("36:30","Side-Lying Series · Leg Lift ×8, Small Circles 8/8, Front/Back ×6","Seitlage, unterer Arm stützt den Kopf oder liegt lang am Boden, Körper eine gerade Linie. Oberes Bein gestreckt auf Hüfthöhe anheben und senken (Leg Lift). Dann kleine Kreise vorwärts und rückwärts (Small Circles). Dann das Bein kontrolliert nach vorne und nach hinten schwingen, ohne dass der Oberkörper mitrotiert (Front/Back).<div class='cue'>„Das Bein hebt sich, der Oberkörper bleibt exakt da, wo er ist.“<br>„Kleine Kreise — die Größe ist egal, die Kontrolle zählt.“<br>„Und jetzt vor und zurück: Kann sich das Bein bewegen, ohne dass der Rest mitwackelt? Das ist Pilates pur.“</div>"),
      P("40:00","Bird Dog → Knee Hover · 8×/Seite + 20 Sek.","Vierfüßler, Handgelenke unter den Schultern, Knie unter der Hüfte. Gegenüberliegender Arm und Bein strecken sich gleichzeitig lang aus, Becken bleibt gerade, kein Kippen zur Seite. Danach: Knie heben 2–3 cm über den Boden und dort halten, Rumpf bleibt stabil. <span class='tag ground'>LEICHTER</span> Knee Hover auslassen, nur Bird Dog. <span class='tag flight'>SCHWERER</span> im Knee Hover zusätzlich abwechselnd einen Fuß antippen, 6×.<div class='cue'>„Arm und gegenüberliegendes Bein strecken sich — das Becken bleibt gerade, kein Kippen.“<br>„Und jetzt die Knie nur wenige Zentimeter heben und dort halten. Der Rumpf trägt, nicht die Arme.“</div>"),
    ]},
    {name:"ATHLETIC PILATES", range:"43–52", start:2580, blocks:[
      P("43:00","Leg Pull Front Prep · 6×/Seite","Plank-Position, Arme gestreckt. Ein Bein hebt sich nur wenige Zentimeter vom Boden, wird kurz gehalten, setzt kontrolliert wieder ab — das Becken bleibt dabei exakt gerade, keine Rotation. Seite wechseln. <span class='tag ground'>LEICHTER</span> Knie am Boden oder nur die Plank halten, ohne das Bein zu heben. <span class='tag flight'>SCHWERER</span> Leg Lift plus ein kleines, kontrolliertes Vor-und-Zurück-Schaukeln des ganzen Körpers (Rock).<div class='cue'>„Das Bein geht nur so hoch, wie dein Becken ruhig bleiben kann.“<br>„Sieht winzig aus — genau deshalb ist es schwer.“</div>"),
      P("45:00","Push-up Pilates Style · 3 Runden","Plank-Position → drei langsame Push-ups, dabei 3 Sekunden kontrolliert nach unten → Pike-Position/Down Dog zum Ausgleich → zurück in die Plank für die nächste Runde.<div class='cue'>„Drei Sekunden runter — nicht schneller.“<br>„Runter kann jeder. Mich interessiert, ob ihr den Weg nach unten kontrolliert.“<br>„Aus der Pike-Position wieder zurück in die Plank für die nächste Runde.“</div>"),
      P("47:30","Side Plank Prep · 20–30 Sek./Seite","Unterarmstütz seitlich, unteres Knie am Boden abgestützt, oberer Arm zeigt zur Decke oder liegt an der Hüfte. Körper eine gerade Linie von Kopf bis Knie. <span class='tag flight'>SCHWERER</span> beide Beine lang übereinander gestreckt; wer noch mehr will: oben ein kleiner, kontrollierter Hip Lift ×5.<div class='cue'>„Eine gerade Linie, das untere Knie trägt einen Teil des Gewichts ab.“<br>„Wer die Beine lang streckt: die Hüfte bleibt gestapelt, nicht nach vorne kippen.“</div>"),
      P("49:30","Standing Scooter / Standing Leg Press · 8–10×/Seite","Mit dem Widerstandsband: Standbein leicht gebeugt, stabil. Anderes Bein mit dem Band kontrolliert weit nach hinten führen (Hüftstreckung), dann langsam und kontrolliert wieder nach vorne zurück — der Widerstand des Bandes wirkt in beide Richtungen.<div class='cue'>„Das Standbein bleibt stabil und leicht gebeugt.“<br>„Das andere Bein nach hinten gegen das Band — und genauso kontrolliert wieder zurück.“<br>„Der Rückweg zählt genauso wie der Hinweg.“</div>"),
    ]},
    {name:"POWERHOUSE BURN", range:"52–57", start:3120, blocks:[
      P("52:00","Rückenlagen-Kette · je 30 Sek. + Hundred 50 Pumps","Ohne Pause direkt hintereinander, alle in Rückenlage: Chest Lift Hold (oben bleiben, 30 Sek.) → Single Leg Stretch (30 Sek., zügiger als zuvor) → Tabletop Toe Taps (30 Sek.) → Hundred (50 Pumps). Danach kurz lösen, Beine ausschütteln.<div class='cue'>„Vier Übungen, ein Fluss, kein Ablegen dazwischen.“<br>„Oben bleiben. Wechseln. Weiter. Das ist der letzte große Push.“<br>„Kurz lösen — Beine ausschütteln, bevor's weitergeht.“</div>"),
      P("54:30","Teaser Prep · 5× langsam, letzte Wiederholung 10 Sek. halten","Füße am Boden aufgestellt, Hände fassen hinter die Oberschenkel. Oberkörper rollt kontrolliert in eine C-Curve nach hinten, bis kurz vor dem Kippunkt, dann wieder kontrolliert nach vorne hoch. Bei der letzten Wiederholung oben in der C-Curve halten, dann erst ablegen.<div class='cue'>„Kontrolliert zurück in die C-Curve — nicht fallen lassen.“<br>„Und genauso kontrolliert wieder hoch.“<br>„Letzte Wiederholung: oben halten, zehn Sekunden.“<br>„Falls ihr euch gefragt habt, wo euer Powerhouse ist: Jetzt wisst ihr es.“</div>"),
    ]},
    {name:"RESET", range:"57–60", start:3420, blocks:[
      P("57:00","Child's Pose → Hip Flexor Stretch → Figure Four → Supine Spinal Twist → Standing Roll Up","Bewusst kein abruptes Ende — diese Zielgruppe braucht Beweglichkeit mindestens so dringend wie Core-Stärke. Child's Pose (Knie breit, Stirn sinkt), dann im Kniestand Hüftbeuger dehnen (Ausfallschritt, Becken nach vorne), dann Rückenlage Figure Four (Knöchel aufs gegenüberliegende Knie, Bein zur Brust ziehen), dann Supine Spinal Twist (Knie zur Seite sinken lassen, Brustkorb bleibt offen), zum Schluss aufstehen und ein letztes Mal die Wirbelsäule aufrollen.<div class='cue'>„Nach so viel Kontrolle heute: hier darf einfach nur losgelassen werden.“<br>„Die Hüftbeuger haben heute viel gearbeitet — hier bekommen sie ihre Länge zurück.“<br>„Knie sinkt zur Seite, der Brustkorb bleibt offen.“<br>„Und zum Schluss: ein letztes Mal aufrollen, ein letzter bewusster Atemzug.“</div>"),
    ]},
  ],
