:root{ --accent:#e8601f; --accent-ink:#171512; }
  html[data-theme="dark"]{
    --bg:#171512; --card:#1c1a17; --line:#2a2622;
    --text:#f2eee6; --text-2:#c9c2b4; --text-3:#8a8070; --text-4:#5c564c;
    --ground-bg:#16221c; --ground-line:#2c4636; --ground:#8fc9a8;
    --flight-bg:#241c14; --flight-line:#3a2c1c; --flight:#c9a876;
  }
  html[data-theme="light"]{
    --bg:#faf6f0; --card:#ffffff; --line:#e8ded0;
    --text:#2a2420; --text-2:#4a443c; --text-3:#7a7166; --text-4:#a89486;
    --ground-bg:#eef7f1; --ground-line:#bfe0cc; --ground:#2f7a4d;
    --flight-bg:#fbf1e4; --flight-line:#eed9b8; --flight:#8a6a2f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:78px; transition:background .2s;}
  h1,h2,h3{font-family:'Inter',system-ui,sans-serif; font-weight:600; margin:0;}
  .wrap{max-width:520px; margin:0 auto; padding:0 16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 16px 0; border-bottom:1px solid var(--line);}
  header.top .brand{display:flex; align-items:flex-start; justify-content:space-between; max-width:520px; margin:0 auto; gap:8px; flex-wrap:wrap;}
  header.top .overline{font-size:10px; font-weight:700; color:var(--text-3); letter-spacing:2px; text-transform:uppercase;}
  header.top .brand h1{font-family:'Melvinsone',sans-serif; font-size:22px; font-weight:400; color:var(--accent); letter-spacing:0.5px; text-transform:none; line-height:1.15; margin-top:2px;}
  header.top .brand .right{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  header.top .brand span{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px;}
  .themebtn{font-size:11px; color:var(--text-3); background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:5px 9px; white-space:nowrap;}
  .themebtn#cueToggle{color:var(--accent); border-color:var(--accent); font-weight:700;}

  .journeytabs{display:flex; gap:6px; max-width:520px; margin:12px auto 0; overflow-x:auto;}
  .jtab{flex:1; text-align:center; padding:9px 4px; border-radius:10px 10px 0 0;

    border:none; white-space:nowrap;}
  .jtab.active{background:var(--card); color:var(--accent);}

  .themebar{max-width:520px; margin:0 auto; padding:12px 16px; background:var(--card);
    border-radius:0 0 14px 14px; margin-bottom:10px; border:1px solid var(--line); border-top:none;}
  .themebar .theme{font-size:13px; font-style:italic; color:var(--text-2);}
  .memline{display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; -webkit-overflow-scrolling:touch;}
  .memline::-webkit-scrollbar{display:none;}
  .memchip{flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:0.4px;
    color:var(--accent); background:var(--bg); border:1px solid var(--line); padding:5px 10px; border-radius:20px;}

  .modebar{display:flex; gap:6px; max-width:520px; margin:0 auto 14px; padding:0 16px;}
  .modebtn{flex:1; padding:9px 0; font-size:13px; font-weight:600; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--text-2);}
  .modebtn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  main{max-width:520px; margin:0 auto; padding:0 16px 24px;}

  .phase{margin-bottom:18px;}
  .phasehead{display:flex; align-items:baseline; justify-content:space-between;
    padding:6px 2px; border-bottom:2px solid var(--accent); margin-bottom:8px;}
  .phasehead h2{font-family:'Melvinsone',sans-serif; font-weight:400; font-size:22px; color:var(--accent); letter-spacing:0.5px; text-transform:none;}
  .phasehead .range{font-size:11px; color:var(--text-3); font-weight:600;}

  .block{background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:8px; overflow:hidden;}
  .blockhead{display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; cursor:pointer;}
  .blockhead .bt{display:flex; flex-direction:column; gap:2px;}
  .blockhead .time{font-size:11px; color:var(--text-3); font-weight:700; letter-spacing:0.3px;}
  .blockhead .title{font-size:15px; font-weight:500; color:var(--text);}
  .chev{font-size:13px; color:var(--text-3); transition:transform .2s;}
  .block.open .chev{transform:rotate(180deg);}
  .blockbody{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .block.open .blockbody{max-height:800px;}
  .blockbody-in{padding:0 14px 14px; font-size:14px; line-height:1.55; color:var(--text-2);}
  .blockbody-in p{margin:0 0 8px;}
  .blockbody-in .lbl{font-size:11px; font-weight:700; color:var(--accent);
    letter-spacing:0.4px; margin:8px 0 3px;}
  .blockbody-in .cue{display:none; font-style:italic; color:var(--text-2); border-left:2px solid var(--accent);
    padding:2px 0 2px 10px; margin-top:10px; font-size:13.5px;}
  body.long-cues .blockbody-in .cue{display:block;}
  .nowcard .cue{display:none; font-style:italic; color:var(--text-2); border-left:2px solid var(--accent);
    padding:2px 0 2px 10px; margin-top:10px; font-size:13px;}
  body.long-cues .nowcard .cue{display:block;}
  .ytlink{display:inline-block; margin-top:10px; font-size:12px; font-weight:600; color:var(--accent); text-decoration:none;}
  .block.active{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);}

  /* flashcards */
  .cardstage{padding:10px 0 6px; text-align:center;}
  .progress{font-size:12px; color:var(--text-3); margin-bottom:10px;}
  .flash{background:var(--card); border:1px solid var(--line); border-radius:16px;
    min-height:220px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; margin-bottom:14px;}
  .flash .fmove{font-family:'Melvinsone',sans-serif; font-weight:400; font-size:30px; color:var(--accent); letter-spacing:0.5px;}
  .flash .fhint{font-size:12px; color:var(--text-3); margin-top:10px;}
  .flash .fanswer{font-size:14px; color:var(--text-2); line-height:1.6; margin-top:14px; display:none;}
  .flash.flipped .fanswer{display:block;}
  .flash.flipped .fhint{display:none;}
  .flashnav{display:flex; gap:10px;}
  .navbtn{flex:1; padding:12px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:14px; font-weight:500; color:var(--text);}
  .navbtn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}

  /* practice */
  .practice-hero{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; text-align:center; margin-bottom:14px;}
  .clock{font-family:'Melvinsone',sans-serif; font-weight:400; font-size:46px; color:var(--accent); font-variant-numeric:tabular-nums;}
  .clockphase{font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-3); margin-top:2px;}
  .bar{height:6px; background:var(--line); border-radius:4px; margin:14px 0; overflow:hidden;}
  .barfill{height:100%; background:var(--accent); width:0%; transition:width .3s linear;}
  .ctrls{display:flex; gap:10px;}
  .ctrls button{flex:1; padding:12px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:14px; font-weight:600; color:var(--text);}
  .ctrls button.go{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .nowcard{background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:14px; margin-bottom:14px;}
  .nowcard .lbl{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:0.4px; text-transform:uppercase;}
  .nowcard .title{font-size:17px; font-weight:600; margin:4px 0 6px; color:var(--text);}
  .nowcard .txt{font-size:14px; color:var(--text-2); line-height:1.5;}
  .minilist .miniblock{display:flex; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);
    font-size:13px; color:var(--text-2);}
  .minilist .miniblock.active{color:var(--accent); font-weight:600;}
  .minilist .miniblock .t{width:52px; flex:0 0 auto; color:var(--text-3); font-weight:600;}

  .tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.3px;
    padding:2px 7px; border-radius:6px; margin-right:5px; border:1px solid;}
  .tag.ground{background:var(--ground-bg); border-color:var(--ground-line); color:var(--ground);}
  .tag.flight{background:var(--flight-bg); border-color:var(--flight-line); color:var(--flight);}

  footer.corebox{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-top:6px;}
  footer.corebox h3{font-size:12px; color:var(--accent); margin-bottom:8px; letter-spacing:1px; text-transform:uppercase;}
  footer.corebox p{font-size:13px; color:var(--text-2); line-height:1.6; margin:0 0 8px;}
  footer.corebox .essence{font-size:12px; font-weight:600; color:var(--text); line-height:1.9;}

  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--line); display:flex; z-index:30;
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
  nav.bottom button{flex:1; background:none; border:none; padding:8px 0; font-size:11px;
    font-weight:600; color:var(--text-3);}
  nav.bottom button.active{color:var(--accent);}
/* === JIN_BUILDER_CSS_START === */

  /* ---- Class Builder ---- */
  .builderwrap{padding-bottom:20px;}
  .bsection{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px;}
  .bsection h3{font-size:12px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin:0 0 10px;}
  .bfield{margin-bottom:10px;}

    width:100%; box-sizing:border-box; background:var(--bg); color:var(--text); border:1px solid var(--line);

  .brow{display:flex; gap:8px;}
  .brow > .bfield{flex:1; min-width:0;}
  .bphase{border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; background:var(--bg);}
  .bphase > .bphasehead{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .bphase > .bphasehead .bpname{font-family:'Melvinsone',sans-serif; font-size:16px; color:var(--accent);}
  .bphase > .bphasehead .brange{font-size:11px; color:var(--text-3); font-weight:600;}
  .bblock{border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:var(--card);}
  .bblock .bblockhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .bblock .bblockhead .bt{font-size:12px; color:var(--text-3); font-weight:700;}
  .bsmallbtn{font-size:11px; font-weight:600; color:var(--text-3); background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:5px 9px;}
  .bsmallbtn.danger{color:#c0392b; border-color:#c0392b;}
  .baddbtn{width:100%; padding:9px 0; border-radius:10px; border:1px dashed var(--line); background:transparent;
    color:var(--text-3); font-size:13px; font-weight:600;}
  .bcheckrow{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2); margin-bottom:8px;}
  .bexplore-grid{display:grid; grid-template-columns:1fr; gap:6px;}
  .bvalid{display:flex; flex-direction:column; gap:6px;}
  .bvalid .vitem{display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.4; padding:8px 10px; border-radius:8px;}
  .vitem.ok{background:color-mix(in srgb, #2e7d32 15%, transparent); color:var(--text);}
  .vitem.warn{background:color-mix(in srgb, #e8a53a 18%, transparent); color:var(--text);}
  .vitem.err{background:color-mix(in srgb, #c0392b 18%, transparent); color:var(--text);}
  .vitem .vdot{flex:0 0 auto; font-weight:700;}
  .bactions{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .bactions button{flex:1; min-width:120px; padding:12px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:13px; font-weight:600; color:var(--text);}
  .bactions button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .bexisting{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .bexisting button{font-size:12px; padding:6px 10px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg); color:var(--text-2); font-weight:600;}
  .bexisting button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .bsuggestbar{display:flex; gap:6px; margin-top:6px;}
  .bsuggestbar button{flex:1; font-size:11px; padding:7px 0; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--text-2); font-weight:600;}
  .bsuggest-panel{margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg);}
  .bsuggest-panel .sfilter{width:100%; box-sizing:border-box; margin-bottom:6px; background:var(--card);
    color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px;}
  .scard{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px;}
  .scard .stitle{font-size:13px; font-weight:600; color:var(--text);}
  .scard .ssrc{font-size:10px; color:var(--text-3); font-weight:600; text-transform:uppercase; margin-left:6px;}
  .scard .sdur{font-size:11px; color:var(--text-3); font-weight:600; float:right;}
  .scard .sbody{font-size:12px; color:var(--text-2); margin:4px 0; line-height:1.4; max-height:60px; overflow:hidden;}
  .scard .sapply{margin-top:4px; font-size:11px; padding:5px 10px; border-radius:8px; border:1px solid var(--accent);
    background:transparent; color:var(--accent); font-weight:700;}
  .sstatus{font-size:12px; color:var(--text-3); padding:6px 2px;}

/* === JIN_BUILDER_CSS_END === */
</style>

<body>

<header class="top">
  <div class="brand">
    <div>
      <div class="overline">JOGAnichtYOGA</div>
      <h1>JIN Journey</h1>
    </div>
    <div class="right">
      <button class="themebtn" id="cueToggle" title="Cue-Länge umschalten">Cues: Lang</button>
      <button class="themebtn" id="themeToggle">☀️</button>
    </div>
  </div>
  <div class="journeytabs" id="journeytabs"></div>
  <span id="journeyLabel" style="display:none"></span>
</header>

<div class="themebar">
  <div class="theme" id="themeText"></div>
  <div class="memline" id="memline"></div>
</div>

<div class="modebar">
  <button class="modebtn" data-mode="study">Lernen</button>
  <button class="modebtn" data-mode="cards">Karten</button>
  <button class="modebtn" data-mode="practice">Übung</button>
</div>

<main id="main"></main>

<nav class="bottom" id="bottomnav">
  <button data-j="morning">Morning</button>
  <button data-j="evening">Evening</button>
  <button data-j="energy">Energy</button>
  <button data-j="core">Core 1.0</button>
  <button data-j="builder">Erstellen</button>
</nav>

<script>
function P(time,title,body){return {time,title,body};}

const DATA = {
morning: { label:"Morning Rise", theme:"Raum schaffen", color:"#c98a4b",
  memory:["BOUNCE","SWING","TWIST","WAVE","SUN","DRAGON","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","PIKE","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–12", start:0, blocks:[
      P("0:00","Arrive","Hüftbreiter Stand. Knie weich. Gewicht verteilen. Schultern lösen. Atem wahrnehmen.<div class='cue'>„Guten Morgen. Wir starten heute nicht damit, besonders beweglich zu sein. Wir starten einfach damit, uns zu bewegen. Spürt kurz eure Füße. Lasst die Knie weich. Atmet einmal tief ein. Und lang wieder aus. Wir sagen heute einfach Ja zu Bewegung. Und schauen, wohin sie uns führt.“</div>"),
      P("1:30","Bounce","<span class='lbl'>Ground</span> Über Füße, Sprunggelenke und Knie federn. Fersen dürfen sich lösen, beide Füße behalten Bodenkontakt.<br><span class='lbl'>Flight</span> Aus dem Federn dürfen kleine Hops entstehen. Beide Qualitäten können jederzeit ineinander übergehen.<div class='cue'>„Gebt dem Körper ein bisschen Rhythmus. Noch kein Workout. Nur wach werden. Wer springen möchte, springt. Wer heute nicht springen möchte, bleibt bei den Fersen. Beides ist richtig.“</div>"),
      P("2:30","Arm Swings","Arme vor dem Körper kreuzen → öffnen. Klein beginnen. Bewegungsradius allmählich vergrößern. Arme schwingen, nicht aktiv in Endpositionen führen.<div class='cue'>„Nicht kontrollieren. Schwingen lassen.“</div>"),
      P("3:30","Trunk Twist","Rumpf R/L drehen. Arme locker mitführen. Gegenüberliegende Ferse darf lösen. Kopf folgt nur in angenehmem Radius.<div class='cue'>„Die Bewegung kommt aus der Mitte. Die Arme hängen einfach dran.“</div>"),
      P("4:30","Body Wave","Knie → Becken → untere Wirbelsäule → Brust → Kopf. Bewegungsrichtung umkehren. Mehrere kontinuierliche Wellen.<div class='cue'>„Keine perfekte Welle. Findet eure.“</div>"),
      P("5:30","Hip Circles","Becken vor → rechts → hinten → links. Mehrere Kreise. Richtungswechsel. Knie bleiben weich.<div class='cue'>„Stellt euch vor, euer Becken zeichnet einen Kreis um eure Füße.“</div>"),
      P("6:30","Squat & Reach","Ein: Aufrichten, Arme hoch. Aus: Becken zurück, Knie beugen, Arme nach hinten. 6–8 Wiederholungen.<div class='cue'>„Das ist kein Squat-Test. Geht nur so tief, dass ihr anschließend genauso leicht wieder hochkommt.“</div>"),
      P("7:30","Golfer Swings","Rumpfrotation mit leichtem Hüftknick, Arme schwingen tief vor dem Körper von einer Seite zur anderen. Knie weich, Becken dreht mit.<div class='cue'>„Stellt euch vor, ihr schwingt lose einen Golfschläger von links nach rechts, knapp über dem Boden. Die Arme hängen locker – die Bewegung kommt aus Rumpf und Hüfte.“</div>"),
      P("9:15","March mit Hände-Clap","Auf der Stelle marschieren, Knie abwechselnd anheben. Bei jedem angehobenen Knie die Hände kurz darüber zusammenklatschen.<div class='cue'>„Marschiert locker auf der Stelle. Immer wenn ihr ein Knie hebt, führt ihr die Hände von außen zum Knie. Ihr bestimmt eure Geschwindigkeit. Es ist kein Rennen – die Koordination darf ruhig etwas holprig sein.“</div>"),
      P("11:00","Side Reach Flow","Abwechselnde Seitbeugen R/L. Arme lang. Knie weich. Kontinuierlich fließen. Radius zum Ende leicht reduzieren.<div class='cue'>„Der Radius darf jetzt schon kleiner werden. Ihr bereitet den Körper vor, nicht das Publikum.“</div>"),
    ]},
    {name:"FLOW", range:"12–24", start:720, blocks:[
      P("12:00","Round 1 — Learn","Mountain → Reach → Forward Fold (Knie weich) → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → rechtes Knie kurz ablegen → Brust öffnen → Hände absetzen → Vierfüßler → Cat/Cow 3× → Down Dog → rechter Fuß nach vorne = Low Lunge R → linkes Knie kurz ablegen → Brust öffnen → Hände absetzen → linker Fuß nach vorne → Fold → Half Lift → Fold → Roll Up → Mountain.<div class='cue'>„Wir nehmen jetzt die freie Bewegung von eben mit in einen ersten Flow. Kein Tempo. Kein Wettbewerb. Der Atem gibt uns den Rhythmus.“</div>"),
      P("16:30","Round 2 — Flow","Identische Sequenz. Cat/Cow 2×. Übergänge weicher verbinden. Atem und Bewegung stärker verbinden. Lunges bleiben dynamisch.<div class='cue'>„Zweite Runde: Lasst die Übergänge ineinanderfließen. Die Form kennt ihr jetzt.“</div>"),
      P("20:30","Round 3 — Feel","Gleicher Bewegungsbogen. Cat/Cow 1×. Weniger technische Führung. Am Ende: Down Dog → Knie ablegen → Vierfüßler. Nicht mehr aufstehen.<div class='cue'>„Wir haben groß angefangen. Ab jetzt wird unsere Bewegung langsam näher zum Boden und etwas kleiner.“</div>"),
    ]},
    {name:"EXPLORE", range:"24–39", start:1440, blocks:[
      P("24:00","Dragon R","<span class='lbl'>Arrive</span> Aus Vierfüßler rechten Fuß zwischen die Hände. Linkes Knie zunächst am Boden.<br><span class='lbl'>Move</span> Rock: Becken 3–4× vor/zurück. Half-Split Rock: Becken zurück, rechtes Bein länger, wieder vor, 3–4×. Activate — Ground: linkes Knie am Boden. Float: linke Zehen auf, Knie wenige cm heben. Rotate: linke Hand innen am rechten Fuß, rechter Arm öffnet, 2–3×. Side Reach: Oberkörper auf, linker Arm hoch, Neigung rechts.<br><span class='lbl'>Reduce</span> Zurück zum Low Lunge, zwei Rocks → kleiner → minimal.<br><span class='lbl'>Pause</span> Ca. 15–20 Sek.<br><span class='lbl'>Release</span> Bein zurück, Vierfüßler, Knie entlasten.<div class='cue'>„Große Bewegung. Kleine Bewegung. Noch kleiner. Bis ihr nichts mehr verändern müsst.“</div>"),
      P("27:00","Dragon L","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release.<div class='cue'>„Spiegelverkehrt, gleiche Anweisung wie rechts. Was rechts richtig war, ist links nicht automatisch gleich – findet es neu.“</div>"),
      P("30:00","90/90 Hip Wave","<span class='lbl'>Arrive</span> Sitz, Knie auf, Füße etwas weiter als hüftbreit.<br><span class='lbl'>Move</span> Knie R/L pendeln, 6–8×. Auf einer Seite bleiben, Oberkörper zum vorderen Bein, leicht vor/zurück. Seitenwechsel. Wieder R/L fließen.<br><span class='lbl'>Reduce</span> Pendel kleiner.<br><span class='lbl'>Pause</span> Neutraler Sitz.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Nicht ziehen. Bewegen.“</div>"),
      P("34:30","Butterfly Wave","<span class='lbl'>Arrive</span> Fußsohlen zusammen.<br><span class='lbl'>Move</span> Ein: Wirbelsäule auf. Aus: nach vorne, 3×. Side Reach R/L. Rotation R/L. Erneut vor → auf → vor.<br><span class='lbl'>Reduce</span> Volle → halbe → minimale Welle.<br><span class='lbl'>Pause</span> Ca. 60–75 Sek.<br><span class='lbl'>Release</span> Hände an Knie, aktiv zusammenführen, Beine ausstrecken.<div class='cue'>„Und genau hier verändert sich unsere Journey. Am Anfang war Bewegung groß. Jetzt wird sie klein. Vielleicht bleibt irgendwann nur noch der Atem.“</div>"),
    ]},
    {name:"MELT", range:"39–55", start:2340, blocks:[
      P("39:00","Half Butterfly R · 2:30","Rechtes Bein lang. Linker Fuß zum inneren Oberschenkel. Oberkörper zum rechten Bein, nach vorne sinken. Knie darf weich sein.<div class='cue'>„Nicht zum Fuß. Einfach in Richtung Bein.“</div>"),
      P("41:30","Half Butterfly L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Die zweite Seite ist selten die gleiche Geschichte wie die erste.“</div>"),
      P("44:00","Deer R · 2:30","Rechtes Bein vor dem Becken, Knie gebeugt, Unterschenkel diagonal vor dem Körper. Linkes Bein seitlich/hinten. Keine erzwungenen 90°. Aufrecht oder sanft nach vorne.<div class='cue'>„Vorderes Bein trägt, hinteres Bein liegt. Kein Ziehen, kein Quadrat erzwingen.“</div>"),
      P("46:30","Deer L · 2:30","Spiegelverkehrt.<div class='cue'>„Spiegelverkehrt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("49:00","Pike / Caterpillar · 3:00","Beide Beine vorne. Knie weich möglich. Aufrichten, leicht aus dem Becken nach vorne, Oberkörper schwer werden lassen. Kein Ziehen zu den Füßen.<div class='cue'>„Die Haltung, auf die euer Körper die ganze Stunde vorbereitet wurde. Vielleicht sieht sie heute unspektakulär aus. Perfekt. Ihr müsst nichts erreichen.“</div>"),
      P("52:00","Supine Twist R · 1:30","Rückenlage. Knie anwinkeln, nach links sinken. Brustkorb rotiert nach rechts. Kopf neutral oder rechts.<div class='cue'>„Das Knie sinkt, der Brustkorb bleibt offen. Der Boden hält den Rest.“</div>"),
      P("53:30","Supine Twist L · 1:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Letzte Bewegung vor der Stille.“</div>"),
    ]},

      P("55:00","Savasana","Rückenlage. Arme/Beine bequem. Ca. vier Minuten vollständige Ruhe. Letzte Minute: Atem vertiefen → Finger/Zehen → strecken → über die Seite zum Sitz.<div class='cue'>„Wir haben mit Bewegung begonnen – groß, locker, unperfekt. Dann wurde sie kleiner. Bis keine Bewegung mehr nötig war.“</div>"),

evening: { label:"Evening Unwind", theme:"Den Tag abgeben", color:"#5a7a8a",
  memory:["SHAKE","SWAY","WAVE","MOON","MELTING CAT","THREAD","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","FIGURE FOUR","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–10", start:0, blocks:[
      P("0:00","Shake & Arrive","Im Stand. Hände → Arme → Schultern → Beine locker ausschütteln. Gewicht verlagern. Bewegung allmählich ruhiger.<div class='cue'>„Bevor wir versuchen loszulassen, bewegen wir erst einmal das, was der Tag uns mitgebracht hat. Ihr müsst jetzt noch nicht ruhig sein.“</div>"),
      P("2:00","Shoulder Rolls → Arm Swings","Schultern langsam kreisen. Daraus lockere Armswings entwickeln.<div class='cue'>„Die Schultern zuerst, dann dürfen die Arme dazukommen. Nichts muss gleichzeitig passieren.“</div>"),
      P("3:00","Trunk Twist","Rumpf R/L. Arme schwer mitschwingen. Fersen dürfen reagieren.<div class='cue'>„Lasst die Arme schwer sein.“</div>"),
      P("4:00","Body Waves","Knie → Becken → Wirbelsäule → Brust → Kopf. Langsamer und weicher als Morning.<div class='cue'>„Der Tag steckt oft in der Wirbelsäule. Lasst die Welle ihn einfach rausschieben.“</div>"),
      P("5:00","Hip Circles","Große langsame Beckenkreise, beide Richtungen. Radius zum Ende reduzieren.<div class='cue'>„Langsamer als heute Morgen. Das Becken darf schwer sein, nicht spielerisch.“</div>"),
      P("6:00","QiGong Kreisen","Arme in einem großen Kreis über außen nach oben kreisen. Dann die Hände mit den Handflächen vor dem Körper bis zur Körpermitte nach unten führen. Dabei leicht in die Knie gehen.<div class='cue'>„Führt die Arme in einem weiten Kreis über außen nach oben. Dabei führt ihr die Hände mit den Handflächen nach unten bis zur Körpermitte. Dabei geht ihr leicht in die Knie. Die Hände weiter nach unten durchführen und dann wieder über außen nach oben bringen.“</div>"),
      P("7:00","QiGong Kreisen — umgekehrt","Arme von oben über außen vor den Bauch führen, dabei leicht in den Squat gehen. Die Hände vor dem Körper mit den Handflächen nach oben zeigend langsam nach oben führen.<div class='cue'>„Diesmal andersherum: Arme von oben über außen vor den Bauch bringen. Dabei geht ihr ganz leicht in einen Squat. Dann führt ihr die Hände vor dem Körper mit den Handflächen wieder nach oben, streckt dabei die Beine.“</div>"),
      P("8:00","Side-to-Side Sway","Gewicht R/L. Arme frei mitfließen. Zunehmend weicher und kleiner.<div class='cue'>„Wir hören nicht plötzlich auf, uns zu bewegen. Wir lassen die Bewegung nur langsam ruhiger werden.“</div>"),
    ]},
    {name:"FLOW", range:"10–20", start:600, blocks:[
      P("10:00","Moon Flow 1","Mountain → Reach → Crescent Side Bend R → Mitte → L → Mitte → Standing Twist R/L → Fold → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → Knie ablegen → <b>Evening Low Crescent</b> (Arme seitlich bis Schulterhöhe/weiches V, 2–3×, keine Überkopfhaltung) → rechte Hand innen, Brustkorb links → Vierfüßler → Cat/Cow 3× → Down Dog → rechter Fuß vor = Low Lunge R → Evening Low Crescent 2–3× → linke Hand innen, Brustkorb rechts → Fold → Roll Up → Mountain.<div class='cue'>„Der Mond drängt nicht. Jede Position darf einen Atemzug länger bleiben als beim Sun Flow heute Morgen.“</div>"),
      P("15:00","Moon Flow 2","Identischer Ablauf. Cat/Cow 1–2×. Weniger technische Führung, mehr kontinuierliche Bewegung. Am Ende: Down Dog → Knie → Vierfüßler.<div class='cue'>„Der Atem darf jetzt länger werden. Wir brauchen immer weniger Schwung. Immer weniger Kraft. Wir bewegen uns langsam nach innen.“</div>"),
    ]},
    {name:"EXPLORE", range:"20–35", start:1200, blocks:[
      P("20:00","Melting Cat","<span class='lbl'>Arrive</span> Vierfüßler.<br><span class='lbl'>Move</span> Cat/Cow 4–5×. Becken Richtung Fersen → Gewicht nach vorne, 3–4×. Body Circles: zurück→rechts→vorne→links, 3×, Richtungswechsel.<br><span class='lbl'>Reduce</span> Kreise kleiner bis minimal.<br><span class='lbl'>Pause</span> Child's Pose, ca. 45 Sek.<br><span class='lbl'>Release</span> Zurück Vierfüßler, Handgelenke entlasten.<div class='cue'>„Nicht mehr Cat-Cow wie am Morgen. Die Wirbelsäule bewegt sich jetzt kleiner, wärmer, langsamer.“</div>"),
      P("24:00","Thread & Reach","<span class='lbl'>Arrive</span> Vierfüßler, Knie unter der Hüfte.<br><span class='lbl'>Move R</span> Rechten Arm hoch öffnen, unter linkem Arm hindurch (3×), letztes Mal Schulter+Kopf sanft zum Boden.<br><span class='lbl'>Reduce</span> Minimal nachgeben.<br><span class='lbl'>Pause</span> Ca. 40–45 Sek.<br><span class='lbl'>Release</span> Hand unter Schulter, aktiv drücken, Arm zurück. Dann Seite L.<div class='cue'>„Der Arm fädelt sich durch, die Schulter sinkt. Sucht nicht die tiefste Rotation, sondern die ehrlichste.“</div>"),
      P("27:30","90/90 Moon Sway","<span class='lbl'>Arrive</span> Sitz, beide Knie aufgestellt.<br><span class='lbl'>Move</span> Beide Knie rechts → Mitte → links, 6× langsam. Auf einer Seite: Oberkörper zum vorderen Bein, auf/vor/zurück 3×, Seitenwechsel.<br><span class='lbl'>Reduce</span> Zwei Wechsel, dann minimal.<br><span class='lbl'>Pause</span> Kurz in der Mitte sitzen, ca. 15–20 Sek.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Lasst die Hüften nicht etwas leisten. Lasst sie reagieren.“</div>"),
      P("31:00","Butterfly Wave — Evening","<span class='lbl'>Arrive</span> Sitz, Fußsohlen zusammen.<br><span class='lbl'>Move</span> Spinal Wave 4×. Circular Fold 3× + Richtungswechsel. Side Melt R/L. Fold Wave 3×.<br><span class='lbl'>Reduce</span> Fold Wave kleiner.<br><span class='lbl'>Pause</span> Ca. 75 Sek.<br><span class='lbl'>Release</span> Knie zusammenführen.<div class='cue'>„Wir hören nicht auf, weil ich sage: Jetzt ist Yin. Wir hören auf, weil die Bewegung nicht mehr gebraucht wird.“</div>"),
    ]},
    {name:"MELT", range:"35–53", start:2100, blocks:[
      P("35:00","Butterfly · 3:00","Fußsohlen zusammen, angenehmer Abstand. Oberkörper nach vorne sinken lassen.<div class='cue'>„Keine Richtung mehr. Nur Gewicht.“</div>"),
      P("38:00","Half Butterfly R · 2:30","Rechtes Bein lang, linker Fuß innen. Oberkörper Richtung rechtes Bein. Knie darf weich sein.<div class='cue'>„Kein Ziehen zum Fuß. Der Oberkörper sinkt nur so weit, wie der Atem noch frei fließt.“</div>"),
      P("40:30","Half Butterfly L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Der Abend hat keine Eile.“</div>"),
      P("43:00","Deer R · 2:30","Rechtes Bein vor/diagonal vor dem Becken. Linkes Bein seitlich/hinten. Aufrecht oder sanft vorne. Keine erzwungenen 90°.<div class='cue'>„Das vordere Bein trägt das Gewicht des ganzen Tages. Lasst es einfach liegen.“</div>"),
      P("45:30","Deer L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Fast geschafft.“</div>"),
      P("48:00","Supine Figure Four","Rückenlage, Knie auf. Rechten Außenknöchel auf linken Oberschenkel. <span class='tag ground'>GROUND</span> Fuß am Boden. <span class='tag flight'>FLOAT</span> Fuß hebt, Hände hinter Oberschenkel. Ca. 1:15 pro Seite.<div class='cue'>„Der untere Fuß darf am Boden bleiben. Kein Ziehen am Bein ist nötig.“</div>"),
      P("50:30","Supine Twist","R: Knie links, Brustkorb rechts (1:15). L: spiegelverkehrt (1:15).<div class='cue'>„Der Boden trägt euch jetzt. Ihr müsst nichts mehr halten, was nicht gehalten werden muss.“</div>"),
    ]},
    {name:"REST", range:"53–60", start:3180, blocks:[
      P("53:00","Savasana","Beine/Arme bequem. Ca. 5–6 Minuten vollständige Ruhe. Letzte Minute: Atem vertiefen → Finger/Zehen → strecken → über die Seite zum Sitz.<div class='cue'>„Was heute erledigt wurde, ist erledigt. Was nicht erledigt wurde, darf bis morgen warten.“</div>"),
    ]},
  ],

energy: { label:"Energy", theme:"Du musst nicht müde sein, um ruhig zu sein.", color:"#a15c3e",
  memory:["BOUNCE","SWING","TWIST","WAVE","CIRCLE","SWAY","ENERGY FLOW","WARRIOR BALANCE","GODDESS","90/90","DRAGONFLY","SPHINX","BUTTERFLY","KNEES TO CHEST","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–12", start:0, blocks:[
      P("0:00","Arrive in Motion","Hüftbreiter Stand. Gewicht langsam R/L. Knie weich. Bewegung darf größer werden. Keine Atemvorgabe.<div class='cue'>„Stellt euch bequem hin. Füße ungefähr hüftbreit. Knie weich.“<br>„Wir fangen nicht mit einer Haltung an. Wir fangen einfach an, uns zu bewegen.“</div>"),
      P("1:30","Bounce","<span class='tag ground'>GROUND</span> Federn, Fersen lösen, Bodenkontakt bleibt. <span class='tag flight'>FLIGHT</span> Kleine Hops. Jederzeit wechseln.<div class='cue'>„Lasst die Fersen leicht federn.“<br>„Ihr könnt die Fersen am Boden lassen oder sie ein kleines Stück lösen.“<br>„Lasst das Federn langsam durch den ganzen Körper laufen.“<br>„Kiefer locker. Schultern locker. Hände locker.“<br>„Ihr müsst hier nichts erreichen. Wir bringen nur Bewegung in den Körper.“<br>„Heute suchen wir Energie nicht, indem wir uns anstrengen. Wir schauen erst einmal, was schon da ist.“</div>"),
      P("2:30","Arm Swings","Kreuzen → öffnen. Klein beginnen, zunehmend durch Brustkorb/Schultergürtel laufen lassen.<div class='cue'>„Lasst die Arme vor dem Körper kreuzen.“<br>„Und wieder weit öffnen.“<br>„Kreuzen. Öffnen.“<br>„Nicht nur die Arme. Lasst den Brustkorb langsam mitmachen.“<br>„Vielleicht wird die Bewegung etwas größer.“<br>„Vielleicht bleibt sie heute klein.“<br>„Beides funktioniert.“</div>"),
      P("3:30","Trunk Twist","Rumpf R/L, Arme locker. Keine maximale Rotation suchen.<div class='cue'>„Arme ganz locker.“<br>„Dreht den Oberkörper nach rechts und links.“<br>„Die Arme dürfen einfach hinterherfliegen.“<br>„Nicht maximal drehen.“<br>„Das Becken darf reagieren.“<br>„Der Blick folgt, wenn das für den Nacken angenehm ist.“<br>„Nicht kontrollieren. Bewegen.“</div>"),
      P("4:30","Body Waves","Knie → Becken → Wirbelsäule → Brust → Kopf. Mehrere Wellen.<div class='cue'>„Beugt die Knie ein wenig.“<br>„Schiebt das Becken nach vorne.“<br>„Dann rollt die Bewegung durch die Wirbelsäule.“<br>„Brustkorb. Schultern. Kopf zuletzt.“<br>„Und wieder von unten.“<br>„Knie. Becken. Wirbelsäule. Brust. Kopf.“<br>„Es muss nicht schön aussehen.“<br>„Sucht eine Welle, die sich für euren Körper gut anfühlt.“</div>"),
      P("5:30","Hip Circles","Große Kreise, beide Richtungen, Knie weich.<div class='cue'>„Große Kreise, volles Tempo. Die Knie bleiben trotzdem weich.“</div>"),
      P("6:30","Full Body Circles","Arme hoch, Oberkörper über eine Seite → weicher Fold → über die andere Seite auf. 2–3 Kreise, Richtungswechsel.<div class='cue'>„Arme nach oben.“<br>„Über die rechte Seite nach unten.“<br>„Durch einen weichen Fold.“<br>„Über links wieder nach oben.“<br>„Noch einmal.“<br>„Dann Richtungswechsel.“<br>„Die Knie bleiben weich.“<br>„Der Kreis muss nicht groß sein.“</div>"),
      P("7:30","Squat & Reach","Ein: Aufrichten, Arme hoch. Aus: Becken zurück, Knie beugen, Arme nach hinten. 6–8 Wiederholungen.<div class='cue'>„Das ist kein Squat-Test. Geht nur so tief, dass ihr anschließend genauso leicht wieder hochkommt.“</div>"),
      P("9:15","Dead Arms","Arme komplett locker lassen, aus dem Oberkörper heraus leicht hin und her schwingen. Die Arme dürfen dabei gegen Oberkörper und Rücken schlagen. Kein Krafteinsatz in den Armen selbst.<div class='cue'>„Lasst die Arme komplett schwer werden und hängen. Keine Kraft in den Armen – nur der Oberkörper bewegt sich, die Arme schwingen wie von selbst mit. Wer es etwas kräftiger mag, kann die Arme gegen Oberkörper und Rücken schlagen lassen.“</div>"),
      P("11:00","Side Sway","Breiter Stand, Gewicht R → Mitte → L. Knie leicht beugen. Keine maximale Side-Lunge.<div class='cue'>„Kommt in einen etwas breiteren Stand.“<br>„Gewicht nach rechts. Zur Mitte. Nach links.“<br>„Lasst die Arme mitgehen.“<br>„Kein Side Lunge. Wir bewegen nur Gewicht.“<br>„Vielleicht wird die Bewegung größer.“<br>„Und bevor wir in den Flow gehen: noch einmal rechts – Mitte – links.“<br>„Die Bewegung war bisher frei. Jetzt geben wir ihr eine Richtung.“</div>"),
    ]},
    {name:"FLOW", range:"12–27", start:720, blocks:[
      P("12:00","Round 1 — Learn · 5:30","Mountain → Reach → Fold → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → Warrior II L (Ground: kürzerer Stand / Reach: Arme horizontal) → Reverse Warrior L (kein Gewicht in die hintere Hand) → Warrior II → Side Angle L → Down Dog → Plank Wave (Ground: Knie am Boden / Float: kurze Plank) → Down Dog → Warrior II R → Reverse Warrior R → Side Angle R → Fold → Roll Up → Mountain.<div class='cue'>„Kommt nach vorne auf eure Matte.“<br>„Einatmen – Arme heben. Ausatmen – nach vorne falten.“<br>„Einatmen – halber Lift. Ausatmen – Fold.“<br>„Rechtes Bein zurück. Linkes Knie vorne: Low Lunge links.“<br>„Öffnet euch in Warrior II links.“<br>„Der Stand darf kürzer oder weiter sein. Findet euren Stand.“<br>„Arme öffnen. Einatmen – Reverse Warrior.“<br>„Die hintere Hand trägt kein Gewicht.“<br>„Ausatmen – zurück in Warrior II.“<br>„Unterarm Richtung Oberschenkel oder Hand Richtung Boden – Side Angle.“<br>„Hände zum Boden. Down Dog.“<br>„Von hier nach vorne in eure Plank Wave.“<br><span class='lbl'>Ground</span> „Die Knie können am Boden bleiben.“<br><span class='lbl'>Float</span> „Oder ihr nehmt kurz die Plank.“<br>„Brustkorb nach vorne. Becken zurück. Wieder Down Dog.“<br>Dann rechte Seite entsprechend vollständig.<br>„Lernt erst die Linie. Wir müssen noch nichts daraus machen.“</div>"),
      P("17:30","Round 2 — Build · 5:00","Identisch. Nach Side Angle: Warrior II → Gewicht vor. <span class='tag ground'>TOUCH</span> Zehen tippen neben Standfuß. <span class='tag flight'>FLOAT</span> Knie hebt vor/oben. Beide Seiten. Kein Knee-Drive-Hold.<div class='cue'>„Gleicher Weg. Diesmal kennt euer Körper die Richtung schon.“<br>„Reach. Fold. Half Lift. Lunge. Warrior II. Reverse. Warrior II. Side Angle. Down Dog. Plank Wave.“<br>„Zurück in Warrior II. Verlagert das Gewicht nach vorne.“<br><span class='lbl'>Touch</span> „Die Zehen tippen neben dem Standfuß.“<br><span class='lbl'>Float</span> „Oder das Knie löst sich nach vorne und oben.“<br>„Nur ein Moment. Und wieder zurück.“<br>„Jetzt darf Kraft dazukommen. Nicht Geschwindigkeit.“<br>„Energie bedeutet heute nicht: schneller. Energie bedeutet: bewusster.“</div>"),

    ["2","Warum JIN mit J?","JIN schlägt bewusst die Brücke zu JOGA – mit J wie Ja zu Bewegung. Bewegung ist kein Privileg junger, beweglicher oder sportlicher Menschen. Wir müssen keine bestimmte Form erreichen, unseren Körper nicht beherrschen – wir dürfen ihn benutzen, kennenlernen, erleben. Erst sagen wir Ja zur Bewegung, dann erlauben wir uns die Ruhe."],
    ["3","Was JIN Journey nicht ist","JIN Journey behauptet nicht, neue Asanas erfunden zu haben. Die Elemente stammen aus Yoga, Yin Yoga, Vinyasa, Mobility und freier Bewegung. Die Eigenständigkeit liegt in der Dramaturgie. JIN Journey ist deshalb nicht: erst Mobility → dann Vinyasa → dann Yin. Die Phasen gehen ineinander über – im Idealfall bemerkt niemand „jetzt beginnt Yin“, sondern nur: „Irgendwann bin ich einfach still geworden.“"],

    ["5","Die fünf Phasen","AWAKEN – bewege dich, keine klassische Aufwärmübung. FLOW – Bewegung bekommt Struktur, Atem und Rhythmus verbinden sich. EXPLORE – Positionen werden nicht eingenommen, sondern ihr Bewegungsraum wird untersucht; das methodische Herzstück. MELT – aktive Bewegung tritt zurück, Schwerkraft übernimmt. REST – keine neue Aufgabe, nur Integration."],
    ["6","Die Explore-Grammatik","Arrive (Position finden, Belastung wahrnehmen) → Move (Bewegungsraum untersuchen – kein einzelner Move, ein Container mit mehreren Bausteinen) → Reduce (schrittweise verkleinern) → Pause (vollständig beenden, beobachten) → Release (bewusst verlassen, entlasten)."],
    ["7","Optionsprinzip","Eine JIN-Option verändert die Erfahrung – sie bewertet sie nicht. Keine Labels wie „Anfänger“, „Best Ager“, „Low Impact“, „Advanced“. Stattdessen: Ground/Flight, Small Range/Open Range. Beim Figure Four: Ground (Fuß bleibt am Boden) / Float (Fuß hebt ab). Keine Variante gewinnt."],
    ["8","Age-inclusive Movement","JIN Journey ist ausdrücklich altersinklusiv, aber kein Seniorenyoga. Berücksichtigt werden Beweglichkeit, Balance, Gelenksensibilität, Kniebelastung, Handgelenksbelastung, Bodenwechsel, Kraft, Tagesform. Alter entscheidet nie automatisch über eine Variante – ein beweglicher 70-Jähriger braucht nicht automatisch weniger, ein unbeweglicher 30-Jähriger nicht automatisch mehr."],
    ["9","Gelenkregel","Keine belastete Gelenkposition wird unnötig lange beibehalten. Bewegung innerhalb derselben Position gilt nicht automatisch als Entlastung – vier Minuten Beckenkreisen im Dragon sind trotzdem vier Minuten Belastung auf demselben Knie. Explore muss bei Bedarf Belastungswechsel enthalten."],
    ["10","Stillness Rule","Eine statische Position dauert maximal drei Minuten – das ist eine Obergrenze, kein Ziel. 45 Sekunden können richtig sein, 90 Sekunden können richtig sein. Die Dramaturgie entscheidet, nicht ein Zeitplan."],
    ["11","Seitenkonvention","Stand/Lunge: nach dem vorderen Bein (rechtes Bein zurück → Low Lunge L). Sitz: nach dem Bein, zu dem die Haltung aufgebaut wird (Half Butterfly R = rechtes Bein lang). Deer R = rechtes Bein vorne, Unterschenkel diagonal vor dem Becken. Twist: nach der Rotationsrichtung des Brustkorbs, nicht nach der Knierichtung – Knie links + Brustkorb rechts = Supine Twist R."],

    ["13","Sprache","JIN-Sprache lädt ein, statt zu bewerten. Nicht „Geh tiefer“, sondern „Schau, ob dein Körper heute noch etwas Raum anbietet.“ Nicht „Zieh dich zum Bein“, sondern „Lass den Oberkörper schwerer werden.“ Nicht „Du solltest die Dehnung jetzt spüren“, sondern „Beobachte, wo dein Körper auf die Position reagiert.“ Zentraler Cue: „Mach die Bewegung langsam kleiner.“"],
    ["14","Morning & Evening","Morning: Die Aktivierung darf zunächst ansteigen, danach führt die Kurve über Explore Richtung Ruhe. Evening: Der Körper darf ebenfalls zunächst aktiviert werden, ohne hochgefahren zu werden – nach Flow nimmt die Aktivierung kontinuierlich ab."],

let state = { journey:"morning", mode:"study", flashIndex:0, flashFlipped:false,

// theme (dark/light), matches JOGA Strength toggle pattern
try {
  const savedTheme = localStorage.getItem("jin-theme");
  if(savedTheme){ document.documentElement.setAttribute("data-theme", savedTheme); }
} catch(e){}
function applyThemeBtn(){
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  document.getElementById("themeToggle").textContent = isDark ? "☀️" : "🌙";
}
document.getElementById("themeToggle").onclick=()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("jin-theme", next); } catch(e){}
  applyThemeBtn();
};
applyThemeBtn();

try {
  if(localStorage.getItem("jin-cuemode")==="long"){ document.body.classList.add("long-cues"); }
} catch(e){}
function applyCueBtn(){
  const isLong = document.body.classList.contains("long-cues");
  document.getElementById("cueToggle").textContent = isLong ? "Cues: Kurz" : "Cues: Lang";
}
document.getElementById("cueToggle").onclick=()=>{
  document.body.classList.toggle("long-cues");
  try { localStorage.setItem("jin-cuemode", document.body.classList.contains("long-cues") ? "long" : "short"); } catch(e){}
  applyCueBtn();
};
applyCueBtn();

});

});

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}

function render(){
  document.querySelectorAll(".jtab").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));
  document.querySelectorAll("nav.bottom button").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));
  document.querySelectorAll(".modebtn").forEach(b=> b.classList.toggle("active", b.dataset.mode===state.mode));

  const modebar = document.querySelector(".modebar");
  const themebar = document.querySelector(".themebar");
  const main = document.getElementById("main");
  const label = document.getElementById("journeyLabel");
  const themeText = document.getElementById("themeText");
  const memline = document.getElementById("memline");

  if(state.journey==="core"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Core 1.0";
    main.innerHTML="";
    renderCore(main);
    return;
  }
  if(state.journey==="builder"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Erstellen";
    main.innerHTML="";
    renderBuilder(main);
    return;
  }
  modebar.style.display="flex";
  themebar.style.display="block";

// ===================== CLASS BUILDER =====================
const PHASE_ORDER = ["AWAKEN","FLOW","EXPLORE","MELT","REST"];

function slugify(s){
  const base = (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
  return "custom_" + (base || String(Date.now()));
}
function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function nl2br(s){ return escapeHtml(s).split("\n").map(x=>x.trim()).filter(Boolean).join("<br>"); }
function parseDur(s){
  if(!s) return null;
  const m = String(s).trim().match(/^(\d+):([0-5]?\d)$/);
  if(!m) return null;
  return (+m[1])*60 + (+m[2]);
}
function secToTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}
function quoteLine(l){
  l = l.trim();
  if(!l) return "";
  if(!l.startsWith("\u201e")) l = "\u201e" + l;
  if(!l.endsWith("\u201c")) l = l + "\u201c";
  return l;
}

function loadCustomStore(){
  try { return JSON.parse(localStorage.getItem("jin-custom-journeys") || "{}"); } catch(e){ return {}; }
}
function saveCustomStore(store){
  try { localStorage.setItem("jin-custom-journeys", JSON.stringify(store)); } catch(e){}
}
function loadCustomJourneys(){
  const store = loadCustomStore();
  Object.keys(store).forEach(key=>{
    DATA[key] = compileJourney(store[key]);
  });
}

function emptyBlock(){
  return { title:"", dur:"", body:"", cueLong:"", isHold:false, explore:null, opts:null };
}
function newDraft(){
  return {
    key:null, label:"", theme:"", intention:"", color:"#e8601f", memory:[],
    phases: PHASE_ORDER.map(name=>({ name, blocks:[] })),
  };
}
let builderDraft = newDraft();
let builderEditingKey = null;

function compileJourney(draft){
  let cursor = 0;
  const phases = draft.phases.map(ph=>{
    const phaseStart = cursor;
    const blocks = ph.blocks.map(bl=>{
      const dur = parseDur(bl.dur) || 0;
      const time = secToTime(cursor);
      let bodyHtml = "";
      if(bl.explore){
        bodyHtml = ["arrive","move","reduce","pause","release"].map(k=>{
          const val = bl.explore[k];
          const lbl = k.charAt(0).toUpperCase()+k.slice(1);
          return val && val.trim() ? "<span class='lbl'>"+lbl+"</span> "+nl2br(val) : null;
        }).filter(Boolean).join("<br>");
      } else if(bl.opts && bl.opts.label1 && bl.opts.text1){
        bodyHtml = "<span class='tag ground'>"+escapeHtml(bl.opts.label1.toUpperCase())+"</span> "+nl2br(bl.opts.text1);
        if(bl.opts.label2 && bl.opts.text2){
          bodyHtml += "<br><span class='tag flight'>"+escapeHtml(bl.opts.label2.toUpperCase())+"</span> "+nl2br(bl.opts.text2);
        }
        if(bl.body && bl.body.trim()) bodyHtml += (bodyHtml?"<br>":"") + nl2br(bl.body);
      } else {
        bodyHtml = nl2br(bl.body);
      }
      if(bl.cueLong && bl.cueLong.trim()){
        const lines = bl.cueLong.split("\n").map(quoteLine).filter(Boolean);
        if(lines.length) bodyHtml += "<div class='cue'>" + lines.join("<br>") + "</div>";
      }
      cursor += dur;
      return { time, title: bl.title || "(ohne Titel)", body: bodyHtml };
    });
    const rangeStr = Math.floor(phaseStart/60) + "\u2013" + Math.floor(cursor/60);
    return { name: ph.name, range: rangeStr, start: phaseStart, blocks };
  });
  return {
    label: draft.label || "Neue Journey",
    theme: draft.theme || "",
    color: draft.color || "#e8601f",
    memory: draft.memory || [],
    phases,
  };
}

function validateJourney(draft){
  const items = [];
  if(!draft.label || !draft.label.trim()){
    items.push({level:"err", text:"Journey braucht einen Namen (Label)."});
  }
  let totalSec = 0;
  let anyBlocks = false;
  let holdIssues = [];
  draft.phases.forEach(ph=>{
    if(!ph.blocks.length){
      items.push({level:"warn", text: ph.name+": noch keine Moves."});
    } else { anyBlocks = true; }
    ph.blocks.forEach(bl=>{
      const dur = parseDur(bl.dur);
      if(bl.title && dur===null){
        items.push({level:"err", text: ph.name+" \u00b7 \"" + bl.title + "\": Dauer fehlt oder falsches Format (mm:ss)."});
      }
      if(dur) totalSec += dur;
      if(bl.isHold && dur && dur>180){
        holdIssues.push(ph.name+" \u00b7 "+bl.title);
      }
    });
    // R/L pairing heuristic
    const titles = ph.blocks.map(b=>b.title||"");
    titles.forEach(t=>{
      const m = t.match(/^(.*)\sR(\s\u00b7.*)?$/);
      if(m){
        const base = m[1];
        const hasL = titles.some(t2=> t2.startsWith(base+" L"));
        if(!hasL) items.push({level:"warn", text: ph.name+": \""+t+"\" hat keine erkennbare L-Seite (Seitenkonvention)."});
      }
    });
  });
  if(!anyBlocks){
    items.push({level:"err", text:"Noch keine Moves in der Journey."});
  }
  if(holdIssues.length){
    items.push({level:"err", text:"Stillness Rule verletzt (max. 3:00 pro Hold): " + holdIssues.join(", ")});
  }
  const totalOk = totalSec>=3570 && totalSec<=3630;
  items.push({
    level: totalOk ? "ok" : (totalSec>0 ? "warn" : "err"),
    text: "Gesamtzeit: " + secToTime(totalSec) + " (Ziel: 60:00)"
  });
  if(draft.phases.every(ph=>ph.blocks.length>0) && !holdIssues.length){
    items.push({level:"ok", text:"Alle 5 Phasen belegt, keine Stillness-Rule-Verletzung."});
  }
  const hasErr = items.some(i=>i.level==="err");
  return { items, canSave: !hasErr };
}

function renderValidationPanel(){
  const el = document.getElementById("bvalid");
  if(!el) return;
  const v = validateJourney(builderDraft);
  el.innerHTML = v.items.map(i=>{
    const dot = i.level==="ok" ? "\u2713" : i.level==="warn" ? "!" : "\u2715";
    return "<div class='vitem "+i.level+"'><span class='vdot'>"+dot+"</span><span>"+escapeHtml(i.text)+"</span></div>";
  }).join("");
  const saveBtn = document.getElementById("bsave");
  if(saveBtn) saveBtn.disabled = !v.canSave;
  return v;
}

    render();
  };
  wrap.querySelector("#bexport").onclick = ()=> exportDocx(builderDraft);
  wrap.querySelector("#bdelete").onclick = ()=>{
    if(!builderEditingKey){ builderDraft = newDraft(); render(); return; }
    if(!confirm("Diese Journey wirklich löschen?")) return;
    const store2 = loadCustomStore();
    delete store2[builderEditingKey];
    saveCustomStore(store2);
    delete DATA[builderEditingKey];
    builderEditingKey = null;
    builderDraft = newDraft();
    buildJourneyTabs();
    render();
  };

  renderValidationPanel();
}

function renderBlockCard(pIdx, bIdx, bl){
  const card = document.createElement("div");
  card.className = "bblock";
  const isExplore = builderDraft.phases[pIdx].name === "EXPLORE";
  card.innerHTML = `
    <div class="bblockhead">
      <span class="bt">Move ${bIdx+1}</span>
      <button class="bsmallbtn danger" data-removeblock="1">Entfernen</button>
    </div>
    <div class="brow">
      <div class="bfield" style="flex:2;"><label>Titel</label><input type="text" class="bi-title" value="${escapeHtml(bl.title)}" placeholder="z.B. Hip Circle R"></div>
      <div class="bfield" style="flex:1;"><label>Dauer (mm:ss)</label><input type="text" class="bi-dur" value="${escapeHtml(bl.dur)}" placeholder="1:30"></div>
    </div>
    <div class="bcheckrow"><label><input type="checkbox" class="bi-hold" ${bl.isHold?"checked":""}> Statischer Hold (Stillness Rule: max. 3:00)</label></div>
    ${isExplore ? `<div class="bcheckrow"><label><input type="checkbox" class="bi-explmode" ${bl.explore?"checked":""}> EXPLORE-Grammatik (Arrive/Move/Reduce/Pause/Release)</label></div>` : ""}
    <div class="bblockbody"></div>
    <div class="bfield"><label>Cue lang (eine Zeile = ein gesprochener Satz)</label><textarea class="bi-cue" placeholder="Ein Satz pro Zeile">${escapeHtml(bl.cueLong)}</textarea></div>
  `;

  const bodyWrap = card.querySelector(".bblockbody");
  function renderBody(){
    bodyWrap.innerHTML = "";
    if(bl.explore){
      const grid = document.createElement("div");
      grid.className = "bexplore-grid";
      ["arrive","move","reduce","pause","release"].forEach(k=>{
        const f = document.createElement("div");
        f.className = "bfield";
        f.innerHTML = "<label>"+k.charAt(0).toUpperCase()+k.slice(1)+"</label><textarea class='bi-expl' data-k='"+k+"'>"+escapeHtml(bl.explore[k]||"")+"</textarea>";
        grid.appendChild(f);
        f.querySelector("textarea").addEventListener("input", e=>{ bl.explore[k]=e.target.value; renderValidationPanel(); });
      });
      bodyWrap.appendChild(grid);
    } else {
      const optsField = document.createElement("div");
      optsField.className = "bsection";
      optsField.style.padding = "10px";
      optsField.innerHTML = `
        <div class="bcheckrow"><label><input type="checkbox" class="bi-optsmode" ${bl.opts?"checked":""}> Zwei Optionen (z.B. Ground/Flight)</label></div>
        <div class="bopts-fields" style="display:${bl.opts?"block":"none"}">
          <div class="brow">
            <div class="bfield"><label>Label 1</label><input type="text" class="bi-opt-l1" value="${escapeHtml(bl.opts&&bl.opts.label1||"")}" placeholder="GROUND"></div>
            <div class="bfield"><label>Text 1</label><input type="text" class="bi-opt-t1" value="${escapeHtml(bl.opts&&bl.opts.text1||"")}"></div>
          </div>
          <div class="brow">
            <div class="bfield"><label>Label 2</label><input type="text" class="bi-opt-l2" value="${escapeHtml(bl.opts&&bl.opts.label2||"")}" placeholder="FLIGHT"></div>
            <div class="bfield"><label>Text 2</label><input type="text" class="bi-opt-t2" value="${escapeHtml(bl.opts&&bl.opts.text2||"")}"></div>
          </div>
        </div>
        <div class="bfield"><label>Beschreibung</label><textarea class="bi-body" placeholder="Freitext, eine Zeile = eine Anweisung">${escapeHtml(bl.body)}</textarea></div>
      `;
      bodyWrap.appendChild(optsField);
      const optsCheck = optsField.querySelector(".bi-optsmode");
      const optsFields = optsField.querySelector(".bopts-fields");
      optsCheck.addEventListener("change", e=>{
        bl.opts = e.target.checked ? {label1:"",text1:"",label2:"",text2:""} : null;
        optsFields.style.display = bl.opts ? "block" : "none";
        renderValidationPanel();
      });
      ["l1","t1","l2","t2"].forEach((suf,i)=>{
        const cls = ".bi-opt-"+suf;
        const el = optsField.querySelector(cls);
        const key = ["label1","text1","label2","text2"][i];
        el.addEventListener("input", e=>{
          if(!bl.opts) bl.opts = {label1:"",text1:"",label2:"",text2:""};
          bl.opts[key] = e.target.value;
          renderValidationPanel();
        });
      });
      optsField.querySelector(".bi-body").addEventListener("input", e=>{ bl.body = e.target.value; renderValidationPanel(); });
    }
  }
  renderBody();

  card.querySelector(".bi-title").addEventListener("input", e=>{ bl.title = e.target.value; renderValidationPanel(); });
  card.querySelector(".bi-dur").addEventListener("input", e=>{ bl.dur = e.target.value; renderValidationPanel(); });
  card.querySelector(".bi-hold").addEventListener("change", e=>{ bl.isHold = e.target.checked; renderValidationPanel(); });
  card.querySelector(".bi-cue").addEventListener("input", e=>{ bl.cueLong = e.target.value; renderValidationPanel(); });
  const explToggle = card.querySelector(".bi-explmode");
  if(explToggle){
    explToggle.addEventListener("change", e=>{
      bl.explore = e.target.checked ? {arrive:"",move:"",reduce:"",pause:"",release:""} : null;
      bl.opts = null;
      renderBody();
    });
  }
  card.querySelector("[data-removeblock]").onclick = ()=>{
    builderDraft.phases[pIdx].blocks.splice(bIdx,1);
    render();
  };

  return card;
}

function buildJourneyTabs(){
  journeytabsEl.innerHTML = "";
  Object.keys(DATA).forEach(j=>{
    const b=document.createElement("button");
    b.className="jtab"; b.textContent=DATA[j].label; b.dataset.j=j;
    b.onclick=()=>{ state.journey=j; state.mode="study"; render(); };
    journeytabsEl.appendChild(b);
  });
}

// ---------- Word export ----------
function buildDocxParagraphs(draft){
  const D = window.docx;
  const ACCENT = (draft.color||"#e8601f").replace("#","").toUpperCase();
  const ch = [];
  const title = t => new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:120},
    children:[new D.TextRun({text:t, bold:true, size:56, color:ACCENT, font:"Georgia"})]});
  const subtitle = t => new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:60},
    children:[new D.TextRun({text:t, size:26, color:"555555", font:"Georgia", italics:true})]});
  const versionLine = t => new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:300},
    border:{bottom:{color:"B8A99A", space:8, style:D.BorderStyle.SINGLE, size:6}},
    children:[new D.TextRun({text:t, size:20, color:"888888"})]});
  const metaLine = (l,t) => new D.Paragraph({spacing:{after:40}, children:[
    new D.TextRun({text:l.toUpperCase()+"  ", bold:true, size:20, color:ACCENT}),
    new D.TextRun({text:t, size:22})]});
  const h1 = t => new D.Paragraph({heading:D.HeadingLevel.HEADING_1, spacing:{before:400, after:160},
    border:{bottom:{color:ACCENT, space:4, style:D.BorderStyle.SINGLE, size:8}},
    children:[new D.TextRun({text:t, bold:true, color:ACCENT, font:"Georgia"})]});
  const h3 = t => new D.Paragraph({heading:D.HeadingLevel.HEADING_3, spacing:{before:180, after:60},
    children:[new D.TextRun({text:t, bold:true, color:ACCENT})]});
  const p = (t,opts) => new D.Paragraph({spacing:{after:90}, children:[new D.TextRun({text:t, size:22, italics: !!(opts&&opts.italics)})]});
  const label = t => new D.Paragraph({spacing:{before:100, after:20}, children:[new D.TextRun({text:t.toUpperCase(), bold:true, size:20, color:ACCENT})]});
  const hr = () => new D.Paragraph({spacing:{before:200, after:200}, border:{bottom:{color:"B8A99A", space:1, style:D.BorderStyle.SINGLE, size:6}}, children:[new D.TextRun({text:""})]});
  const memoryLine = items => new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{before:200, after:200},
    shading:{type:D.ShadingType.CLEAR, fill:"F4EFE9"}, children:[new D.TextRun({text:items.join("  \u2192  "), bold:true, size:20, color:ACCENT})]});

  ch.push(title("JIN JOURNEY"));
  ch.push(subtitle(draft.label||"Neue Journey"));
  ch.push(versionLine("Custom Journey \u2014 erstellt mit dem JIN Journey Builder"));
  let totalSec = 0;
  draft.phases.forEach(ph=> ph.blocks.forEach(b=> totalSec += (parseDur(b.dur)||0)));
  ch.push(metaLine("Dauer", secToTime(totalSec)+" Min."));
  if(draft.theme) ch.push(metaLine("Thema", draft.theme));
  if(draft.intention) ch.push(metaLine("Intention", draft.intention));
  ch.push(hr());

  let cursor = 0;
  draft.phases.forEach(ph=>{
    const phaseStart = cursor;
    const phaseDur = ph.blocks.reduce((s,b)=> s+(parseDur(b.dur)||0), 0);
    ch.push(h1(Math.floor(phaseStart/60)+"\u2013"+Math.floor((phaseStart+phaseDur)/60)+" Min \u00b7 "+ph.name));
    ph.blocks.forEach(bl=>{
      const dur = parseDur(bl.dur)||0;
      const start = secToTime(cursor);
      const end = secToTime(cursor+dur);
      const holdSuffix = (bl.isHold && dur) ? "  ("+secToTime(dur)+" Min.)" : "";
      ch.push(h3(start+"\u2013"+end+" \u00b7 "+(bl.title||"(ohne Titel)")+holdSuffix));
      if(bl.explore){
        ["arrive","move","reduce","pause","release"].forEach(k=>{
          const val = bl.explore[k];
          if(val && val.trim()){
            ch.push(label(k.charAt(0).toUpperCase()+k.slice(1)));
            val.split("\n").filter(x=>x.trim()).forEach(line=> ch.push(p(line.trim())));
          }
        });
      } else {
        if(bl.opts && bl.opts.label1 && bl.opts.text1){
          ch.push(label(bl.opts.label1)); ch.push(p(bl.opts.text1));
          if(bl.opts.label2 && bl.opts.text2){ ch.push(label(bl.opts.label2)); ch.push(p(bl.opts.text2)); }
        }
        if(bl.body && bl.body.trim()) bl.body.split("\n").filter(x=>x.trim()).forEach(line=> ch.push(p(line.trim())));
      }
      if(bl.cueLong && bl.cueLong.trim()){
        bl.cueLong.split("\n").filter(x=>x.trim()).forEach(line=> ch.push(p(quoteLine(line), {italics:true})));
      }
      cursor += dur;
    });
  });

  if(draft.memory && draft.memory.length){
    ch.push(h1((draft.label||"Journey")+" \u2014 Memory Line"));
    ch.push(memoryLine(draft.memory));
  }
  return ch;
}

async function exportDocx(draft){
  if(!window.docx){
    alert("Die Word-Export-Bibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.");
    return;
  }
  const v = validateJourney(draft);
  if(!v.canSave && !confirm("Es gibt noch offene Punkte in der Prüfung. Trotzdem als Word-Dokument exportieren?")) return;
  try {
    const D = window.docx;
    const doc = new D.Document({ sections: [{
      properties: { page: { size:{width:11906, height:16838}, margin:{top:1080, bottom:1080, left:1200, right:1200} } },
      children: buildDocxParagraphs(draft),
    }]});
    const blob = await D.Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "JIN_Journey_" + (draft.label||"custom").replace(/[^a-z0-9]+/gi,"_") + ".docx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
  } catch(err){
    alert("Word-Export fehlgeschlagen: " + err.message);
  }
}

// ---------- Suggestions: offline library + AI ----------
function htmlToPlainLine(s){
  return (s||"")
    .replace(/<span class='lbl'>([^<]*)<\/span>\s*/g, "$1: ")
    .replace(/<span class='tag (?:ground|flight)'>([^<]*)<\/span>\s*/g, "$1: ")
    .replace(/<[^>]+>/g, "")
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .trim();
}
function splitBodyAndCue(html){
  const m = html.match(/<div class='cue'>([\s\S]*?)<\/div>/);
  let cueLines = [];
  let rest = html;
  if(m){
    cueLines = m[1].split(/<br\s*\/?>/).map(htmlToPlainLine).filter(Boolean);
    rest = html.replace(/<div class='cue'>[\s\S]*?<\/div>/, "");
  }
  return { rest, cueLines };
}
function htmlToDraftFields(html, phaseName){
  const { rest, cueLines } = splitBodyAndCue(html);
  const lines = rest.split(/<br\s*\/?>/).map(htmlToPlainLine).filter(Boolean);
  const plain = lines.join("\n");
  let explore = null;
  if(phaseName === "EXPLORE"){
    const keys = ["Arrive","Move","Reduce","Pause","Release"];
    if(keys.some(k=> plain.includes(k+": "))){
      explore = {arrive:"",move:"",reduce:"",pause:"",release:""};
      let current = null;
      lines.forEach(line=>{
        const found = keys.find(k=> line.startsWith(k+": "));
        if(found){ current = found.toLowerCase(); explore[current] = line.slice(found.length+2); }
        else if(current){ explore[current] += "\n" + line; }
      });
    }
  }
  return { body: explore ? "" : plain, explore, cueLong: cueLines.join("\n") };
}

let MOVE_LIBRARY = null;
function buildMoveLibrary(){
  if(MOVE_LIBRARY) return MOVE_LIBRARY;
  MOVE_LIBRARY = { AWAKEN:[], FLOW:[], EXPLORE:[], MELT:[], REST:[] };
  const sources = [["morning","Morning"], ["evening","Evening"], ["energy","Energy"]];
  sources.forEach(([key, srcLabel])=>{
    const j = DATA[key];
    if(!j) return;
    j.phases.forEach(ph=>{
      if(!MOVE_LIBRARY[ph.name]) return;
      ph.blocks.forEach((bl, i)=>{
        const nextStart = i+1 < ph.blocks.length ? parseTimeToSec(ph.blocks[i+1].time) : (ph.start + rangeEndSec(ph));
        const startSec = parseTimeToSec(bl.time);
        const dur = Math.max(0, nextStart - startSec);
        const fields = htmlToDraftFields(bl.body, ph.name);
        MOVE_LIBRARY[ph.name].push({
          title: bl.title, journeySource: srcLabel, duration: secToTime(dur||60),
          isHold: !!(fields.cueLong || dur<=180) && ph.name==="MELT",
          body: fields.body, explore: fields.explore, cueLong: fields.cueLong,
        });
      });
    });
  });
  return MOVE_LIBRARY;
}
function parseTimeToSec(t){
  const m = String(t||"0:00").match(/^(\d+):([0-5]?\d)/);
  return m ? (+m[1])*60 + (+m[2]) : 0;
}
function rangeEndSec(ph){
  const m = String(ph.range||"").match(/\u2013(\d+)$/);
  return m ? (+m[1])*60 - ph.start : 180;
}

function suggestionCardHtml(s, idx){
  const src = s.journeySource ? "<span class='ssrc'>"+escapeHtml(s.journeySource)+"</span>" : "";
  const preview = s.explore
    ? Object.entries(s.explore).filter(([k,v])=>v).map(([k,v])=> k+": "+v).join(" · ")
    : (s.body||"");
  return "<div class='scard'><span class='sdur'>"+escapeHtml(s.duration||"")+"</span>" +
    "<span class='stitle'>"+escapeHtml(s.title||"")+"</span>"+src+
    "<div class='sbody'>"+escapeHtml(preview)+"</div>" +
    "<button class='sapply' data-applyidx='"+idx+"'>Übernehmen</button></div>";
}

function openLibraryPanel(pIdx){
  const panel = document.getElementById("bsuggest-"+pIdx);
  const phaseName = builderDraft.phases[pIdx].name;
  const lib = buildMoveLibrary()[phaseName] || [];
  const show = panel.style.display !== "none" && panel.dataset.mode === "library";
  if(show){ panel.style.display = "none"; return; }
  panel.dataset.mode = "library";
  panel.style.display = "block";
  let items = lib;
  function draw(filter){
    const f = (filter||"").toLowerCase();
    const filtered = f ? items.filter(s=> s.title.toLowerCase().includes(f)) : items;
    panel.innerHTML = "<input class='sfilter' placeholder='Move suchen...' id='libfilter-"+pIdx+"'>" +
      filtered.map((s,i)=> suggestionCardHtml(s, i)).join("") +
      (filtered.length ? "" : "<div class='sstatus'>Keine Treffer.</div>");
    panel.querySelector(".sfilter").addEventListener("input", e=> draw(e.target.value));
    panel.querySelectorAll("[data-applyidx]").forEach(btn=>{
      btn.onclick = ()=>{ applySuggestion(pIdx, filtered[+btn.dataset.applyidx]); };
    });
  }
  draw("");
}

async function openAiPanel(pIdx){
  const panel = document.getElementById("bsuggest-"+pIdx);
  const already = panel.style.display !== "none" && panel.dataset.mode === "ai";
  if(already){ panel.style.display = "none"; return; }
  panel.dataset.mode = "ai";
  panel.style.display = "block";
  panel.innerHTML = "<div class='sstatus'>Lädt Vorschläge …</div>";
  const ph = builderDraft.phases[pIdx];
  const existingTitles = builderDraft.phases.flatMap(p=> p.blocks.map(b=>b.title)).filter(Boolean);
  const usedSec = ph.blocks.reduce((s,b)=> s+(parseDur(b.dur)||0), 0);
  try {
    const res = await fetch("/.netlify/functions/joga", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ type:"jin_move_suggestion", params:{
        phase: ph.name, journeyLabel: builderDraft.label||"Neue Journey", journeyTheme: builderDraft.theme,
        existingTitles, remainingTime: secToTime(Math.max(0,3600/5-usedSec)), provider:"claude"
      }})
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(!data.claude) throw new Error(data.claudeError || "Keine Antwort von der KI erhalten.");
    let parsed;
    try {
      const cleaned = data.claude.trim().replace(/^```json\s*/,"").replace(/```$/,"");
      parsed = JSON.parse(cleaned);
    } catch(e){ throw new Error("Antwort war kein gültiges JSON."); }
    const suggestions = parsed.suggestions || [];
    if(!suggestions.length){ panel.innerHTML = "<div class='sstatus'>Keine Vorschläge erhalten.</div>"; return; }
    panel.innerHTML = suggestions.map((s,i)=> suggestionCardHtml(s, i)).join("");
    panel.querySelectorAll("[data-applyidx]").forEach(btn=>{
      btn.onclick = ()=>{ applySuggestion(pIdx, suggestions[+btn.dataset.applyidx]); };
    });
  } catch(err){
    panel.innerHTML = "<div class='sstatus'>KI-Vorschlag fehlgeschlagen: " + escapeHtml(err.message) +
      ". Prüfe, ob die Netlify Function erreichbar ist und ein API-Key hinterlegt ist.</div>";
  }
}

function applySuggestion(pIdx, s){
  if(!s) return;
  const block = emptyBlock();
  block.title = s.title || "";
  block.dur = s.duration || "";
  block.isHold = !!s.isHold;
  block.cueLong = s.cueLong || "";
  if(s.explore && Object.values(s.explore).some(v=>v)){
    block.explore = { arrive:s.explore.arrive||"", move:s.explore.move||"", reduce:s.explore.reduce||"", pause:s.explore.pause||"", release:s.explore.release||"" };
  } else {
    block.body = s.body || "";
  }
  builderDraft.phases[pIdx].blocks.push(block);
  render();
}
