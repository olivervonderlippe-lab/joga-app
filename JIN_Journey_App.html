:root{ --accent:#e8601f; --accent-ink:#171512; }
  html[data-theme="dark"]{
    --bg:#171512; --card:#1c1a17; --line:#2a2622;
    --text:#f2eee6; --text-2:#c9c2b4; --text-3:#8a8070; --text-4:#5c564c;
    --ground-bg:#16221c; --ground-line:#2c4636; --ground:#8fc9a8;
    --flight-bg:#241c14; --flight-line:#3a2c1c; --flight:#c9a876;
  }
  html[data-theme="light"]{
    --bg:#faf6f0; --card:#ffffff; --line:#e8ded0;
    --text:#2a2420; --text-2:#4a443c; --text-3:#7a7166; --text-4:#a89486;
    --ground-bg:#eef7f1; --ground-line:#bfe0cc; --ground:#2f7a4d;
    --flight-bg:#fbf1e4; --flight-line:#eed9b8; --flight:#8a6a2f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:78px; transition:background .2s;}
  h1,h2,h3{font-family:'Inter',system-ui,sans-serif; font-weight:600; margin:0;}
  .wrap{max-width:520px; margin:0 auto; padding:0 16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 16px 0; border-bottom:1px solid var(--line);}
  header.top .brand{display:flex; align-items:flex-start; justify-content:space-between; max-width:520px; margin:0 auto; gap:8px; flex-wrap:wrap;}
  header.top .overline{font-size:10px; font-weight:700; color:var(--text-3); letter-spacing:2px; text-transform:uppercase;}
  header.top .brand h1{font-family:'Melvinsone',sans-serif; font-size:22px; font-weight:400; color:var(--accent); letter-spacing:0.5px; text-transform:none; line-height:1.15; margin-top:2px;}
  header.top .brand .right{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  header.top .brand span{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px;}
  .themebtn{font-size:11px; color:var(--text-3); background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:5px 9px; white-space:nowrap;}
  .themebtn#cueToggle{color:var(--accent); border-color:var(--accent); font-weight:700;}

  .journeytabs{display:flex; gap:6px; max-width:520px; margin:12px auto 0; overflow-x:auto;}
  .jtab{flex:1; text-align:center; padding:9px 4px; border-radius:10px 10px 0 0;
    font-size:12px; font-weight:600; color:var(--text-3); background:transparent;
    border:none; white-space:nowrap;}
  .jtab.active{background:var(--card); color:var(--accent);}

  .themebar{max-width:520px; margin:0 auto; padding:12px 16px; background:var(--card);
    border-radius:0 0 14px 14px; margin-bottom:10px; border:1px solid var(--line); border-top:none;}
  .themebar .theme{font-size:13px; font-style:italic; color:var(--text-2);}
  .memline{display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; -webkit-overflow-scrolling:touch;}
  .memline::-webkit-scrollbar{display:none;}
  .memchip{flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:0.4px;
    color:var(--accent); background:var(--bg); border:1px solid var(--line); padding:5px 10px; border-radius:20px;}

  .modebar{display:flex; gap:6px; max-width:520px; margin:0 auto 14px; padding:0 16px;}
  .modebtn{flex:1; padding:9px 0; font-size:13px; font-weight:600; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--text-2);}
  .modebtn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  main{max-width:520px; margin:0 auto; padding:0 16px 24px;}

  .phase{margin-bottom:18px;}
  .phasehead{display:flex; align-items:baseline; justify-content:space-between;
    padding:6px 2px; border-bottom:2px solid var(--accent); margin-bottom:8px;}
  .phasehead h2{font-family:'Melvinsone',sans-serif; font-weight:400; font-size:22px; color:var(--accent); letter-spacing:0.5px; text-transform:none;}
  .phasehead .range{font-size:11px; color:var(--text-3); font-weight:600;}

  .block{background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:8px; overflow:hidden;}
  .blockhead{display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; cursor:pointer;}
  .blockhead .bt{display:flex; flex-direction:column; gap:2px;}
  .blockhead .time{font-size:11px; color:var(--text-3); font-weight:700; letter-spacing:0.3px;}
  .blockhead .title{font-size:15px; font-weight:500; color:var(--text);}
  .chev{font-size:13px; color:var(--text-3); transition:transform .2s;}
  .block.open .chev{transform:rotate(180deg);}
  .blockbody{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .block.open .blockbody{max-height:800px;}
  .blockbody-in{padding:0 14px 14px; font-size:14px; line-height:1.55; color:var(--text-2);}
  .blockbody-in p{margin:0 0 8px;}
  .blockbody-in .lbl{font-size:11px; font-weight:700; color:var(--accent);
    letter-spacing:0.4px; margin:8px 0 3px;}
  .blockbody-in .cue{display:none; font-style:italic; color:var(--text-2); border-left:2px solid var(--accent);
    padding:2px 0 2px 10px; margin-top:10px; font-size:13.5px;}
  body.long-cues .blockbody-in .cue{display:block;}
  .nowcard .cue{display:none; font-style:italic; color:var(--text-2); border-left:2px solid var(--accent);
    padding:2px 0 2px 10px; margin-top:10px; font-size:13px;}
  body.long-cues .nowcard .cue{display:block;}
  .ytlink{display:inline-block; margin-top:10px; font-size:12px; font-weight:600; color:var(--accent); text-decoration:none;}
  .block.active{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);}

  /* flashcards */
  .cardstage{padding:10px 0 6px; text-align:center;}
  .progress{font-size:12px; color:var(--text-3); margin-bottom:10px;}
  .flash{background:var(--card); border:1px solid var(--line); border-radius:16px;
    min-height:220px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; margin-bottom:14px;}
  .flash .fmove{font-family:'Melvinsone',sans-serif; font-weight:400; font-size:30px; color:var(--accent); letter-spacing:0.5px;}
  .flash .fhint{font-size:12px; color:var(--text-3); margin-top:10px;}
  .flash .fanswer{font-size:14px; color:var(--text-2); line-height:1.6; margin-top:14px; display:none;}
  .flash.flipped .fanswer{display:block;}
  .flash.flipped .fhint{display:none;}
  .flashnav{display:flex; gap:10px;}
  .navbtn{flex:1; padding:12px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:14px; font-weight:500; color:var(--text);}
  .navbtn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}

  /* practice */
  .practice-hero{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; text-align:center; margin-bottom:14px;}
  .clock{font-family:'Melvinsone',sans-serif; font-weight:400; font-size:46px; color:var(--accent); font-variant-numeric:tabular-nums;}
  .clockphase{font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-3); margin-top:2px;}
  .bar{height:6px; background:var(--line); border-radius:4px; margin:14px 0; overflow:hidden;}
  .barfill{height:100%; background:var(--accent); width:0%; transition:width .3s linear;}
  .ctrls{display:flex; gap:10px;}
  .ctrls button{flex:1; padding:12px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:14px; font-weight:600; color:var(--text);}
  .ctrls button.go{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .nowcard{background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:14px; margin-bottom:14px;}
  .nowcard .lbl{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:0.4px; text-transform:uppercase;}
  .nowcard .title{font-size:17px; font-weight:600; margin:4px 0 6px; color:var(--text);}
  .nowcard .txt{font-size:14px; color:var(--text-2); line-height:1.5;}
  .minilist .miniblock{display:flex; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);
    font-size:13px; color:var(--text-2);}
  .minilist .miniblock.active{color:var(--accent); font-weight:600;}
  .minilist .miniblock .t{width:52px; flex:0 0 auto; color:var(--text-3); font-weight:600;}

  .tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.3px;
    padding:2px 7px; border-radius:6px; margin-right:5px; border:1px solid;}
  .tag.ground{background:var(--ground-bg); border-color:var(--ground-line); color:var(--ground);}
  .tag.flight{background:var(--flight-bg); border-color:var(--flight-line); color:var(--flight);}

  footer.corebox{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-top:6px;}
  footer.corebox h3{font-size:12px; color:var(--accent); margin-bottom:8px; letter-spacing:1px; text-transform:uppercase;}
  footer.corebox p{font-size:13px; color:var(--text-2); line-height:1.6; margin:0 0 8px;}
  footer.corebox .essence{font-size:12px; font-weight:600; color:var(--text); line-height:1.9;}

  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--line); display:flex; z-index:30;
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
  nav.bottom button{flex:1; background:none; border:none; padding:8px 0; font-size:11px;
    font-weight:600; color:var(--text-3);}
  nav.bottom button.active{color:var(--accent);}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div>
      <div class="overline">JOGAnichtYOGA</div>
      <h1>JIN Journey</h1>
    </div>
    <div class="right">
      <button class="themebtn" id="cueToggle" title="Cue-Länge umschalten">Cues: Lang</button>
      <button class="themebtn" id="themeToggle">☀️</button>
    </div>
  </div>
  <div class="journeytabs" id="journeytabs"></div>
  <span id="journeyLabel" style="display:none"></span>
</header>

<div class="themebar">
  <div class="theme" id="themeText"></div>
  <div class="memline" id="memline"></div>
</div>

<div class="modebar">
  <button class="modebtn" data-mode="study">Lernen</button>
  <button class="modebtn" data-mode="cards">Karten</button>
  <button class="modebtn" data-mode="practice">Übung</button>
</div>

<main id="main"></main>

<nav class="bottom" id="bottomnav">
  <button data-j="morning">Morning</button>
  <button data-j="evening">Evening</button>
  <button data-j="energy">Energy</button>
  <button data-j="core">Core 1.0</button>
</nav>

<script>
function P(time,title,body){return {time,title,body};}

const DATA = {
morning: { label:"Morning Rise", theme:"Raum schaffen", color:"#c98a4b",
  memory:["BOUNCE","SWING","TWIST","WAVE","SUN","DRAGON","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","PIKE","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–12", start:0, blocks:[
      P("0:00","Arrive","Hüftbreiter Stand. Knie weich. Gewicht verteilen. Schultern lösen. Atem wahrnehmen.<div class='cue'>„Guten Morgen. Wir starten heute nicht damit, besonders beweglich zu sein. Wir starten einfach damit, uns zu bewegen. Spürt kurz eure Füße. Lasst die Knie weich. Atmet einmal tief ein. Und lang wieder aus. Wir sagen heute einfach Ja zu Bewegung. Und schauen, wohin sie uns führt.“</div>"),
      P("1:30","Bounce","<span class='lbl'>Ground</span> Über Füße, Sprunggelenke und Knie federn. Fersen dürfen sich lösen, beide Füße behalten Bodenkontakt.<br><span class='lbl'>Flight</span> Aus dem Federn dürfen kleine Hops entstehen. Beide Qualitäten können jederzeit ineinander übergehen.<div class='cue'>„Gebt dem Körper ein bisschen Rhythmus. Noch kein Workout. Nur wach werden. Wer springen möchte, springt. Wer heute nicht springen möchte, bleibt bei den Fersen. Beides ist richtig.“</div>"),
      P("3:00","Arm Swings","Arme vor dem Körper kreuzen → öffnen. Klein beginnen. Bewegungsradius allmählich vergrößern. Arme schwingen, nicht aktiv in Endpositionen führen.<div class='cue'>„Nicht kontrollieren. Schwingen lassen.“</div>"),
      P("4:30","Trunk Twist","Rumpf R/L drehen. Arme locker mitführen. Gegenüberliegende Ferse darf lösen. Kopf folgt nur in angenehmem Radius.<div class='cue'>„Die Bewegung kommt aus der Mitte. Die Arme hängen einfach dran.“</div>"),
      P("6:00","Body Wave","Knie → Becken → untere Wirbelsäule → Brust → Kopf. Bewegungsrichtung umkehren. Mehrere kontinuierliche Wellen.<div class='cue'>„Keine perfekte Welle. Findet eure.“</div>"),
      P("7:30","Hip Circles","Becken vor → rechts → hinten → links. Mehrere Kreise. Richtungswechsel. Knie bleiben weich.<div class='cue'>„Stellt euch vor, euer Becken zeichnet einen Kreis um eure Füße.“</div>"),
      P("9:00","Squat & Reach","Ein: Aufrichten, Arme hoch. Aus: Becken zurück, Knie beugen, Arme nach hinten. 6–8 Wiederholungen.<div class='cue'>„Das ist kein Squat-Test. Geht nur so tief, dass ihr anschließend genauso leicht wieder hochkommt.“</div>"),
      P("10:30","Side Reach Flow","Abwechselnde Seitbeugen R/L. Arme lang. Knie weich. Kontinuierlich fließen. Radius zum Ende leicht reduzieren.<div class='cue'>„Der Radius darf jetzt schon kleiner werden. Ihr bereitet den Körper vor, nicht das Publikum.“</div>"),
    ]},
    {name:"FLOW", range:"12–24", start:720, blocks:[
      P("12:00","Round 1 — Learn","Mountain → Reach → Forward Fold (Knie weich) → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → rechtes Knie kurz ablegen → Brust öffnen → Hände absetzen → Vierfüßler → Cat/Cow 3× → Child's Pose → auf den Bauch → Sphinx (1–2 Atemzüge) → Vierfüßler → Down Dog → rechter Fuß nach vorne = Low Lunge R → linkes Knie kurz ablegen → Brust öffnen → Hände absetzen → linker Fuß nach vorne → Fold → Half Lift → Fold → Roll Up → Mountain.<div class='cue'>„Wir nehmen jetzt die freie Bewegung von eben mit in einen ersten Flow. Kein Tempo. Kein Wettbewerb. Der Atem gibt uns den Rhythmus.“</div>"),
      P("16:30","Round 2 — Flow","Identische Sequenz. Cat/Cow 2×. Übergänge weicher verbinden. Atem und Bewegung stärker verbinden. Lunges bleiben dynamisch.<div class='cue'>„Zweite Runde: Lasst die Übergänge ineinanderfließen. Die Form kennt ihr jetzt.“</div>"),
      P("20:30","Round 3 — Feel","Gleicher Bewegungsbogen. Cat/Cow 1×. Sphinx als fließender Übergang. Weniger technische Führung. Am Ende: Down Dog → Knie ablegen → Vierfüßler. Nicht mehr aufstehen.<div class='cue'>„Wir haben groß angefangen. Ab jetzt wird unsere Bewegung langsam näher zum Boden und etwas kleiner.“</div>"),
    ]},
    {name:"EXPLORE", range:"24–39", start:1440, blocks:[
      P("24:00","Dragon R","<span class='lbl'>Arrive</span> Aus Vierfüßler rechten Fuß zwischen die Hände. Linkes Knie zunächst am Boden.<br><span class='lbl'>Move</span> Rock: Becken 3–4× vor/zurück. Half-Split Rock: Becken zurück, rechtes Bein länger, wieder vor, 3–4×. Activate — Ground: linkes Knie am Boden. Float: linke Zehen auf, Knie wenige cm heben. Rotate: linke Hand innen am rechten Fuß, rechter Arm öffnet, 2–3×. Side Reach: Oberkörper auf, linker Arm hoch, Neigung rechts.<br><span class='lbl'>Reduce</span> Zurück zum Low Lunge, zwei Rocks → kleiner → minimal.<br><span class='lbl'>Pause</span> Ca. 15–20 Sek.<br><span class='lbl'>Release</span> Bein zurück, Vierfüßler, Knie entlasten.<div class='cue'>„Große Bewegung. Kleine Bewegung. Noch kleiner. Bis ihr nichts mehr verändern müsst.“</div>"),
      P("27:00","Dragon L","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release.<div class='cue'>„Spiegelverkehrt, gleiche Anweisung wie rechts. Was rechts richtig war, ist links nicht automatisch gleich – findet es neu.“</div>"),
      P("30:00","90/90 Hip Wave","<span class='lbl'>Arrive</span> Sitz, Knie auf, Füße etwas weiter als hüftbreit.<br><span class='lbl'>Move</span> Knie R/L pendeln, 6–8×. Auf einer Seite bleiben, Oberkörper zum vorderen Bein, leicht vor/zurück. Seitenwechsel. Wieder R/L fließen.<br><span class='lbl'>Reduce</span> Pendel kleiner.<br><span class='lbl'>Pause</span> Neutraler Sitz.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Nicht ziehen. Bewegen.“</div>"),
      P("34:30","Butterfly Wave","<span class='lbl'>Arrive</span> Fußsohlen zusammen.<br><span class='lbl'>Move</span> Ein: Wirbelsäule auf. Aus: nach vorne, 3×. Side Reach R/L. Rotation R/L. Erneut vor → auf → vor.<br><span class='lbl'>Reduce</span> Volle → halbe → minimale Welle.<br><span class='lbl'>Pause</span> Ca. 60–75 Sek.<br><span class='lbl'>Release</span> Hände an Knie, aktiv zusammenführen, Beine ausstrecken.<div class='cue'>„Und genau hier verändert sich unsere Journey. Am Anfang war Bewegung groß. Jetzt wird sie klein. Vielleicht bleibt irgendwann nur noch der Atem.“</div>"),
    ]},
    {name:"MELT", range:"39–55", start:2340, blocks:[
      P("39:00","Half Butterfly R · 2:30","Rechtes Bein lang. Linker Fuß zum inneren Oberschenkel. Oberkörper zum rechten Bein, nach vorne sinken. Knie darf weich sein.<div class='cue'>„Nicht zum Fuß. Einfach in Richtung Bein.“</div>"),
      P("41:30","Half Butterfly L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Die zweite Seite ist selten die gleiche Geschichte wie die erste.“</div>"),
      P("44:00","Deer R · 2:30","Rechtes Bein vor dem Becken, Knie gebeugt, Unterschenkel diagonal vor dem Körper. Linkes Bein seitlich/hinten. Keine erzwungenen 90°. Aufrecht oder sanft nach vorne.<div class='cue'>„Vorderes Bein trägt, hinteres Bein liegt. Kein Ziehen, kein Quadrat erzwingen.“</div>"),
      P("46:30","Deer L · 2:30","Spiegelverkehrt.<div class='cue'>„Spiegelverkehrt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("49:00","Pike / Caterpillar · 3:00","Beide Beine vorne. Knie weich möglich. Aufrichten, leicht aus dem Becken nach vorne, Oberkörper schwer werden lassen. Kein Ziehen zu den Füßen.<div class='cue'>„Die Haltung, auf die euer Körper die ganze Stunde vorbereitet wurde. Vielleicht sieht sie heute unspektakulär aus. Perfekt. Ihr müsst nichts erreichen.“</div>"),
      P("52:00","Supine Twist R · 1:30","Rückenlage. Knie anwinkeln, nach links sinken. Brustkorb rotiert nach rechts. Kopf neutral oder rechts.<div class='cue'>„Das Knie sinkt, der Brustkorb bleibt offen. Der Boden hält den Rest.“</div>"),
      P("53:30","Supine Twist L · 1:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Letzte Bewegung vor der Stille.“</div>"),
    ]},
    {name:"REST", range:"55–60", start:3300, blocks:[
      P("55:00","Savasana","Rückenlage. Arme/Beine bequem. Ca. vier Minuten vollständige Ruhe. Letzte Minute: Atem vertiefen → Finger/Zehen → strecken → über die Seite zum Sitz.<div class='cue'>„Wir haben mit Bewegung begonnen – groß, locker, unperfekt. Dann wurde sie kleiner. Bis keine Bewegung mehr nötig war.“</div>"),
    ]},
  ],
  cards:[
    {label:"BOUNCE", phase:"AWAKEN", time:"1:30", title:"Bounce", body:"Ground: über Füße/Sprunggelenke/Knie federn, Bodenkontakt bleibt. Flight: kleine Hops entstehen lassen."},
    {label:"SWING", phase:"AWAKEN", time:"3:00", title:"Arm Swings", body:"Arme kreuzen → öffnen. Klein beginnen, Radius allmählich vergrößern."},
    {label:"TWIST", phase:"AWAKEN", time:"4:30", title:"Trunk Twist", body:"Rumpf R/L drehen. Arme locker mitführen. Ferse darf lösen."},
    {label:"WAVE", phase:"AWAKEN", time:"6:00", title:"Body Wave", body:"Knie → Becken → Wirbelsäule → Brust → Kopf, dann umkehren."},
    {label:"SUN", phase:"FLOW", time:"12:00", title:"Soft Sun Flow", body:"Mountain → Fold → Low Lunge → Vierfüßler → Cat/Cow → Sphinx → Down Dog → andere Seite → Roll Up. Drei Runden: Learn → Flow → Feel."},
    {label:"DRAGON", phase:"EXPLORE", time:"24:00", title:"Dragon R/L", body:"Arrive im Low Lunge. Move: Rock → Half-Split Rock → Activate (Ground/Float) → Rotate → Side Reach. Reduce → Pause (15–20 Sek.) → Release."},
    {label:"90/90", phase:"EXPLORE", time:"30:00", title:"90/90 Hip Wave", body:"Knie R/L pendeln, auf einer Seite Oberkörper zum vorderen Bein orientieren. Reduce → Pause → Release."},
    {label:"BUTTERFLY", phase:"EXPLORE", time:"34:30", title:"Butterfly Wave", body:"Wellen vor/auf, Side Reach, Rotation. Volle → halbe → minimale Welle. Pause ca. 60–75 Sek."},
    {label:"HALF BUTTERFLY", phase:"MELT", time:"39:00", title:"Half Butterfly R/L · 2:30", body:"Langes Bein, anderer Fuß innen. Oberkörper zum langen Bein orientieren, Knie darf weich sein."},
    {label:"DEER", phase:"MELT", time:"44:00", title:"Deer R/L · 2:30", body:"Vorderes Bein gebeugt vor dem Becken, hinteres Bein seitlich. Keine erzwungenen 90°."},
    {label:"PIKE", phase:"MELT", time:"49:00", title:"Pike / Caterpillar · 3:00", body:"Beide Beine vorne, Knie weich möglich. Oberkörper schwer werden lassen, kein Ziehen."},
    {label:"TWIST", phase:"MELT", time:"52:00", title:"Supine Twist R/L · 1:30", body:"Knie zur einen Seite, Brustkorb rotiert zur anderen. Kopf neutral oder zur Rotation."},
    {label:"REST", phase:"REST", time:"55:00", title:"Savasana", body:"Ca. vier Minuten vollständige Ruhe, dann langsam über die Seite zum Sitz."},
  ]},

evening: { label:"Evening Unwind", theme:"Den Tag abgeben", color:"#5a7a8a",
  memory:["SHAKE","SWAY","WAVE","MOON","MELTING CAT","THREAD","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","FIGURE FOUR","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–10", start:0, blocks:[
      P("0:00","Shake & Arrive","Im Stand. Hände → Arme → Schultern → Beine locker ausschütteln. Gewicht verlagern. Bewegung allmählich ruhiger.<div class='cue'>„Bevor wir versuchen loszulassen, bewegen wir erst einmal das, was der Tag uns mitgebracht hat. Ihr müsst jetzt noch nicht ruhig sein.“</div>"),
      P("2:00","Shoulder Rolls → Arm Swings","Schultern langsam kreisen. Daraus lockere Armswings entwickeln.<div class='cue'>„Die Schultern zuerst, dann dürfen die Arme dazukommen. Nichts muss gleichzeitig passieren.“</div>"),
      P("3:30","Trunk Twist","Rumpf R/L. Arme schwer mitschwingen. Fersen dürfen reagieren.<div class='cue'>„Lasst die Arme schwer sein.“</div>"),
      P("5:00","Body Waves","Knie → Becken → Wirbelsäule → Brust → Kopf. Langsamer und weicher als Morning.<div class='cue'>„Der Tag steckt oft in der Wirbelsäule. Lasst die Welle ihn einfach rausschieben.“</div>"),
      P("6:30","Hip Circles","Große langsame Beckenkreise, beide Richtungen. Radius zum Ende reduzieren.<div class='cue'>„Langsamer als heute Morgen. Das Becken darf schwer sein, nicht spielerisch.“</div>"),

const CORE = {
  essence:[
    "Bewegung führt in die Ruhe.",
    "AWAKEN → FLOW → EXPLORE → MELT → REST",
    "Explore: Arrive → Move → Reduce → Pause → Release",
    "Bewegung: groß → fließend → explorativ → klein → still",
    "Optionen statt Hierarchie.",
    "Maximal drei Minuten Stillness.",
    "Belastung bewusst wechseln.",
    "Rest ist Praxis.",
  ],
  sections:[
    ["1","Die Idee","JIN Journey führt über Bewegung in die Ruhe – statt Ruhe vom Körper zu verlangen. Die Stunde beginnt nicht zwangsläufig still, sondern mit Bewegung: schwingen, drehen, kreisen, strecken, federn, fließen. Diese Bewegung verändert im Verlauf ihre Qualität – bewusster, fließender, explorativer, kleiner – bis schließlich keine Bewegung mehr notwendig ist."],
    ["2","Warum JIN mit J?","JIN schlägt bewusst die Brücke zu JOGA – mit J wie Ja zu Bewegung. Bewegung ist kein Privileg junger, beweglicher oder sportlicher Menschen. Wir müssen keine bestimmte Form erreichen, unseren Körper nicht beherrschen – wir dürfen ihn benutzen, kennenlernen, erleben. Erst sagen wir Ja zur Bewegung, dann erlauben wir uns die Ruhe."],
    ["3","Was JIN Journey nicht ist","JIN Journey behauptet nicht, neue Asanas erfunden zu haben. Die Elemente stammen aus Yoga, Yin Yoga, Vinyasa, Mobility und freier Bewegung. Die Eigenständigkeit liegt in der Dramaturgie. JIN Journey ist deshalb nicht: erst Mobility → dann Vinyasa → dann Yin. Die Phasen gehen ineinander über – im Idealfall bemerkt niemand „jetzt beginnt Yin“, sondern nur: „Irgendwann bin ich einfach still geworden.“"],
    ["4","Die drei Sprachebenen","Methodische Phasen (AWAKEN→FLOW→EXPLORE→MELT→REST) – damit werden Journeys entwickelt. Bewegungsqualität (groß→fließend→explorativ→klein→still) – beschreibt die Veränderung. Markenformel (MOVE. FLOW. MELT.) – verdichtet die Erfahrung kommunikativ. Unterrichtet wird immer nach den fünf Phasen, nicht nach der Markenformel."],
    ["5","Die fünf Phasen","AWAKEN – bewege dich, keine klassische Aufwärmübung. FLOW – Bewegung bekommt Struktur, Atem und Rhythmus verbinden sich. EXPLORE – Positionen werden nicht eingenommen, sondern ihr Bewegungsraum wird untersucht; das methodische Herzstück. MELT – aktive Bewegung tritt zurück, Schwerkraft übernimmt. REST – keine neue Aufgabe, nur Integration."],
    ["6","Die Explore-Grammatik","Arrive (Position finden, Belastung wahrnehmen) → Move (Bewegungsraum untersuchen – kein einzelner Move, ein Container mit mehreren Bausteinen) → Reduce (schrittweise verkleinern) → Pause (vollständig beenden, beobachten) → Release (bewusst verlassen, entlasten)."],
    ["7","Optionsprinzip","Eine JIN-Option verändert die Erfahrung – sie bewertet sie nicht. Keine Labels wie „Anfänger“, „Best Ager“, „Low Impact“, „Advanced“. Stattdessen: Ground/Flight, Small Range/Open Range. Beim Figure Four: Ground (Fuß bleibt am Boden) / Float (Fuß hebt ab). Keine Variante gewinnt."],
    ["8","Age-inclusive Movement","JIN Journey ist ausdrücklich altersinklusiv, aber kein Seniorenyoga. Berücksichtigt werden Beweglichkeit, Balance, Gelenksensibilität, Kniebelastung, Handgelenksbelastung, Bodenwechsel, Kraft, Tagesform. Alter entscheidet nie automatisch über eine Variante – ein beweglicher 70-Jähriger braucht nicht automatisch weniger, ein unbeweglicher 30-Jähriger nicht automatisch mehr."],
    ["9","Gelenkregel","Keine belastete Gelenkposition wird unnötig lange beibehalten. Bewegung innerhalb derselben Position gilt nicht automatisch als Entlastung – vier Minuten Beckenkreisen im Dragon sind trotzdem vier Minuten Belastung auf demselben Knie. Explore muss bei Bedarf Belastungswechsel enthalten."],
    ["10","Stillness Rule","Eine statische Position dauert maximal drei Minuten – das ist eine Obergrenze, kein Ziel. 45 Sekunden können richtig sein, 90 Sekunden können richtig sein. Die Dramaturgie entscheidet, nicht ein Zeitplan."],
    ["11","Seitenkonvention","Stand/Lunge: nach dem vorderen Bein (rechtes Bein zurück → Low Lunge L). Sitz: nach dem Bein, zu dem die Haltung aufgebaut wird (Half Butterfly R = rechtes Bein lang). Deer R = rechtes Bein vorne, Unterschenkel diagonal vor dem Becken. Twist: nach der Rotationsrichtung des Brustkorbs, nicht nach der Knierichtung – Knie links + Brustkorb rechts = Supine Twist R."],
    ["12","Pose-Namen ersetzen keine Anleitung","Ein Detailed Teacher Script nennt nicht nur „Deer R“, sondern beschreibt Ausgangsposition → Eintritt → Orientierung → Position → Austritt. Besonders wichtig bei Positionen, deren Namen zwischen Traditionen variieren."],
    ["13","Sprache","JIN-Sprache lädt ein, statt zu bewerten. Nicht „Geh tiefer“, sondern „Schau, ob dein Körper heute noch etwas Raum anbietet.“ Nicht „Zieh dich zum Bein“, sondern „Lass den Oberkörper schwerer werden.“ Nicht „Du solltest die Dehnung jetzt spüren“, sondern „Beobachte, wo dein Körper auf die Position reagiert.“ Zentraler Cue: „Mach die Bewegung langsam kleiner.“"],
    ["14","Morning & Evening","Morning: Die Aktivierung darf zunächst ansteigen, danach führt die Kurve über Explore Richtung Ruhe. Evening: Der Körper darf ebenfalls zunächst aktiviert werden, ohne hochgefahren zu werden – nach Flow nimmt die Aktivierung kontinuierlich ab."],
    ["15","Rest Rule","Rest ist Praxis, keine Restzeit. Bei Zeitverzug wird Rest nicht geopfert – reduziert werden vorher Move-Wiederholungen, einzelne Explore-Elemente, Pause-Zeiten oder Melt-Holds."],
    ["16","Hilfsmittel","Hilfsmittelfreiheit gehört nicht zum Core, sondern ist Venue-Parameter. Core = methodische DNA. Class Design = konkrete Journey. Venue Parameters = Raum, Hilfsmittel, Gruppengröße. JIN Journey kann mit oder ohne Block, Bolster, Gurt oder Decke unterrichtet werden."],
    ["17","Autonomie","Jede Journey ist vollständig eigenständig unterrichtbar. Keine Journey setzt die Kenntnis einer anderen voraus – Bewegungen werden vollständig beschrieben, auch wenn sie in anderen Journeys bereits vorkommen."],
    ["18","Dokumenthierarchie","1 Core (Methode) → 2 Journey Design (Dramaturgie/Ziel) → 3 Detailed Teacher Script (vollständige Anleitung) → 4 Teacher Quick Sheet (Gedächtnisstütze). Ein Quick Sheet darf seinem Detailed Teacher Script niemals widersprechen."],
  ],
};

// ---------- state ----------
let state = { journey:"morning", mode:"study", flashIndex:0, flashFlipped:false,
  timer:{running:false, elapsed:0, interval:null} };

// theme (dark/light), matches JOGA Strength toggle pattern
try {
  const savedTheme = localStorage.getItem("jin-theme");
  if(savedTheme){ document.documentElement.setAttribute("data-theme", savedTheme); }
} catch(e){}
function applyThemeBtn(){
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  document.getElementById("themeToggle").textContent = isDark ? "☀️" : "🌙";
}
document.getElementById("themeToggle").onclick=()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("jin-theme", next); } catch(e){}
  applyThemeBtn();
};
applyThemeBtn();

// cue length toggle: kurz (nur Instruktion) vs. lang (Instruktion + gesprochener Cue)
try {
  if(localStorage.getItem("jin-cuemode")==="long"){ document.body.classList.add("long-cues"); }
} catch(e){}
function applyCueBtn(){
  const isLong = document.body.classList.contains("long-cues");
  document.getElementById("cueToggle").textContent = isLong ? "Cues: Kurz" : "Cues: Lang";
}
document.getElementById("cueToggle").onclick=()=>{
  document.body.classList.toggle("long-cues");
  try { localStorage.setItem("jin-cuemode", document.body.classList.contains("long-cues") ? "long" : "short"); } catch(e){}
  applyCueBtn();
};
applyCueBtn();

const journeytabsEl = document.getElementById("journeytabs");
["morning","evening","energy"].forEach(j=>{
  const b=document.createElement("button");
  b.className="jtab"; b.textContent=DATA[j].label; b.dataset.j=j;
  b.onclick=()=>{ state.journey=j; state.mode="study"; render(); };
  journeytabsEl.appendChild(b);
});

document.querySelectorAll(".modebtn").forEach(b=>{
  b.onclick=()=>{ state.mode=b.dataset.mode; render(); };
});
document.querySelectorAll("nav.bottom button").forEach(b=>{
  b.onclick=()=>{ if(b.dataset.j==="core"){ state.journey="core"; } else { state.journey=b.dataset.j; if(state.mode==="_core") state.mode="study"; } render(); };
});

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}

function render(){
  document.querySelectorAll(".jtab").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));
  document.querySelectorAll("nav.bottom button").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));
  document.querySelectorAll(".modebtn").forEach(b=> b.classList.toggle("active", b.dataset.mode===state.mode));

  const modebar = document.querySelector(".modebar");
  const themebar = document.querySelector(".themebar");
  const main = document.getElementById("main");
  const label = document.getElementById("journeyLabel");
  const themeText = document.getElementById("themeText");
  const memline = document.getElementById("memline");

  if(state.journey==="core"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Core 1.0";
    main.innerHTML="";
    renderCore(main);
    return;
  }
  modebar.style.display="flex";
  themebar.style.display="block";
  const j = DATA[state.journey];
  label.textContent = j.label;
  themeText.textContent = "„" + j.theme + "“";
  memline.innerHTML = j.memory.map(m=>`<span class="memchip">${m}</span>`).join("");
  main.innerHTML="";

  if(state.mode==="study") renderStudy(main, j);
  if(state.mode==="cards") renderCards(main, j);
  if(state.mode==="practice") renderPractice(main, j);
}

function cleanMoveName(title){
  return title.replace(/·.*$/,"").replace(/\s*[RL]$/,"").replace(/\s*—.*$/,"").replace(/\s*\/.*$/,"").trim();
}

function ytLink(title){
  if(VIDEO_MAP[title]) return VIDEO_MAP[title];
  const q = encodeURIComponent("joganichtyoga " + cleanMoveName(title));
  return `https://www.youtube.com/results?search_query=${q}`;
}

function renderStudy(main, j){
  j.phases.forEach(ph=>{
    const sec = document.createElement("div"); sec.className="phase";
    sec.innerHTML = `<div class="phasehead"><h2>${ph.name}</h2><span class="range">${ph.range} Min.</span></div>`;
    const list = document.createElement("div");
    ph.blocks.forEach(bl=>{
      const card = document.createElement("div"); card.className="block";
      card.innerHTML = `
        <div class="blockhead">
          <div class="bt"><span class="time">${bl.time}</span><span class="title">${bl.title}</span></div>
          <span class="chev">⌄</span>
        </div>
        <div class="blockbody"><div class="blockbody-in"><p>${bl.body}</p>
          <a class="ytlink" href="${ytLink(bl.title)}" target="_blank" rel="noopener">▶ Video ansehen (Platzhalter)</a>
        </div></div>`;
      card.querySelector(".blockhead").onclick=()=> card.classList.toggle("open");
      list.appendChild(card);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  });
}

function parseTime(t){
  const parts = t.split(":").map(Number);
  return parts[0]*60 + (parts[1]||0);
}
function allBlocksFlat(j){
  const out=[];
  j.phases.forEach(ph=> ph.blocks.forEach(bl=> out.push({phase:ph.name, start:parseTime(bl.time), ...bl})));
  return out;
}

function renderCards(main, j){
  const items = j.cards;
  if(state.flashIndex>=items.length) state.flashIndex=0;
  const match = items[state.flashIndex];

  const stage = document.createElement("div"); stage.className="cardstage";
  stage.innerHTML = `
    <div class="progress">${state.flashIndex+1} / ${items.length}</div>
    <div class="flash ${state.flashFlipped?'flipped':''}" id="flashcard">
      <div class="fmove">${match.label}</div>
      <div class="fhint">Antippen für den Cue</div>
      <div class="fanswer"><b>${match.time} · ${match.phase} · ${match.title}</b><br>${match.body}</div>
    </div>
    <div class="flashnav">
      <button class="navbtn" id="fprev">‹ Zurück</button>
      <button class="navbtn primary" id="fflip">Umdrehen</button>
      <button class="navbtn" id="fnext">Weiter ›</button>
    </div>`;
  main.appendChild(stage);
  document.getElementById("flashcard").onclick=()=>{ state.flashFlipped=!state.flashFlipped; render(); };
  document.getElementById("fflip").onclick=(e)=>{ e.stopPropagation(); state.flashFlipped=!state.flashFlipped; render(); };
  document.getElementById("fprev").onclick=()=>{ state.flashIndex=(state.flashIndex-1+items.length)%items.length; state.flashFlipped=false; render(); };
  document.getElementById("fnext").onclick=()=>{ state.flashIndex=(state.flashIndex+1)%items.length; state.flashFlipped=false; render(); };
}

function renderPractice(main, j){
  const flat = allBlocksFlat(j);
  const total = 3600;
  const elapsed = state.timer.elapsed;
  let current = flat[0];
  for(const b of flat){ if(b.start<=elapsed) current=b; }

  const hero = document.createElement("div"); hero.className="practice-hero";
  hero.innerHTML = `
    <div class="clock">${fmt(elapsed)}</div>
    <div class="clockphase">${current.phase}</div>
    <div class="bar"><div class="barfill" style="width:${Math.min(100, elapsed/total*100)}%"></div></div>
    <div class="ctrls">
      <button id="ptoggle" class="go">${state.timer.running? "Pause":"Start"}</button>
      <button id="preset">Reset</button>
    </div>`;
  main.appendChild(hero);

  const now = document.createElement("div"); now.className="nowcard";
  now.innerHTML = `<div class="lbl">${current.time} · ${current.phase}</div><div class="title">${current.title}</div><div class="txt">${current.body}</div>`;
  main.appendChild(now);

  const mini = document.createElement("div"); mini.className="minilist";
  flat.forEach(b=>{
    const row=document.createElement("div");
    row.className="miniblock"+(b===current?" active":"");
    row.innerHTML=`<span class="t">${b.time}</span><span>${b.title}</span>`;
    row.onclick=()=>{ state.timer.elapsed=b.start; render(); };
    mini.appendChild(row);
  });
  main.appendChild(mini);

  document.getElementById("ptoggle").onclick=()=>{
    state.timer.running=!state.timer.running;
    if(state.timer.running){
      state.timer.interval=setInterval(()=>{
        state.timer.elapsed+=1;
        if(state.timer.elapsed>=total){ state.timer.elapsed=total; state.timer.running=false; clearInterval(state.timer.interval); }
        render();
      },1000);
    } else {
      clearInterval(state.timer.interval);
    }
    render();
  };
  document.getElementById("preset").onclick=()=>{
    state.timer.running=false; state.timer.elapsed=0; clearInterval(state.timer.interval); render();
  };
}

function renderCore(main){
  const box = document.createElement("div"); box.className="corebox";
  box.style.marginTop="16px";
  box.innerHTML = `<h3>Essence</h3>
    <div class="essence">${CORE.essence.join("<br>")}</div>`;
  main.appendChild(box);

  const sec = document.createElement("div"); sec.className="phase"; sec.style.marginTop="18px";
  sec.innerHTML = `<div class="phasehead"><h2>Method & Teacher Manual</h2><span class="range">18 Abschnitte</span></div>`;
  const list = document.createElement("div");
  CORE.sections.forEach(([num,title,body])=>{
    const card = document.createElement("div"); card.className="block";
    card.innerHTML = `
      <div class="blockhead">
        <div class="bt"><span class="time">${num}</span><span class="title">${title}</span></div>
        <span class="chev">⌄</span>
      </div>
      <div class="blockbody"><div class="blockbody-in"><p>${body}</p></div></div>`;
    card.querySelector(".blockhead").onclick=()=> card.classList.toggle("open");
    list.appendChild(card);
  });
  sec.appendChild(list);
  main.appendChild(sec);
}

render();
