:root{ --accent:#e8601f; --accent-ink:#171512; }
  html[data-theme="dark"]{
    --bg:#171512; --card:#1c1a17; --line:#2a2622;
    --text:#f2eee6; --text-2:#c9c2b4; --text-3:#8a8070; --text-4:#5c564c;
    --ground-bg:#16221c; --ground-line:#2c4636; --ground:#8fc9a8;
    --flight-bg:#241c14; --flight-line:#3a2c1c; --flight:#c9a876;
  }
  html[data-theme="light"]{
    --bg:#faf6f0; --card:#ffffff; --line:#e8ded0;
    --text:#2a2420; --text-2:#4a443c; --text-3:#7a7166; --text-4:#a89486;
    --ground-bg:#eef7f1; --ground-line:#bfe0cc; --ground:#2f7a4d;
    --flight-bg:#fbf1e4; --flight-line:#eed9b8; --flight:#8a6a2f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:78px; transition:background .2s;}
  h1,h2,h3{font-family:'Inter',system-ui,sans-serif; font-weight:600; margin:0;}
  .wrap{max-width:520px; margin:0 auto; padding:0 16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 16px 0; border-bottom:1px solid var(--line);}
  header.top .brand{display:flex; align-items:flex-start; justify-content:space-between; max-width:520px; margin:0 auto; gap:8px; flex-wrap:wrap;}
  header.top .overline{font-size:10px; font-weight:700; color:var(--text-3); letter-spacing:2px; text-transform:uppercase;}

<script>
function P(time,title,body){return {time,title,body};}

const DATA = {
morning: { label:"Morning Rise", theme:"Raum schaffen", color:"#c98a4b",
  memory:["BOUNCE","SWING","TWIST","WAVE","SUN","DRAGON","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","PIKE","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–12", start:0, blocks:[
      P("0:00","Arrive","Hüftbreiter Stand. Knie weich. Gewicht verteilen. Schultern lösen. Atem wahrnehmen.<div class='cue'>„Guten Morgen. Wir starten heute nicht damit, besonders beweglich zu sein. Wir starten einfach damit, uns zu bewegen. Spürt kurz eure Füße. Lasst die Knie weich. Atmet einmal tief ein. Und lang wieder aus. Wir sagen heute einfach Ja zu Bewegung. Und schauen, wohin sie uns führt.“</div>"),
      P("1:30","Bounce","<span class='lbl'>Ground</span> Über Füße, Sprunggelenke und Knie federn. Fersen dürfen sich lösen, beide Füße behalten Bodenkontakt.<br><span class='lbl'>Flight</span> Aus dem Federn dürfen kleine Hops entstehen. Beide Qualitäten können jederzeit ineinander übergehen.<div class='cue'>„Gebt dem Körper ein bisschen Rhythmus. Noch kein Workout. Nur wach werden. Wer springen möchte, springt. Wer heute nicht springen möchte, bleibt bei den Fersen. Beides ist richtig.“</div>"),
      P("2:30","Arm Swings","Arme vor dem Körper kreuzen → öffnen. Klein beginnen. Bewegungsradius allmählich vergrößern. Arme schwingen, nicht aktiv in Endpositionen führen.<div class='cue'>„Lasst die Arme vor dem Körper kreuzen.“<br>„Und wieder öffnen, weit zur Seite.“<br>„Kreuzen. Öffnen.“<br>„Fangt klein an. Der Radius darf langsam größer werden.“<br>„Nicht kontrollieren. Schwingen lassen.“<br>„Die Arme dürfen einfach mitfliegen.“</div>"),
      P("3:30","Trunk Twist","Rumpf R/L drehen. Arme locker mitführen. Gegenüberliegende Ferse darf lösen. Kopf folgt nur in angenehmem Radius.<div class='cue'>„Dreht den Oberkörper sanft nach rechts. Und nach links.“<br>„Die Arme bleiben locker, sie hängen einfach mit.“<br>„Die Bewegung kommt aus der Mitte. Die Arme hängen einfach dran.“<br>„Die Ferse darf sich lösen, wenn das für euch stimmt.“<br>„Nicht maximal drehen. Einfach drehen.“</div>"),
      P("4:30","Body Wave","Knie → Becken → untere Wirbelsäule → Brust → Kopf. Bewegungsrichtung umkehren. Mehrere kontinuierliche Wellen.<div class='cue'>„Beugt die Knie ein wenig.“<br>„Schiebt das Becken sanft nach vorne.“<br>„Lasst die Welle durch die Wirbelsäule laufen – Becken, Wirbelsäule, Brust, Kopf zuletzt.“<br>„Und noch einmal von unten.“<br>„Keine perfekte Welle. Findet eure.“</div>"),
      P("5:30","Hip Circles","Becken vor → rechts → hinten → links. Mehrere Kreise. Richtungswechsel. Knie bleiben weich.<div class='cue'>„Becken nach vorne, nach rechts, nach hinten, nach links – ein großer Kreis.“<br>„Stellt euch vor, euer Becken zeichnet einen Kreis um eure Füße.“<br>„Ein paar Kreise, dann Richtung wechseln.“<br>„Die Knie bleiben weich, während ihr kreist.“</div>"),
      P("6:30","Squat & Reach","Ein: Aufrichten, Arme hoch. Aus: Becken zurück, Knie beugen, Arme nach hinten. 6–8 Wiederholungen.<div class='cue'>„Das ist kein Squat-Test. Geht nur so tief, dass ihr anschließend genauso leicht wieder hochkommt.“</div>"),
      P("7:30","Reach & Open","Beide Arme seitlich weit nach oben öffnen, ganz strecken, kurz halten. Dann Arme sinken lassen, mit dem Ausatmen. 4–6 Wiederholungen.<div class='cue'>„Öffnet beide Arme weit zur Seite und nach oben. Macht euch groß, schafft Raum um euch herum.“<br>„Kurz halten – dann lasst alles wieder sinken, mit dem Ausatmen.“<br>„Noch einmal: Arme öffnen, Raum schaffen. Und loslassen.“<br>„Genau darum geht's heute Morgen: nicht enger werden, sondern Platz schaffen für den Tag, der kommt.“</div>"),
      P("9:15","March mit Hände-Clap","Auf der Stelle marschieren, Knie abwechselnd anheben. Bei jedem angehobenen Knie die Hände kurz darüber zusammenklatschen.<div class='cue'>„Marschiert locker auf der Stelle. Immer wenn ihr ein Knie hebt, führt ihr die Hände von außen zum Knie. Ihr bestimmt eure Geschwindigkeit. Es ist kein Rennen – die Koordination darf ruhig etwas holprig sein.“</div>"),
      P("11:00","Side Reach Flow","Abwechselnde Seitbeugen R/L. Arme lang. Knie weich. Kontinuierlich fließen. Radius zum Ende leicht reduzieren.<div class='cue'>„Der Radius darf jetzt schon kleiner werden. Ihr bereitet den Körper vor, nicht das Publikum.“</div>"),
    ]},
    {name:"FLOW", range:"12–24", start:720, blocks:[
      P("12:00","Round 1 — Learn","Mountain → Reach → Forward Fold (Knie weich) → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → rechtes Knie kurz ablegen → Brust öffnen → Hände absetzen → Vierfüßler → Cat/Cow 3× → Down Dog → rechter Fuß nach vorne = Low Lunge R → linkes Knie kurz ablegen → Brust öffnen → Hände absetzen → linker Fuß nach vorne → Fold → Half Lift → Fold → Roll Up → Mountain.<div class='cue'>„Kommt nach vorne auf eure Matte, in den Stand.“<br>„Einatmen – Arme heben, lang nach oben. Schafft euch Raum, bevor der Tag ihn füllt.“<br>„Ausatmen – nach vorne falten. Knie bleiben weich.“<br>„Einatmen – halber Lift, Rücken lang.“<br>„Ausatmen – wieder Fold.“<br>„Rechtes Bein weit nach hinten: Low Lunge links.“<br>„Rechtes Knie sinkt sanft zum Boden.“<br>„Brustkorb öffnet sich, kurz nach oben schauen, wenn das gut tut.“<br>„Hände zum Boden. Vierfüßler.“<br>„Cat/Cow, drei Mal – rund, dann lang.“<br>„Hände schieben, Hüfte hoch: Down Dog.“<br>„Rechter Fuß nach vorne, zwischen die Hände: Low Lunge rechts.“<br>„Linkes Knie sinkt sanft zum Boden.“<br>„Brustkorb öffnet sich.“<br>„Linker Fuß kommt dazu. Fold.“<br>„Einatmen – halber Lift. Ausatmen – Fold.“<br>„Roll Up, Wirbel für Wirbel. Mountain.“<br>„Wir nehmen jetzt die freie Bewegung von eben mit in einen ersten Flow. Kein Tempo. Kein Wettbewerb. Der Atem gibt uns den Rhythmus.“</div>"),
      P("16:30","Round 2 — Flow","Identische Sequenz. Cat/Cow 2×. Übergänge weicher verbinden. Atem und Bewegung stärker verbinden. Lunges bleiben dynamisch.<div class='cue'>„Gleicher Weg, diesmal fließender.“<br>„Reach, Fold, Half Lift, Fold, Low Lunge links, Vierfüßler, Cat/Cow zweimal, Down Dog, Low Lunge rechts, Fold, Roll Up, Mountain.“<br>„Zweite Runde: Lasst die Übergänge ineinanderfließen. Die Form kennt ihr jetzt.“</div>"),
      P("20:30","Round 3 — Feel","Gleicher Bewegungsbogen. Cat/Cow 1×. Weniger technische Führung. Kurzer Moment des Wahrnehmens der Gruppe (optional). Am Ende: Down Dog → Knie ablegen → Vierfüßler. Nicht mehr aufstehen.<div class='cue'>„Wir haben groß angefangen. Vielleicht bemerkt ihr kurz die anderen im Raum, die heute mit euch angefangen haben. Ab jetzt wird unsere Bewegung langsam näher zum Boden und etwas kleiner.“</div>"),
    ]},
    {name:"EXPLORE", range:"24–39", start:1440, blocks:[
      P("24:00","Dragon R","<span class='lbl'>Arrive</span> Aus Vierfüßler rechten Fuß zwischen die Hände. Linkes Knie zunächst am Boden.<br><span class='lbl'>Move</span> Rock: Becken 3–4× vor/zurück. Half-Split Rock: Becken zurück, rechtes Bein länger, wieder vor, 3–4×. Activate — <span class='tag ground'>GROUND</span> linkes Knie am Boden. <span class='tag flight'>FLOAT</span> linke Zehen auf, Knie wenige cm heben. Rotate: linke Hand innen am rechten Fuß, rechter Arm öffnet, 2–3×. Side Reach: Oberkörper auf, linker Arm hoch, Neigung rechts.<br><span class='lbl'>Reduce</span> Zurück zum Low Lunge, zwei Rocks → kleiner → minimal.<br><span class='lbl'>Pause</span> Ca. 15–20 Sek.<br><span class='lbl'>Release</span> Bein zurück, Vierfüßler, Knie entlasten.<div class='cue'>„Rock, dann Half-Split Rock – findet euer Tempo.“<br><span class='lbl'>Ground</span> „Das linke Knie bleibt am Boden.“<br><span class='lbl'>Float</span> „Oder die linken Zehen kommen auf, das Knie hebt ein paar Zentimeter.“<br>„Große Bewegung. Kleine Bewegung. Noch kleiner. Bis ihr nichts mehr verändern müsst.“</div>"),
      P("27:00","Dragon L","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release.<div class='cue'>„Spiegelverkehrt, gleiche Anweisung wie rechts. Was rechts richtig war, ist links nicht automatisch gleich – findet es neu.“</div>"),
      P("30:00","90/90 Hip Wave","<span class='lbl'>Arrive</span> Sitz, Knie auf, Füße etwas weiter als hüftbreit.<br><span class='lbl'>Move</span> Knie R/L pendeln, 6–8×. Auf einer Seite bleiben, Oberkörper zum vorderen Bein, leicht vor/zurück. Seitenwechsel. Wieder R/L fließen.<br><span class='lbl'>Reduce</span> Pendel kleiner.<br><span class='lbl'>Pause</span> Neutraler Sitz.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Nicht ziehen. Bewegen.“</div>"),
      P("34:30","Butterfly Wave","<span class='lbl'>Arrive</span> Fußsohlen zusammen.<br><span class='lbl'>Move</span> Ein: Wirbelsäule auf. Aus: nach vorne, 3×. Side Reach R/L. Rotation R/L. Erneut vor → auf → vor.<br><span class='lbl'>Reduce</span> Volle → halbe → minimale Welle.<br><span class='lbl'>Pause</span> Ca. 60–75 Sek.<br><span class='lbl'>Release</span> Hände an Knie, aktiv zusammenführen, Beine ausstrecken.<div class='cue'>„Und genau hier verändert sich unsere Journey. Am Anfang war Bewegung groß. Jetzt wird sie klein. Vielleicht bleibt irgendwann nur noch der Atem.“</div>"),
    ]},
    {name:"MELT", range:"39–55", start:2340, blocks:[
      P("39:00","Half Butterfly R · 2:00","Rechtes Bein lang. Linker Fuß zum inneren Oberschenkel. Oberkörper zum rechten Bein, nach vorne sinken. Knie darf weich sein.<div class='cue'>„Nicht zum Fuß. Einfach in Richtung Bein.“</div>"),
      P("41:00","Half Butterfly L · 2:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Die zweite Seite ist selten die gleiche Geschichte wie die erste.“</div>"),
      P("43:00","Deer R · 2:00","Rechtes Bein vor dem Becken, Knie gebeugt, Unterschenkel diagonal vor dem Körper. Linkes Bein seitlich/hinten. Keine erzwungenen 90°. Aufrecht oder sanft nach vorne.<div class='cue'>„Vorderes Bein trägt, hinteres Bein liegt. Kein Ziehen, kein Quadrat erzwingen.“</div>"),
      P("45:00","Deer L · 2:00","Spiegelverkehrt.<div class='cue'>„Spiegelverkehrt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("47:00","Sphinx · 2:00","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Unterer Rücken behält Raum.<div class='cue'>„Kommt langsam in die Bauchlage. Unterarme zum Boden.“<br>„Je weiter die Ellbogen nach vorne wandern, desto kleiner wird die Rückbeuge.“<br>„Die Unterarme tragen euch, nicht die untere Wirbelsäule.“<br>„Nach so viel Falten heute: hier darf sich der Oberkörper einmal öffnen, bevor wir noch einmal nach vorne gehen.“</div>"),
      P("49:00","Pike / Caterpillar · 3:00","Beide Beine vorne. <span class='tag ground'>GROUND</span> Knie deutlich gebeugt, Oberkörper sinkt leicht. <span class='tag flight'>FLIGHT</span> Beine gestreckt, wenn die Rückseite das zulässt. Aufrichten, leicht aus dem Becken nach vorne, Oberkörper schwer werden lassen. Kein Ziehen zu den Füßen.<div class='cue'>„Die Haltung, auf die euer Körper die ganze Stunde vorbereitet wurde.“<br><span class='lbl'>Ground</span> „Die Knie dürfen deutlich gebeugt bleiben.“<br><span class='lbl'>Flight</span> „Oder die Beine strecken sich, wenn die Rückseite das zulässt.“<br>„Vielleicht sieht sie heute unspektakulär aus. Perfekt.“</div>"),
      P("52:00","Supine Twist R · 1:30","Rückenlage. Knie anwinkeln, nach links sinken. Brustkorb rotiert nach rechts. Kopf neutral oder rechts.<div class='cue'>„Das Knie sinkt, der Brustkorb bleibt offen. Der Boden hält den Rest.“</div>"),
      P("53:30","Supine Twist L · 1:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Letzte Bewegung vor der Stille.“</div>"),
    ]},
    {name:"REST", range:"55–60", start:3300, blocks:[
      P("55:00","Savasana","Rückenlage. Arme/Beine bequem. Ca. vier Minuten vollständige Ruhe. Letzte Minute: Atem vertiefen → Finger/Zehen → strecken → über die Seite zum Sitz.<div class='cue'>„Wir haben mit Bewegung begonnen – groß, locker, unperfekt. Dann wurde sie kleiner. Bis keine Bewegung mehr nötig war.“</div>"),
    ]},
  ],

evening: { label:"Evening Unwind", theme:"Den Tag abgeben", color:"#5a7a8a",
  memory:["SHAKE","SWAY","WAVE","MOON","MELTING CAT","THREAD","90/90","BUTTERFLY","HALF BUTTERFLY","DEER","FIGURE FOUR","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–10", start:0, blocks:[
      P("0:00","Shake & Arrive","Im Stand. Hände → Arme → Schultern → Beine locker ausschütteln. Gewicht verlagern. Bewegung allmählich ruhiger.<div class='cue'>„Bevor wir versuchen loszulassen, bewegen wir erst einmal das, was der Tag uns mitgebracht hat. Ihr müsst jetzt noch nicht ruhig sein.“</div>"),
      P("2:00","Shoulder Rolls → Arm Swings","Schultern langsam kreisen. Daraus lockere Armswings entwickeln.<div class='cue'>„Die Schultern zuerst, dann dürfen die Arme dazukommen. Nichts muss gleichzeitig passieren.“</div>"),
      P("3:00","Trunk Twist","Rumpf R/L. Arme schwer mitschwingen. Fersen dürfen reagieren.<div class='cue'>„Lasst die Arme schwer sein.“</div>"),
      P("4:00","Body Waves","Knie → Becken → Wirbelsäule → Brust → Kopf. Langsamer und weicher als Morning.<div class='cue'>„Der Tag steckt oft in der Wirbelsäule. Lasst die Welle ihn einfach rausschieben.“</div>"),
      P("5:00","Hip Circles","Große langsame Beckenkreise, beide Richtungen. Radius zum Ende reduzieren.<div class='cue'>„Langsamer als heute Morgen. Das Becken darf schwer sein, nicht spielerisch.“</div>"),
      P("6:00","QiGong Kreisen","Arme in einem großen Kreis über außen nach oben kreisen. Dann die Hände mit den Handflächen vor dem Körper bis zur Körpermitte nach unten führen. Dabei leicht in die Knie gehen.<div class='cue'>„Führt die Arme in einem weiten Kreis über außen nach oben. Dabei führt ihr die Hände mit den Handflächen nach unten bis zur Körpermitte. Dabei geht ihr leicht in die Knie. Die Hände weiter nach unten durchführen und dann wieder über außen nach oben bringen.“</div>"),
      P("7:00","QiGong Kreisen — umgekehrt","Arme von oben über außen vor den Bauch führen, dabei leicht in den Squat gehen. Die Hände vor dem Körper mit den Handflächen nach oben zeigend langsam nach oben führen.<div class='cue'>„Diesmal andersherum: Arme von oben über außen vor den Bauch bringen. Dabei geht ihr ganz leicht in einen Squat. Dann führt ihr die Hände vor dem Körper mit den Handflächen wieder nach oben, streckt dabei die Beine.“</div>"),
      P("8:00","Side-to-Side Sway","Gewicht R/L. Arme frei mitfließen. Zunehmend weicher und kleiner.<div class='cue'>„Wir hören nicht plötzlich auf, uns zu bewegen. Wir lassen die Bewegung nur langsam ruhiger werden.“</div>"),
    ]},
    {name:"FLOW", range:"10–20", start:600, blocks:[
      P("10:00","Moon Flow 1","Mountain → Reach → Crescent Side Bend R → Mitte → L → Mitte → Standing Twist R/L → Fold → Half Lift → Fold → rechtes Bein zurück = Low Lunge L → Knie ablegen → <b>Evening Low Crescent</b> (Arme seitlich bis Schulterhöhe/weiches V, 2–3×, keine Überkopfhaltung) → rechte Hand innen, Brustkorb links → Vierfüßler → Cat/Cow 3× → Down Dog → rechter Fuß vor = Low Lunge R → Evening Low Crescent 2–3× → linke Hand innen, Brustkorb rechts → Fold → Roll Up → Mountain.<div class='cue'>„Kommt nach vorne auf eure Matte, in den Stand.“<br>„Einatmen – Arme heben, lang nach oben.“<br>„Neigt euch sanft nach rechts – Crescent Side Bend.“<br>„Zurück zur Mitte. Und nach links.“<br>„Zurück zur Mitte.“<br>„Dreht den Oberkörper sanft nach rechts, Arme schwingen locker mit. Und nach links.“<br>„Ausatmen – nach vorne falten.“<br>„Einatmen – halber Lift, Rücken lang.“<br>„Ausatmen – wieder Fold.“<br>„Rechtes Bein weit nach hinten, Knie sinkt ab: Low Lunge links.“<br>„Arme seitlich bis Schulterhöhe öffnen, ein weiches V – Evening Low Crescent. Keine Überkopfhaltung heute Abend.“<br>„Zwei, drei Mal, in eurem eigenen Tempo.“<br>„Rechte Hand innen neben dem Fuß, Brustkorb öffnet sich nach links.“<br>„Hände zum Boden. Vierfüßler.“<br>„Cat/Cow, drei Mal – Wirbelsäule rund, dann lang.“<br>„Hände schieben, Hüfte hoch: Down Dog.“<br>„Rechter Fuß nach vorne, zwischen die Hände: Low Lunge rechts.“<br>„Evening Low Crescent, zwei, drei Mal.“<br>„Linke Hand innen, Brustkorb öffnet sich nach rechts.“<br>„Zurück zur Matte, Fold.“<br>„Roll Up, Wirbel für Wirbel, Kopf kommt zuletzt.“<br>„Mountain.“<br>„Der Mond drängt nicht. Jede Position darf einen Atemzug länger bleiben als beim Sun Flow heute Morgen.“</div>"),
      P("15:00","Moon Flow 2","Identischer Ablauf. Cat/Cow 1–2×. Weniger technische Führung, mehr kontinuierliche Bewegung. Kurzer Moment des gemeinsamen Atems (optional). Am Ende: Down Dog → Knie → Vierfüßler.<div class='cue'>„Gleicher Weg wie eben. Diesmal fließt er von selbst.“<br>„Reach, Seitneigung rechts und links, Twist, Fold, Half Lift, Fold.“<br>„Low Lunge links, Evening Low Crescent, Brustkorb öffnet.“<br>„Vierfüßler, Cat/Cow ein-, zweimal, Down Dog.“<br>„Low Lunge rechts, Evening Low Crescent, Brustkorb öffnet.“<br>„Fold, Roll Up, Mountain.“<br>„Der Atem darf jetzt länger werden. Wir brauchen immer weniger Schwung. Immer weniger Kraft.“<br>„Ihr atmet gerade alle im selben Raum. Jede*r in ihrem eigenen Tempo.“<br>„Wir bewegen uns langsam nach innen.“</div>"),
    ]},
    {name:"EXPLORE", range:"20–35", start:1200, blocks:[
      P("20:00","Melting Cat","<span class='lbl'>Arrive</span> Vierfüßler.<br><span class='lbl'>Move</span> Cat/Cow 4–5×. Becken Richtung Fersen → Gewicht nach vorne, 3–4×. Body Circles: zurück→rechts→vorne→links, 3×, Richtungswechsel.<br><span class='lbl'>Reduce</span> Kreise kleiner bis minimal.<br><span class='lbl'>Pause</span> Child's Pose, ca. 45 Sek.<br><span class='lbl'>Release</span> Zurück Vierfüßler, Handgelenke entlasten.<div class='cue'>„Nicht mehr Cat-Cow wie am Morgen. Die Wirbelsäule bewegt sich jetzt kleiner, wärmer, langsamer.“</div>"),
      P("24:00","Thread & Reach R · 1:45","<span class='lbl'>Arrive</span> Vierfüßler, Knie unter der Hüfte.<br><span class='lbl'>Move</span> Rechten Arm hoch öffnen, unter linkem Arm hindurch (3×), letztes Mal Schulter+Kopf sanft zum Boden.<br><span class='lbl'>Reduce</span> Minimal nachgeben.<br><span class='lbl'>Pause</span> Ca. 30–35 Sek.<br><span class='lbl'>Release</span> Hand unter Schulter, aktiv drücken, Arm zurück.<div class='cue'>„Der Arm fädelt sich durch, die Schulter sinkt. Sucht nicht die tiefste Rotation, sondern die ehrlichste.“</div>"),
      P("25:45","Thread & Reach L · 1:45","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release.<div class='cue'>„Gespiegelt, linker Arm fädelt unter dem rechten hindurch. Gleiche Regel: keine Bestleistung, nur die ehrlichste Rotation.“</div>"),
      P("27:30","90/90 Moon Sway","<span class='lbl'>Arrive</span> Sitz, beide Knie aufgestellt.<br><span class='lbl'>Move</span> Beide Knie rechts → Mitte → links, 6× langsam. Auf einer Seite: Oberkörper zum vorderen Bein, auf/vor/zurück 3×, Seitenwechsel.<br><span class='lbl'>Reduce</span> Zwei Wechsel, dann minimal.<br><span class='lbl'>Pause</span> Kurz in der Mitte sitzen, ca. 15–20 Sek.<br><span class='lbl'>Release</span> Fußsohlen zusammen.<div class='cue'>„Lasst die Hüften nicht etwas leisten. Lasst sie reagieren.“</div>"),
      P("31:00","Butterfly Wave — Evening","<span class='lbl'>Arrive</span> Sitz, Fußsohlen zusammen.<br><span class='lbl'>Move</span> Spinal Wave 4×. Circular Fold 3× + Richtungswechsel. Side Melt R/L. Fold Wave 3×.<br><span class='lbl'>Reduce</span> Fold Wave kleiner.<br><span class='lbl'>Pause</span> Ca. 75 Sek.<br><span class='lbl'>Release</span> Knie zusammenführen.<div class='cue'>„Wir hören nicht auf, weil ich sage: Jetzt ist Yin. Wir hören auf, weil die Bewegung nicht mehr gebraucht wird.“</div>"),
    ]},
    {name:"MELT", range:"35–53", start:2100, blocks:[
      P("35:00","Butterfly · 3:00","Fußsohlen zusammen, angenehmer Abstand. Oberkörper nach vorne sinken lassen.<div class='cue'>„Keine Richtung mehr. Nur Gewicht.“</div>"),
      P("38:00","Half Butterfly R · 2:30","Rechtes Bein lang, linker Fuß innen. Oberkörper Richtung rechtes Bein. Knie darf weich sein.<div class='cue'>„Kein Ziehen zum Fuß. Der Oberkörper sinkt nur so weit, wie der Atem noch frei fließt.“</div>"),
      P("40:30","Half Butterfly L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Der Abend hat keine Eile.“</div>"),
      P("43:00","Deer R · 2:30","Rechtes Bein vor/diagonal vor dem Becken. Linkes Bein seitlich/hinten. Aufrecht oder sanft vorne. Keine erzwungenen 90°.<div class='cue'>„Das vordere Bein trägt das Gewicht des ganzen Tages. Lasst es einfach liegen.“</div>"),
      P("45:30","Deer L · 2:30","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Fast geschafft.“</div>"),
      P("48:00","Supine Figure Four","Rückenlage, Knie auf. Rechten Außenknöchel auf linken Oberschenkel. <span class='tag ground'>GROUND</span> Fuß am Boden. <span class='tag flight'>FLOAT</span> Fuß hebt, Hände hinter Oberschenkel. Ca. 1:15 pro Seite.<div class='cue'>„Der untere Fuß darf am Boden bleiben. Kein Ziehen am Bein ist nötig.“</div>"),
      P("50:30","Supine Twist","R: Knie links, Brustkorb rechts (1:15). L: spiegelverkehrt (1:15).<div class='cue'>„Der Boden trägt euch jetzt. Ihr müsst nichts mehr halten, was nicht gehalten werden muss.“</div>"),
    ]},

energy: { label:"Energy", theme:"Du musst nicht müde sein, um ruhig zu sein.", color:"#a15c3e",
  memory:["KLOPFEN","BOUNCE","WAVE","KREUZSCHLAG","TWIST","GOLFERSWING","QISQUAT","FAUSTSCHLAG","ENERGY FLOW","SWAY","FOLD WAVE","LOW LUNGE WAVE","90/90","DRAGONFLY","SPHINX","BUTTERFLY","CHEST OPENER","KNEES TO CHEST","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–12", start:0, blocks:[
      P("0:00","Wach-Klopfen","Mit den Fingerspitzen oder der flachen Hand Arme, Schultern und Oberschenkel abklopfen. Gleichmäßiges Tempo, Stärke selbst gewählt.<div class='cue'>„Klopft mit den Fingerspitzen oder der flachen Hand sanft über Arme, Schultern und Oberschenkel.“<br>„Ihr bestimmt die Stärke – von ganz leicht bis kräftiger.“<br>„Das ist keine Massage und keine Therapie. Nur ein einfacher Weg, dem Körper zu sagen: wir sind jetzt wach.“<br>„Das ist heute unser Start – keine Haltung, kein Vorwissen nötig.“</div>"),
      P("1:30","Bounce","<span class='tag ground'>GROUND</span> Federn, Fersen lösen, Bodenkontakt bleibt. <span class='tag flight'>FLIGHT</span> Kleine Hops. Jederzeit wechseln.<div class='cue'>„Lasst die Fersen leicht federn.“<br>„Ihr könnt die Fersen am Boden lassen oder sie ein kleines Stück lösen.“<br>„Lasst das Federn langsam durch den ganzen Körper laufen.“<br>„Kiefer locker. Schultern locker. Hände locker.“<br>„Ihr müsst hier nichts erreichen. Wir bringen nur Bewegung in den Körper.“<br>„Heute suchen wir Energie nicht, indem wir uns anstrengen. Wir schauen erst einmal, was schon da ist.“</div>"),
      P("2:30","Body Waves","Knie → Becken → Wirbelsäule → Brust → Kopf. Mehrere Wellen.<div class='cue'>„Beugt die Knie ein wenig.“<br>„Schiebt das Becken nach vorne.“<br>„Dann rollt die Bewegung durch die Wirbelsäule.“<br>„Brustkorb. Schultern. Kopf zuletzt.“<br>„Und wieder von unten.“<br>„Knie. Becken. Wirbelsäule. Brust. Kopf.“<br>„Es muss nicht schön aussehen.“<br>„Sucht eine Welle, die sich für euren Körper gut anfühlt.“</div>"),
      P("3:30","Arme-Kreuz-Schlag","Arme über Kreuz vor der Brust zusammenschlagen, dann weit nach hinten öffnen, dann andersherum über Kreuz. Tempo und Stärke selbst wählen.<div class='cue'>„Schlagt die Arme über Kreuz vor der Brust zusammen – wie eine Umarmung mit Schwung.“<br>„Dann öffnen sich die Arme weit nach hinten.“<br>„Und andersherum über Kreuz.“<br>„Ihr bestimmt Tempo und Stärke.“</div>"),
      P("4:30","Dead Arms","Arme komplett locker lassen, aus dem Oberkörper heraus leicht hin und her schwingen. Die Arme dürfen dabei gegen Oberkörper und Rücken schlagen. Kein Krafteinsatz in den Armen selbst.<div class='cue'>„Lasst die Arme komplett schwer werden und hängen. Keine Kraft in den Armen – nur der Oberkörper bewegt sich, die Arme schwingen wie von selbst mit. Wer es etwas kräftiger mag, kann die Arme gegen Oberkörper und Rücken schlagen lassen.“</div>"),
      P("5:30","Trunk Twist","Rumpf R/L, Arme locker. Keine maximale Rotation suchen.<div class='cue'>„Arme ganz locker.“<br>„Dreht den Oberkörper nach rechts und links.“<br>„Die Arme dürfen einfach hinterherfliegen.“<br>„Nicht maximal drehen.“<br>„Das Becken darf reagieren.“<br>„Der Blick folgt, wenn das für den Nacken angenehm ist.“<br>„Nicht kontrollieren. Bewegen.“</div>"),
      P("6:30","Hüft-Twist mit Armschlag","Hüfte treibt die Drehung R/L, Arme bleiben komplett locker und schlagen durch den Schwung seitlich gegen den Körper. Anders als Trunk Twist: Bewegung kommt aus der Hüfte, nicht aus dem Oberkörper.<div class='cue'>„Diesmal treibt die Hüfte die Bewegung, nicht der Oberkörper.“<br>„Lasst die Arme komplett locker – sie schlagen von selbst seitlich an, wenn die Hüfte dreht.“<br>„Kein Ziehen mit den Armen. Nur die Hüfte bewegt, der Rest folgt.“</div>"),
      P("7:30","Golferswing","Breiter Stand, Arme wie einen Golfschläger gefasst. Große Rotation R/L, Schwung kommt aus der Hüfte.<div class='cue'>„Stellt euch vor, ihr haltet einen Golfschläger.“<br>„Großer Schwung von einer Seite zur anderen, die Hüfte dreht mit.“<br>„Lasst den Schwung größer werden, wenn es sich gut anfühlt.“</div>"),
      P("8:30","QiSquat","Breiter Stand, Zehen leicht nach außen. Arme über die Seite nach oben führen, dann Hände nach unten führen, während die Beine in den Squat sinken. <span class='tag ground'>SMALL RANGE</span> Squat bleibt flach. <span class='tag flight'>OPEN RANGE</span> Squat wird tiefer.<div class='cue'>„Breiter Stand, Zehen leicht nach außen.“<br>„Arme über die Seite nach oben führen.“<br>„Und jetzt die Hände nach unten führen, während die Beine in den Squat sinken.“<br><span class='lbl'>Small Range</span> „Der Squat bleibt flach.“<br><span class='lbl'>Open Range</span> „Oder er wird tiefer.“<br>„Mehrfach wiederholen, im eigenen Tempo.“</div>"),
      P("9:45","Faustschlag","Aus dem Squat: Fäuste ballen, abwechselnd nach vorne stoßen, Blick fokussiert. <span class='tag ground'>SMALL RANGE</span> Stand höher, Stoß kleiner. <span class='tag flight'>OPEN RANGE</span> Tieferer Stand, größerer Stoß.<div class='cue'>„Aus dem Squat: ballt die Fäuste.“<br>„Stoßt abwechselnd nach vorne.“<br>„Gebt dem Schlag Richtung und Klarheit – nicht Kraft.“<br>„Der Blick geht mit dem Stoß mit – fokussiert, nicht wild.“<br><span class='lbl'>Small Range</span> „Der Stand bleibt höher, der Stoß kleiner.“<br><span class='lbl'>Open Range</span> „Oder tieferer Stand, größerer Stoß.“<br>„Das ist der letzte Moment vor dem Flow.“</div>"),
    ]},
    {name:"FLOW", range:"12–27", start:720, blocks:[
      P("12:00","Round 1 — Learn · 5:30","Mountain → Reach → Fold → Half Lift → Fold → rechtes Bein weit nach hinten, hintere Ferse hebt, Bein streckt sich = High Lunge L → hintere Ferse sinkt, hinterer Fuß öffnet sich deutlich: Warrior II L (Ground: kürzerer Stand / Reach: Arme horizontal) → Reverse Warrior L (kein Gewicht in die hintere Hand) → zurück Warrior II → Side Angle L → Hände zum Boden, Down Dog → Plank Wave (Ground: Knie am Boden / Float: kurze Plank) → Down Dog → rechter Fuß nach vorne, hintere Ferse hebt, Bein streckt sich = High Lunge R → hintere Ferse sinkt, hinterer Fuß öffnet sich deutlich: Warrior II R → Reverse Warrior R → Side Angle R → Fold → Roll Up → Mountain. Runden sind optional: 1×, 2× oder 3× – wie viele passen, entscheidet jede Person für sich. Ausstieg nach jeder Runde in Kindshaltung/bequemen Sitz möglich, Wiedereinstieg spätestens bei Explore.<div class='cue'>„Kommt nach vorne auf eure Matte.“<br>„Wir gehen diesen Weg heute bis zu dreimal. Ihr entscheidet selbst, wie oft für euch heute richtig ist. Ihr könnt nach jeder Runde in die Kindshaltung oder einen bequemen Sitz wechseln und dort warten.“<br>„Einatmen – Arme heben. Ausatmen – nach vorne falten.“<br>„Einatmen – halber Lift. Ausatmen – Fold.“<br>„Rechtes Bein weit nach hinten, die hintere Ferse hebt, das Bein streckt sich: High Lunge links.“<br>„Jetzt sinkt die hintere Ferse zum Boden, der hintere Fuß öffnet sich deutlich, das vordere Knie folgt der Richtung der Zehen: Warrior II links.“<br>„Der Stand darf kürzer oder weiter sein. Findet euren Stand.“<br>„Arme öffnen. Einatmen – Reverse Warrior.“<br>„Die hintere Hand trägt kein Gewicht.“<br>„Ausatmen – zurück in Warrior II.“<br>„Unterarm Richtung Oberschenkel oder Hand Richtung Boden – Side Angle.“<br>„Hände zum Boden. Down Dog.“<br>„Von hier nach vorne in eure Plank Wave.“<br><span class='lbl'>Ground</span> „Die Knie können am Boden bleiben.“<br><span class='lbl'>Float</span> „Oder ihr nehmt kurz die Plank.“<br>„Brustkorb nach vorne. Becken zurück. Wieder Down Dog.“<br>„Rechter Fuß nach vorne, zwischen die Hände. Hintere Ferse hebt, das Bein streckt sich: High Lunge rechts.“<br>„Hintere Ferse sinkt, hinterer Fuß öffnet sich deutlich: Warrior II rechts.“<br>„Arme öffnen. Einatmen – Reverse Warrior.“<br>„Ausatmen – zurück in Warrior II.“<br>„Side Angle rechts.“<br>„Zurück zur Matte. Fold.“<br>„Roll Up. Mountain.“<br>„Wer hier eine Pause spüren möchte: Kindshaltung oder bequemer Sitz. Ihr steigt mit EXPLORE wieder ein.“<br>„Lernt erst die Linie. Wir müssen noch nichts daraus machen.“</div>"),
      P("17:30","Round 2 — Build · 5:00","Identisch. Nach Side Angle: Warrior II → Gewicht vor. <span class='tag ground'>TOUCH</span> Zehen tippen neben Standfuß. <span class='tag flight'>FLOAT</span> Knie hebt vor/oben. Beide Seiten. Kein Knee-Drive-Hold.<div class='cue'>„Gleicher Weg. Diesmal kennt euer Körper die Richtung schon.“<br>„Reach. Fold. Half Lift. High Lunge. Warrior II. Reverse. Warrior II. Side Angle. Down Dog. Plank Wave.“<br>„Zurück in Warrior II. Verlagert das Gewicht nach vorne.“<br><span class='lbl'>Touch</span> „Die Zehen tippen neben dem Standfuß.“<br><span class='lbl'>Float</span> „Oder das Knie löst sich nach vorne und oben.“<br>„Nur ein Moment. Und wieder zurück.“<br>„Jetzt darf Kraft dazukommen. Nicht Geschwindigkeit.“<br>„Energie bedeutet heute nicht: schneller. Energie bedeutet: bewusster.“<br>„Wer hier aussetzen möchte: Kindshaltung oder bequemer Sitz. Ihr steigt mit EXPLORE wieder ein. Wer weitermacht: Runde drei.“</div>"),
      P("22:30","Round 3 — Feel · 4:30","Für alle, die weitermachen möchten – wer nach Runde 1/2 in Kindshaltung/Sitz pausiert, bleibt dort, genauso richtig. Kompletter Flow, keine neuen Elemente. Eigene Wahl bei allen Optionen. Am Ende: kurzer Moment freier, gemeinsamer Bewegung (Augen offen oder geschlossen, eigene Wahl). Alle – auch die Pausierenden – kommen zu Beginn von EXPLORE wieder zusammen.<div class='cue'>„Wer noch dabei ist: ihr kennt den Weg. Nehmt die Variante, die heute zu euch passt.“<br>„Reach. Fold. High Lunge. Warrior II. Reverse. Side Angle. Down Dog. Wave. Andere Seite.“<br>„Dritte Runde. Nicht mehr lernen. Spüren.“<br>„Ihr seid diesen Weg heute mit mir gegangen – ein-, zwei- oder dreimal, je nachdem, was heute gepasst hat. Für ein paar Atemzüge: bewegt euch frei, so wie es sich gerade richtig anfühlt.“<br>„Wenn ihr mögt, nehmt wahr, dass ihr das gerade gemeinsam im Raum macht.“<br>„Augen offen oder geschlossen – eure Wahl.“<br>„Bleibt hier.“<br>„Vielleicht spürt ihr gerade den Herzschlag etwas schneller, den Atem etwas größer. Das ist okay – wir schauen dem jetzt einfach nur zu.“<br>„Alle kommen jetzt wieder zusammen.“</div>"),
    ]},
    {name:"EXPLORE", range:"27–40", start:1620, blocks:[
      P("27:00","Standing Energy Sway · 3:00","<span class='lbl'>Arrive</span> Nach Runde 3 nicht sofort auf die Matte. Füße etwas weiter als hüftbreit, Knie weich, Arme hängen.<br><span class='lbl'>Move</span> Gewicht R/L verlagern, ein Knie beugt sich, das andere Bein wird länger. Arme dürfen beim Wechsel locker durch die Mitte schwingen und sich zur neuen Seite öffnen, Oberkörper darf leicht diagonal mitgehen. <span class='tag ground'>GROUND</span> kleiner Gewichtswechsel, Füße bleiben schwer. <span class='tag flight'>OPEN</span> größere seitliche Verlagerung, Arme weiter.<br><span class='lbl'>Reduce</span> Weg wird kleiner, Arme müssen irgendwann nicht mehr mitgehen, bis nur noch das Gewicht wandert.<div class='cue'>„Bleibt noch einen Moment im Stand.“<br>„Vielleicht ist der Atem größer. Vielleicht spürt ihr euren Herzschlag.“<br>„Wir versuchen jetzt nicht, das wegzumachen. Wir verändern nur die Bewegung.“<br>„Verlagert euer Gewicht nach rechts. Und nach links.“<br>„Ein Bein beugt sich, das andere wird länger.“<br>„Lasst die Arme irgendwann mitkommen. Nicht platzieren. Schwingen lassen.“<br>„Ihr habt gerade sehr klare Formen gemacht. Jetzt dürft ihr die Form wieder verlieren.“<br>„Und jetzt macht denselben Weg etwas kleiner. Weniger Weg. Die Arme müssen irgendwann nicht mehr mit. Bis nur noch das Gewicht von einem Fuß zum anderen wandert.“</div>"),
      P("30:00","Fold Wave / Ragdoll · 3:00","<span class='lbl'>Arrive</span> Aus dem Stand.<br><span class='lbl'>Move</span> Einatmen: aufrichten, Brust/Arme öffnen. Ausatmen: Knie weich, Fold. Einatmen: Half Lift oder Oberkörper leicht anheben. Ausatmen: wieder schwer werden – freie vertikale Welle zwischen Aufrichten und Nachgeben. Dann Ragdoll: Ellbogen greifen oder Arme hängen lassen, leicht R/L sway. <span class='tag ground'>GROUND</span> Hände auf Oberschenkeln, Fold höher. <span class='tag flight'>DEEP</span> Oberkörper hängt vollständig.<br><span class='lbl'>Reduce</span> Große Fold Wave → halbe Wave → leichtes Sway → Stillstand im Fold.<br><span class='lbl'>Release</span> Hände zum Boden, Knie ablegen, Vierfüßler.<div class='cue'>„Einatmen, richtet euch noch einmal auf.“<br>„Ausatmen, Knie weich, lasst den Oberkörper nach unten sinken.“<br>„Einatmen, hebt euch ein Stück.“<br>„Ausatmen, wieder schwer.“<br>„Ihr müsst nicht jedes Mal ganz nach oben. Findet eure eigene Welle zwischen Aufrichten und Nachgeben.“<br>„Die Welle wird kleiner. Vielleicht bleibt nur noch ein leichtes Pendeln. Und irgendwann müsst ihr auch das nicht mehr machen.“</div>"),
      P("33:00","Low Lunge Wave R · 2:00","<span class='lbl'>Arrive</span> Aus dem Vierfüßler rechter Fuß nach vorne.<br><span class='lbl'>Move</span> Low Lunge → Becken nach vorne. Becken zurück → vorderes Bein wird länger/Half Split. Wieder nach vorne, 3–4 Wellen. Dann beim Vorwärtskommen Oberkörper aufrichten, linker Arm über die Seite nach oben und leicht nach rechts. Zurück → Hände Boden → Half Split, noch 2–3×. <span class='tag ground'>GROUND</span> Hände bleiben am Boden/Oberschenkel. <span class='tag flight'>REACH</span> Arm nimmt die Bewegung mit. Keine Rückbeuge.<br><span class='lbl'>Reduce</span> Weg kleiner, noch kleiner.<br><span class='lbl'>Pause</span> Ca. 10–15 Sek. dort bleiben, wo es sich richtig anfühlt.<br><span class='lbl'>Release</span> Zurück Vierfüßler.<div class='cue'>„Rechter Fuß nach vorne.“<br>„Becken kommt nach vorne.“<br>„Dann schiebt euch wieder zurück, das vordere Bein darf länger werden.“<br>„Vor. Zurück. Nicht halten. Pendeln.“<br>„Wenn ihr mögt, nimmt der linke Arm beim nächsten Mal den Weg mit.“<br>„Groß nach vorne – und wieder zurück.“<br>„Macht den Weg kleiner. Noch kleiner. Und bleibt einen Moment dort, wo es sich gerade richtig anfühlt.“</div>"),
      P("35:00","Low Lunge Wave L · 2:00","Spiegelverkehrt. Gleiche Grammatik: Arrive → Move → Reduce → Pause → Release. Am Ende: eine einzige langsame Cat/Cow-Welle durch die Wirbelsäule, dann Becken zu einer Seite drehen → Sitz.<div class='cue'>„Linker Fuß nach vorne.“<br>„Gleicher Weg. Vor und zurück.“<br>„Ground oder Reach.“<br>„Und dann lasst auch diese Bewegung kleiner werden.“<br>„Eine letzte große Welle durch die Wirbelsäule.“</div>"),
      P("37:00","90/90 Melt · 3:00","<span class='lbl'>Arrive</span> Sitz, beide Füße vor dem Körper aufgestellt, Knie gebeugt.<br><span class='lbl'>Move</span> Knie nach rechts sinken lassen → Mitte → links, 6–8 langsame Wechsel. Arme/Hände dürfen hinter dem Körper stützen. Auf einer Seite bleiben: Oberkörper leicht Richtung vorderes Knie → zurück, 2–3 kleine Waves. Andere Seite.<br><span class='lbl'>Reduce</span> Zurück zu den Wechseln, dann kleiner: Knie müssen nicht mehr bis zum Boden, nur noch ein kleines Pendeln, noch kleiner.<br><span class='lbl'>Pause</span> Mitte, Beine ausstrecken oder locker angewinkelt, 20–30 Sek. sitzen. — <b>Hier endet der Peak.</b><div class='cue'>„Lasst beide Knie zu einer Seite sinken.“<br>„Durch die Mitte.“<br>„Andere Seite.“<br>„Kein Winkel muss stimmen. Die Beine wechseln einfach von einer Seite zur anderen.“<br>„Jetzt wird auch dieser Weg kleiner. Die Knie müssen nicht mehr bis zum Boden. Nur noch ein kleines Pendeln. Noch kleiner.“<br>„Unser Peak liegt schon hinter uns.“<br>„Und vielleicht ist trotzdem noch Energie da. Die müssen wir nicht loswerden.“<br>„Du musst nicht müde sein, um ruhig zu sein.“<br>„Ab jetzt bauen wir nichts mehr auf.“</div>"),
    ]},
    {name:"MELT", range:"40–54", start:2400, blocks:[
      P("40:00","Dragonfly · 3:00","Breiter Sitz, Beine nur so weit wie ohne Haltearbeit. Knie deutlich gebeugt möglich. Becken auf, Oberkörper nach vorne sinken. Keine Hände ziehen.<div class='cue'>„Öffnet die Beine nur so weit, dass ihr sie nicht aktiv festhalten müsst.“<br>„Die Knie dürfen deutlich gebeugt sein.“<br>„Richtet euch zunächst auf. Dann lasst den Oberkörper nach vorne schwerer werden.“<br>„Die Hände ziehen euch nirgendwo hin.“<br>„Beobachtet, ob irgendwo noch Arbeit übrig ist. Vielleicht Kiefer. Vielleicht Schultern. Vielleicht Beine.“<br>„Nicht weiter. Schwerer.“</div>"),
      P("43:00","Sphinx · 2:00","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Bewusst kurz gehalten – eine gehaltene Streckung belastet den unteren Rücken anders als ein Fold.<div class='cue'>„Bauchlage, Unterarme zum Boden.“<br>„Je weiter die Ellbogen nach vorne wandern, desto sanfter die Rückbeuge.“<br>„Nach so viel Bewegung: hier öffnet sich der Oberkörper einmal in die andere Richtung.“</div>"),
      P("45:00","Reclined Butterfly · 2:00","Rückenlage, Fußsohlen zusammen, Knie sinken zur Seite. <span class='tag ground'>WIDE</span> Füße weiter vom Becken. <span class='tag flight'>CLOSE</span> Füße näher am Becken. Hände drücken die Knie nicht nach unten.<div class='cue'>„Lasst die Knie einfach sinken, ohne nachzuhelfen.“<br><span class='lbl'>Wide</span> „Füße etwas weiter vom Becken.“<br><span class='lbl'>Close</span> „Oder näher zum Becken.“<br>„Die Schwerkraft übernimmt.“</div>"),
      P("47:00","Reclined Chest Opener · 2:00","Rückenlage, Beine angestellt oder lang. <span class='tag ground'>GROUND</span> Arme in Kaktus-Position, Ellbogen angewinkelt, Oberarme auf Schulterhöhe am Boden. <span class='tag flight'>FLIGHT</span> Arme lang über den Kopf, Hände fassen sich oder verschränken.<div class='cue'>„Legt euch auf den Rücken. Beine dürfen angestellt oder lang sein.“<br><span class='lbl'>Ground</span> „Arme in die Kaktus-Position: Ellbogen angewinkelt, Oberarme liegen auf Schulterhöhe am Boden.“<br><span class='lbl'>Flight</span> „Oder Arme lang über den Kopf strecken, Hände können sich fassen oder ineinander verschränken.“<br>„Die Schultern sinken einfach zum Boden, kein Ziehen.“<br>„Nach so viel Armarbeit im Flow darf sich hier vorne alles öffnen.“</div>"),
      P("49:00","Knees to Chest · 1:00","Rückenlage, beide Knie zur Brust, Hände locker an den Beinen.<div class='cue'>„Beide Knie zur Brust, Hände locker dran. Wiegt euch sanft hin und her, dann still.“</div>"),
      P("50:00","Supine Twist R · 2:00","Knie links, Brustkorb rotiert rechts. Arme bequem, Kopf neutral oder rechts.<div class='cue'>„Füße noch einmal aufstellen. Knie nach links sinken lassen.“<br>„Brustkorb dreht nach rechts. Rechter Arm darf sich öffnen.“<br>„Die Knie müssen den Boden nicht erreichen.“<br>„Schulter und Knie müssen nicht gleichzeitig unten sein.“<br>„Findet die Version, in der ihr nicht festhalten müsst.“</div>"),
      P("52:00","Supine Twist L · 2:00","Spiegelverkehrt.<div class='cue'>„Knie zurück zur Mitte. Langsam zur anderen Seite.“<br>„Knie nach rechts. Brustkorb nach links. Linker Arm öffnet.“<br>„Nichts ziehen. Nichts korrigieren. Nur Gewicht abgeben.“</div>"),
    ]},
    {name:"REST", range:"54–60", start:3240, blocks:[
      P("54:00","Savasana","Arme/Beine bequem. Keine Atemtechnik, keine Visualisierung, keine Aufgabe. Ca. fünf Minuten vollständige Ruhe. Erst gegen Ende reaktivieren.<div class='cue'>„Kommt langsam zurück zur Mitte. Beine ausstrecken.“<br>„Arme dort ablegen, wo sie bequem liegen.“<br>„Vorhin haben wir Energie bewegt.“<br>„Wir haben sie nicht verbraucht.“<br>„Und wir müssen nicht erschöpft sein, um still zu werden.“<br>(Etwa vier Minuten Stille.)<br>„Vertieft langsam den Atem. Bewegt Finger und Zehen.“<br>„Vielleicht streckt ihr euch.“<br>„Nehmt euch Zeit, über eine Seite nach oben zu kommen.“<br>„Energie und Ruhe sind keine Gegensätze.“</div>"),
    ]},
  ],

    {label:"FAUSTSCHLAG", phase:"AWAKEN", time:"9:45", title:"Faustschlag", body:"Aus dem Squat: Fäuste ballen, abwechselnd nach vorne stoßen, Richtung und Klarheit statt Kraft."},
    {label:"ENERGY FLOW", phase:"FLOW", time:"12:00", title:"JIN Energy Flow", body:"High Lunge → Warrior II → Reverse Warrior → Side Angle → Down Dog → Plank Wave → andere Seite. Drei Runden: Learn → Build → Feel, 1–3× frei wählbar."},
    {label:"SWAY", phase:"EXPLORE", time:"27:00", title:"Standing Energy Sway · 3:00", body:"Gewicht R/L verlagern, Arme schwingen frei mit. Ground: kleiner Wechsel. Open: größere Verlagerung. Reduce bis nur noch das Gewicht wandert."},
    {label:"FOLD WAVE", phase:"EXPLORE", time:"30:00", title:"Fold Wave / Ragdoll · 3:00", body:"Vertikale Welle zwischen Aufrichten und Nachgeben, dann Ragdoll. Ground: Hände auf Oberschenkeln. Deep: Oberkörper hängt vollständig."},
    {label:"LOW LUNGE WAVE", phase:"EXPLORE", time:"33:00", title:"Low Lunge Wave R/L · 2:00 + 2:00", body:"Becken pendelt vor/zurück im Low Lunge. Ground: Hände am Boden. Reach: Arm nimmt die Bewegung mit. Danach eine Cat/Cow-Welle."},

qigongyin: { label:"QIJIN", theme:"Ruhe entsteht durch Wiederholung, nicht durch Dauer.", color:"#6f8c74",
  memory:["ARRIVE","QIGONG","PUPPY","SPHINX","TWIST","BUTTERFLY","BREATH","CATERPILLAR","SWAN","GROUND","DRAGONFLY","GATHER","HEART","SIDE MELT","REST"],
  phases:[
    {name:"AWAKEN", range:"0–7", start:0, blocks:[
      P("0:00","Arrive","Sitzen oder Rückenlage, wie es sich heute richtig anfühlt. Augen dürfen schließen. Atem beobachten, nichts verändern. Kein Halten wird lang – die Ruhe entsteht durch Wiederholung, nicht durch Dauer.<div class='cue'>„Setzt oder legt euch hin, wie es sich gerade richtig anfühlt. Wir fangen heute anders an: nicht lange still, sondern immer wieder kurz. Bewegung, dann kurz Ruhe, dann wieder Bewegung. Am Ende hat sich trotzdem viel beruhigt – nur auf einem anderen Weg.“</div>"),
      P("2:00","QiGong Schultern","Stehend. Arme in großen, langsamen Kreisen über außen nach oben und wieder nach unten führen. Schultern rollen sanft mit. Tempo an den eigenen Atem koppeln. Letzter Stehmoment der Stunde.<div class='cue'>„Führt die Arme in großen, langsamen Kreisen über außen nach oben. Lasst die Schultern einfach mitrollen. Kein Tempo-Ziel – der Atem gibt das Tempo vor.“<br>„Und für den Rest der Stunde kommen wir auf den Boden – ihr müsst jetzt nicht mehr aufstehen.“</div>"),
      P("4:30","Puppy Pose · 1:30","Aus dem Vierfüßler Unterarme nach vorne gleiten, Stirn sinkt Richtung Boden. <span class='tag ground'>GROUND</span> Hüfte bleibt über den Knien. <span class='tag flight'>FLIGHT</span> Gesäß sinkt weiter Richtung Fersen.<div class='cue'>„Kommt in den Vierfüßler. Unterarme gleiten nach vorne, die Stirn sinkt Richtung Boden. Die Schultern dürfen komplett schwer werden.“<br><span class='lbl'>Ground</span> „Die Hüfte bleibt über den Knien.“<br><span class='lbl'>Flight</span> „Oder das Gesäß sinkt weiter Richtung Fersen, wenn das heute gut tut.“<br>„Ihr müsst nirgends hinkommen – nur nachgeben, so weit es heute geht.“</div>"),
      P("6:00","Sphinx · 1:30","Bauchlage, Unterarme am Boden. Ellbogen weiter vorne reduziert die Rückbeuge. Unterer Rücken behält Raum.<div class='cue'>„Kommt langsam in die Bauchlage. Unterarme zum Boden. Je weiter die Ellbogen nach vorne wandern, desto kleiner wird die Rückbeuge.“</div>"),
    ]},
    {name:"FLOW", range:"7–19", start:450, blocks:[
      P("7:30","QiGong Rumpf","Aufrechter Sitz oder Fersensitz. Rumpf sanft nach rechts und links drehen, Arme schwingen locker mit wie leere Ärmel. Erst kleiner Radius, dann darf die Drehung größer werden. Letzte Runden: langsamer, Blick darf leicht mitgehen.<div class='cue'>„Dreht den Oberkörper sanft nach rechts und links, im Sitz. Die Arme hängen einfach mit, wie leere Ärmel.“<br>„Fangt mit einem kleinen Radius an.“<br>„Nach und nach darf die Drehung etwas größer werden.“<br>„Für die letzten Atemzüge: langsamer werden, der Blick darf ein kleines Stück mitgehen.“</div>"),
      P("10:00","Supine Twist R · 1:15","Rückenlage, Knie angewinkelt. Beide Knie sinken nach links, Brustkorb bleibt offen nach rechts gedreht. Arme bequem ablegen.<div class='cue'>„Knie sinken zur einen Seite, der Brustkorb bleibt offen zur anderen. Beide Schultern müssen nicht unten bleiben – findet die Version ohne Ziehen.“</div>"),
      P("11:15","Supine Twist L · 1:15","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Knie zur anderen Seite, Brustkorb offen zur Gegenseite.“</div>"),
      P("12:30","QiGong Hüfte","Aufrechter Sitz, Beine gekreuzt oder Fersensitz. Becken in großen, langsamen Kreisen bewegen, dann Gewicht sanft von einer Sitzbeinseite zur anderen verlagern.<div class='cue'>„Kreist langsam mit dem Becken, beide Richtungen – im Sitz. Dann verlagert das Gewicht sanft von einer Sitzbeinseite zur anderen, wie ein langsames Wiegen.“</div>"),
      P("15:00","Butterfly · 1:30","Sitz, Fußsohlen zusammen, Knie sinken zur Seite. Oberkörper darf nach vorne sinken, muss aber nicht. Kein Ziehen an den Füßen.<div class='cue'>„Fußsohlen zusammen, Knie sinken nach außen. Der Oberkörper darf sinken – oder auch nicht.“</div>"),
      P("16:30","Half Butterfly R · 1:15","Rechtes Bein lang, linker Fuß innen. Oberkörper Richtung rechtes Bein, Knie darf weich sein.<div class='cue'>„Kein Ziehen zum Fuß. Der Oberkörper sinkt nur so weit, wie es gut tut.“</div>"),
      P("17:45","Half Butterfly L · 1:15","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Andere Seite, gleiche Regel: kein Ziehen.“</div>"),
    ]},
    {name:"EXPLORE", range:"19–34", start:1140, blocks:[
      P("19:00","QiGong Atem-Welle","Stehend oder sitzend. Beim Einatmen Arme langsam seitlich nach oben führen, beim Ausatmen wieder senken. Bewegung und Atem exakt verbinden.<div class='cue'>„Beim Einatmen heben sich die Arme seitlich nach oben. Beim Ausatmen sinken sie wieder. Lasst den Atem die Geschwindigkeit bestimmen, nicht ihr.“</div>"),
      P("21:00","Caterpillar · 2:00","Beide Beine lang, Knie weich möglich. Oberkörper sinkt aus dem Becken nach vorne, wird zunehmend schwer.<div class='cue'>„Beide Beine lang, Knie dürfen weich sein. Lasst den Oberkörper einfach schwerer werden – kein Ziehen zu den Füßen.“<br>„Nehmt euch hier die zusätzliche Zeit – nichts muss forciert werden.“</div>"),
      P("23:00","Gentle Swan R · 1:45","Aus dem Vierfüßler ein Bein angewinkelt nach vorne bringen, das andere Bein lang nach hinten. Aufrecht bleiben oder mit den Händen leicht nach vorne sinken – keine tiefe Rotation erzwingen.<div class='cue'>„Ein Bein vorne angewinkelt, das andere lang nach hinten. Bleibt aufrecht, wenn Aufrecht sich richtig anfühlt – ihr müsst nicht tief nach vorne.“</div>"),
      P("24:45","Gentle Swan L · 1:45","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Beobachtet, was sich hier anders anfühlt als rechts.“</div>"),
      P("26:30","QiGong Seite","Aufrechter Sitz, ein Arm lang über den Kopf führen, Oberkörper sanft zur Gegenseite neigen, zurück zur Mitte, Seite wechseln.<div class='cue'>„Im Sitz: ein Arm lang nach oben, der Oberkörper neigt sich sanft zur Seite. Zurück zur Mitte, andere Seite.“</div>"),
      P("27:30","Seated Side Bend R · 1:00","Sitz, ein Arm lang nach oben und über den Kopf zur Seite geneigt. Das Sitzbein bleibt unten.<div class='cue'>„Ein Arm lang nach oben, dann über den Kopf zur Seite neigen. Das Sitzbein bleibt unten – die Länge kommt von oben, nicht vom Ziehen.“</div>"),
      P("28:30","Seated Side Bend L · 1:00","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Andere Seite, gleiche Länge.“</div>"),
      P("29:30","QiGong Wirbelwelle","Stehend oder sitzend. Langsame Welle durch die Wirbelsäule laufen lassen, von unten nach oben, dann umkehren.<div class='cue'>„Lasst eine langsame Welle durch die Wirbelsäule laufen, von unten nach oben. Und wieder zurück. Keine perfekte Welle – eure eigene.“<br>„Noch ein paar Wellen – lasst sie langsamer werden.“</div>"),
      P("32:00","Seated Twist R · 1:15","Aufrechter Sitz, Oberkörper sanft nach rechts drehen, eine Hand kann hinter dem Körper abstützen.<div class='cue'>„Dreht den Oberkörper sanft zur Seite, eine Hand stützt hinter euch. Die Drehung kommt aus der Mitte, nicht aus dem Ziehen der Arme.“</div>"),
      P("33:15","Seated Twist L · 1:15","Spiegelverkehrt.<div class='cue'>„Gespiegelt. Zur anderen Seite drehen.“</div>"),
    ]},
    {name:"MELT", range:"34–49", start:2070, blocks:[
      P("34:30","QiGong Erdung","Aufrechter Sitz oder Fersensitz. Gewicht bewusst in die Sitzknochen spüren, Oberkörper mehrfach sanft nach vorne und zurück wiegen.<div class='cue'>„Spürt das Gewicht in den Sitzknochen. Wiegt den Oberkörper sanft nach vorne, dann zurück. Jedes Mal ein bisschen mehr Boden unter euch.“</div>"),
      P("36:30","Dragonfly · 2:00","Breiter Sitz, Beine nur so weit wie ohne Haltearbeit. Oberkörper darf nach vorne sinken.<div class='cue'>„Öffnet die Beine nur so weit, dass ihr sie nicht festhalten müsst. Der Oberkörper darf schwerer werden.“<br>„Kein Ziel hier – nur so viel Zeit, wie der Körper heute braucht.“</div>"),
      P("38:30","Reclined Butterfly · 2:00","Rückenlage, Fußsohlen zusammen, Knie sinken zur Seite. <span class='tag ground'>WIDE</span> Füße weiter vom Becken. <span class='tag flight'>CLOSE</span> Füße näher am Becken. Hände drücken die Knie nicht nach unten.<div class='cue'>„Lasst die Knie einfach sinken, ohne nachzuhelfen.“<br><span class='lbl'>Wide</span> „Füße etwas weiter vom Becken.“<br><span class='lbl'>Close</span> „Oder näher zum Becken.“<br>„Die Schwerkraft übernimmt.“</div>"),
      P("40:30","QiGong Sammeln","Stehend oder sitzend, Hände langsam vor dem Körper zusammenführen, als würdet ihr etwas sammeln. Bewegung wird zunehmend kleiner.<div class='cue'>„Führt die Hände langsam vor dem Körper zusammen. Die Bewegung darf jetzt kleiner werden – so klein, wie sie will.“</div>"),
      P("42:00","Knees to Chest · 2:00","Rückenlage, beide Knie zur Brust, Hände locker an den Beinen. Sanft hin und her wiegen, dann still.<div class='cue'>„Beide Knie zur Brust, Hände locker dran. Wiegt euch sanft hin und her. Dann Mitte, still.“<br>„Bleibt hier noch ein paar Atemzüge länger als sonst.“</div>"),
      P("44:00","QiGong Herzöffnung","Aufrechter Sitz, Arme langsam weit zur Seite öffnen, Brustkorb hebt sich leicht. Wieder schließen, mehrfach, langsames Tempo.<div class='cue'>„Im Sitz: Öffnet die Arme langsam weit zur Seite, der Brustkorb hebt sich ein wenig. Und wieder schließen. Ganz langsam.“</div>"),
      P("46:00","Reclined Side Melt · 1:30","Rückenlage, Arme lang über den Kopf, Hände können sich kreuzen. Beine und Arme gemeinsam sanft nach rechts sinken lassen, leichte Bananenform (je zur Hälfte der Zeit). Zurück zur Mitte, dann nach links.<div class='cue'>„Arme lang über den Kopf strecken.“<br>„Jetzt lasst Beine und Arme gemeinsam sanft nach rechts sinken – eine leichte Bananenform, kein Ziehen.“<br>„Zurück zur Mitte. Und nach links.“<br>„Die Seite spürt hier zum ersten Mal heute richtig Länge.“</div>"),
      P("47:30","Heart Rest · 2:00","Rückenlage, eine oder beide Hände auf dem Herzen. Nichts tun, nur spüren.<div class='cue'>„Legt eine oder beide Hände auf euer Herz. Ihr müsst nichts fühlen, nichts suchen. Nur die Hand dort lassen.“<br>„Lasst euch hier ruhig etwas länger Zeit.“</div>"),
    ]},
    {name:"REST", range:"49–60", start:2970, blocks:[
      P("49:30","QiGong Abschluss","Stehend oder sitzend, Hände langsam vor dem Körper zusammenführen, Bewegung wird immer kleiner, bis sie von selbst aufhört.<div class='cue'>„Führt die Hände noch einmal langsam zusammen. Lasst die Bewegung kleiner werden, bis sie von selbst aufhört.“</div>"),
      P("51:30","Fetal Rest · 1:30","Seitlage, Knie angezogen, Kopf auf dem Arm oder locker abgelegt. Augen dürfen schließen.<div class='cue'>„Legt euch auf die Seite, Knie angezogen, Kopf bequem abgelegt. Die Augen dürfen jetzt zu bleiben.“</div>"),
      P("53:00","Savasana","Rückenlage, Arme und Beine bequem ablegen. Volle Länge, kein Halten. Letzte Minute Atem vertiefen, dann über die Seite langsam hoch.<div class='cue'>„Legt euch auf den Rücken, Arme und Beine bequem. Nichts mehr zu tun, nichts mehr zu halten.“<br>(Stille.)<br>„Vertieft langsam den Atem, bewegt Finger und Zehen. Über die Seite, wenn ihr bereit seid, langsam hoch.“</div>"),
    ]},
  ],

yin: { label:"Yin", theme:"Manchmal braucht Ruhe Zeit.", color:"#7a6a8c",
  memory:["ARRIVE","HEART","THREAD","SQUAT","HALF BUTTERFLY","DEER","DRAGONFLY","CATERPILLAR","SPHINX","BUTTERFLY","SIDE MELT","BRIDGE","TWIST","REST"],
  phases:[
    {name:"AWAKEN", range:"0–7", start:0, blocks:[
      P("0:00","Arrive","Sitzen oder Rückenlage, wie es sich richtig anfühlt. Augen dürfen schließen. Kurz ankommen, bevor die erste Haltung beginnt.<div class='cue'>„Setzt oder legt euch hin. Heute ist eine andere Art von Ruhe: kein QiGong dazwischen, kein Fließen – nur Haltungen, die wir wirklich lange halten, bis zu drei Minuten pro Haltung.“<br>„Das ist ungewohnt, wenn ihr sonst mehr in Bewegung seid. Gebt euch die Erlaubnis, hier nichts tun zu müssen außer bleiben.“<br>„Ein paar ruhige Atemzüge, bevor wir in die erste Haltung gehen.“</div>"),

    {name:"MELT", range:"7–52", start:450, blocks:[

    ["1","Die Idee","JIN Journey führt über Bewegung in die Ruhe – statt Ruhe vom Körper zu verlangen. Die Stunde beginnt nicht zwangsläufig still, sondern mit Bewegung: schwingen, drehen, kreisen, strecken, federn, fließen. Diese Bewegung verändert im Verlauf ihre Qualität – bewusster, fließender, explorativer, kleiner – bis schließlich keine Bewegung mehr notwendig ist."],
    ["2","Warum JIN mit J?","JIN schlägt bewusst die Brücke zu JOGA – mit J wie Ja zu Bewegung. Bewegung ist kein Privileg junger, beweglicher oder sportlicher Menschen. Wir müssen keine bestimmte Form erreichen, unseren Körper nicht beherrschen – wir dürfen ihn benutzen, kennenlernen, erleben. Erst sagen wir Ja zur Bewegung, dann erlauben wir uns die Ruhe."],
    ["3","Was JIN Journey nicht ist","JIN Journey behauptet nicht, neue Asanas erfunden zu haben. Die Elemente stammen aus Yoga, Yin Yoga, Vinyasa, Mobility und freier Bewegung. Die Eigenständigkeit liegt in der Dramaturgie. JIN Journey ist deshalb nicht: erst Mobility → dann Vinyasa → dann Yin. Die Phasen gehen ineinander über – im Idealfall bemerkt niemand „jetzt beginnt Yin“, sondern nur: „Irgendwann bin ich einfach still geworden.“"],
    ["4","Die drei Sprachebenen","Methodische Phasen (AWAKEN→FLOW→EXPLORE→MELT→REST) – die Standardform, mit der die meisten Journeys entwickelt werden. Bewegungsqualität (groß→fließend→explorativ→klein→still) – das eigentliche Prinzip, dem die Phasen dienen. Markenformel (MOVE. FLOW. MELT.) – verdichtet die Erfahrung kommunikativ. Unterrichtet wird nach den Phasen, die eine Journey tatsächlich braucht – nicht jede Journey braucht alle fünf. Entscheidend ist, dass sich die Bewegungsqualität nachvollziehbar verändert, nicht dass exakt fünf Etiketten durchlaufen werden. QiGong Yin variiert das Modell zu einem Wechsel aus Bewegung und Nachhall statt einer einmaligen Kurve; Yin reduziert bewusst auf Ankommen → Halten → Ruhe, weil hier die Stille selbst die Journey ist, nicht ihr Ziel am Ende."],
    ["5","Die fünf Phasen","AWAKEN – bewege dich, keine klassische Aufwärmübung. FLOW – Bewegung bekommt Struktur, Atem und Rhythmus verbinden sich. EXPLORE – Positionen werden nicht eingenommen, sondern ihr Bewegungsraum wird untersucht; das methodische Herzstück. MELT – aktive Bewegung tritt zurück, Schwerkraft übernimmt. REST – keine neue Aufgabe, nur Integration. Das ist die Standardabfolge für Morning, Evening und Energy. Journeys dürfen begründet abweichen, wenn die Dramaturgie es verlangt – etwa wenn eine Klasse bewusst nicht aufbaut, sondern fast unmittelbar in Stille geht (Yin), oder wenn sich Aktivierung und Ruhe fortlaufend abwechseln statt sich einmal aufzubauen (QiGong Yin). Eine Abweichung ist kein Freifahrtschein: Die Bewegungsqualität muss sich weiterhin nachvollziehbar verändern, sonst ist es keine JIN Journey mehr, sondern nur eine Übungsliste."],
    ["6","Die Explore-Grammatik","Arrive (Position finden, Belastung wahrnehmen) → Move (Bewegungsraum untersuchen – kein einzelner Move, ein Container mit mehreren Bausteinen) → Reduce (schrittweise verkleinern) → Pause (vollständig beenden, beobachten) → Release (bewusst verlassen, entlasten)."],
    ["7","Optionsprinzip","Eine JIN-Option verändert die Erfahrung – sie bewertet sie nicht. Keine Labels wie „Anfänger“, „Best Ager“, „Low Impact“, „Advanced“. Stattdessen: Ground/Flight, Small Range/Open Range. Beim Figure Four: Ground (Fuß bleibt am Boden) / Float (Fuß hebt ab). Keine Variante gewinnt."],
    ["8","Age-inclusive Movement","JIN Journey ist ausdrücklich altersinklusiv, aber kein Seniorenyoga. Berücksichtigt werden Beweglichkeit, Balance, Gelenksensibilität, Kniebelastung, Handgelenksbelastung, Bodenwechsel, Kraft, Tagesform. Alter entscheidet nie automatisch über eine Variante – ein beweglicher 70-Jähriger braucht nicht automatisch weniger, ein unbeweglicher 30-Jähriger nicht automatisch mehr."],
    ["9","Gelenkregel","Keine belastete Gelenkposition wird unnötig lange beibehalten. Bewegung innerhalb derselben Position gilt nicht automatisch als Entlastung – vier Minuten Beckenkreisen im Dragon sind trotzdem vier Minuten Belastung auf demselben Knie. Explore muss bei Bedarf Belastungswechsel enthalten."],
    ["10","Stillness Rule","Eine statische Position dauert maximal drei Minuten – das ist eine Obergrenze, kein Ziel. 45 Sekunden können richtig sein, 90 Sekunden können richtig sein. Die Dramaturgie entscheidet, nicht ein Zeitplan."],
    ["11","Seitenkonvention","Stand/Lunge: nach dem vorderen Bein (rechtes Bein zurück → Low Lunge L). Sitz: nach dem Bein, zu dem die Haltung aufgebaut wird (Half Butterfly R = rechtes Bein lang). Deer R = rechtes Bein vorne, Unterschenkel diagonal vor dem Becken. Twist: nach der Rotationsrichtung des Brustkorbs, nicht nach der Knierichtung – Knie links + Brustkorb rechts = Supine Twist R."],
    ["12","Pose-Namen ersetzen keine Anleitung","Ein Detailed Teacher Script nennt nicht nur „Deer R“, sondern beschreibt Ausgangsposition → Eintritt → Orientierung → Position → Austritt. Besonders wichtig bei Positionen, deren Namen zwischen Traditionen variieren."],
    ["13","Sprache","JIN-Sprache lädt ein, statt zu bewerten. Nicht „Geh tiefer“, sondern „Schau, ob dein Körper heute noch etwas Raum anbietet.“ Nicht „Zieh dich zum Bein“, sondern „Lass den Oberkörper schwerer werden.“ Nicht „Du solltest die Dehnung jetzt spüren“, sondern „Beobachte, wo dein Körper auf die Position reagiert.“ Zentraler Cue: „Mach die Bewegung langsam kleiner.“"],
    ["14","Morning & Evening","Morning: Die Aktivierung darf zunächst ansteigen, danach führt die Kurve über Explore Richtung Ruhe. Evening: Der Körper darf ebenfalls zunächst aktiviert werden, ohne hochgefahren zu werden – nach Flow nimmt die Aktivierung kontinuierlich ab."],
    ["15","Rest Rule","Rest ist Praxis, keine Restzeit. Bei Zeitverzug wird Rest nicht geopfert – reduziert werden vorher Move-Wiederholungen, einzelne Explore-Elemente, Pause-Zeiten oder Melt-Holds."],
    ["16","Hilfsmittel","Hilfsmittelfreiheit gehört nicht zum Core, sondern ist Venue-Parameter. Core = methodische DNA. Class Design = konkrete Journey. Venue Parameters = Raum, Hilfsmittel, Gruppengröße. JIN Journey kann mit oder ohne Block, Bolster, Gurt oder Decke unterrichtet werden."],
    ["17","Autonomie","Jede Journey ist vollständig eigenständig unterrichtbar. Keine Journey setzt die Kenntnis einer anderen voraus – Bewegungen werden vollständig beschrieben, auch wenn sie in anderen Journeys bereits vorkommen."],

try {

} catch(e){}
function applyThemeBtn(){
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  document.getElementById("themeToggle").textContent = isDark ? "☀️" : "🌙";
}
document.getElementById("themeToggle").onclick=()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("jin-theme", next); } catch(e){}
  applyThemeBtn();
};

} catch(e){}

  const isLong = document.body.classList.contains("long-cues");
  document.getElementById("cueToggle").textContent = isLong ? "Cues: Kurz" : "Cues: Lang";

};

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}

function render(){
  document.querySelectorAll(".jtab").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));
  document.querySelectorAll("nav.bottom button").forEach(b=> b.classList.toggle("active", b.dataset.j===state.journey));

  const modebar = document.querySelector(".modebar");
  const themebar = document.querySelector(".themebar");
  const main = document.getElementById("main");
  const label = document.getElementById("journeyLabel");
  const themeText = document.getElementById("themeText");
  const memline = document.getElementById("memline");

  if(state.journey==="core"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Core 1.0";
    main.innerHTML="";
    renderCore(main);
    return;
  }
  if(state.journey==="study"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Nacharbeit";
    main.innerHTML="";
    renderStudyPlan(main);
    return;
  }
  if(state.journey==="builder"){
    modebar.style.display="none";
    themebar.style.display="none";
    label.textContent="Erstellen";
    main.innerHTML="";
    renderBuilder(main);
    return;
  }
  modebar.style.display="flex";
  themebar.style.display="block";
  const j = DATA[state.journey];
  label.textContent = j.label;
  themeText.textContent = "„" + j.theme + "“";
  memline.innerHTML = j.memory.map(m=>`<span class="memchip">${m}</span>`).join("");
  main.innerHTML="";

  const prepBtn = document.getElementById("prepModeBtn");
  const hasPrep = state.journey==="energy";
  prepBtn.style.display = hasPrep ? "block" : "none";
  if(state.mode==="prep" && !hasPrep) state.mode="study";
  document.querySelectorAll(".modebtn").forEach(b=> b.classList.toggle("active", b.dataset.mode===state.mode));

  if(state.mode==="study") renderStudy(main, j);
  if(state.mode==="cards") renderCards(main, j);
  if(state.mode==="practice") renderPractice(main, j);
  if(state.mode==="music") renderMusic(main, j);
  if(state.mode==="prep" && hasPrep) renderWorkbookPrep(main);
}

function cleanMoveName(title){
  return title.replace(/·.*$/,"").replace(/\s*[RL]$/,"").replace(/\s*—.*$/,"").replace(/\s*\/.*$/,"").trim();
}

function amLink(artist, title){
  return `https://music.apple.com/de/search?term=${encodeURIComponent(artist + " " + title)}`;
}
function renderMusic(main, j){
  const pl = PLAYLISTS[state.journey];
  if(!pl){ main.innerHTML = `<div class="musicnote">Für diese Journey gibt es noch keine Setlist.</div>`; return; }

  if(pl.type==="album"){
    const note = document.createElement("div"); note.className="musicnote";
    note.textContent = pl.note;
    main.appendChild(note);
    pl.albums.forEach(al=>{
      const row = document.createElement("div"); row.className="musictrack";
      row.innerHTML = `
        <div class="mt"><span class="martist">${al.artist}</span><span class="mtitle">${al.title}</span></div>
        <a class="musiclink" href="${amLink(al.artist, al.title)}" target="_blank" rel="noopener">Suchen ›</a>`;
      main.appendChild(row);
    });
    return;
  }

  if(pl.note){
    const note = document.createElement("div"); note.className="musicnote";
    note.textContent = pl.note;
    main.appendChild(note);
  }

  pl.groups.forEach(g=>{
    const sec = document.createElement("div"); sec.className="phase";
    sec.innerHTML = `<div class="phasehead"><h2>${g.phase}</h2></div>`;
    const list = document.createElement("div");
    g.tracks.forEach(tr=>{
      const row = document.createElement("div"); row.className="musictrack";
      row.innerHTML = `
        <div class="mt"><span class="martist">${tr.artist}</span><span class="mtitle">${tr.title}</span></div>
        <a class="musiclink" href="${amLink(tr.artist, tr.title)}" target="_blank" rel="noopener">Suchen ›</a>`;
      list.appendChild(row);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  });
}

function getWorkbookEntries(journeyKey, title){
  if(journeyKey !== "energy") return [];
  return WORKBOOK_ENERGY_MOVES.filter(w=> w.titles.includes(title));
}

    sec.innerHTML = `<div class="phasehead"><h2>${ph.name}</h2><span class="range">${ph.range} Min.</span></div>`;

    ph.blocks.forEach(bl=>{

function parseTime(t){
  const parts = t.split(":").map(Number);
  return parts[0]*60 + (parts[1]||0);
}
function allBlocksFlat(j){
  const out=[];
  j.phases.forEach(ph=> ph.blocks.forEach(bl=> out.push({phase:ph.name, start:parseTime(bl.time), ...bl})));
  return out;
}

// ===================== TEXT-TO-SPEECH (Cues vorlesen) =====================
let ttsEnabled = (function(){ try { return localStorage.getItem("jin-tts")!=="0"; } catch(e){ return true; } })();
let ttsLastSpokenKey = null;
let ttsInterruptedKey = null;
let ttsVoice = null;
function ttsLoadVoice(){
  if(!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  ttsVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("de")) || null;
}
if("speechSynthesis" in window){
  ttsLoadVoice();
  window.speechSynthesis.onvoiceschanged = ttsLoadVoice;
}
function extractCueText(bodyHtml){
  const m = (bodyHtml||"").match(/<div class='cue'>([\s\S]*?)<\/div>/);
  const html = m ? m[1] : (bodyHtml||"");
  const lines = html.split("<br>").map(l=>{
    let t = l;
    t = t.replace(/<span class='lbl'>(.*?)<\/span>/g, (mm,txt)=> txt+": ");
    t = t.replace(/<span class='tag (ground|flight)'>(.*?)<\/span>/g, (mm,cls,txt)=> txt+": ");
    t = t.replace(/<[^>]+>/g,"");
    t = t.replace(/„|“/g,"");
    return t.trim();
  }).filter(Boolean);
  return lines.join(". ");
}
function ttsSpeak(text, onEnd){
  if(!("speechSynthesis" in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  if(ttsVoice) u.voice = ttsVoice;
  u.rate = 0.95;
  if(onEnd){ u.onend = onEnd; u.onerror = onEnd; }
  window.speechSynthesis.speak(u);
}
function ttsStop(){
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function ttsMaybeAutoSpeak(block){
  if(!ttsEnabled || !state.timer.running) return;
  const key = block.phase+"|"+block.time+"|"+block.title;
  if(key===ttsLastSpokenKey) return;
  ttsLastSpokenKey = key;
  ttsSpeak(extractCueText(block.body));
}

function renderPractice(main, j){
  const flat = allBlocksFlat(j);
  const total = 3600;
  const elapsed = state.timer.elapsed;
  let current = flat[0];
  for(const b of flat){ if(b.start<=elapsed) current=b; }

  const hero = document.createElement("div"); hero.className="practice-hero";
  hero.innerHTML = `
    <div class="clock">${fmt(elapsed)}</div>
    <div class="clockphase">${current.phase}</div>
    <div class="bar"><div class="barfill" style="width:${Math.min(100, elapsed/total*100)}%"></div></div>
    <div class="ctrls">
      <button id="ptoggle" class="go">${state.timer.running? "Pause":"Start"}</button>
      <button id="preset">Reset</button>
      <button id="ttstoggle" class="ttstoggle${ttsEnabled?" on":""}" title="Cues automatisch vorlesen">${ttsEnabled?"🔊":"🔇"}</button>
    </div>`;
  main.appendChild(hero);

  const now = document.createElement("div"); now.className="nowcard";
  now.innerHTML = `<div class="lblrow"><div class="lbl">${current.time} · ${current.phase}</div><button id="speaknow" class="speakbtn">🔊 Vorlesen</button></div><div class="title">${current.title}</div><div class="txt">${current.body}</div>`;
  main.appendChild(now);

  const mini = document.createElement("div"); mini.className="minilist";
  flat.forEach(b=>{
    const row=document.createElement("div");
    row.className="miniblock"+(b===current?" active":"");
    row.innerHTML=`<span class="t">${b.time}</span><span>${b.title}</span>`;
    row.onclick=()=>{ state.timer.elapsed=b.start; if(state.timer.running) state.timer.startedAt=Date.now()-b.start*1000; render(); };
    mini.appendChild(row);
  });
  main.appendChild(mini);

  document.getElementById("ptoggle").onclick=()=>{
    state.timer.running=!state.timer.running;
    if(state.timer.running){
      // Anker auf die Wanduhr statt nur hochzuzählen: so bleibt die Anzeige auch
      // korrekt, wenn der Browser den Tick mal verzögert oder aussetzt (z.B. während
      // Sprachausgabe läuft oder das Display kurz sperrt) — beim nächsten Tick holt
      // sie sich automatisch die tatsächlich vergangene Zeit statt einfach weiterzuzählen.
      state.timer.startedAt = Date.now() - state.timer.elapsed*1000;
      state.timer.interval=setInterval(()=>{
        state.timer.elapsed = Math.floor((Date.now()-state.timer.startedAt)/1000);
        if(state.timer.elapsed>=total){ state.timer.elapsed=total; state.timer.running=false; clearInterval(state.timer.interval); }
        render();
      },1000);
    } else {
      clearInterval(state.timer.interval);
      ttsStop();
    }
    render();
  };
  document.getElementById("preset").onclick=()=>{
    state.timer.running=false; state.timer.elapsed=0; state.timer.startedAt=null; clearInterval(state.timer.interval);
    ttsStop(); ttsLastSpokenKey=null; ttsInterruptedKey=null;
    render();
  };
  document.getElementById("ttstoggle").onclick=()=>{
    const key = current.phase+"|"+current.time+"|"+current.title;
    const wasSpeaking = ("speechSynthesis" in window) && window.speechSynthesis.speaking;
    ttsEnabled = !ttsEnabled;
    try { localStorage.setItem("jin-tts", ttsEnabled?"1":"0"); } catch(e){}
    if(!ttsEnabled){
      ttsStop();
      // Wurde der Cue gerade aktiv gesprochen, merken wir uns das, um ihn beim
      // Wiedereinschalten fortzusetzen (TTS kann nicht mitten im Satz weitermachen).
      ttsInterruptedKey = wasSpeaking ? key : ttsInterruptedKey;
    } else if(ttsInterruptedKey === key){
      ttsInterruptedKey = null;
      ttsLastSpokenKey = key;
      ttsSpeak(extractCueText(current.body));
    } else {
      // Wiedereinschalten, ohne dass der Cue dieses Blocks unterbrochen wurde:
      // nicht rückwirkend von vorne vorlesen. Erst der nächste Blockwechsel
      // löst wieder automatisches Vorlesen aus.
      ttsLastSpokenKey = key;
    }
    render();
  };
  document.getElementById("speaknow").onclick=(ev)=>{
    ttsSpeak(extractCueText(current.body));
    const btn=ev.currentTarget; btn.classList.add("speaking");
    setTimeout(()=>btn.classList.remove("speaking"), 600);
  };

  ttsMaybeAutoSpeak(current);
}

// ===================== CLASS BUILDER =====================
const PHASE_ORDER = ["AWAKEN","FLOW","EXPLORE","MELT","REST"];

function slugify(s){
  const base = (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
  return "custom_" + (base || String(Date.now()));
}
function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function nl2br(s){ return escapeHtml(s).split("\n").map(x=>x.trim()).filter(Boolean).join("<br>"); }
function parseDur(s){
  if(!s) return null;
  const m = String(s).trim().match(/^(\d+):([0-5]?\d)$/);
  if(!m) return null;
  return (+m[1])*60 + (+m[2]);
}
function secToTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}
function quoteLine(l){
  l = l.trim();
  if(!l) return "";
  if(!l.startsWith("\u201e")) l = "\u201e" + l;
  if(!l.endsWith("\u201c")) l = l + "\u201c";
  return l;
}

function loadCustomStore(){
  try { return JSON.parse(localStorage.getItem("jin-custom-journeys") || "{}"); } catch(e){ return {}; }
}
function saveCustomStore(store){
  try { localStorage.setItem("jin-custom-journeys", JSON.stringify(store)); } catch(e){}
}
function loadCustomJourneys(){
  const store = loadCustomStore();
  Object.keys(store).forEach(key=>{
    DATA[key] = compileJourney(store[key]);
  });
}

function emptyBlock(){
  return { title:"", dur:"", body:"", cueLong:"", isHold:false, explore:null, opts:null };
}
function newDraft(){
  return {
    key:null, label:"", theme:"", intention:"", color:"#e8601f", memory:[],
    phases: PHASE_ORDER.map(name=>({ name, blocks:[] })),
  };
}
let builderDraft = newDraft();
let builderEditingKey = null;

function compileJourney(draft){
  let cursor = 0;
  const phases = draft.phases.map(ph=>{
    const phaseStart = cursor;
    const blocks = ph.blocks.map(bl=>{
      const dur = parseDur(bl.dur) || 0;
      const time = secToTime(cursor);
      let bodyHtml = "";
      if(bl.explore){
        bodyHtml = ["arrive","move","reduce","pause","release"].map(k=>{
          const val = bl.explore[k];
          const lbl = k.charAt(0).toUpperCase()+k.slice(1);
          return val && val.trim() ? "<span class='lbl'>"+lbl+"</span> "+nl2br(val) : null;
        }).filter(Boolean).join("<br>");
      } else if(bl.opts && bl.opts.label1 && bl.opts.text1){
        bodyHtml = "<span class='tag ground'>"+escapeHtml(bl.opts.label1.toUpperCase())+"</span> "+nl2br(bl.opts.text1);
        if(bl.opts.label2 && bl.opts.text2){
          bodyHtml += "<br><span class='tag flight'>"+escapeHtml(bl.opts.label2.toUpperCase())+"</span> "+nl2br(bl.opts.text2);
        }
        if(bl.body && bl.body.trim()) bodyHtml += (bodyHtml?"<br>":"") + nl2br(bl.body);
      } else {
        bodyHtml = nl2br(bl.body);
      }
      if(bl.cueLong && bl.cueLong.trim()){
        const lines = bl.cueLong.split("\n").map(quoteLine).filter(Boolean);
        if(lines.length) bodyHtml += "<div class='cue'>" + lines.join("<br>") + "</div>";
      }
      cursor += dur;
      return { time, title: bl.title || "(ohne Titel)", body: bodyHtml };
    });
    const rangeStr = Math.floor(phaseStart/60) + "\u2013" + Math.floor(cursor/60);
    return { name: ph.name, range: rangeStr, start: phaseStart, blocks };
  });
  return {
    label: draft.label || "Neue Journey",
    theme: draft.theme || "",
    color: draft.color || "#e8601f",
    memory: draft.memory || [],
    phases,
  };
}

function validateJourney(draft){
  const items = [];
  if(!draft.label || !draft.label.trim()){
    items.push({level:"err", text:"Journey braucht einen Namen (Label)."});
  }
  let totalSec = 0;
  let anyBlocks = false;
  let holdIssues = [];
  draft.phases.forEach(ph=>{
    if(!ph.blocks.length){
      items.push({level:"warn", text: ph.name+": noch keine Moves."});
    } else { anyBlocks = true; }
    ph.blocks.forEach(bl=>{
      const dur = parseDur(bl.dur);
      if(bl.title && dur===null){
        items.push({level:"err", text: ph.name+" \u00b7 \"" + bl.title + "\": Dauer fehlt oder falsches Format (mm:ss)."});
      }
      if(dur) totalSec += dur;
      if(bl.isHold && dur && dur>180){
        holdIssues.push(ph.name+" \u00b7 "+bl.title);
      }
    });
    // R/L pairing heuristic
    const titles = ph.blocks.map(b=>b.title||"");
    titles.forEach(t=>{
      const m = t.match(/^(.*)\sR(\s\u00b7.*)?$/);
      if(m){
        const base = m[1];
        const hasL = titles.some(t2=> t2.startsWith(base+" L"));
        if(!hasL) items.push({level:"warn", text: ph.name+": \""+t+"\" hat keine erkennbare L-Seite (Seitenkonvention)."});
      }
    });
  });
  if(!anyBlocks){
    items.push({level:"err", text:"Noch keine Moves in der Journey."});
  }
  if(holdIssues.length){
    items.push({level:"err", text:"Stillness Rule verletzt (max. 3:00 pro Hold): " + holdIssues.join(", ")});
  }
  const totalOk = totalSec>=3570 && totalSec<=3630;
  items.push({
    level: totalOk ? "ok" : (totalSec>0 ? "warn" : "err"),
    text: "Gesamtzeit: " + secToTime(totalSec) + " (Ziel: 60:00)"
  });
  if(draft.phases.every(ph=>ph.blocks.length>0) && !holdIssues.length){
    items.push({level:"ok", text:"Alle 5 Phasen belegt, keine Stillness-Rule-Verletzung."});
  }
  const hasErr = items.some(i=>i.level==="err");
  return { items, canSave: !hasErr };
}

function renderValidationPanel(){
  const el = document.getElementById("bvalid");
  if(!el) return;
  const v = validateJourney(builderDraft);
  el.innerHTML = v.items.map(i=>{
    const dot = i.level==="ok" ? "\u2713" : i.level==="warn" ? "!" : "\u2715";
    return "<div class='vitem "+i.level+"'><span class='vdot'>"+dot+"</span><span>"+escapeHtml(i.text)+"</span></div>";
  }).join("");
  const saveBtn = document.getElementById("bsave");
  if(saveBtn) saveBtn.disabled = !v.canSave;
  return v;
}

    b.onclick = ()=>{

      const source = b.dataset.suggest;
      if(source === "library") openLibraryPanel(pIdx);
      else openAiPanel(pIdx);

  wrap.querySelector("#bf-intention").addEventListener("input", e=>{ builderDraft.intention = e.target.value; });

    builderEditingKey = null;
    builderDraft = newDraft();
    buildJourneyTabs();
    render();
  };

  renderValidationPanel();
}
