<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JOGA Creator 2.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            syne: ['Syne', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #080808; color: #F0EDE7; }
    * { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }

    textarea, input[type="text"] {
      outline: none;
      resize: vertical;
      font-family: 'IBM Plex Mono', monospace;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease both; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #2a2a2a;
      border-top-color: #C8960A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    .results-grid {
      display: flex;
      gap: 16px;
    }
    @media (max-width: 760px) {
      .results-grid { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useCallback } = React;

// ─── Design tokens ───────────────────────────────────────────────────────────
const G      = '#C8960A';
const CL_C   = '#CC785C';   // Claude – terracotta
const GP_C   = '#10A37F';   // GPT-4o – green
const BG     = '#080808';
const CARD   = '#0f0f0f';
const BORDER = '#1e1e1e';
const TEXT   = '#F0EDE7';
const MUTED  = '#555';
const MONO   = "'IBM Plex Mono', monospace";
const SYNE   = "'Syne', sans-serif";

// ─── Data ────────────────────────────────────────────────────────────────────
const PILLARS = [
  { id: 'nutzlich', label: 'Nützlich' },
  { id: 'wow',      label: 'Wow'      },
  { id: 'ehrlich',  label: 'Ehrlich'  },
];
const PLATFORMS = [
  { id: 'tiktok',    label: 'TikTok'    },
  { id: 'instagram', label: 'Instagram' },
  { id: 'youtube',   label: 'YouTube'   },
];

// ─── Tiny helpers ────────────────────────────────────────────────────────────
function Tag({ children, color }) {
  return (
    <div style={{
      fontFamily: MONO, fontSize: 9, letterSpacing: '2.5px',
      color: color || MUTED, marginBottom: 8, textTransform: 'uppercase',
    }}>
      {children}
    </div>
  );
}

function Pill({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      padding: '5px 13px', borderRadius: 20, cursor: 'pointer',
      border: active ? 'none' : `1px solid ${BORDER}`,
      background: active ? G : 'transparent',
      color: active ? '#000' : MUTED,
      fontFamily: MONO, fontSize: 10, letterSpacing: '0.5px',
      transition: 'all .15s',
    }}>
      {children}
    </button>
  );
}

function CopyBtn({ text }) {
  const [done, setDone] = useState(false);
  const copy = () => {
    const s = Array.isArray(text) ? text.join('\n') : String(text || '');
    navigator.clipboard?.writeText(s).then(() => {
      setDone(true);
      setTimeout(() => setDone(false), 1600);
    });
  };
  return (
    <button onClick={copy} style={{
      background: 'none', border: 'none', cursor: 'pointer',
      fontFamily: MONO, fontSize: 9, letterSpacing: '1px',
      color: done ? G : '#333', transition: 'color .15s', padding: '2px 6px',
    }}>
      {done ? 'KOPIERT ✓' : 'KOPIEREN'}
    </button>
  );
}

// ─── Single output field ─────────────────────────────────────────────────────
function Field({ label, content, accent }) {
  if (!content && content !== 0) return null;

  const baseCard = {
    background: '#141414', border: `1px solid ${BORDER}`,
    borderRadius: 6, padding: '10px 14px',
    fontFamily: MONO, fontSize: 11, lineHeight: 1.7, color: TEXT,
  };

  let body;

  if (label === 'HOOK') {
    body = (
      <div style={{
        ...baseCard,
        borderLeft: `3px solid ${accent}`,
        borderRadius: '0 6px 6px 0',
        fontFamily: SYNE, fontSize: 15, fontWeight: 600,
      }}>
        {content}
      </div>
    );
  } else if (label === 'TEXTSUPER') {
    const items = Array.isArray(content) ? content : [content];
    body = (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {items.map((t, i) => (
          <div key={i} style={{ ...baseCard, display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ color: accent, fontWeight: 600, flexShrink: 0 }}>{i + 1}</span>
            <span>{t}</span>
          </div>
        ))}
      </div>
    );
  } else if (label === 'HASHTAGS') {
    const tags = Array.isArray(content) ? content
      : String(content).split(/\s+/).filter(Boolean);
    body = (
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
        {tags.map((t, i) => (
          <span key={i} style={{
            ...baseCard, padding: '3px 10px', borderRadius: 4,
            color: '#777', fontSize: 10,
          }}>{t}</span>
        ))}
      </div>
    );
  } else if (label === 'ENDGEFÜHL') {
    body = (
      <div style={{ ...baseCard, color: '#888', fontStyle: 'italic' }}>
        „{content}"
      </div>
    );
  } else {
    body = <div style={{ ...baseCard, whiteSpace: 'pre-wrap' }}>{content}</div>;
  }

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 7 }}>
        <Tag color={accent}>{label}</Tag>
        <CopyBtn text={content} />
      </div>
      {body}
    </div>
  );
}

// ─── One model panel ─────────────────────────────────────────────────────────
function ModelPanel({ model, result, loading }) {
  const color = model === 'claude' ? CL_C : GP_C;
  const name  = model === 'claude' ? 'CLAUDE SONNET 4.5' : 'GPT-4O';

  return (
    <div style={{
      flex: 1, minWidth: 0,
      background: CARD,
      border: `1px solid ${BORDER}`,
      borderTop: `2px solid ${color}`,
      borderRadius: 12, padding: '18px 18px 24px',
    }}>
      {/* Model label */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8, marginBottom: 20,
        fontFamily: MONO, fontSize: 9, letterSpacing: '2px', color,
      }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: color, display: 'inline-block' }} />
        {name}
      </div>

      {loading && (
        <div style={{ display: 'flex', justifyContent: 'center', padding: '48px 0' }}>
          <span className="spin" style={{ borderTopColor: color }} />
        </div>
      )}

      {!loading && result?.error && (
        <div style={{
          background: '#1a0808', border: '1px solid #3a1515',
          borderRadius: 8, padding: 14,
          fontFamily: MONO, fontSize: 11, color: '#ef4444',
        }}>
          {result.error}
        </div>
      )}

      {!loading && result && !result.error && (
        <div className="fade-up">
          <Field label="HOOK"          content={result.hook}          accent={color} />
          <Field label="TEXTSUPER"     content={result.textsuper}     accent={color} />
          <Field label="CAPTION"       content={result.caption}       accent={color} />
          <Field label="DREHANLEITUNG" content={result.drehanleitung} accent={color} />
          <Field label="HASHTAGS"      content={result.hashtags}      accent={color} />
          <Field label="ENDGEFÜHL"     content={result.endgefuehl}    accent={color} />
        </div>
      )}
    </div>
  );
}

// ─── Main Content Lab ────────────────────────────────────────────────────────
function ContentLab() {
  const [ablauf,   setAblauf]   = useState('');
  const [pillar,   setPillar]   = useState('nutzlich');
  const [platform, setPlatform] = useState('tiktok');
  const [loading,  setLoading]  = useState(false);
  const [results,  setResults]  = useState(null);

  const ready = ablauf.trim().length > 0 && !loading;

  const generate = useCallback(async () => {
    if (!ready) return;
    setLoading(true);
    setResults(null);
    try {
      const res  = await fetch('/.netlify/functions/joga', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ type: 'verpacken', ablauf, pillar, platform }),
      });
      const data = await res.json();
      setResults(data);
    } catch (e) {
      setResults({ claude: { error: e.message }, gpt4o: { error: e.message } });
    } finally {
      setLoading(false);
    }
  }, [ablauf, pillar, platform, ready]);

  return (
    <main style={{ maxWidth: 1240, margin: '0 auto', padding: '28px 20px 80px' }}>

      {/* Section header */}
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '3px', color: G, marginBottom: 8 }}>
          CONTENT LAB
        </div>
        <div style={{ fontFamily: SYNE, fontSize: 24, fontWeight: 700 }}>
          Eigener Ablauf
        </div>
        <div style={{ fontFamily: MONO, fontSize: 11, color: MUTED, marginTop: 6, lineHeight: 1.6 }}>
          Flow rein → Hook · Textsuper · Caption · Drehanleitung · Hashtags · Endgefühl raus.
          Claude + GPT-4o parallel.
        </div>
      </div>

      {/* Textarea */}
      <div style={{ marginBottom: 20 }}>
        <Tag>EIGENER ABLAUF</Tag>
        <textarea
          value={ablauf}
          onChange={e => setAblauf(e.target.value)}
          placeholder={"Beschreibe deinen JOGA-Ablauf / Flow:\n\nz.B.:\n– 5× Arme schwingen von oben nach unten\n– Schulterkreisen rückwärts × 10\n– Nackendehnung links / rechts je 20 Sek\n– Arm-Shake + Ausschütteln zum Abschluss"}
          rows={9}
          style={{
            width: '100%', background: '#0c0c0c',
            border: `1px solid ${BORDER}`, borderRadius: 8,
            color: TEXT, padding: 14, fontSize: 12, lineHeight: 1.7,
            transition: 'border-color .15s',
          }}
          onFocus={e => e.target.style.borderColor = G}
          onBlur={e  => e.target.style.borderColor = BORDER}
        />
      </div>

      {/* Controls row */}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '20px 32px', marginBottom: 24 }}>
        <div>
          <Tag>SÄULE</Tag>
          <div style={{ display: 'flex', gap: 6 }}>
            {PILLARS.map(p => (
              <Pill key={p.id} active={pillar === p.id} onClick={() => setPillar(p.id)}>
                {p.label}
              </Pill>
            ))}
          </div>
        </div>
        <div>
          <Tag>PLATTFORM</Tag>
          <div style={{ display: 'flex', gap: 6 }}>
            {PLATFORMS.map(p => (
              <Pill key={p.id} active={platform === p.id} onClick={() => setPlatform(p.id)}>
                {p.label}
              </Pill>
            ))}
          </div>
        </div>
      </div>

      {/* Generate button */}
      <button
        onClick={generate}
        disabled={!ready}
        style={{
          width: '100%', padding: '13px 0',
          background: ready ? G : '#181818',
          color:      ready ? '#000' : '#333',
          border: 'none', borderRadius: 8, cursor: ready ? 'pointer' : 'not-allowed',
          fontFamily: MONO, fontSize: 11, letterSpacing: '2.5px', fontWeight: 600,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          transition: 'background .2s, color .2s',
          marginBottom: 36,
        }}
      >
        {loading && <span className="spin" style={{ borderTopColor: '#555' }} />}
        {loading ? 'VERPACKE…' : 'ABLAUF VERPACKEN →'}
      </button>

      {/* Results */}
      {(results || loading) && (
        <div className="results-grid fade-up">
          <ModelPanel model="claude" result={results?.claude} loading={loading} />
          <ModelPanel model="gpt4o"  result={results?.gpt4o}  loading={loading} />
        </div>
      )}
    </main>
  );
}

// ─── Header ──────────────────────────────────────────────────────────────────
function Header() {
  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 100,
      background: BG, borderBottom: `1px solid ${BORDER}`,
      padding: '14px 20px',
      display: 'flex', alignItems: 'center', gap: 14,
    }}>
      <div style={{ fontFamily: SYNE, fontSize: 17, fontWeight: 800, letterSpacing: '2px' }}>
        JOGA
      </div>
      <div style={{
        fontFamily: MONO, fontSize: 8, letterSpacing: '2px', color: '#2e2e2e',
        paddingLeft: 14, borderLeft: `1px solid #1e1e1e`,
      }}>
        CREATOR 2.0
      </div>
      <div style={{ flex: 1 }} />
      <div style={{ fontFamily: MONO, fontSize: 9, color: '#2a2a2a', letterSpacing: '1px' }}>
        CONTENT LAB
      </div>
    </header>
  );
}

// ─── Root ────────────────────────────────────────────────────────────────────
function App() {
  return (
    <>
      <Header />
      <ContentLab />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
