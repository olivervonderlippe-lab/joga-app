      {title:'JOGA auf Ehrlich #5-30',items:[
        {id:'fe05',title:'#5 — Krieger II',hook:'Yoga: Krieger II',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Krieger II. JOGA nennt es: einfach machen. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Krieger II.','','[Pause, 1 Sek.]','','JOGA nennt das:','Zwei Schritte breit stehen und die Arme heben.','','Klingt nach nichts.','Fühlt sich nach allem an.']},
{id:'fe06',title:'#6 — Herabschauender Hund',hook:'Yoga: Herabschauender Hund',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Hund. JOGA nennt es: Annäherung. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Herabschauender Hund.','','[Pause, 1 Sek.]','','JOGA nennt das:','Hinten beugen und hoffen, dass die Fersen den Boden berühren.','','Meistens tun sie das nicht.','','Das ist auch okay.']},

{id:'fe09',title:'#9 — Baum',hook:'Yoga: Baum',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Baum. JOGA nennt es: Gleichgewicht testen. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Baum.','','[Pause, 1 Sek.]','','JOGA nennt das:','Auf einem Bein stehen und so tun als wäre das normal.','','Mit offenen Augen: geht.','Mit geschlossenen Augen: interessant.']},

{id:'fe14',title:'#14 — Vorwärtsbeuge',hook:'Yoga: Vorwärtsbeuge',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Vorwärtsbeuge. JOGA nennt es: ehrlicher Check. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Vorwärtsbeuge.','','[Pause, 1 Sek.]','','JOGA nennt das:','Versuchen, die Zehen zu berühren.','','Wer es schafft: super.','Wer nicht: willkommen im Club.']},
{id:'fe15',title:'#15 — Drehsitz',hook:'Yoga: Drehsitz',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Drehsitz. JOGA nennt es: Wirbelsäule entstören. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Drehsitz.','','[Pause, 1 Sek.]','','JOGA nennt das:','Sitzen und drehen bis es knackt.','','Das Knacken ist okay.','Der Moment danach: besser.']},
{id:'fe16',title:'#16 — Halber Mond',hook:'Yoga: Halber Mond',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Halber Mond. JOGA nennt es: Gleichgewicht herausfordern. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Halber Mond.','','[Pause, 1 Sek.]','','JOGA nennt das:','Auf einem Bein stehen, ein Arm zum Boden, einer nach oben.','','Sieht spektakulär aus.','Fühlt sich genauso an.','','Selten beides gleichzeitig.']},

{id:'fe18',title:'#18 — Krähe',hook:'Yoga: Krähe',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Krähe. JOGA nennt es: lernen durch Fallen. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Krähe.','','[Pause, 1 Sek.]','','JOGA nennt das:','Auf den Händen balancieren.','','Spoiler: das dauert.','','Aber irgendwann geht es.','Oder man fällt.','Beides zählt.']},

{id:'fe20',title:'#20 — Held I',hook:'Yoga: Held I',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Held I. JOGA nennt es: Lunge mit Haltung. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Held I.','','[Pause, 1 Sek.]','','JOGA nennt das:','Großer Schritt nach vorne, Arme hoch, Brust offen.','','Held I ist der freundlichste Ausfallschritt der Welt.','','Man versteht sofort warum er so heißt.']},
{id:'fe21',title:'#21 — Held II',hook:'Yoga: Held II',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Held II. JOGA nennt es: stehen bleiben. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Held II.','','[Pause, 1 Sek.]','','JOGA nennt das:','Ausfallschritt mit Armen parallel zum Boden.','','Der Held schaut zur Seite.','Der JOGA-Held auch.','Er ist müde. Aber er steht.']},
{id:'fe22',title:'#22 — Held III',hook:'Yoga: Held III',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Held III. JOGA nennt es: Mut zum Kipppunkt. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Held III.','','[Pause, 1 Sek.]','','JOGA nennt das:','Auf einem Bein nach vorne fallen — kontrolliert.','','Das Wort fallen ist hier wichtig.','','Kontrolliert.','','Die meisten fallen unkontrolliert.','Das zählt auch.']},
{id:'fe23',title:'#23 — Lotussitz',hook:'Yoga: Lotussitz',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Lotussitz. JOGA nennt es: auf dem Boden sitzen. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Lotussitz.','','[Pause, 1 Sek.]','','JOGA nennt das:','Im Schneidersitz auf dem Boden sitzen.','','Das ist schon der Lotussitz.','','Wer es nicht glaubt: probiert mal.']},

{id:'fe25',title:'#25 — Fisch',hook:'Yoga: Fisch',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Fisch. JOGA nennt es: das Gegenteil des Alltags. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Fisch.','','[Pause, 1 Sek.]','','JOGA nennt das:','Auf dem Rücken liegen und die Brust nach oben öffnen.','','Das Gegenteil von allem,','was wir den ganzen Tag tun.','','Warum machen wir das so selten?']},
{id:'fe26',title:'#26 — Bogenschütze',hook:'Yoga: Bogenschütze',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Bogenschütze. JOGA nennt es: Rotation aus der Tiefe. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Bogenschütze.','','[Pause, 1 Sek.]','','JOGA nennt das:','Tiefer Ausfallschritt, Oberkörper aufdrehen, ein Arm nach vorne.','','Kein Pfeil. Keine Jagd.','','Nur der Körper, der sich öffnet.','Das reicht.']},
{id:'fe27',title:'#27 — Pflug',hook:'Yoga: Pflug',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Pflug. JOGA nennt es: Grenzen testen. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Pflug.','','[Pause, 1 Sek.]','','JOGA nennt das:','Beine über den Kopf.','','Das klingt unmöglich.','Ist es meistens auch.','','Trotzdem versuchen.']},
{id:'fe28',title:'#28 — Garbe',hook:'Yoga: Garbe',laenge:'20-30 Sek. · Direkt in Kamera · kein Schnitt',caption:'Yoga nennt es Garbe. JOGA nennt es: die Frage stellen. #JOGA #NichtYoga #JOGAaufEhrlich',tags:'#JOGA #NichtYoga #JOGAaufEhrlich',lines:['Yoga nennt das: Garbe.','','[Pause, 1 Sek.]','','JOGA nennt das:','Vorwärtsbeuge mit verschränkten Armen.','','Warum?','','[lange Pause]','','Das habe ich mich auch gefragt.','Und dann hat mein Rücken geantwortet.']},

      {title:'Mit 56 #4-20',items:[

{id:'m56n05',title:'#5',hook:'Mit 56 mache ich Dinge,',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Mit 30 für unmöglich gehalten. Mit 56 gemacht. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 mache ich Dinge,','die ich mit 30 für unmöglich hielt.','','[Pause, 1,5 Sek.]','','Das ist keine Motivation.','Das ist eine Feststellung.']},
{id:'m56n06',title:'#6',hook:'Mit 56 ist der Unterschied zwischen',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Das Aufwärmen ist das Training. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 ist der Unterschied zwischen','Aufwärmen und Training','kleiner geworden.','','[Pause, 1 Sek.]','','Das Aufwärmen ist das Training.']},
{id:'m56n07',title:'#7',hook:'Mit 56 achte ich auf Dinge,',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Der Körper buchführt. Immer. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 achte ich auf Dinge,','die ich mit 36 ignoriert habe.','','[Pause, 1 Sek.]','','Schlaf. Wasser. Pausen.','','Nicht weil ich muss.','Weil ich weiß was passiert wenn nicht.']},
{id:'m56n08',title:'#8',hook:'Mit 56 fange ich Dinge an,',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Es passt nie. Also jetzt. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 fange ich Dinge an,','die ich nie lernen konnte.','','[Pause, 1 Sek.]','','Nicht weil ich jetzt Zeit hätte.','Sondern weil ich aufgehört habe zu warten.']},
{id:'m56n09',title:'#9',hook:'Mit 56 verhandle ich nicht mehr',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Aufgehört zu verhandeln. Angefangen zuzuhören. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 verhandle ich nicht mehr','mit meinem Körper.','','[Pause, 1 Sek.]','','Ich höre ihm zu.','','Das ist der Unterschied.']},
{id:'m56n10',title:'#10',hook:'Mit 56 ist Steifheit am Morgen',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Steifheit ist Feedback, kein Urteil. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 ist Steifheit am Morgen','kein Zeichen von Alter.','','[Pause, 1 Sek.]','','Es ist ein Zeichen,','dass ich mich gestern bewegt habe.']},
{id:'m56n11',title:'#11',hook:'Mit 56 weiß ich was der Körper',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Informiert handeln ist nicht dasselbe wie vorsichtig sein. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 weiß ich was der Körper','am nächsten Tag bezahlen muss.','','[Pause, 1 Sek.]','','Und ich mache es trotzdem.','Aber ich weiß es.']},
{id:'m56n12',title:'#12',hook:'Mit 56 bin ich nicht mehr',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Neugier ist keine Altersfrage. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 bin ich nicht mehr','der fitteste Mann im Raum.','','[Pause, 1 Sek.]','','Der neugierigste?','Vielleicht.']},
{id:'m56n13',title:'#13',hook:'Mit 56 trainiere ich gegen nichts.',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Einfach trainieren. Das reicht. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 trainiere ich gegen nichts.','','[Pause, 1,5 Sek.]','','Nicht gegen das Alter.','Nicht gegen die Zeit.','','Ich trainiere einfach.']},
{id:'m56n14',title:'#14',hook:'Mit 56 habe ich aufgehört,',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Vergleiche mit dir selbst sind bereits zu viele. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 habe ich aufgehört,','meinen Körper','mit dem von 30 zu vergleichen.','','[Pause, 1 Sek.]','','Das war die beste Entscheidung','des letzten Jahrzehnts.']},
{id:'m56n15',title:'#15',hook:'Mit 56 braucht mein Körper',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Konsistenz schlägt Intensität. Immer. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 braucht mein Körper','keine Herausforderung.','','[Pause, 1 Sek.]','','Er braucht Konsistenz.','','Das ist die eigentliche Herausforderung.']},
{id:'m56n16',title:'#16',hook:'Mit 56 lerne ich immer noch,',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Den Unterschied lernt man durch Bewegung. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 lerne ich immer noch,','dass Schmerz und Unbehagen','verschiedene Dinge sind.','','[Pause, 1 Sek.]','','Unbehagen: weiter.','Schmerz: stop.']},
{id:'m56n17',title:'#17',hook:'Mit 56 ist mein Körper',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Pflegen, nicht ausbeuten. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 ist mein Körper','kein Statussymbol mehr.','','[Pause, 1 Sek.]','','Er ist Werkzeug.','','Und das Werkzeug pflegt man.']},
{id:'m56n18',title:'#18',hook:'Mit 56 gibt es Tage',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Gewohnheit ist stärker als Motivation. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 gibt es Tage','wo alles zieht, alles schwer ist','und nichts stimmt.','','[Pause, 1 Sek.]','','Ich mache es trotzdem.','','Nicht wegen Motivation.','Wegen Gewohnheit.']},
{id:'m56n19',title:'#19',hook:'Mit 56 überrasche ich mich',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Aufgehört, sich selbst zu unterschätzen. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56 überrasche ich mich','regelmäßig selbst.','','[Pause, 1,5 Sek.]','','Das ist kein Kunststück.','Das ist das Ergebnis davon,','dass ich aufgehört habe','mich selbst zu unterschätzen.']},
{id:'m56n20',title:'#20',hook:'Mit 56.',laenge:'15-25 Sek. · ein Take · kein VO',caption:'Stand der Dinge. #JOGA #Mit56 #NichtYoga',tags:'#JOGA #Mit56 #NichtYoga',lines:['Mit 56.','','[Pause, 2 Sek.]','','Handstand in Arbeit.','Rücken manchmal laut.','Neugier unverändert.','','[Pause, 1 Sek.]','','Das ist der Stand der Dinge.']}

      {title:'Oliver #3-15',items:[
        {id:'olinew03',title:'#3 — Ich bin 56, lerne Handstand',hook:'Ich bin 56.',laenge:'ca. 25 Sek. · Augenhöhe · Statisch · ein Take',caption:'Mit 56 noch Schüler sein. Ich finde das ist kein Nachteil. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Ich bin 56.','','[Pause, 1 Sek.]','','Und lerne gerade Handstand.','','[Pause, 1 Sek.]','','Nicht weil ich muss.','Sondern weil ich noch nicht fertig bin.']},
{id:'olinew04',title:'#4 — Fitnesslüge',hook:'Die größte Fitnesslüge:',laenge:'ca. 25 Sek. · Augenhöhe · Statisch · ein Take',caption:'Zu spät ist ein sehr bequemer Gedanke. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Die größte Fitnesslüge:','','[Pause, 2 Sek.]','','Es ist zu spät.','','[Pause, 2 Sek.]','','Zu spät für was genau?','','Die Lüge funktioniert,','weil sie sich wie die Wahrheit anfühlt.','','Ist sie aber nicht.']},
{id:'olinew05',title:'#5 — Handstand mit 56',hook:'Ich kann noch keinen perfekten Handstand.',laenge:'ca. 40 Sek. · Augenhöhe · Statisch · ein Take',caption:'Neugier ist kein Jugendprivileg. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Ich kann noch keinen perfekten Handstand.','','[Pause, 1 Sek.]','','Aber ich bin 56.','','Und ich finde es ziemlich geil,','dass ich es immer noch versuche.','','[Pause, 1 Sek.]','','Die meisten geben ihre Neugier','viel früher auf.','','Ich nicht.']},
{id:'olinew06',title:'#6 — Warum Yogalehrerausbildung',hook:'Ich habe eine Yogalehrerausbildung gemacht.',laenge:'ca. 35 Sek. · Augenhöhe · Statisch · ein Take',caption:'Verstehen was man tut. Das ist der eigentliche Move. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Ich habe eine Yogalehrerausbildung gemacht.','','[Pause, 1 Sek.]','','Nicht weil ich Yogalehrer werden wollte.','Sondern weil ich verstehen wollte,','was ich da eigentlich tue.','','[Pause, 1 Sek.]','','Der Unterschied ist kleiner als ich dachte.','Und größer als ich erwartet habe.']},
{id:'olinew07',title:'#7 — Heute beim Gehen',hook:'Ich bin gerade draußen.',laenge:'ca. 30 Sek. · Augenhöhe · Statisch · ein Take',caption:'Mit 30 benutzt man den Körper. Mit 56 hört man ihm zu. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Ich bin gerade draußen.','','[Pause, 1 Sek.]','','Und denke daran, dass ich mit 30','gedacht habe, ich kenne meinen Körper.','','Ich kannte ihn nicht.','Ich habe ihn nur benutzt.','','Jetzt höre ich zu.']},
{id:'olinew08',title:'#8 — Was Yoga mir gegeben hat',hook:'Yoga hat mir Körpergefühl gegeben.',laenge:'ca. 35 Sek. · Augenhöhe · Statisch · ein Take',caption:'Gleiche Wirkung. Anderes Bild. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Yoga hat mir Körpergefühl gegeben.','Flexibilität. Präsenz.','','[Pause, 1 Sek.]','','Was es mir nicht gegeben hat:','Den Wunsch, in Räucherstäbchen zu sitzen.','','Deshalb gibt es JOGA.','Gleiche Wirkung. Anderes Bild.']},
{id:'olinew09',title:'#9 — Mit 56 macht man das',hook:'Mit 56 trainiert man nicht mehr',laenge:'ca. 30 Sek. · Augenhöhe · Statisch · ein Take',caption:'Keine Entschuldigung. Eine Entscheidung. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Mit 56 trainiert man nicht mehr','um besser auszusehen.','','[Pause, 1 Sek.]','','Man trainiert um sich besser zu fühlen.','Um beweglich zu bleiben.','Um neugierig zu bleiben.','','Das ist kein Rückzug.','Das ist eine Entscheidung.']},
{id:'olinew10',title:'#10 — Rückblick Woche 6',hook:'6 Wochen.',laenge:'ca. 25 Sek. · Augenhöhe · Statisch · ein Take',caption:'Das eigentliche Ergebnis ist Gewohnheit. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['6 Wochen.','','[Pause, 1 Sek.]','','Ich dachte das Ergebnis wäre','mehr Flexibilität.','','Das Ergebnis ist:','es fühlt sich komisch an wenn ich es nicht mache.','','Das ist mehr.']},
{id:'olinew11',title:'#11 — Die Einladung',hook:'JOGA ist nicht für alle.',laenge:'ca. 30 Sek. · Augenhöhe · Statisch · ein Take',caption:'JOGA ist nicht für alle. Aber vielleicht für dich. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['JOGA ist nicht für alle.','','[Pause, 1,5 Sek.]','','Aber vielleicht für dich.','','Wenn du das kennst —','dieses Gefühl, dass der Körper','irgendwann die Rechnung schickt —','','dann bist du hier richtig.']},
{id:'olinew12',title:'#12 — Was sich verändert hat',hook:'Vor einem Jahr hätte ich das nicht gesagt.',laenge:'ca. 40 Sek. · Augenhöhe · Statisch · ein Take',caption:'Bewegung stabilisiert den Tag. Das war die Überraschung. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Vor einem Jahr hätte ich das nicht gesagt.','','[Pause, 1 Sek.]','','Dass Bewegung das Ding ist,','das meinen Tag stabilisiert.','Nicht Kaffee. Nicht Produktivität.','','Bewegung.','','[Pause, 1 Sek.]','','Das hört sich esoterisch an.','Ist es nicht.','Es ist einfach wahr.']},
{id:'olinew13',title:'#13 — Feierabend-Gedanke',hook:'Der Tag läuft noch.',laenge:'ca. 20 Sek. · Augenhöhe · Statisch · ein Take',caption:'Der Körper macht seinen Teil. Täglich. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Der Tag läuft noch.','','[Pause, 1 Sek.]','','Aber der Körper hat seinen Teil','schon erledigt.','','Das ist kein kleines Ding.']},
{id:'olinew14',title:'#14 — Die Wette',hook:'Ich glaube nicht, dass JOGA wächst',laenge:'ca. 30 Sek. · Augenhöhe · Statisch · ein Take',caption:'Das könnte ich auch sein. Das ist die Einladung. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['Ich glaube nicht, dass JOGA wächst','weil ich bessere Flows zeige.','','[Pause, 1 Sek.]','','Ich glaube, JOGA wächst','wenn Menschen sehen:','','Das ist ein echter Typ.','Mit 56.','Der sich noch bewegt.','','Das könnte ich auch sein.']},
{id:'olinew15',title:'#15 — 56-Tage-Fazit',hook:'56 Tage.',laenge:'ca. 45 Sek. · Augenhöhe · Statisch · ein Take',caption:'56 Tage. Ich höre nicht auf. #JOGA #NichtYoga #Männer40',tags:'#JOGA #NichtYoga #Männer40',lines:['56 Tage.','','[Pause, 1 Sek.]','','Ich weiß jetzt was mein Körper','als Tagesbeginn braucht.','','Ich weiß was auf TikTok funktioniert','und was nicht.','','[Pause, 1,5 Sek.]','','Ich weiß nicht ob JOGA groß wird.','','Ich weiß, dass ich nicht aufhöre.','','[Pause, 1 Sek.]','','Das ist genug.']}
