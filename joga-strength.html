function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}
function formatDateDE(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return `${WEEKDAYS_DE[d.getDay()]}, ${d.getDate()}. ${MONTHS_DE[d.getMonth()]}`;
}

// ---------- Storage helpers ----------
function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.error("Speichern fehlgeschlagen", e); return false; }
}
function allLogsForWeek(weekNum) {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("log:")) {
      const v = loadJSON(k, null);
      if (v && v.week === weekNum) out.push(v);
    }
  }
  return out;
}

// ---------- Week recommendation ----------
function WeekRecommendation({ week }) {
  if (week === 1) return null;
  const prevLogs = allLogsForWeek(week - 1).filter((l) => l.kater !== null && l.kater !== undefined);
  if (prevLogs.length === 0) {
    return (
      <div className="rounded-lg bg-[var(--card)] border border-[var(--border)] px-3 py-2.5 mb-4">
        <p className="text-[var(--text-secondary)] text-xs leading-relaxed">
          Noch keine Folgetag-Daten aus Woche {week - 1}. Trag sie nach dem Training ein, dann bekommst du hier eine Empfehlung.
        </p>
      </div>
    );
  }
  const ok = prevLogs.every((l) => l.kater <= 3 && l.gelenke === "nein" && (l.muedigkeit ?? 10) <= 5 && l.bereit === "ja");
  return (
    <div className={`rounded-lg border px-3 py-2.5 mb-4 ${ok ? "bg-[var(--success-bg)] border-[var(--success-border)]" : "bg-[var(--warning-bg)] border-[var(--warning-border)]"}`}>
      <p className={`text-xs leading-relaxed ${ok ? "text-[var(--success-text)]" : "text-[var(--warning-text)]"}`}>
        {ok
          ? `Woche ${week - 1} war sauber (Muskelkater ≤3, keine Gelenkbeschwerden, bereit). Weiter zu Woche ${week} wie geplant.`
          : `Woche ${week - 1} war noch nicht sauber genug (Muskelkater, Gelenke, Müdigkeit oder Bereitschaft außerhalb des Zielbereichs). Empfehlung: Woche ${week - 1} noch einmal wiederholen statt zu Woche ${week} weiterzugehen.`}
      </p>
    </div>
  );
}

// ---------- UI bits ----------

function buildSummary({ master, sets, reps, rir, hasLog, setVals }) {
  if (master) {
    var s = "3 × " + reps;
    if (hasLog) {
      s += " · " + (setVals.weight || setVals.reps) + " · Anstrengung " + setVals.effort + "/10";
    }
    return s;
  }
  var s2 = sets + " × " + reps + " · RIR " + rir;
  if (hasLog) {
    var extra = "";
    if (setVals.weight) extra += setVals.weight + " · ";
    if (setVals.reps) extra += setVals.reps + " Wdh · ";
    extra += "Anstrengung " + setVals.effort + "/10";
    s2 += " · " + extra;
  }
  return s2;
}

function embedUrl(watchUrl) {
  const match = watchUrl.match(/[?&]v=([^&]+)/);
  const id = match ? match[1] : "";
  return `https://www.youtube.com/embed/${id}?rel=0`;
}

function ExerciseCard({ ex, exKey, sets, reps, rir, master, location, dateKey }) {
  const [open, setOpen] = useState(false);
  const [showVideo, setShowVideo] = useState(false);
  const setDefaults = { weight: "", reps: "", effort: 5, note: "" };
  const setKey = `set:${dateKey}:${exKey}`;
  const [setVals, setSetVals] = useState(() => ({ ...setDefaults, ...loadJSON(setKey, {}) }));

  useEffect(() => {
    setSetVals({ ...setDefaults, ...loadJSON(setKey, {}) });
  }, [dateKey, exKey]);

  const updateSet = (patch) => {
    const next = { ...setVals, ...patch };
    setSetVals(next);
    saveJSON(setKey, next);
  };

  const useHome = location === "home" && ex.home;
  const display = useHome ? { ...ex, ...ex.home } : ex;
  const hasLog = setVals.weight || setVals.reps;

  return (
    <div className="rounded-xl border border-[var(--border)] bg-[var(--card)] overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between px-4 py-3 text-left">
        <div>
          <div className="text-[var(--text)] font-medium">{display.name}</div>
          <div className="text-[var(--text-secondary)] text-sm mt-0.5">
            {buildSummary({ master, sets, reps, rir, hasLog, setVals })}
          </div>
        </div>
        <span className="text-[var(--text-secondary)] shrink-0">{open ? <IconChevronDown /> : <IconChevronRight />}</span>
      </button>
      {open && (
        <div className="px-4 pb-4 -mt-1 space-y-3">
          <p className="text-[var(--text-body)] text-sm leading-relaxed">{display.cue}</p>
          {ex.startHint && <p className="text-[var(--text-hint)] text-xs italic leading-relaxed">{ex.startHint}</p>}
          {display.videoUrl && (
            <div>
              <button
                onClick={() => setShowVideo(!showVideo)}
                className="inline-flex items-center gap-1.5 text-sm text-[#c1541f] font-medium"
              >
                <IconPlay /> {showVideo ? "Video ausblenden" : "Video ansehen"}
              </button>
              {showVideo && (
                <div className="mt-2 rounded-lg overflow-hidden" style={{ position: "relative", paddingBottom: "56.25%", height: 0 }}>
                  <iframe
                    src={embedUrl(display.videoUrl)}
                    title={display.name}
                    style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: 0 }}
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  ></iframe>
                </div>
              )}
            </div>
          )}

          <div className="pt-2 border-t border-[var(--border)] grid grid-cols-2 gap-2">
            <div>
              <label className="text-[var(--text-secondary)] text-xs block mb-1">Gewicht/Variante</label>
              <input
                type="text"
                value={setVals.weight}
                onChange={(e) => updateSet({ weight: e.target.value })}
                placeholder="z.B. 16 kg"
                className="w-full bg-[var(--bg)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-[var(--text)] text-sm placeholder-[var(--text-muted)] focus:outline-none focus:border-[#c1541f]"
              />
            </div>
            <div>
              <label className="text-[var(--text-secondary)] text-xs block mb-1">Reale Wdh</label>
              <input
                type="text"
                value={setVals.reps}
                onChange={(e) => updateSet({ reps: e.target.value })}
                placeholder={`z.B. ${reps}`}
                className="w-full bg-[var(--bg)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-[var(--text)] text-sm placeholder-[var(--text-muted)] focus:outline-none focus:border-[#c1541f]"
              />
            </div>
          </div>
          <div>
            <div className="flex items-center justify-between mb-1">
              <label className="text-[var(--text-secondary)] text-xs">Anstrengung</label>
              <span className="text-[var(--text)] text-xs font-medium">{setVals.effort}/10</span>

          </div>
          <input
            type="text"
            value={setVals.note}
            onChange={(e) => updateSet({ note: e.target.value })}
            placeholder="Notiz (optional)"

        </div>

        ))}
      </div>
      {note && vals[field] === "ja" && (
        <input
          type="text"
          value={vals[note] || ""}
          onChange={(e) => setVals({ ...vals, [note]: e.target.value })}
          placeholder="Wo und wobei?"
          className="w-full mt-2 bg-[var(--bg)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-[var(--text)] text-sm placeholder-[var(--text-muted)] focus:outline-none focus:border-[#c1541f]"
        />
      )}
    </div>
  );

  return (
    <div className="rounded-xl border border-[var(--border)] bg-[var(--card)] p-4 mt-6">
      <h3 className="text-[var(--text)] font-medium mb-3">Log</h3>
      <div className="flex gap-2 mb-4">
        <button onClick={() => setTab("nach")} className={`flex-1 py-2 rounded-lg text-sm border ${tab === "nach" ? "bg-[var(--border)] border-[#c1541f] text-[var(--text)]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>☀️ Direkt danach</button>
        <button onClick={() => setTab("morgen")} className={`flex-1 py-2 rounded-lg text-sm border ${tab === "morgen" ? "bg-[var(--border)] border-[#c1541f] text-[var(--text)]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>🌙 Am nächsten Tag</button>
      </div>

      {tab === "nach" ? (
        <React.Fragment>
          <Slider label="Spaß" field="spass" icon={<span>😊</span>} />
          <Slider label="Energie danach" field="energie" icon={<span>🔋</span>} />
          <Slider label="Wahrgenommene Anstrengung" field="anstrengung" icon={<span>⚡</span>} />
          <YesNo label="Schmerzen oder Beschwerden während des Trainings?" field="beschwerden" note="beschwerdenNotiz" />
          <div className="mb-1">
            <span className="text-[var(--text-body)] text-sm mb-1.5 block">Lieblingsbewegung</span>
            <input type="text" value={vals.lieblingsuebung} onChange={(e) => setVals({ ...vals, lieblingsuebung: e.target.value })} placeholder="z.B. Farmer Carry"
              className="w-full bg-[var(--bg)] border border-[var(--border)] rounded-lg px-3 py-2 text-[var(--text)] text-sm placeholder-[var(--text-muted)] focus:outline-none focus:border-[#c1541f]" />
          </div>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <Slider label="Muskelkater" field="kater" icon={<span>🔥</span>} />
          <Slider label="Müdigkeit" field="muedigkeit" icon={<span>🥱</span>} />
          <Slider label="Schlafqualität" field="schlaf" icon={<span>💤</span>} />
          <YesNo label="Gelenkbeschwerden?" field="gelenke" note="gelenkeNotiz" />
          <YesNo label="Bereit fürs nächste Training?" field="bereit" />
        </React.Fragment>
      )}

      <button onClick={save} className="w-full py-2.5 rounded-lg bg-[#c1541f] text-[#171512] font-medium text-sm flex items-center justify-center gap-1.5 mt-3">
        {saved ? <React.Fragment><IconCheck /> Gespeichert</React.Fragment> : "Speichern"}
      </button>
    </div>
  );
}

const THEMES = {
  dark: {
    "--bg": "#171512", "--card": "#1c1a17", "--border": "#2a2622",
    "--text": "#f2eee6", "--text-secondary": "#a89f8f", "--text-body": "#c9c2b4",
    "--text-muted": "#5c564c", "--text-hint": "#8a8070",
    "--success-bg": "#16221c", "--success-border": "#2c4636", "--success-text": "#8fc9a8",
    "--warning-bg": "#241c14", "--warning-border": "#3a2c1c", "--warning-text": "#c9a876",
  },
  light: {
    "--bg": "#faf6f0", "--card": "#ffffff", "--border": "#e8ded0",
    "--text": "#2a2420", "--text-secondary": "#7a7166", "--text-body": "#4a443c",
    "--text-muted": "#a89486", "--text-hint": "#8a7f6a",
    "--success-bg": "#eef7f1", "--success-border": "#bfe0cc", "--success-text": "#2f7a4d",
    "--warning-bg": "#fbf1e4", "--warning-border": "#eed9b8", "--warning-text": "#8a6a2f",
  },
};

function JogaStrength() {
  const [week, setWeek] = useState(() => loadJSON("joga-strength:week", 1));
  const [day, setDay] = useState(() => loadJSON("joga-strength:day", "A"));
  const [location, setLocation] = useState(() => loadJSON("joga-strength:location", "studio"));
  const [date, setDate] = useState(() => loadJSON("joga-strength:date", todayISO()));
  const [theme, setTheme] = useState(() => loadJSON("joga-strength:theme", "dark"));
  const [moveOpen, setMoveOpen] = useState(false);

  useEffect(() => { saveJSON("joga-strength:week", week); }, [week]);
  useEffect(() => { saveJSON("joga-strength:day", day); }, [day]);
  useEffect(() => { saveJSON("joga-strength:location", location); }, [location]);
  useEffect(() => { saveJSON("joga-strength:date", date); }, [date]);
  useEffect(() => { saveJSON("joga-strength:theme", theme); }, [theme]);

  const weekData = WEEKS[week - 1];
  const exList = day === "A" ? BUILD_A : BUILD_B;
  const masterKey = day === "A" ? "dead_hang" : "hollow_hold";
  const dateKey = date;

  return (
    <div className="min-h-screen bg-[var(--bg)]" style={{ fontFamily: "'Inter', system-ui, sans-serif", ...THEMES[theme] }}>
      <div className="max-w-md mx-auto px-4 pt-8 pb-16">
        <div className="mb-6">
          <div className="flex items-center justify-between mb-1">
            <div className="text-[#c1541f] text-xs font-semibold tracking-widest uppercase">JOGA Strength · Einstieg (Wochen 1–4)</div>
            <button
              onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
              className="text-[var(--text-secondary)] text-xs border border-[var(--border)] rounded-full px-2.5 py-1 shrink-0"
            >
              {theme === "dark" ? "☀️ Hell" : "🌙 Dunkel"}
            </button>
          </div>
          <div className="flex items-center justify-between gap-2">
            <h1 className="text-[var(--text)] text-xl font-semibold">{formatDateDE(date)} · Build {day}</h1>
          </div>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
            className="bg-transparent text-[var(--text-secondary)] text-xs mt-1 border border-[var(--border)] rounded px-2 py-1" />
          <p className="text-[var(--text-secondary)] text-sm mt-2">Woche {week} · {weekData.note}</p>
        </div>

        <div className="flex gap-2 mb-4">
          {WEEKS.map((w) => (
            <button key={w.week} onClick={() => setWeek(w.week)}
              className={`flex-1 py-2 rounded-lg text-sm font-medium border ${week === w.week ? "bg-[#c1541f] border-[#c1541f] text-[#171512]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>
              W{w.week}
            </button>
          ))}
        </div>

        <WeekRecommendation week={week} />

        {week === 3 && (
          <div className="rounded-lg bg-[var(--warning-bg)] border border-[var(--warning-border)] px-3 py-2.5 mb-4">
            <p className="text-[var(--warning-text)] text-xs leading-relaxed">
              Nur erhöhen, wenn: alle Wiederholungen sauber waren, RIR mind. 4 blieb und der Muskelkater am Folgetag ≤3 war. Sonst gleiches Gewicht wiederholen. Kein Satz soll sich schwerer als 6/10 anfühlen. Bei einseitigen Übungen: 1–2 Arbeitssätze pro Seite.
            </p>
          </div>
        )}

        <div className="flex gap-2 mb-3">
          <button onClick={() => setDay("A")} className={`flex-1 py-2.5 rounded-lg text-sm font-medium border ${day === "A" ? "bg-[var(--border)] border-[#c1541f] text-[var(--text)]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>Montag · Build A</button>
          <button onClick={() => setDay("B")} className={`flex-1 py-2.5 rounded-lg text-sm font-medium border ${day === "B" ? "bg-[var(--border)] border-[#c1541f] text-[var(--text)]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>Donnerstag · Build B</button>
        </div>

        <div className="flex gap-2 mb-6">
          <button onClick={() => setLocation("studio")} className={`flex-1 py-2 rounded-lg text-sm font-medium border ${location === "studio" ? "bg-[#c1541f]/10 border-[#c1541f] text-[#c1541f]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>Studio</button>
          <button onClick={() => setLocation("home")} className={`flex-1 py-2 rounded-lg text-sm font-medium border ${location === "home" ? "bg-[#c1541f]/10 border-[#c1541f] text-[#c1541f]" : "border-[var(--border)] text-[var(--text-secondary)]"}`}>Home</button>
        </div>

        <div className="rounded-xl border border-[var(--border)] bg-[var(--card)] overflow-hidden mb-3">
          <button onClick={() => setMoveOpen(!moveOpen)} className="w-full flex items-center justify-between px-4 py-3">
            <div className="text-left">
              <div className="text-[var(--text)] font-medium">MOVE</div>
              <div className="text-[var(--text-secondary)] text-sm">8–10 Minuten · immer gleich</div>
            </div>
            <span className="text-[var(--text-secondary)]">{moveOpen ? <IconChevronDown /> : <IconChevronRight />}</span>
          </button>
          {moveOpen && (
            <div className="px-4 pb-4 space-y-3">
              {MOVE_FLOW.map((m, i) => (
                <div key={i} className="border-t border-[var(--border)] pt-3 first:border-0 first:pt-0">
                  <div className="flex items-baseline justify-between">
                    <span className="text-[var(--text)] text-sm font-medium">{m.name}</span>
                    <span className="text-[var(--text-secondary)] text-xs">{m.dur}</span>
                  </div>
                  <p className="text-[var(--text-body)] text-sm mt-0.5">{m.cue}</p>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="mb-1 mt-6">
          <div className="text-[var(--text)] font-medium">BUILD</div>
          <div className="text-[var(--text-secondary)] text-sm mb-3">30–40 Minuten · {weekData.sets} Sätze · RIR {weekData.rir}</div>
        </div>
        <div className="space-y-2">
          {exList.map((key) => (
            <ExerciseCard key={key} exKey={key} ex={EXERCISES[key]} sets={weekData.sets} reps={REPS[key]} rir={weekData.rir} location={location} dateKey={dateKey} />
          ))}
        </div>

        <div className="mb-1 mt-6">
          <div className="text-[var(--text)] font-medium">MASTER</div>
          <div className="text-[var(--text-secondary)] text-sm mb-3">5–8 Minuten · 3 Sätze · Skill, nicht Ermüdung</div>
        </div>
        <ExerciseCard exKey={masterKey} ex={EXERCISES[masterKey]} reps="20 Sek" master location={location} dateKey={dateKey} />

        <p className="text-[var(--text-muted)] text-xs text-center mt-4">Gesamtdauer realistisch: ca. 55–60 Minuten.</p>

        <LogForm dateKey={dateKey} week={week} day={day} location={location} />

        <p className="text-[var(--text-muted)] text-xs text-center mt-8 leading-relaxed">
          Regel: Du verlässt das Training mit Energie, nicht platt.<br />Muskelkater &gt; 4? Nächstes Mal Gewicht runter.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<JogaStrength />);
</script>

  runScript.text = compiled;
  document.body.appendChild(runScript);

</body>
